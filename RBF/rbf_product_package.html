<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰RBF - 商品包</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-business-tags.css">
    <link rel="stylesheet" href="../vendor/octopus-prototype-runtime/runtime.css">
    <link rel="stylesheet" href="../vendor/octopus-prototype-runtime/theme.css">
    <style>
        [v-cloak] { display: none; }
        .rbf-package-schema-host { min-height: 480px; }
        .rbf-package-form .el-form-item { align-items: flex-start; }
        .rbf-package-sku { width: 100%; min-width: 0; }
        .rbf-package-sku__bar { margin-bottom: 8px; }
        .rbf-package-sku .el-button.is-text { padding-left: 0; padding-right: 0; }
        .rbf-package-sku__required::before { content: '*'; color: #f56c6c; margin-right: 4px; }
        .rbf-package-sku__price { width: 100%; }
        .rbf-sku-picker__query .el-input,
        .rbf-sku-picker__query .el-select { width: 180px; }
        .rbf-package-sku-table-wrap { width: 100%; overflow-x: auto; }
        .rbf-package-sku-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .rbf-package-sku-table th,
        .rbf-package-sku-table td { border: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; white-space: nowrap; }
        .rbf-package-sku-table th { background: #f7f8fa; font-weight: 600; color: #303133; }
        .rbf-package-sku-table td.is-money,
        .rbf-package-sku-table th.is-money { text-align: right; }
        .rbf-package-sku-table td.is-empty { text-align: center; color: #909399; }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="rbf-sidebar.js"></script>

    <div id="header-container"></div>

    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button type="button" class="active">商品包</button></div>
            <hr class="content-divider">

            <div id="rbfPackageApp" class="rbf-package-schema-host" v-cloak>
                <vab-schema-table
                    ref="table"
                    :columns="columns"
                    :request="requestRows"
                    row-key="code"
                    row-selection
                    search-label-width="112px"
                    action-column-width="160"
                    :default-page-size="20"
                    :auto-format-time="false">
                    <template v-slot:[slots.code]="{row}">
                        <doc-no-link :value="row.code" @open="openDetail(row)"></doc-no-link>
                    </template>
                    <template #toolbar-left="{elSize}">
                        <el-button type="primary" :size="elSize" @click="openAdd">新增商品包</el-button>
                        <el-button :size="elSize" @click="openTags">标签管理</el-button>
                    </template>
                    <template #selection-actions="{rows}">
                        <el-button type="primary" @click="openBatch('add', rows)">添加标签</el-button>
                        <el-button @click="openBatch('remove', rows)">移出标签</el-button>
                    </template>
                    <template v-slot:[slots.status]="{row,elSize}">
                        <el-tag :size="elSize" effect="light" :type="row.enabled === false ? 'danger' : 'success'">{{ row.enabled === false ? '禁用' : '启用' }}</el-tag>
                    </template>
                    <template v-slot:[slots.tags]="{row,elSize}">
                        <el-space v-if="tagsOf(row).length" :size="4" wrap>
                            <el-tag v-for="tag in tagsOf(row)" :key="tag.id" :size="elSize" effect="light">{{ tag.name }}</el-tag>
                        </el-space>
                        <span v-else>—</span>
                    </template>
                    <template #actions="{row,elSize}">
                        <el-button :size="elSize" text type="primary" @click="openEdit(row)">编辑</el-button>
                        <el-button :size="elSize" text type="primary" @click="toggleEnabled(row)">{{ row.enabled === false ? '启用' : '禁用' }}</el-button>
                    </template>
                </vab-schema-table>
                <vab-schema-form-dialog
                    ref="addDialog"
                    :title="dialogTitle"
                    dialog-width="1180px"
                    form-class="rbf-package-form"
                    label-position="top"
                    label-width="120px"
                    :default-col-span="24"
                    :fields="addFields"
                    row-key-field="code"
                    :before-submit="beforeSubmit"
                    :add-api="addPackage"
                    :edit-api="updatePackage"
                    add-success-message="商品包已新增"
                    edit-success-message="商品包已更新"
                    @saved="refreshTable">
                    <template #form-skus="{form}">
                        <div class="rbf-package-sku">
                            <div class="rbf-package-sku__bar">
                                <el-button type="primary" @click="openSkuPicker(form)">添加商品</el-button>
                            </div>
                            <el-table :data="form.skus || []" row-key="code" border empty-text="暂无商品">
                                <el-table-column label="商品图片" width="88">
                                    <template #default="{row}"><img v-if="skuImage(row.code)" class="wms-sku-image" :src="skuImage(row.code)" :alt="skuOf(row.code).name"></template>
                                </el-table-column>
                                <el-table-column label="商品编码" min-width="120">
                                    <template #default="{row}">{{ row.code }}</template>
                                </el-table-column>
                                <el-table-column label="商品名称" min-width="150" show-overflow-tooltip>
                                    <template #default="{row}">{{ skuOf(row.code).name }}</template>
                                </el-table-column>
                                <el-table-column label="商品条码" min-width="140">
                                    <template #default="{row}">{{ skuOf(row.code).barcode }}</template>
                                </el-table-column>
                                <el-table-column label="商品单位" width="96">
                                    <template #default="{row}">{{ skuOf(row.code).unit }}</template>
                                </el-table-column>
                                <el-table-column label="商品规格" width="100">
                                    <template #default="{row}">{{ skuOf(row.code).spec }}</template>
                                </el-table-column>
                                <el-table-column label="采购价" width="100" align="right">
                                    <template #default="{row}">{{ money(skuOf(row.code).purchasePrice) }}</template>
                                </el-table-column>
                                <el-table-column width="140">
                                    <template #header><span class="rbf-package-sku__required">售价</span></template>
                                    <template #default="{row}">
                                        <el-input class="rbf-package-sku__price" v-model="row.salePrice" placeholder="请输入"></el-input>
                                    </template>
                                </el-table-column>
                                <el-table-column label="操作" width="72">
                                    <template #default="{row}"><el-button text type="primary" @click="removeSku(form, row.code)">移除</el-button></template>
                                </el-table-column>
                            </el-table>
                        </div>
                    </template>
                </vab-schema-form-dialog>
                <vab-schema-form-dialog
                    ref="batchDialog"
                    :title="batchTitle"
                    dialog-width="520px"
                    label-width="120px"
                    :default-col-span="24"
                    :fields="batchFields"
                    :before-submit="beforeSubmitBatch"
                    :add-api="applyBatchTags"
                    :add-success-message="batchSuccessText"
                    @saved="refreshAfterBatch">
                </vab-schema-form-dialog>
                <el-dialog v-model="pickerOpen" title="添加商品" width="1080px" append-to-body :close-on-click-modal="false">
                    <el-form class="rbf-sku-picker__query" inline @submit.prevent>
                        <el-form-item label="商品编码">
                            <el-input v-model="pickerQuery.code" placeholder="请输入" clearable></el-input>
                        </el-form-item>
                        <el-form-item label="商品名称">
                            <el-input v-model="pickerQuery.name" placeholder="请输入" clearable></el-input>
                        </el-form-item>
                        <el-form-item label="商品类目">
                            <el-select v-model="pickerQuery.category" placeholder="请选择" clearable>
                                <el-option v-for="name in categoryOptions" :key="name" :label="name" :value="name"></el-option>
                            </el-select>
                        </el-form-item>
                        <el-form-item>
                            <el-button type="primary" @click="searchSkus">查询</el-button>
                            <el-button @click="resetSkuSearch">重置</el-button>
                        </el-form-item>
                    </el-form>
                    <el-table ref="pickerTable" :data="pickerRows" row-key="code" border empty-text="暂无数据" @selection-change="onSkuPick">
                        <el-table-column type="selection" width="48"></el-table-column>
                        <el-table-column label="商品图片" width="88">
                            <template #default="{row}"><img v-if="skuImage(row.code)" class="wms-sku-image" :src="skuImage(row.code)" :alt="row.name"></template>
                        </el-table-column>
                        <el-table-column prop="code" label="商品编码" min-width="120"></el-table-column>
                        <el-table-column prop="name" label="商品名称" min-width="150" show-overflow-tooltip></el-table-column>
                        <el-table-column prop="barcode" label="商品条码" min-width="140"></el-table-column>
                        <el-table-column prop="unit" label="商品单位" width="96"></el-table-column>
                        <el-table-column prop="spec" label="商品规格" width="100"></el-table-column>
                        <el-table-column label="采购价" width="100" align="right">
                            <template #default="{row}">{{ money(row.purchasePrice) }}</template>
                        </el-table-column>
                    </el-table>
                    <template #footer>
                        <el-button @click="pickerOpen = false">取消</el-button>
                        <el-button type="primary" @click="confirmAddSkus">添加</el-button>
                    </template>
                </el-dialog>
            </div>
        </main>
    </div>

    <script src="rbf-fresh.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/business-tag-prototype-store.js"></script>
    <script src="../js/business-tag-prototype-ui.js"></script>
    <script src="../vendor/octopus-prototype-runtime/runtime.js"></script>
    <script src="rbf-product-package-detail.js"></script>
    <script src="rbf-product-package.js"></script>
</body>
</html>
