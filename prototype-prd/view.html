<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRD</title>
  <style>
    :root {
      --orange: #ff7019;
      --bg: #f3f4f6;
      --line: #e8e8e8;
      --text: #222;
      --muted: #888;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .pv-head {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 56px;
      padding: 0 20px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .pv-head h1 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pv-export {
      flex: none;
      height: 32px;
      padding: 0 14px;
      border: 0;
      border-radius: 6px;
      background: var(--orange);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .pv-export:hover { background: #f0630c; }
    .pv-export:disabled { opacity: .45; cursor: not-allowed; }
    .pv-wrap {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 16px;
      max-width: 1220px;
      margin: 0 auto;
      padding: 16px 16px 80px;
      align-items: start;
    }
    .pv-toc {
      position: sticky;
      top: 72px;
      max-height: calc(100vh - 88px);
      overflow: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 0 12px;
    }
    .pv-toc__title {
      padding: 6px 14px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .pv-toc a {
      display: block;
      padding: 6px 14px;
      font-size: 13px;
      line-height: 1.4;
      color: #444;
      text-decoration: none;
      border-left: 2px solid transparent;
    }
    .pv-toc a:hover { background: #fff7f0; color: var(--orange); }
    .pv-toc a.is-active {
      color: var(--orange);
      background: #fff7f0;
      border-left-color: var(--orange);
      font-weight: 600;
    }
    .pv-toc a.lv-1 { font-weight: 600; }
    .pv-toc a.lv-2 { padding-left: 22px; }
    .pv-toc a.lv-3 { padding-left: 34px; font-size: 12px; }
    .pv-toc a.lv-4,
    .pv-toc a.lv-5,
    .pv-toc a.lv-6 { padding-left: 46px; font-size: 12px; color: #888; }
    .pv-body { min-width: 0; }
    .pv-article {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 28px 36px 40px;
      line-height: 1.7;
      font-size: 14px;
    }
    .pv-article h1,
    .pv-article h2,
    .pv-article h3,
    .pv-article h4,
    .pv-article h5,
    .pv-article h6 { scroll-margin-top: 72px; }
    .pv-article {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 28px 36px 40px;
      line-height: 1.7;
      font-size: 14px;
    }
    .pv-article h1 { font-size: 26px; margin: 0 0 20px; }
    .pv-article h1 + h1 { margin-top: 32px; }
    .pv-article h2 { font-size: 20px; margin: 32px 0 12px; padding-bottom: 6px; border-bottom: 1px solid #f0f0f0; }
    .pv-article h3 { font-size: 16px; margin: 28px 0 10px; }
    .pv-article h4 { font-size: 14px; margin: 20px 0 8px; }
    .pv-article p { margin: 8px 0; }
    .pv-article ul, .pv-article ol { margin: 8px 0; padding-left: 22px; }
    .pv-article li { margin: 4px 0; }
    .pv-article a { color: var(--orange); }
    .pv-article code {
      background: #f6f6f6;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
    }
    .pv-article pre {
      background: #f6f6f6;
      padding: 12px 14px;
      border-radius: 8px;
      overflow: auto;
      font-size: 12px;
    }
    .pv-article table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0 18px;
      font-size: 13px;
    }
    .pv-article th, .pv-article td {
      border: 1px solid #eee;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    .pv-article th { background: #fafafa; font-weight: 600; }
    .pv-article .mermaid { background: #fafafa; border-radius: 8px; padding: 12px; margin: 12px 0 20px; }
    .pv-empty { padding: 48px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <header class="pv-head">
    <h1 id="pvTitle">PRD</h1>
    <button type="button" class="pv-export" id="pvExportWord" disabled>导出 Word</button>
  </header>
  <div class="pv-wrap">
    <nav class="pv-toc" id="pvToc" aria-label="目录">
      <div class="pv-toc__title">目录</div>
      <div id="pvTocList"></div>
    </nav>
    <div class="pv-body">
      <article class="pv-article" id="pvHost"><div class="pv-empty">正在加载…</div></article>
    </div>
  </div>
  <script src="../js/pg-prd-md.js?v=20260824-prd-fix"></script>
  <script>
    function qs(name) {
      try { return new URLSearchParams(location.search).get(name) || ''; }
      catch (e) { return ''; }
    }
    function siteRoot() {
      var path = (location.pathname || '/').replace(/\\/g, '/');
      var markers = ['/MDM/', '/SCM/', '/CRM/', '/user-app/', '/shop-h5/', '/store-app/', '/prototype-prd/', '/.local/'];
      var lower = path.toLowerCase();
      for (var i = 0; i < markers.length; i++) {
        var idx = lower.indexOf(markers[i].toLowerCase());
        if (idx >= 0) return path.slice(0, idx) + '/';
      }
      if (/\/index\.html$/i.test(path)) return path.replace(/index\.html$/i, '');
      if (path.charAt(path.length - 1) === '/') return path;
      var last = path.lastIndexOf('/');
      return last >= 0 ? path.slice(0, last + 1) : '/';
    }
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function buildToc(article) {
      var list = document.getElementById('pvTocList');
      if (!list || !article) return;
      var heads = article.querySelectorAll('h1, h2, h3, h4, h5, h6');
      if (!heads.length) {
        list.innerHTML = '<div class="pv-empty" style="padding:12px 14px;font-size:12px;">暂无目录</div>';
        return;
      }
      var html = '';
      Array.prototype.forEach.call(heads, function (el) {
        if (!el.id) return;
        var lv = Number((el.tagName || 'H2').replace(/H/i, '')) || 2;
        html += '<a class="lv-' + lv + '" href="#' + encodeURIComponent(el.id) + '" data-id="' +
          escapeHtml(el.id) + '">' + escapeHtml(el.textContent) + '</a>';
      });
      list.innerHTML = html;
      list.onclick = function (ev) {
        var a = ev.target.closest('a[data-id]');
        if (!a) return;
        ev.preventDefault();
        var target = document.getElementById(a.getAttribute('data-id'));
        if (!target) return;
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        setActiveToc(a.getAttribute('data-id'));
        try { history.replaceState(null, '', '#' + a.getAttribute('data-id')); } catch (e) {}
      };
      var hash = (location.hash || '').replace(/^#/, '');
      if (hash) {
        var jump = document.getElementById(decodeURIComponent(hash));
        if (jump) setTimeout(function () { jump.scrollIntoView({ block: 'start' }); }, 40);
      }
      bindScrollSpy(article, heads);
    }
    var lastActiveId = '';
    function setActiveToc(id) {
      var list = document.getElementById('pvTocList');
      if (!list || !id || id === lastActiveId) return;
      lastActiveId = id;
      Array.prototype.forEach.call(list.querySelectorAll('a'), function (a) {
        a.classList.toggle('is-active', a.getAttribute('data-id') === id);
      });
      var active = list.querySelector('a.is-active');
      var toc = document.getElementById('pvToc');
      if (active && toc) {
        var top = active.offsetTop - toc.clientHeight / 3;
        toc.scrollTop = Math.max(0, top);
      }
    }
    function bindScrollSpy(article, heads) {
      var ticking = false;
      function update() {
        ticking = false;
        var current = heads[0] && heads[0].id;
        for (var i = 0; i < heads.length; i++) {
          if (heads[i].getBoundingClientRect().top <= 88) current = heads[i].id;
        }
        if (current) setActiveToc(current);
      }
      window.addEventListener('scroll', function () {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(update);
      }, { passive: true });
      update();
    }
    function safeFileName(title) {
      return String(title || 'PRD').replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim().slice(0, 80) || 'PRD';
    }
    function svgToPng(svgEl) {
      return new Promise(function (resolve) {
        try {
          var xml = new XMLSerializer().serializeToString(svgEl);
          if (!/xmlns=/.test(xml)) {
            xml = xml.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
          }
          var url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
          var img = new Image();
          img.onload = function () {
            var canvas = document.createElement('canvas');
            var w = Math.max(svgEl.clientWidth || 0, svgEl.viewBox && svgEl.viewBox.baseVal.width || 0, img.width || 0, 640);
            var h = Math.max(svgEl.clientHeight || 0, svgEl.viewBox && svgEl.viewBox.baseVal.height || 0, img.height || 0, 240);
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/png'));
          };
          img.onerror = function () { resolve(''); };
          img.src = url;
        } catch (e) {
          resolve('');
        }
      });
    }
    function prepareExportHtml(article) {
      var clone = article.cloneNode(true);
      var nodes = clone.querySelectorAll('.mermaid');
      var jobs = [];
      Array.prototype.forEach.call(nodes, function (box, idx) {
        var live = article.querySelectorAll('.mermaid')[idx];
        var svg = live && live.querySelector('svg');
        jobs.push(
          (svg ? svgToPng(svg) : Promise.resolve('')).then(function (png) {
            if (png) {
              var img = document.createElement('img');
              img.src = png;
              img.style.maxWidth = '100%';
              box.parentNode.replaceChild(img, box);
            } else if (box.parentNode) {
              box.parentNode.removeChild(box);
            }
          })
        );
      });
      return Promise.all(jobs).then(function () { return clone.innerHTML; });
    }
    function wordCss() {
      return [
        'body{font-family:"PingFang SC","Microsoft YaHei",SimSun,sans-serif;font-size:12pt;line-height:1.6;color:#222;}',
        'h1{font-size:22pt;margin:18pt 0 10pt;}',
        'h2{font-size:16pt;margin:16pt 0 8pt;border-bottom:1px solid #ddd;padding-bottom:4pt;}',
        'h3{font-size:14pt;margin:14pt 0 6pt;}',
        'h4{font-size:12pt;margin:12pt 0 6pt;}',
        'p{margin:6pt 0;}',
        'table{border-collapse:collapse;width:100%;margin:8pt 0 12pt;font-size:10.5pt;}',
        'th,td{border:1px solid #999;padding:4pt 6pt;vertical-align:top;}',
        'th{background:#f3f3f3;font-weight:bold;}',
        'code{font-family:Consolas,monospace;background:#f5f5f5;padding:0 3pt;}',
        'pre{background:#f5f5f5;padding:8pt;font-size:10pt;}',
        'a{color:#c45a11;}',
        'img{max-width:100%;}'
      ].join('');
    }
    function downloadWord(title, innerHtml) {
      var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
        '<head><meta charset="utf-8"><title>' + escapeHtml(title) + '</title>' +
        '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->' +
        '<style>' + wordCss() + '</style></head><body>' + innerHtml + '</body></html>';
      var blob = new Blob(['\ufeff', html], { type: 'application/msword' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = safeFileName(title) + '.doc';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    }
    function exportWord() {
      var article = document.getElementById('pvHost');
      var btn = document.getElementById('pvExportWord');
      if (!article || !btn || btn.disabled) return;
      btn.disabled = true;
      btn.textContent = '正在导出…';
      prepareExportHtml(article)
        .then(function (inner) {
          downloadWord(document.getElementById('pvTitle').textContent || 'PRD', inner);
        })
        .catch(function () {})
        .then(function () {
          btn.disabled = false;
          btn.textContent = '导出 Word';
        });
    }
    function rewriteProtoLinks(md) {
      var prefix = location.origin + siteRoot();
      var text = String(md || '')
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .replace(/本地预览：/g, '原型预览：')
        .replace(/https?:\/\/localhost:5173\//gi, prefix)
        .replace(/https?:\/\/127\.0\.0\.1:5173\//gi, prefix);
      /* 反引号里的原型地址改成可点击链接 */
      text = text.replace(/`(https?:\/\/[^`\s]+)`/g, '[$1]($1)');
      return text;
    }
    function loadMermaid() {
      return new Promise(function (resolve) {
        if (window.mermaid) {
          resolve(window.mermaid);
          return;
        }
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
        s.async = true;
        var done = false;
        function finish(v) {
          if (done) return;
          done = true;
          resolve(v || null);
        }
        s.onload = function () { finish(window.mermaid); };
        s.onerror = function () { finish(null); };
        setTimeout(function () { finish(window.mermaid || null); }, 4000);
        document.head.appendChild(s);
      });
    }
    function enableExport() {
      var btn = document.getElementById('pvExportWord');
      if (btn) {
        btn.disabled = false;
        btn.onclick = exportWord;
      }
    }
    function fetchPrdMarkdown(name) {
      return fetch(encodeURI(name), { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('missing');
        return r.text();
      });
    }
    function fetchPrdWithAlias(name) {
      return fetchPrdMarkdown(name).catch(function () {
        return fetch('index.json', { cache: 'no-store' })
          .then(function (r) {
            if (!r.ok) throw new Error('missing');
            return r.json();
          })
          .then(function (data) {
            var list = (data && data.prds) || [];
            var stem = String(name || '').replace(/\.md$/i, '');
            var hit = list.find(function (p) {
              return p.file === name || p.id === stem || p.title === stem;
            });
            if (!hit) {
              hit = list.find(function (p) {
                return /直播场次状态对应操作和中控台的活动发放优化/.test(
                  String((p && (p.file || p.title || p.id)) || '')
                );
              });
            }
            if (hit && hit.file && hit.file !== name) return fetchPrdMarkdown(hit.file);
            throw new Error('missing');
          });
      });
    }
    var file = qs('file');
    var host = document.getElementById('pvHost');
    if (!file) {
      host.innerHTML = '<div class="pv-empty">未指定 PRD 文件。</div>';
    } else {
      fetchPrdWithAlias(file)
        .then(function (md) {
          md = rewriteProtoLinks(md);
          var first = String(md).split(/\n/).find(function (line) {
            return /^#\s+/.test(line);
          });
          var title = first ? first.replace(/^#\s+/, '').trim() : file.replace(/\.md$/i, '');
          document.title = title;
          document.getElementById('pvTitle').textContent = title;
          if (!window.PgMarkdown || typeof window.PgMarkdown.render !== 'function') {
            host.innerHTML = '<div class="pv-empty">PRD 渲染脚本未加载。</div>';
            return;
          }
          host.innerHTML = window.PgMarkdown.render(md);
          buildToc(host);
          enableExport();
          loadMermaid().then(function (mermaid) {
            if (!mermaid) return;
            mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
            return mermaid.run({ querySelector: '.mermaid' });
          }).catch(function () {});
        })
        .catch(function () {
          host.innerHTML = '<div class="pv-empty">读不到这份 PRD 文件：' + escapeHtml(file) + '</div>';
        });
    }
  </script>
</body>
</html>
