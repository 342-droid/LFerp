<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>忘记密码 · 门店APP</title>
  <link rel="stylesheet" href="../css/store-app.css?v=20260804-pwd">
  <link rel="stylesheet" href="../css/store-app-password.css?v=20260813-caret">
</head>
<body class="store-app-body">
  <div class="sa-shell sa-pwd-shell">
    <div class="sa-pwd sa-pwd--edit sa-pwd--forgot" id="pwdForgotRoot">
      <header class="sa-pwd-nav" id="pwdForgotNav">
        <a href="#" class="sa-pwd-nav__back" id="pwdForgotBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <h1 class="sa-pwd-nav__title" id="pwdForgotTitle">忘记登录密码</h1>
      </header>

      <!-- 步骤1：短信验证码（六位下划线 OTP） -->
      <div class="sa-pwd-body sa-pwd-body--otp" id="pwdForgotStepSms">
        <h2 class="sa-pwd-otp__title">请输入短信验证码</h2>
        <p class="sa-pwd-otp__sub" id="pwdForgotSmsHint">验证码发送至159****4315</p>
        <div class="sa-pwd-otp" id="pwdForgotOtp">
          <input
            type="text"
            class="sa-pwd-otp__input"
            id="pwdForgotSmsInput"
            maxlength="6"
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="one-time-code"
            enterkeyhint="done"
            aria-label="短信验证码"
          >
          <div class="sa-pwd-otp__cells" id="pwdForgotOtpCells" aria-hidden="true">
            <span class="sa-pwd-otp__cell" data-otp-cell="0"></span>
            <span class="sa-pwd-otp__cell" data-otp-cell="1"></span>
            <span class="sa-pwd-otp__cell" data-otp-cell="2"></span>
            <span class="sa-pwd-otp__cell" data-otp-cell="3"></span>
            <span class="sa-pwd-otp__cell" data-otp-cell="4"></span>
            <span class="sa-pwd-otp__cell" data-otp-cell="5"></span>
          </div>
        </div>
        <button type="button" class="sa-pwd-otp__resend" id="pwdForgotSmsBtn">获取验证码</button>
      </div>

      <!-- 步骤2：设置新密码 -->
      <div class="sa-pwd-body" id="pwdForgotStepReset" hidden>
        <div class="sa-pwd-fields" id="pwdForgotFields"></div>
        <button type="button" class="sa-pwd-submit sa-pwd-submit--block" id="pwdForgotSubmit" disabled>提交</button>
      </div>

      <div class="sa-pwd-keypad" id="pwdForgotKeypad" hidden aria-label="数字键盘">
        <button type="button" data-key="1"><span class="sa-pwd-keypad__num">1</span></button>
        <button type="button" data-key="2"><span class="sa-pwd-keypad__num">2</span><span class="sa-pwd-keypad__sub">ABC</span></button>
        <button type="button" data-key="3"><span class="sa-pwd-keypad__num">3</span><span class="sa-pwd-keypad__sub">DEF</span></button>
        <button type="button" data-key="4"><span class="sa-pwd-keypad__num">4</span><span class="sa-pwd-keypad__sub">GHI</span></button>
        <button type="button" data-key="5"><span class="sa-pwd-keypad__num">5</span><span class="sa-pwd-keypad__sub">JKL</span></button>
        <button type="button" data-key="6"><span class="sa-pwd-keypad__num">6</span><span class="sa-pwd-keypad__sub">MNO</span></button>
        <button type="button" data-key="7"><span class="sa-pwd-keypad__num">7</span><span class="sa-pwd-keypad__sub">PQRS</span></button>
        <button type="button" data-key="8"><span class="sa-pwd-keypad__num">8</span><span class="sa-pwd-keypad__sub">TUV</span></button>
        <button type="button" data-key="9"><span class="sa-pwd-keypad__num">9</span><span class="sa-pwd-keypad__sub">WXYZ</span></button>
        <button type="button" class="sa-pwd-keypad__empty" disabled aria-hidden="true"></button>
        <button type="button" data-key="0"><span class="sa-pwd-keypad__num">0</span></button>
        <button type="button" class="sa-pwd-keypad__del" data-key="del" aria-label="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M9 6H20a1 1 0 011 1v10a1 1 0 01-1 1H9l-6-6 6-6z"/>
            <path d="M12 10l4 4M16 10l-4 4"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <script src="../../js/store-pay-password.js?v=20260813-forgot"></script>
  <script src="../js/store-app-login-pwd.js?v=20260813-caret"></script>
  <script src="../js/store-app-password-forgot.js?v=20260813-blur"></script>
</body>
</html>
