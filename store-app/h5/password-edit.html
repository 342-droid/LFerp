<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>密码管理 · 门店APP</title>
  <link rel="stylesheet" href="../css/store-app.css?v=20260804-pwd">
  <link rel="stylesheet" href="../css/store-app-password.css?v=20260805-gap">
</head>
<body class="store-app-body">
  <div class="sa-shell sa-pwd-shell">
    <div class="sa-pwd sa-pwd--edit">
      <header class="sa-pwd-nav">
        <a href="password.html" class="sa-pwd-nav__back" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <h1 class="sa-pwd-nav__title" id="pwdPageTitle">修改登录密码</h1>
      </header>

      <div class="sa-pwd-body">
        <p class="sa-pwd-lead" id="pwdLead">修改您的登录密码</p>
        <div class="sa-pwd-fields" id="pwdFields"></div>
        <button type="button" class="sa-pwd-submit" id="pwdSubmit" disabled>确定</button>
      </div>

      <div class="sa-pwd-keypad" id="pwdKeypad" aria-label="数字键盘">
        <button type="button" data-key="1"><span class="sa-pwd-keypad__num">1</span></button>
        <button type="button" data-key="2"><span class="sa-pwd-keypad__num">2</span><span class="sa-pwd-keypad__sub">ABC</span></button>
        <button type="button" data-key="3"><span class="sa-pwd-keypad__num">3</span><span class="sa-pwd-keypad__sub">DEF</span></button>
        <button type="button" data-key="4"><span class="sa-pwd-keypad__num">4</span><span class="sa-pwd-keypad__sub">GHI</span></button>
        <button type="button" data-key="5"><span class="sa-pwd-keypad__num">5</span><span class="sa-pwd-keypad__sub">JKL</span></button>
        <button type="button" data-key="6"><span class="sa-pwd-keypad__num">6</span><span class="sa-pwd-keypad__sub">MNO</span></button>
        <button type="button" data-key="7"><span class="sa-pwd-keypad__num">7</span><span class="sa-pwd-keypad__sub">PQRS</span></button>
        <button type="button" data-key="8"><span class="sa-pwd-keypad__num">8</span><span class="sa-pwd-keypad__sub">TUV</span></button>
        <button type="button" data-key="9"><span class="sa-pwd-keypad__num">9</span><span class="sa-pwd-keypad__sub">WXYZ</span></button>
        <button type="button" class="sa-pwd-keypad__empty" disabled aria-hidden="true"></button>
        <button type="button" data-key="0"><span class="sa-pwd-keypad__num">0</span></button>
        <button type="button" class="sa-pwd-keypad__del" data-key="del" aria-label="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M9 6H20a1 1 0 011 1v10a1 1 0 01-1 1H9l-6-6 6-6z"/>
            <path d="M12 10l4 4M16 10l-4 4"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <script src="../../js/store-pay-password.js?v=20260804"></script>
  <script src="../js/store-app-password.js?v=20260804-pay"></script>
</body>
</html>
