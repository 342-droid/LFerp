<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>佣金明细 · 丰银宝</title>
  <!-- UI：等价于 Time Machine 本地快照 2026-11-19-123921（佣金 HTML/CSS 自 11:05 未改；挂载需本机密码，改用 Cursor Local History 5a14de00/4iyL.html + store-app-biz-commission.css） -->
  <link rel="stylesheet" href="../css/store-app.css?v=20261119-fix2">
  <link rel="stylesheet" href="../css/store-app-biz-report.css?v=20261119-fix2">
  <link rel="stylesheet" href="../css/store-app-biz-commission.css?v=20261126-income-metrics">
</head>
<body class="store-app-body">
  <div class="sa-shell sa-biz-shell">
    <div class="sa-biz">
      <div class="sa-biz-scroll">
        <div class="sa-biz-topline" role="tablist">
          <a class="sa-biz-topline__tab" id="bizBackOverview" href="biz-center.html">总览</a>
          <span class="sa-biz-topline__tab is-active">佣金明细</span>
          <i class="sa-biz-topline__ink" aria-hidden="true"></i>
        </div>

        <div class="sa-biz-mode" id="bizDimTabs" role="tablist" aria-label="统计维度" style="width:220px">
          <button type="button" class="sa-biz-mode__btn is-active" data-dim="pay">下单时间</button>
          <button type="button" class="sa-biz-mode__btn" data-dim="settle">入账时间</button>
        </div>

        <section class="sa-biz-summary">
          <div class="sa-biz-summary__metrics">
            <div><span>预计累计收入</span><strong id="bizEstimatedTotal">0.00</strong></div>
            <div><span id="bizCreditedLabel">当前已入账金额</span><strong id="bizCreditedTotal">0.00</strong></div>
            <div><span>待结算金额</span><strong id="bizPendingTotal">0.00</strong></div>
            <div><span>结款中金额</span><strong id="bizSettlingTotal">0.00</strong></div>
          </div>
          <div class="sa-biz-summary__wallet"><span>可提现余额</span><strong id="bizWithdrawAmount">0.00</strong><button type="button" id="bizWithdrawBtn">提现</button></div>
        </section>

        <section class="sa-biz-filter sa-biz-filter--range">
          <div class="sa-biz-range" id="bizRangeTabs" role="tablist" aria-label="统计周期">
            <button type="button" class="sa-biz-range__btn is-active" data-range="today">今日</button>
            <button type="button" class="sa-biz-range__btn" data-range="yesterday">昨日</button>
            <button type="button" class="sa-biz-range__btn" data-range="7d">近7天</button>
            <button type="button" class="sa-biz-range__btn" data-range="30d">近30天</button>
            <button type="button" class="sa-biz-range__btn" data-range="custom">自定义</button>
          </div>
          <p class="sa-biz-filter__meta" id="bizPeriodCaption">统计周期 —</p>
        </section>

        <div class="sa-biz-summary__total sa-biz-summary__total--outside" id="bizTotalLine">所选期间共计 <em>0</em> 单，预计佣金 <em>0.00</em> 元</div>

        <section class="sa-biz-period" id="bizPeriodStrip" aria-label="分时段预估佣金">
          <div class="sa-biz-period__cell">
            <div class="sa-biz-period__t">今日预估</div>
            <div class="sa-biz-period__v" id="bizPeriodToday">0</div>
            <div class="sa-biz-period__s" id="bizPeriodTodayCnt">0单</div>
          </div>
          <div class="sa-biz-period__cell">
            <div class="sa-biz-period__t">昨日预估</div>
            <div class="sa-biz-period__v" id="bizPeriodYday">0</div>
            <div class="sa-biz-period__s" id="bizPeriodYdayCnt">0单</div>
          </div>
          <div class="sa-biz-period__cell">
            <div class="sa-biz-period__t">近7天预估</div>
            <div class="sa-biz-period__v" id="bizPeriodWeek">0</div>
            <div class="sa-biz-period__s" id="bizPeriodWeekCnt">0单</div>
          </div>
          <div class="sa-biz-period__cell">
            <div class="sa-biz-period__t">近30天预估</div>
            <div class="sa-biz-period__v" id="bizPeriodMonth">0</div>
            <div class="sa-biz-period__s" id="bizPeriodMonthCnt">0单</div>
          </div>
        </section>

        <section class="sa-biz-filter">

          <div class="sa-biz-search">
            <button type="button" class="sa-biz-search__go" id="bizSearchBtn" aria-label="搜索">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="6.5"/>
                <path d="M16 16l4.5 4.5" stroke-linecap="round"/>
              </svg>
            </button>
            <button type="button" class="sa-biz-search__type" id="bizSearchTypeBtn" hidden>
              <span id="bizSearchTypeLabel">综合</span>
            </button>
            <input
              type="search"
              class="sa-biz-search__input"
              id="bizSearchInput"
              placeholder="联系人电话/订单编号/会员码/用户昵称/商品"
              autocomplete="off"
            >
          </div>
          <div class="sa-biz-search-menu" id="bizSearchTypeMenu" hidden>
            <button type="button" data-type="all">综合</button>
            <button type="button" data-type="order">订单编号</button>
            <button type="button" data-type="phone">手机号</button>
            <button type="button" data-type="nick">用户昵称</button>
            <button type="button" data-type="goods">商品</button>
          </div>

          <div class="sa-biz-ordertabs" id="bizOrderTabs" role="tablist">
            <button type="button" class="sa-biz-ordertabs__btn is-active" data-status="all">全部</button>
            <button type="button" class="sa-biz-ordertabs__btn" data-status="待发货">待发货</button>
            <button type="button" class="sa-biz-ordertabs__btn" data-status="待履约">待自提/待收货</button>
            <button type="button" class="sa-biz-ordertabs__btn" data-status="已完成">已完成</button>
          </div>
        </section>

        <div id="bizOrderList" class="sa-biz-list"></div>
      </div>

      <nav class="sa-rpt-tabbar" aria-label="丰银宝导航">
        <a href="home.html" class="sa-rpt-tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-9.5z"/></svg>
          <span>工作台</span>
        </a>
        <button type="button" class="sa-rpt-tab" id="commAiBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M5 16.5c0-4.1 3.1-7.5 7-7.5s7 3.4 7 7.5c0 1.4-.4 2.7-1.1 3.8L19 22l-3.2-1.2A7.3 7.3 0 0112 21.5c-3.9 0-7-3.4-7-5z"/>
          </svg>
          <span>AI</span>
        </button>
        <a href="biz-center.html" class="sa-rpt-tab is-active" id="commDcTab">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h14v3H5V4zm2 5h3v11H7V9zm5 0h3v8h-3V9zm5 0h3v11h-3V9z"/></svg>
          <span>数据中心</span>
        </a>
        <a href="more.html" class="sa-rpt-tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M5.5 19.5c1.2-3.2 3.5-4.8 6.5-4.8s5.3 1.6 6.5 4.8"/>
          </svg>
          <span>更多</span>
        </a>
      </nav>
    </div>

    <div class="sa-rpt-sheet sa-rpt-sheet--time" id="bizRangeSheet" hidden>
      <div class="sa-rpt-sheet__panel" role="dialog">
        <div class="sa-rpt-sheet__hd"><strong>自定义日期</strong><button type="button" class="sa-rpt-sheet__close" data-close-range>×</button></div>
        <div class="sa-rpt-custom" id="bizCustom">
          <div class="sa-rpt-custom__row">
            <label class="sa-rpt-custom__field"><span>开始</span><input type="date" id="bizCustomStart"></label>
            <span class="sa-rpt-custom__sep">至</span>
            <label class="sa-rpt-custom__field"><span>结束</span><input type="date" id="bizCustomEnd"></label>
          </div>
          <p class="sa-rpt-custom__err" id="bizCustomErr" hidden></p>
          <button type="button" class="sa-rpt-custom__btn" id="bizCustomApply">确定</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/business-report-fixtures.js"></script>
  <script src="../../js/store-wallet-demo.js"></script>
  <script src="../js/store-app-biz-datacenter-data.js?v=20261126-income-metrics"></script>
  <script src="../js/store-app-biz-session.js?v=20261117-bd2"></script>
  <script src="../js/store-app-biz-datacenter-state.js?v=20261119-fix6"></script>
  <script src="../js/store-app-biz-datacenter-commission.js?v=20261126-income-metrics"></script>
</body>
</html>
