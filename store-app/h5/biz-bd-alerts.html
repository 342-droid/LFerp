<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>经营提醒 · BD</title>
  <link rel="stylesheet" href="../css/store-app.css?v=20261117-bd1">
  <link rel="stylesheet" href="../css/store-app-biz-report.css?v=20261117-bd1">
  <style>
    .sa-bd-nav {
      display: flex;
      align-items: center;
      height: 46px;
      padding: 0 8px;
      background: #fff;
      border-bottom: 1px solid #f1f2f5;
      flex-shrink: 0;
    }
    .sa-bd-nav a {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #1f2024;
      text-decoration: none;
    }
    .sa-bd-nav a svg { width: 22px; height: 22px; }
    .sa-bd-nav h1 {
      flex: 1;
      margin: 0;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
      padding-right: 36px;
    }
    .sa-bd-sub {
      margin: 8px 12px 12px;
      font-size: 12px;
      color: #71727a;
      line-height: 1.5;
    }
    .sa-bd-card {
      display: block;
      margin: 0 12px 10px;
      padding: 14px 12px;
      background: #fff;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      position: relative;
    }
    .sa-bd-card__hd {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .sa-bd-card__name {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: #1f2024;
      min-width: 0;
      padding-right: 12px;
    }
    .sa-bd-card__tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(255, 101, 1, 0.12);
      color: #ff6501;
      font-weight: 500;
      flex-shrink: 0;
    }
    .sa-bd-card__tag.is-danger {
      background: rgba(246, 43, 87, 0.1);
      color: #f62b57;
    }
    .sa-bd-card__alert {
      font-size: 12px;
      color: #525866;
      line-height: 1.5;
      padding-right: 16px;
    }
    .sa-bd-card__arrow {
      position: absolute;
      right: 10px;
      top: 16px;
      color: #c0c4cc;
      font-size: 18px;
    }
  </style>
</head>
<body class="store-app-body">
  <div class="sa-shell sa-rpt-shell">
    <div class="sa-rpt">
      <header class="sa-bd-nav">
        <a href="biz-bd-home.html?from=bd-app&role=bd" id="bdAlertBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <h1>经营提醒</h1>
      </header>
      <div class="sa-rpt-scroll">
        <p class="sa-bd-sub" id="bdAlertAsOf">加载中…</p>
        <div id="bdAlertList"></div>
      </div>
    </div>
  </div>
  <script src="../js/store-app-biz-report-data.js?v=20261117-bd1"></script>
  <script src="../js/store-app-biz-bd.js?v=20261117-bd1"></script>
</body>
</html>
