<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>经营参谋 · BD</title>
  <link rel="stylesheet" href="../css/store-app.css?v=20261117-bd1">
  <link rel="stylesheet" href="../css/store-app-biz-report.css?v=20261117-bd1">
  <style>
    .sa-bd-nav {
      display: flex;
      align-items: center;
      height: 46px;
      padding: 0 8px;
      background: #fff;
      border-bottom: 1px solid #f1f2f5;
      flex-shrink: 0;
    }
    .sa-bd-nav a {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #1f2024;
      text-decoration: none;
    }
    .sa-bd-nav a svg { width: 22px; height: 22px; }
    .sa-bd-nav h1 {
      flex: 1;
      margin: 0;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
      padding-right: 36px;
    }
    .sa-bd-sub {
      margin: 8px 12px 0;
      font-size: 12px;
      color: #71727a;
    }
    .sa-bd-chip-em {
      display: inline-block;
      min-width: 16px;
      margin-left: 4px;
      padding: 0 5px;
      border-radius: 8px;
      background: rgba(255, 101, 1, 0.12);
      color: #ff6501;
      font-size: 11px;
      font-style: normal;
      font-weight: 600;
      line-height: 16px;
      vertical-align: 1px;
    }
    .sa-rpt-chip.is-active .sa-bd-chip-em {
      background: #fff;
      color: #ff6501;
    }
    .sa-bd-card {
      display: block;
      margin: 0 12px 10px;
      padding: 14px 12px;
      background: #fff;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      position: relative;
    }
    .sa-bd-card__hd {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .sa-bd-card__name {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: #1f2024;
      min-width: 0;
    }
    .sa-bd-card__tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #eef9f0;
      color: #45c74a;
      font-weight: 500;
    }
    .sa-bd-card__tag.is-warn {
      background: rgba(255, 101, 1, 0.12);
      color: #ff6501;
    }
    .sa-bd-card__tag.is-danger {
      background: rgba(246, 43, 87, 0.1);
      color: #f62b57;
    }
    .sa-bd-card__metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .sa-bd-card__m-t { font-size: 11px; color: #8a8f9c; }
    .sa-bd-card__m-v {
      margin-top: 2px;
      font-size: 14px;
      font-weight: 600;
      color: #1f2024;
      font-family: "DIN Alternate", "Helvetica Neue", sans-serif;
    }
    .sa-bd-card__alert {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #eef0f4;
      font-size: 12px;
      color: #ff6501;
      line-height: 1.45;
    }
    .sa-bd-card__arrow {
      position: absolute;
      right: 10px;
      top: 16px;
      color: #c0c4cc;
      font-size: 18px;
    }
    .sa-bd-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 10px 12px 0;
      padding: 14px 12px;
      background: #fff;
      border-radius: 12px;
      text-decoration: none;
      color: #1f2024;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid #f1f2f5;
    }
    .sa-bd-link.is-warn {
      background: rgba(255, 101, 1, 0.06);
      border-color: rgba(255, 101, 1, 0.22);
    }
    .sa-bd-link__main { flex: 1; min-width: 0; }
    .sa-bd-link__sub {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 400;
      color: #71727a;
      line-height: 1.4;
    }
    .sa-bd-link.is-warn .sa-bd-link__sub { color: #ff6501; }
    .sa-bd-link__arrow { color: #c0c4cc; font-size: 18px; flex-shrink: 0; }
    .sa-bd-sec-title {
      margin: 16px 12px 8px;
      font-size: 14px;
      font-weight: 600;
      color: #1f2024;
    }
  </style>
</head>
<body class="store-app-body">
  <div class="sa-shell sa-rpt-shell">
    <div class="sa-rpt">
      <header class="sa-bd-nav">
        <a href="../../MDM/mdm_bd_workbench.html#home" id="bdBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <h1>经营参谋</h1>
      </header>
      <div class="sa-rpt-scroll">
        <p class="sa-bd-sub" id="bdAsOf">关联门店经营 · 数据截至 —</p>

        <a class="sa-bd-link" href="biz-bd-center.html?from=bd-app&role=bd">
          <div class="sa-bd-link__main">
            数据中心
            <div class="sa-bd-link__sub">当前负责门店的零售、代采，以及本人佣金</div>
          </div>
          <span class="sa-bd-link__arrow" aria-hidden="true">›</span>
        </a>

        <a class="sa-bd-link" id="bdAlertEntry" href="biz-bd-alerts.html?from=bd-app&role=bd">
          <div class="sa-bd-link__main">
            经营提醒
            <div class="sa-bd-link__sub" id="bdAlertLinkHint">加载中…</div>
          </div>
          <span class="sa-bd-link__arrow" aria-hidden="true">›</span>
        </a>

        <div class="sa-bd-sec-title">关联门店</div>
        <div class="sa-rpt-chips" id="bdFilter" role="tablist" style="margin:0 12px 10px">
          <button type="button" class="sa-rpt-chip is-active" data-filter="all">全部<em class="sa-bd-chip-em" id="bdStoreCnt">0</em></button>
          <button type="button" class="sa-rpt-chip" data-filter="alert">有预警<em class="sa-bd-chip-em" id="bdAlertStoreCnt">0</em></button>
        </div>

        <div id="bdStoreList"></div>
      </div>
    </div>
  </div>
  <script src="../js/store-app-biz-report-data.js?v=20261117-bd1"></script>
  <script src="../js/store-app-biz-bd.js?v=20261117-bd3"></script>
</body>
</html>
