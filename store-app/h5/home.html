<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>门店APP · 工作台</title>
  <link rel="stylesheet" href="../css/store-app.css?v=20260726-order-verify-only">
</head>
<body class="store-app-body">
  <div class="sa-shell">
    <div class="sa-home">
      <div class="sa-scroll">
        <header class="sa-header">
          <span class="sa-avatar" aria-hidden="true">牛</span>
          <h1 class="sa-store-name">斯斯门店商家2</h1>
          <button type="button" class="sa-settings" data-sa-action="settings" aria-label="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
              <path d="M12 3.2l7 3.8v5.2c0 4.4-2.9 8.1-7 9.6-4.1-1.5-7-5.2-7-9.6V7L12 3.2z"/>
              <circle cx="12" cy="12" r="2.6"/>
            </svg>
          </button>
        </header>

        <section class="sa-quick" aria-label="快捷核销">
          <button type="button" class="sa-quick__item" data-sa-action="scan">
            <span class="sa-quick__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/>
                <path d="M7 12h10M9 9v6M15 9v6"/>
              </svg>
            </span>
            <span class="sa-quick__label">扫码核销</span>
          </button>
          <button type="button" class="sa-quick__item" data-sa-action="code">
            <span class="sa-quick__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M7 4h8l4 4v12a1 1 0 01-1 1H7a1 1 0 01-1-1V5a1 1 0 011-1z"/>
                <path d="M15 4v4h4M9 13h6M9 17h4"/>
                <path d="M17.5 14.5l1.2 1.2 2.3-2.4"/>
              </svg>
            </span>
            <span class="sa-quick__label">输码核销</span>
          </button>
          <button type="button" class="sa-quick__item" data-sa-action="pending">
            <span class="sa-quick__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M8 4h8v2H8V4zM7 6h10a1 1 0 011 1v13a1 1 0 01-1 1H7a1 1 0 01-1-1V7a1 1 0 011-1z"/>
                <circle cx="12" cy="13.5" r="3.2"/>
                <path d="M12 12.2v1.6l1.1.7"/>
              </svg>
            </span>
            <span class="sa-quick__label">待核销</span>
          </button>
          <button type="button" class="sa-quick__item" data-sa-action="aftersaleQuick">
            <span class="sa-quick__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M7 8h11l1.5 4.5V19a1 1 0 01-1 1H8a1 1 0 01-1-1v-3"/>
                <path d="M7 8L5.5 4H3"/>
                <path d="M9 14H4.5m0 0l2-2m-2 2l2 2"/>
              </svg>
            </span>
            <span class="sa-quick__label">售后</span>
          </button>
        </section>

        <section class="sa-card">
          <h2 class="sa-card__title">基础工具</h2>
          <div class="sa-tools">
            <button type="button" class="sa-tool" data-sa-action="memberCode">
              <span class="sa-tool__icon sa-tool__icon--yellow">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M4 4h7v7H4V4zm2 2v3h3V6H6zm7-2h7v7h-7V4zm2 2v3h3V6h-3zM4 13h7v7H4v-7zm2 2v3h3v-3H6zm9.5-2h1.5v1.5H15.5V13zm3 0H20v1.5h-1.5V13zM13 16.5h1.5V18H13v-1.5zm0 3H14.5V21H13v-1.5zm3-3H17.5V18H16v-1.5zm3 0H20V18h-1.5v-1.5zm-3 3H17.5V21H16v-1.5zm3 0H20V21h-1.5v-1.5z"/>
                </svg>
              </span>
              <span class="sa-tool__label">门店会员码</span>
            </button>

            <button type="button" class="sa-tool" data-sa-action="orders">
              <span class="sa-tool__icon sa-tool__icon--yellow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M8 3h8v2H8V3zM7 5h10a1 1 0 011 1v14a1 1 0 01-1 1H7a1 1 0 01-1-1V6a1 1 0 011-1z"/>
                  <path d="M9 10h6M9 14h6M9 18h4"/>
                </svg>
              </span>
              <span class="sa-tool__label">门店订单</span>
            </button>

            <button type="button" class="sa-tool" data-sa-action="receive">
              <span class="sa-tool__icon sa-tool__icon--orange">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4 8l8-4 8 4v3H4V8z"/>
                  <path d="M4 11v8a1 1 0 001 1h14a1 1 0 001-1v-8"/>
                  <path d="M9 15.5l2 2 4-4"/>
                </svg>
              </span>
              <span class="sa-tool__label">收货</span>
            </button>

            <button type="button" class="sa-tool" data-sa-action="restock" id="saRestockBtn">
              <span class="sa-tool__icon sa-tool__icon--orange">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <circle cx="9" cy="20" r="1.4"/>
                  <circle cx="17" cy="20" r="1.4"/>
                  <path d="M3 4h2l2.2 11h9.8L19 8H7"/>
                  <path d="M12 7v5m0 0l-2-2m2 2l2-2" stroke-linecap="round"/>
                </svg>
              </span>
              <span class="sa-tool__label">进货</span>
            </button>

            <button type="button" class="sa-tool" data-sa-action="wallet">
              <span class="sa-tool__icon sa-tool__icon--orange">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="3" y="6" width="18" height="13" rx="2"/>
                  <path d="M3 10h18"/>
                  <circle cx="16.5" cy="14.5" r="1.2" fill="currentColor"/>
                </svg>
              </span>
              <span class="sa-tool__label">门店钱包</span>
            </button>

            <button type="button" class="sa-tool" data-sa-action="bizCenter">
              <span class="sa-tool__icon sa-tool__icon--orange">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4 19h16"/>
                  <path d="M6 19V10l4-2.5L14 11l4-3v11"/>
                  <path d="M10 19v-5h4v5"/>
                </svg>
              </span>
              <span class="sa-tool__label">经营中心</span>
            </button>

            <button type="button" class="sa-tool" data-sa-action="inventory">
              <span class="sa-tool__icon sa-tool__icon--blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4 10.5L12 4l8 6.5V19a1 1 0 01-1 1h-5v-5H10v5H5a1 1 0 01-1-1v-8.5z"/>
                  <circle cx="16.5" cy="16.5" r="3.2"/>
                  <path d="M18.7 18.7L21 21"/>
                </svg>
              </span>
              <span class="sa-tool__label">库存查询</span>
            </button>

            <button type="button" class="sa-tool" data-sa-action="aftersale">
              <span class="sa-tool__icon sa-tool__icon--blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4 8l8-3.5L20 8v3H4V8z"/>
                  <path d="M4 11v8h16v-8"/>
                  <path d="M9 15H5.5m0 0l1.8-1.8M5.5 15l1.8 1.8"/>
                </svg>
              </span>
              <span class="sa-tool__label">售后</span>
            </button>

            <button type="button" class="sa-tool" data-sa-action="onboarding">
              <span class="sa-tool__icon sa-tool__icon--blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M7 3h8l4 4v13a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/>
                  <path d="M15 3v4h4M9 13h4M9 17h6"/>
                  <path d="M16.5 12.5v4m0 0l-1.5-1.5m1.5 1.5l1.5-1.5"/>
                </svg>
              </span>
              <span class="sa-tool__label">商户进件<span class="sa-tool__dot" aria-hidden="true"></span></span>
            </button>
          </div>
        </section>
      </div>

      <nav class="sa-tabbar" aria-label="门店APP导航">
        <span class="sa-tab is-active">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.2L4 10.5V20a1 1 0 001 1h5v-6h4v6h5a1 1 0 001-1v-9.5L12 4.2z"/></svg>
          <span>工作台</span>
        </span>
        <button type="button" class="sa-tab" data-sa-action="ai">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M5 16.5c0-4.1 3.1-7.5 7-7.5s7 3.4 7 7.5c0 1.4-.4 2.7-1.1 3.8L19 22l-3.2-1.2A7.3 7.3 0 0112 21.5c-3.9 0-7-3.4-7-5z"/>
            <text x="8.2" y="15.2" fill="currentColor" stroke="none" font-size="6.5" font-weight="700" font-family="Arial, sans-serif">AI</text>
          </svg>
          <span>AI</span>
        </button>
        <button type="button" class="sa-tab" data-sa-action="more">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M5.5 19.5c1.2-3.2 3.5-4.8 6.5-4.8s5.3 1.6 6.5 4.8"/>
          </svg>
          <span>更多</span>
        </button>
      </nav>
    </div>
  </div>
  <script src="../js/store-app-home.js?v=20260805-ob"></script>
</body>
</html>
