<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>登录 · 门店APP</title>
  <link rel="stylesheet" href="../css/store-app.css?v=20261109-857">
  <style>
    .sa-login { flex: 1; background: linear-gradient(180deg, #fdf0e6 0, #fff 150px); padding: 72px 30px 24px; display: flex; flex-direction: column; overflow-y: auto; }
    .sa-login__tabs { display: flex; align-items: baseline; gap: 14px; margin-bottom: 44px; }
    .sa-login__tab { border: 0; background: none; padding: 0; font-size: 14px; color: #9a9aa5; cursor: pointer; }
    .sa-login__tab.is-active { font-size: 22px; font-weight: 700; color: #1d1d2b; }
    .sa-login__field { display: flex; align-items: center; padding: 18px 0; }
    .sa-login__field[hidden] { display: none; }
    .sa-login__field + .sa-login__field { border-top: 1px solid #eee; }
    .sa-login__label { width: 64px; flex-shrink: 0; font-size: 15px; color: #333; }
    .sa-login__field input { flex: 1; min-width: 0; border: 0; outline: none; font-size: 15px; color: var(--sa-text); background: transparent; }
    .sa-login__field input::placeholder { color: #b5b5bd; }
    .sa-login__eye, .sa-login__code { border: 0; background: none; padding: 0 0 0 8px; cursor: pointer; }
    .sa-login__eye svg { width: 22px; height: 22px; display: block; }
    .sa-login__code { color: var(--sa-orange-deep); font-size: 14px; white-space: nowrap; }
    .sa-login__forgot { align-self: flex-end; margin-top: 6px; font-size: 13px; color: var(--sa-orange-deep); text-decoration: none; }
    .sa-login__agree { display: flex; align-items: flex-start; gap: 10px; margin-top: 30px; font-size: 13px; color: #666; line-height: 1.5; cursor: pointer; }
    .sa-login__agree input { appearance: none; -webkit-appearance: none; width: 17px; height: 17px; flex-shrink: 0; margin-top: 1px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
    .sa-login__agree input:checked { background: var(--sa-orange); border-color: var(--sa-orange); box-shadow: inset 0 0 0 3px var(--sa-orange); }
    .sa-login__agree b { color: #1a1a1a; }
    .sa-login__err { min-height: 18px; margin-top: 10px; font-size: 13px; color: #e5484d; line-height: 1.5; }
    .sa-login__btn { margin-top: 10px; border: 0; border-radius: 28px; background: var(--sa-orange); color: #fff; font-size: 16px; font-weight: 600; padding: 14px 0; cursor: pointer; }
    .sa-login__btn:disabled { background: #f5b98a; cursor: default; }
    .sa-login__tip { margin-top: 18px; font-size: 12px; color: #aaa; line-height: 1.6; }
  </style>
</head>
<body class="store-app-body">
  <div class="sa-shell">
    <div class="sa-login">
      <div class="sa-login__tabs" role="tablist">
        <button type="button" class="sa-login__tab is-active" data-mode="pwd">账号登录</button>
        <button type="button" class="sa-login__tab" data-mode="sms">验证码登录</button>
      </div>
      <div class="sa-login__field">
        <span class="sa-login__label">手机号</span>
        <input type="tel" id="saLoginPhone" maxlength="11" placeholder="请输入手机号">
      </div>
      <div class="sa-login__field" id="saLoginPwdRow">
        <span class="sa-login__label">密码</span>
        <input type="password" id="saLoginPwd" maxlength="20" placeholder="请输入密码">
        <button type="button" class="sa-login__eye" id="saLoginEye" aria-label="显示密码">
          <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round"><path d="M3 10c2.5 3 5.5 4.5 9 4.5s6.5-1.5 9-4.5M6 13l-1.5 2M10 14.3l-.6 2.3M14 14.3l.6 2.3M18 13l1.5 2"/></svg>
        </button>
      </div>
      <div class="sa-login__field" id="saLoginCodeRow" hidden>
        <span class="sa-login__label">验证码</span>
        <input type="text" id="saLoginCode" maxlength="6" placeholder="请输入验证码">
        <button type="button" class="sa-login__code" id="saLoginSend">获取验证码</button>
      </div>
      <a class="sa-login__forgot" id="saLoginForgot" href="password-forgot.html">忘记密码?</a>
      <label class="sa-login__agree">
        <input type="checkbox" id="saLoginAgree">
        <span>我已阅读并同意<b>《用户服务协议》</b>、<b>《用户隐私政策》</b></span>
      </label>
      <div class="sa-login__err" id="saLoginErr"></div>
      <button type="button" class="sa-login__btn" id="saLoginBtn" disabled>登录</button>
      <p class="sa-login__tip">【857 演示】原手机号 13812348001 名下已没有门店时，账号登录和验证码登录都会提示「该手机号未绑定门店，请联系 BD 或管理员」；其他手机号可正常登录。演示验证码 123456，密码任意。</p>
    </div>
  </div>
  <script src="../js/store-app-toast.js?v=20260826-cutoff"></script>
  <script>
    (function () {
      var KEY = 'sa_857_phone_change_v1';
      var OLD_PHONE = '13812348001';
      var mode = 'pwd';
      var phone = document.getElementById('saLoginPhone');
      var pwd = document.getElementById('saLoginPwd');
      var code = document.getElementById('saLoginCode');
      var agree = document.getElementById('saLoginAgree');
      var btn = document.getElementById('saLoginBtn');
      var err = document.getElementById('saLoginErr');
      function state() {
        try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; }
      }
      function sync() {
        var second = mode === 'pwd' ? pwd.value.trim() : code.value.trim();
        btn.disabled = !(phone.value.trim() && second && agree.checked);
      }
      function setMode(m) {
        mode = m;
        document.querySelectorAll('.sa-login__tab').forEach(function (t) {
          t.classList.toggle('is-active', t.getAttribute('data-mode') === m);
        });
        document.getElementById('saLoginPwdRow').hidden = m !== 'pwd';
        document.getElementById('saLoginCodeRow').hidden = m !== 'sms';
        document.getElementById('saLoginForgot').style.visibility = m === 'pwd' ? 'visible' : 'hidden';
        err.textContent = '';
        sync();
      }
      document.querySelectorAll('.sa-login__tab').forEach(function (t) {
        t.addEventListener('click', function () { setMode(t.getAttribute('data-mode')); });
      });
      document.getElementById('saLoginEye').addEventListener('click', function () {
        pwd.type = pwd.type === 'password' ? 'text' : 'password';
      });
      document.getElementById('saLoginSend').addEventListener('click', function () {
        if (window.LFToast) window.LFToast.show('验证码已发送（演示验证码：123456）');
      });
      [phone, pwd, code].forEach(function (el) { el.addEventListener('input', sync); });
      agree.addEventListener('change', sync);
      if (state().loggedOut) phone.value = OLD_PHONE;
      btn.addEventListener('click', function () {
        var p = phone.value.trim();
        err.textContent = '';
        if (!/^1\d{10}$/.test(p)) { err.textContent = '请输入正确的 11 位手机号'; return; }
        if (mode === 'sms' && code.value.trim() !== '123456') { err.textContent = '验证码错误或已过期'; return; }
        if (p === OLD_PHONE && state().loggedOut) {
          err.textContent = '该手机号未绑定门店，请联系 BD 或管理员';
          return;
        }
        try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
        location.href = 'home.html';
      });
      sync();
    })();
  </script>
  <script src="../../js/pg-prd-float.js?v=20260924-prd-all"></script>
</body>
</html>
