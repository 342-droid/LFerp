<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>经营中心 · 门店APP</title>
  <link rel="stylesheet" href="../css/store-app.css?v=20260803-biz">
  <link rel="stylesheet" href="../css/store-app-biz-center.css?v=20260803">
</head>
<body class="store-app-body">
  <div class="sa-shell sa-biz-shell">
    <div class="sa-biz">
      <header class="sa-biz-nav">
        <a href="home.html" class="sa-biz-nav__back" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <h1 class="sa-biz-nav__title">经营中心</h1>
        <span class="sa-biz-nav__capsule" aria-hidden="true">
          <span class="sa-biz-nav__dots"><i></i><i></i><i></i></span>
          <span class="sa-biz-nav__ring"></span>
        </span>
      </header>

      <div class="sa-biz-scroll">
        <section class="sa-biz-summary">
          <div class="sa-biz-summary__top">
            <div class="sa-biz-summary__balance">
              <div class="sa-biz-summary__label">
                可提现账户余额 (元)
                <button type="button" class="sa-biz-eye" id="bizEyeBtn" aria-label="显示/隐藏余额" aria-pressed="false">
                  <svg class="sa-biz-eye__on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/>
                    <circle cx="12" cy="12" r="2.5"/>
                  </svg>
                  <svg class="sa-biz-eye__off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" hidden>
                    <path d="M3 3l18 18M10.5 10.7A2.5 2.5 0 0012 14.5c.5 0 1-.1 1.4-.4M9.2 5.5C10.1 5.2 11 5 12 5c6.5 0 10 7 10 7a18 18 0 01-4.2 4.6M6.1 6.2A17 17 0 002 12s3.5 7 10 7c1.3 0 2.5-.3 3.6-.7"/>
                  </svg>
                </button>
              </div>
              <div class="sa-biz-summary__amount" id="bizWithdrawAmount">0.00</div>
            </div>
            <button type="button" class="sa-biz-summary__withdraw" id="bizWithdrawBtn">去提现 &gt;</button>
          </div>

          <div class="sa-biz-summary__total" id="bizTotalLine">
            累计总佣金 <em>29.87</em>元 <em>4</em>单
          </div>

          <div class="sa-biz-summary__grid" id="bizPeriodGrid">
            <div class="sa-biz-summary__cell">
              <div class="sa-biz-summary__cell-t">今日佣金</div>
              <div class="sa-biz-summary__cell-v"><span data-k="todayAmt">0.00</span>元</div>
              <div class="sa-biz-summary__cell-c"><span data-k="todayCnt">0</span>单</div>
            </div>
            <div class="sa-biz-summary__cell">
              <div class="sa-biz-summary__cell-t">昨日佣金</div>
              <div class="sa-biz-summary__cell-v"><span data-k="yestAmt">0.00</span>元</div>
              <div class="sa-biz-summary__cell-c"><span data-k="yestCnt">0</span>单</div>
            </div>
            <div class="sa-biz-summary__cell">
              <div class="sa-biz-summary__cell-t">本周佣金</div>
              <div class="sa-biz-summary__cell-v"><span data-k="weekAmt">0.00</span>元</div>
              <div class="sa-biz-summary__cell-c"><span data-k="weekCnt">0</span>单</div>
            </div>
            <div class="sa-biz-summary__cell">
              <div class="sa-biz-summary__cell-t">本月佣金</div>
              <div class="sa-biz-summary__cell-v"><span data-k="monthAmt">0.00</span>元</div>
              <div class="sa-biz-summary__cell-c"><span data-k="monthCnt">0</span>单</div>
            </div>
          </div>
        </section>

        <section class="sa-biz-filter">
          <div class="sa-biz-range" id="bizRangeTabs" role="tablist">
            <button type="button" class="sa-biz-range__btn" data-range="today">今天</button>
            <button type="button" class="sa-biz-range__btn" data-range="yesterday">昨天</button>
            <button type="button" class="sa-biz-range__btn" data-range="7d">近7天</button>
            <button type="button" class="sa-biz-range__btn is-active" data-range="30d">近1个月</button>
          </div>

          <div class="sa-biz-search">
            <button type="button" class="sa-biz-search__type" id="bizSearchTypeBtn">
              <span id="bizSearchTypeLabel">手机号</span>
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 4.5L6 7.5 9 4.5"/></svg>
            </button>
            <input
              type="search"
              class="sa-biz-search__input"
              id="bizSearchInput"
              placeholder="联系人电话/订单编号/会员码/用户昵称/商品"
              autocomplete="off"
            >
            <button type="button" class="sa-biz-search__go" id="bizSearchBtn" aria-label="搜索">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="6.5"/>
                <path d="M16 16l4.5 4.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="sa-biz-search-menu" id="bizSearchTypeMenu" hidden>
            <button type="button" data-type="phone">手机号</button>
            <button type="button" data-type="order">订单编号</button>
            <button type="button" data-type="code">会员码</button>
            <button type="button" data-type="nick">用户昵称</button>
            <button type="button" data-type="goods">商品</button>
          </div>
        </section>

        <section class="sa-biz-ordertabs" id="bizOrderTabs" role="tablist">
          <button type="button" class="sa-biz-ordertabs__btn is-active" data-status="all">全部订单</button>
          <button type="button" class="sa-biz-ordertabs__btn" data-status="pending_ship">待发货</button>
          <button type="button" class="sa-biz-ordertabs__btn" data-status="pending_pickup">待自提/待收货</button>
          <button type="button" class="sa-biz-ordertabs__btn" data-status="done">已完成</button>
        </section>

        <div id="bizOrderList" class="sa-biz-list"></div>
      </div>
    </div>
  </div>

  <script src="../../js/store-wallet-demo.js"></script>
  <script src="../js/store-app-biz-center.js?v=20260803"></script>
</body>
</html>
