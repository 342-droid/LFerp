<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>数据中心 · 丰银宝</title>
  <link rel="stylesheet" href="../css/store-app.css?v=20261120-p1fix">
  <link rel="stylesheet" href="../css/store-app-biz-report.css?v=20261120-p1fix">
  <link rel="stylesheet" href="../css/store-app-biz-datacenter.css?v=20261120-p1fix">
</head>
<body class="store-app-body">
  <div class="sa-shell sa-rpt-shell">
    <div class="sa-rpt sa-dc-page">
      <div class="sa-dc-topbar sa-dc-topbar--overview">
        <div class="sa-dc-head">
          <div class="sa-dc-head__row">
            <div class="sa-rpt-topline" role="tablist" aria-label="数据中心">
              <span class="sa-rpt-topline__tab is-active">总览</span>
              <a class="sa-rpt-topline__tab" id="dcCommLink" href="biz-commission.html">佣金明细</a>
              <i class="sa-rpt-topline__ink is-overview" aria-hidden="true"></i>
            </div>
            <button type="button" class="sa-dc-help sa-dc-help--abs" data-tip="glossary" aria-label="指标说明">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 11v5" stroke-linecap="round"/>
                <circle cx="12" cy="8" r="1" fill="currentColor" stroke="none"/>
              </svg>
              <span class="sa-dc-help__sr">指标说明</span>
            </button>
          </div>
        </div>
      </div>

      <div class="sa-rpt-scroll" id="dcScroll">
        <div class="sa-dc-filterbar" aria-label="公共筛选">
          <div class="sa-dc-ranges" id="dcRanges" role="tablist" aria-label="统计周期"></div>
          <p class="sa-dc-filterbar__tip">以下经营、进货、客户概况均按上方周期统计</p>
        </div>

        <section class="sa-dc-block" aria-label="营业额">
          <div class="sa-dc-block__hd">
            <h2 class="sa-dc-block__title">营业额</h2>
            <a class="sa-dc-link" id="dcToOps" href="biz-ops.html?tab=retail">查看经营数据</a>
          </div>
          <p class="sa-dc-cover" id="dcCoverNote" hidden></p>
          <div class="sa-dc-hero sa-dc-hero--soft" id="dcPaidHero">
            <div class="sa-dc-hero__t" id="dcHeroTitle">营业额</div>
            <div class="sa-dc-hero__v" id="dcPaid">0<span class="sa-dc-hero__unit">元</span></div>
            <div class="sa-dc-hero__foot" id="dcPaidCmp"></div>
          </div>
          <div class="sa-dc-grid sa-dc-grid--3">
            <div class="sa-dc-metric">
              <div class="sa-dc-metric__t">退款金额（元）</div>
              <div class="sa-dc-metric__v" id="dcRefund">0</div>
              <div class="sa-dc-metric__foot" id="dcRefundCmp"></div>
            </div>
            <div class="sa-dc-metric">
              <div class="sa-dc-metric__t">退款后净营业额（元）</div>
              <div class="sa-dc-metric__v" id="dcNet">0</div>
              <div class="sa-dc-metric__foot" id="dcNetCmp"></div>
            </div>
            <div class="sa-dc-metric sa-dc-metric--with-link">
              <div class="sa-dc-metric__t">佣金（元）</div>
              <div class="sa-dc-metric__v" id="dcIncome">0</div>
              <div class="sa-dc-metric__foot" id="dcIncomeCmp"></div>
              <a class="sa-dc-link sa-dc-link--metric" id="dcToCommMetric" href="biz-commission.html">佣金明细</a>
            </div>
          </div>
          <div class="sa-dc-channel" id="dcChannelBody" aria-label="营业额渠道构成"></div>
          <div class="sa-dc-chart" id="dcTrendBox" style="margin-top:14px">
            <div class="sa-dc-block__hd">
              <h2 class="sa-dc-block__title" style="font-size:14px">营业额趋势</h2>
              <div class="sa-dc-chip" id="dcTrendMetric" role="tablist">
                <button type="button" class="sa-dc-chip__btn is-active" data-metric="revenue">营业额</button>
                <button type="button" class="sa-dc-chip__btn" data-metric="revenueNet">净营业额</button>
                <button type="button" class="sa-dc-chip__btn" data-metric="users">交易人数</button>
              </div>
            </div>
            <div class="sa-dc-chart__meta">
              <span id="dcTrendUnit">单位：元</span>
              <button type="button" class="sa-dc-data-toggle" id="dcTrendDataBtn" hidden>查看数据</button>
            </div>
            <div class="sa-dc-chart-wrap" id="dcTrendWrap">
              <div class="sa-dc-chart-y" id="dcTrendY" aria-hidden="true"></div>
              <svg id="dcTrendSvg" viewBox="0 0 289 88" aria-hidden="true"></svg>
            </div>
            <div class="sa-dc-chart-x" id="dcTrendX"></div>
            <div class="sa-dc-data-table" id="dcTrendTable" hidden></div>
          </div>
        </section>

        <section class="sa-dc-block" aria-label="采购支出" id="dcProxySection">
          <div class="sa-dc-block__hd">
            <h2 class="sa-dc-block__title">采购支出</h2>
            <a class="sa-dc-link" id="dcToProxy" href="biz-ops.html?tab=proxy">查看进货数据</a>
          </div>
          <div id="dcProxySummary">—</div>
        </section>

        <section class="sa-dc-block" aria-label="客户概况">
          <div class="sa-dc-block__hd">
            <h2 class="sa-dc-block__title">客户概况</h2>
            <a class="sa-dc-link" id="dcToOperate" href="biz-operate.html?tab=customers">查看运营数据</a>
          </div>
          <div class="sa-dc-grid sa-dc-grid--2">
            <div class="sa-dc-metric">
              <div class="sa-dc-metric__t">交易人数（人）</div>
              <div class="sa-dc-metric__v" id="dcPayUsers">0</div>
            </div>
            <div class="sa-dc-metric">
              <div class="sa-dc-metric__t">首购客户数（人）</div>
              <div class="sa-dc-metric__v" id="dcFirst">0</div>
            </div>
            <div class="sa-dc-metric">
              <div class="sa-dc-metric__t">老客户数（人）</div>
              <div class="sa-dc-metric__v" id="dcOld">0</div>
            </div>
            <div class="sa-dc-metric">
              <div class="sa-dc-metric__t">购买2次及以上（人）</div>
              <div class="sa-dc-metric__v" id="dcMulti">0</div>
            </div>
          </div>
        </section>
      </div>

      <nav class="sa-rpt-tabbar" aria-label="丰银宝导航">
        <a href="home.html" class="sa-rpt-tab" id="dcHomeTab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-9.5z"/></svg>
          <span>工作台</span>
        </a>
        <button type="button" class="sa-rpt-tab" data-sa-toast="AI助手演示中">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M5 16.5c0-4.1 3.1-7.5 7-7.5s7 3.4 7 7.5c0 1.4-.4 2.7-1.1 3.8L19 22l-3.2-1.2A7.3 7.3 0 0112 21.5c-3.9 0-7-3.4-7-5z"/>
          </svg>
          <span>AI</span>
        </button>
        <span class="sa-rpt-tab is-active">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h14v3H5V4zm2 5h3v11H7V9zm5 0h3v8h-3V9zm5 0h3v11h-3V9z"/></svg>
          <span>数据中心</span>
        </span>
        <a href="more.html" class="sa-rpt-tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M5.5 19.5c1.2-3.2 3.5-4.8 6.5-4.8s5.3 1.6 6.5 4.8"/>
          </svg>
          <span>更多</span>
        </a>
      </nav>
    </div>

    <div class="sa-rpt-toast" id="dcToast" hidden></div>
    <div class="sa-rpt-sheet sa-rpt-sheet--tip" id="dcSheet" hidden>
      <div class="sa-rpt-sheet__panel" role="dialog" aria-modal="true">
        <div class="sa-rpt-sheet__hd">
          <strong id="dcSheetTitle">指标说明</strong>
          <button type="button" class="sa-rpt-sheet__close" data-close-sheet aria-label="关闭">×</button>
        </div>
        <div id="dcSheetBody" class="sa-rpt-sheet__body"></div>
      </div>
    </div>
    <div class="sa-rpt-sheet sa-rpt-sheet--time" id="dcRangeSheet" hidden>
      <div class="sa-rpt-sheet__panel" role="dialog" aria-modal="true">
        <div class="sa-rpt-sheet__hd">
          <strong>自定义日期</strong>
          <button type="button" class="sa-rpt-sheet__close" data-close-range aria-label="关闭">×</button>
        </div>
        <div class="sa-rpt-custom" id="dcCustom">
          <div class="sa-rpt-custom__row">
            <label class="sa-rpt-custom__field"><span>开始</span><input type="date" id="dcCustomStart"></label>
            <span class="sa-rpt-custom__sep">至</span>
            <label class="sa-rpt-custom__field"><span>结束</span><input type="date" id="dcCustomEnd"></label>
          </div>
          <p class="sa-rpt-custom__err" id="dcCustomErr" hidden></p>
          <button type="button" class="sa-rpt-custom__btn" id="dcCustomApply">确定</button>
        </div>
      </div>
    </div>
  </div>

    <div class="sa-lp-demo" id="dcNoPurchaseDemo" aria-label="采购支出验收开关">
      <div class="sa-lp-demo__title">采购支出验收开关</div>
      <label class="sa-lp-demo__row">进货场景<select id="dcNoPurchaseMode" aria-label="进货场景">
        <option value="normal">正常有进货记录</option>
        <option value="noPurchase">门店从未进货</option>
      </select></label>
      <p class="sa-lp-demo__hint">模拟门店没有进货记录时，采购支出模块不展示。</p>
      <button type="button" class="sa-lp-demo__apply" id="dcNoPurchaseApply">应用并刷新</button>
    </div>

  <script src="../../js/business-report-fixtures.js"></script>
  <script src="../js/store-app-biz-datacenter-data.js?v=20261126-yyye"></script>
  <script src="../js/store-app-biz-session.js?v=20261120-p1fix"></script>
  <script src="../js/store-app-biz-datacenter-state.js?v=20261120-p1fix"></script>
  <script src="../js/store-app-biz-datacenter-overview.js?v=20261126-yyye"></script>
</body>
</html>
