<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>数据中心 · 门店</title>
  <meta http-equiv="refresh" content="1;url=biz-center.html">
</head>
<body>
  <p><a id="storeCenterLink" href="biz-center.html">返回门店数据中心</a></p>
  <script>
    (function () {
      var source = new URLSearchParams(location.search);
      var target = new URLSearchParams();
      ['range', 'start', 'end'].forEach(function (key) {
        if (source.has(key)) target.set(key, source.get(key));
      });
      var suffix = target.toString();
      var href = 'biz-center.html' + (suffix ? '?' + suffix : '');
      document.getElementById('storeCenterLink').href = href;
      location.replace(href);
    })();
  </script>
</body>
</html>
