<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰ERP - 更新日志</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
        }
        .cl-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 16px;
            height: 60px;
            padding: 0 24px;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
        }
        .cl-back {
            border: 1px solid #d9d9d9;
            background: #fff;
            border-radius: 4px;
            padding: 5px 12px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
        }
        .cl-back:hover { border-color: #2c313c; }
        .cl-header h1 { font-size: 17px; color: #2c313c; flex: 1; }
        .cl-header .cl-meta { font-size: 12px; color: #999; }
        .cl-header .cl-meta a { color: #4a90d9; text-decoration: none; }
        .cl-wrap { max-width: 860px; margin: 24px auto 60px; padding: 0 16px; }
        .cl-day { margin-bottom: 20px; }
        .cl-day-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #2c313c;
            margin: 0 0 8px 4px;
        }
        .cl-day-tag {
            font-size: 11px;
            font-weight: normal;
            color: #fff;
            background: #4a90d9;
            border-radius: 3px;
            padding: 1px 6px;
        }
        .cl-day-count { font-size: 12px; font-weight: normal; color: #999; }
        .cl-card {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            overflow: hidden;
        }
        .cl-entry { border-bottom: 1px solid #f0f0f0; }
        .cl-entry:last-child { border-bottom: none; }
        .cl-item {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 10px 16px;
            font-size: 13px;
        }
        .cl-note {
            margin: 0 16px 9px 66px;
            padding: 1px 0 1px 10px;
            border-left: 2px solid #e0e4ea;
            font-size: 12px;
            color: #7a8088;
            line-height: 1.7;
        }
        .cl-badge {
            flex: none;
            font-size: 11px;
            border-radius: 3px;
            padding: 1px 7px;
            color: #fff;
            min-width: 40px;
            text-align: center;
        }
        .cl-badge.feat { background: #52c41a; }
        .cl-badge.fix { background: #f5222d; }
        .cl-badge.docs { background: #4a90d9; }
        .cl-badge.refactor { background: #722ed1; }
        .cl-badge.perf { background: #fa8c16; }
        .cl-badge.other { background: #8c9099; }
        .cl-text { flex: 1; color: #333; line-height: 1.6; word-break: break-all; }
        .cl-item-meta { flex: none; font-size: 12px; color: #999; white-space: nowrap; }
        .cl-item-meta a { color: #bbb; text-decoration: none; font-family: Menlo, Consolas, monospace; }
        .cl-item-meta a:hover { color: #4a90d9; }
        .cl-sub-title {
            display: block;
            width: 100%;
            text-align: left;
            border: none;
            cursor: pointer;
            padding: 8px 16px;
            font-size: 12px;
            color: #999;
            background: #fafafa;
            border-top: 1px solid #f0f0f0;
        }
        .cl-sub-title:hover { color: #4a90d9; }
        .cl-page-module {
            flex: none;
            font-size: 11px;
            color: #666;
            background: #f0f2f5;
            border-radius: 3px;
            padding: 1px 6px;
        }
        .cl-page-go { font-weight: normal; color: #bbb; font-size: 12px; }
        .cl-cmt-toggle {
            flex: none;
            border: none;
            background: none;
            font-size: 12px;
            color: #4a90d9;
            cursor: pointer;
            padding: 2px 4px;
        }
        .cl-cmt-body { padding-bottom: 6px; }
        .cl-cpage {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 5px 16px 5px 66px;
            font-size: 12.5px;
        }
        .cl-cpage--quiet { opacity: 0.45; }
        .cl-cpage--quiet:hover { opacity: 1; }
        .cl-cpage-name { flex: none; font-weight: 600; color: #2c313c; text-decoration: none; }
        .cl-cpage-name:hover { color: #4a90d9; }
        .cl-cpage-name:hover .cl-page-go { color: #4a90d9; }
        .cl-cpage-note { flex: 1; color: #7a8088; line-height: 1.7; min-width: 0; }
        .cl-cmp-link { flex: none; font-size: 12px; color: #4a90d9; text-decoration: none; white-space: nowrap; }
        .cl-cmp-link:hover { text-decoration: underline; }
        .cl-cmp-none { flex: none; font-size: 11px; color: #bbb; white-space: nowrap; cursor: help; }
        .cl-more, .cl-status {
            display: block;
            width: 100%;
            margin-top: 4px;
            border: 1px dashed #d9d9d9;
            background: none;
            border-radius: 6px;
            padding: 10px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            text-align: center;
        }
        .cl-more:hover { border-color: #2c313c; }
        .cl-status { cursor: default; border-style: solid; }
        .cl-status a { color: #4a90d9; }
    </style>
</head>
<body>
    <header class="cl-header">
        <button class="cl-back" onclick="if (history.length > 1) { history.back(); } else { location.href = 'index.html'; }">← 返回</button>
        <h1>更新日志</h1>
        <span class="cl-meta" id="cl-meta"></span>
    </header>

    <div class="cl-wrap">
        <div id="cl-content"><div class="cl-status">加载中…</div></div>
        <button class="cl-more" id="cl-more" hidden>显示更早的记录</button>
    </div>

    <script>
        (function () {
            var REPO_URL = 'https://github.com/342-droid/LFerp';
            var FIRST_BATCH_DAYS = 10;
            var TYPE_LABELS = {
                feat: '新功能', fix: '修复', docs: '文档', refactor: '重构',
                perf: '优化', test: '测试', style: '样式', chore: '工程',
                build: '工程', ci: '工程', revert: '回滚', other: '其他'
            };
            var BADGE_CLASS = { feat: 'feat', fix: 'fix', docs: 'docs', refactor: 'refactor', perf: 'perf' };

            function esc(s) {
                return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }
            function bjToday(offsetDays) {
                var d = new Date(Date.now() - (offsetDays || 0) * 86400000);
                return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Shanghai' }).format(d);
            }
            var MANIFEST = {}; // 变更对比图清单（changelog-assets/manifest.json）

            /* 面向看原型的同事：只展示「改了什么」的一句话说明，不透出 sha/diff 等代码信息 */
            function commitRow(it, file, pageTitle) {
                var cls = BADGE_CLASS[it.type] || 'other';
                var label = TYPE_LABELS[it.type] || TYPE_LABELS.other;
                var cmp = '';
                if (file) {
                    var e = MANIFEST[it.sha + '|' + file];
                    if (e) {
                        var href = 'compare.html?k=' + encodeURIComponent(it.sha + '|' + file) +
                            '&t=' + encodeURIComponent((pageTitle || '') + ' · ' + it.text);
                        if (e.status === 'added') {
                            cmp = '<a class="cl-cmp-link" href="' + href + '" target="_blank" rel="noopener">新增 · 看截图</a>';
                        } else if (e.regions > 0) {
                            cmp = '<a class="cl-cmp-link" href="' + href + '" target="_blank" rel="noopener">看对比</a>';
                        } else {
                            cmp = '<span class="cl-cmp-none" title="改动在交互或数据逻辑里，打开页面的默认状态截图看不出差异">无界面变化</span>';
                        }
                    }
                }
                // 按页面说明：页面上下文取该页的行 + 提交级(通用/未归属)行；其他改动/旧格式只取提交级行
                var noteHtml = (it.notes || [])
                    .filter(function (n) { return file ? (n.file === file || n.file === null) : n.file === null; })
                    .map(function (n) { return '<div class="cl-note">' + esc(n.text) + '</div>'; })
                    .join('');
                return '<div class="cl-entry"><div class="cl-item">' +
                    '<span class="cl-badge ' + cls + '">' + label + '</span>' +
                    '<span class="cl-text">' + esc(it.text) + '</span>' + cmp +
                    '<span class="cl-item-meta">' + esc(it.author) + ' · ' + esc(it.time) + '</span>' +
                    '</div>' + noteHtml + '</div>';
            }
            /** 按提交拆分一天：有页面的走 commitBlock，无页面的进「其他改动」；旧格式返回 null */
            function aggDay(day) {
                var hasPages = day.items.some(function (it) { return 'pages' in it; });
                if (!hasPages) return null;
                var commits = [];
                var others = [];
                day.items.forEach(function (it) {
                    if ((it.pages || []).length) commits.push(it);
                    else others.push(it);
                });
                return { commits: commits, others: others };
            }
            /* 提交下的页面拆分行：页面名 + 该页说明 + 对比入口 */
            function cmpEntry(it, file, pageTitle) {
                var e = MANIFEST[it.sha + '|' + file];
                if (!e) return '';
                var href = 'compare.html?k=' + encodeURIComponent(it.sha + '|' + file) +
                    '&t=' + encodeURIComponent((pageTitle || '') + ' · ' + it.text);
                if (e.status === 'added') {
                    return '<a class="cl-cmp-link" href="' + href + '" target="_blank" rel="noopener">新增 · 看截图</a>';
                }
                if (e.regions > 0) {
                    return '<a class="cl-cmp-link" href="' + href + '" target="_blank" rel="noopener">看对比</a>';
                }
                return '<span class="cl-cmp-none" title="改动在交互或数据逻辑里，打开页面的默认状态截图看不出差异">无界面变化</span>';
            }
            function pageNotesOf(it, file) {
                return (it.notes || []).filter(function (n) { return n.file === file; });
            }
            /** 没有说明且截图无差异的页面行弱化 */
            function isQuietPage(it, p) {
                var e = MANIFEST[it.sha + '|' + p.file];
                return !pageNotesOf(it, p.file).length && e && e.status === 'diff' && e.regions === 0;
            }
            function commitPageRow(it, p) {
                var notes = pageNotesOf(it, p.file);
                return '<div class="cl-cpage' + (isQuietPage(it, p) ? ' cl-cpage--quiet' : '') + '">' +
                    (p.module ? '<span class="cl-page-module">' + esc(p.module) + '</span>' : '') +
                    '<a class="cl-cpage-name" href="' + esc(p.file) + '" target="_blank" rel="noopener">' +
                    esc(p.title) + ' <span class="cl-page-go">↗</span></a>' +
                    '<span class="cl-cpage-note">' +
                    notes.map(function (n) { return esc(n.text); }).join('；') + '</span>' +
                    cmpEntry(it, p.file, p.title) +
                    '</div>';
            }
            /** 提交为主体的条目：标题行 + 提交级说明 + 页面拆分（弱化的沉底） */
            function commitBlock(it, expanded) {
                var cls = BADGE_CLASS[it.type] || 'other';
                var label = TYPE_LABELS[it.type] || TYPE_LABELS.other;
                var generalNotes = (it.notes || [])
                    .filter(function (n) { return n.file === null; })
                    .map(function (n) { return '<div class="cl-note">' + esc(n.text) + '</div>'; })
                    .join('');
                var pages = it.pages.slice().sort(function (a, b) {
                    return (isQuietPage(it, a) ? 1 : 0) - (isQuietPage(it, b) ? 1 : 0);
                });
                var body = generalNotes + pages.map(function (p) { return commitPageRow(it, p); }).join('');
                return '<div class="cl-entry">' +
                    '<div class="cl-item">' +
                    '<span class="cl-badge ' + cls + '">' + label + '</span>' +
                    '<span class="cl-text">' + esc(it.text) + '</span>' +
                    '<button class="cl-cmt-toggle" type="button" data-count="' + it.pages.length + '">' +
                    (expanded ? '收起 ▴' : it.pages.length + ' 个页面 ▾') + '</button>' +
                    '<span class="cl-item-meta">' + esc(it.author) + ' · ' + esc(it.time) + '</span>' +
                    '</div>' +
                    '<div class="cl-cmt-body"' + (expanded ? '' : ' hidden') + '>' + body + '</div>' +
                    '</div>';
            }
            function dayHtml(day) {
                var tag = '';
                if (day.date === bjToday(0)) tag = '<span class="cl-day-tag">今天</span>';
                else if (day.date === bjToday(1)) tag = '<span class="cl-day-tag">昨天</span>';
                var agg = aggDay(day);
                var body;
                var countText;
                if (!agg) {
                    body = day.items.map(function (it) { return commitRow(it); }).join('');
                    countText = day.items.length + ' 条';
                } else {
                    // 今天/昨天默认展开页面拆分，更早的收起
                    var expanded = day.date === bjToday(0) || day.date === bjToday(1);
                    body = agg.commits.map(function (it) { return commitBlock(it, expanded); }).join('');
                    if (agg.others.length) {
                        body += '<button class="cl-sub-title cl-others-toggle" type="button">其他改动（全局样式 / 框架 / 文档等）' +
                            agg.others.length + ' 条 ▾</button>' +
                            '<div class="cl-others" hidden>' +
                            agg.others.map(function (it) { return commitRow(it); }).join('') + '</div>';
                    }
                    var pageCount = agg.commits.reduce(function (s, it) { return s + it.pages.length; }, 0);
                    countText = agg.commits.length
                        ? agg.commits.length + ' 项更新 · ' + pageCount + ' 个页面'
                        : day.items.length + ' 条';
                }
                return '<section class="cl-day">' +
                    '<h2 class="cl-day-title">' + esc(day.date) + tag +
                    '<span class="cl-day-count">' + countText + '</span></h2>' +
                    '<div class="cl-card">' + body + '</div></section>';
            }
            function render(data) {
                var content = document.getElementById('cl-content');
                var more = document.getElementById('cl-more');
                if (!data.days || !data.days.length) {
                    content.innerHTML = '<div class="cl-status">暂无更新记录</div>';
                    return;
                }
                document.getElementById('cl-meta').innerHTML =
                    '共 ' + data.total + ' 条 · <a href="' + REPO_URL + '/commits/main" target="_blank" rel="noopener">GitHub 提交记录</a>';
                content.innerHTML = data.days.slice(0, FIRST_BATCH_DAYS).map(dayHtml).join('');
                if (data.days.length > FIRST_BATCH_DAYS) {
                    more.hidden = false;
                    more.onclick = function () {
                        content.innerHTML += data.days.slice(FIRST_BATCH_DAYS).map(dayHtml).join('');
                        more.hidden = true;
                    };
                }
                try { localStorage.setItem('lfChangelogSeenSha', data.latestSha || ''); } catch (e) { /* 隐私模式忽略 */ }
            }
            document.getElementById('cl-content').addEventListener('click', function (e) {
                var btn = e.target.closest('.cl-cmt-toggle');
                if (btn) {
                    var bodyEl = btn.closest('.cl-entry').querySelector('.cl-cmt-body');
                    bodyEl.hidden = !bodyEl.hidden;
                    btn.textContent = bodyEl.hidden ? btn.getAttribute('data-count') + ' 个页面 ▾' : '收起 ▴';
                    return;
                }
                var sub = e.target.closest('.cl-others-toggle');
                if (sub) {
                    var others = sub.nextElementSibling;
                    others.hidden = !others.hidden;
                    sub.textContent = sub.textContent.replace(others.hidden ? '▴' : '▾', others.hidden ? '▾' : '▴');
                }
            });
            Promise.all([
                fetch('changelog.json', { cache: 'no-cache' })
                    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }),
                fetch('changelog-assets/manifest.json', { cache: 'no-cache' })
                    .then(function (r) { return r.ok ? r.json() : {}; })
                    .catch(function () { return {}; })
            ])
                .then(function (rs) {
                    MANIFEST = rs[1] || {};
                    render(rs[0]);
                })
                .catch(function () {
                    document.getElementById('cl-content').innerHTML =
                        '<div class="cl-status">更新日志数据加载失败，可直接查看 <a href="' + REPO_URL +
                        '/commits/main" target="_blank" rel="noopener">GitHub 提交记录</a></div>';
                });
        })();
    </script>
</body>
</html>
