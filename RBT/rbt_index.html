<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰RBT - 首页</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-contract.css?v=20261120-rbt-read">
    <style>
        .rbt-risk-block { margin: 0 0 20px; }
        .rbt-risk-block:first-of-type { margin-top: 16px; }
        .rbt-risk-cards { display: flex; gap: 12px; }
        .rbt-risk-card { flex: 1; padding: 14px 16px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; }
        .rbt-risk-card span { display: block; color: #909399; font-size: 13px; }
        .rbt-risk-card b { display: block; margin-top: 6px; font-size: 24px; line-height: 1.2; }
        .rbt-risk-card.is-ok b { color: #389e0d; }
        .rbt-risk-card.is-watch b { color: #d48806; }
        .rbt-risk-card.is-warn b { color: #d46b08; }
        .rbt-risk-card.is-bad b { color: #cf1322; }
        .rbt-risk-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 8px; }
        .rbt-risk-head h3 { margin: 0; font-size: 15px; }
        .rbt-risk-all { color: #155bd4; font-size: 13px; text-decoration: none; white-space: nowrap; }
        .rbt-risk-all:hover { text-decoration: underline; }
        .rbt-risk-table-wrap { width: 100%; overflow-x: auto; }
        .rbt-risk-scroll { overflow: auto; }
        .rbt-risk-scroll thead th { position: sticky; top: 0; z-index: 1; }
        .rbt-risk-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
        .rbt-risk-table th,
        .rbt-risk-table td { border: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; vertical-align: top; }
        .rbt-risk-table th { background: #f7f8fa; font-weight: 600; color: #303133; white-space: nowrap; }
        .rbt-risk-table td.is-money { text-align: right; white-space: nowrap; }
        .rbt-risk-table td.is-empty { text-align: center; color: #909399; }
        .rbt-risk-tag { display: inline-block; padding: 0 8px; border-radius: 4px; line-height: 22px; font-size: 12px; }
        .rbt-risk-tag.is-正常 { color: #389e0d; background: #f6ffed; }
        .rbt-risk-tag.is-关注 { color: #d48806; background: #fffbe6; }
        .rbt-risk-tag.is-预警 { color: #d46b08; background: #fff7e6; }
        .rbt-risk-tag.is-异常 { color: #cf1322; background: #fff1f0; }
        .rbt-risk-link { border: 0; padding: 0; background: transparent; color: #155bd4; cursor: pointer; font: inherit; }
        .rbt-risk-empty { margin: 0; color: #909399; font-size: 13px; }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="rbt-sidebar.js"></script>

    <div id="header-container"></div>

    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button type="button" class="active">付款风险</button></div>
            <hr class="content-divider">

            <section class="rbt-risk-block">
                <div class="rbt-risk-head"><h3>付款风险统计总览</h3></div>
                <div class="rbt-risk-cards" id="rbtRiskCards"></div>
            </section>

            <section class="rbt-risk-block">
                <div class="rbt-risk-head"><h3>异常提醒</h3></div>
                <div class="rbt-risk-table-wrap">
                <table class="rbt-risk-table">
                    <thead>
                        <tr>
                            <th>门店</th><th>付款单号</th><th>需求单号</th><th>付款风险等级</th><th>异常提醒</th>
                        </tr>
                    </thead>
                    <tbody id="rbtRiskAlerts"></tbody>
                </table>
                </div>
            </section>

            <section class="rbt-risk-block">
                <div class="rbt-risk-head">
                    <h3>异常待处理单据</h3>
                    <a class="rbt-risk-all" href="rbt_risk_abnormal.html?handle=待处置">全部</a>
                </div>
                <div class="rbt-risk-table-wrap">
                <table class="rbt-risk-table">
                    <thead>
                        <tr>
                            <th>门店</th><th>付款单号</th><th>需求单号</th>
                            <th>付款风险等级</th><th>剩余付款额</th><th>连续未付款天数</th><th>工单状态</th>
                        </tr>
                    </thead>
                    <tbody id="rbtRiskPending"></tbody>
                </table>
                </div>
            </section>

            <section class="rbt-risk-block">
                <div class="rbt-risk-head">
                    <h3>当天付款中</h3>
                    <a class="rbt-risk-all" id="rbtRiskTodayAll" href="rbt_daily_fulfill.html">全部</a>
                </div>
                <div class="rbt-risk-table-wrap" id="rbtRiskTodayWrap">
                <table class="rbt-risk-table">
                    <thead>
                        <tr>
                            <th>付款子单号</th><th>结款状态</th><th>门店</th><th>需求单号</th>
                            <th>角色</th><th>收款方名称</th><th>支付方式</th><th>付款账户</th>
                            <th>应付</th><th>实际付款</th>
                        </tr>
                    </thead>
                    <tbody id="rbtRiskToday"></tbody>
                </table>
                </div>
            </section>
        </main>
    </div>

    <script src="rbt-fresh.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/contract-bodies.js?v=20261120-rbt-read"></script>
    <script src="../js/basic-settings-contract.js?v=20261120-rbt-read"></script>
    <script src="rbt-store-data.js"></script>
    <script src="rbt-settle-ratio.js"></script>
    <script src="rbt-demand-data.js?v=20261128-rbt-auto"></script>
    <script src="rbt-demand-detail.js?v=20261128-rbt-auto"></script>
    <script src="rbt-daily-fulfill.js?v=20261128-ratio-node"></script>
    <script src="rbt-risk.js?v=20261128-occurred-days"></script>
    <script>
        (function () {
            var api = window.RbtRisk;
            function esc(value) {
                return String(value == null ? '' : value)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
            function tag(grade) {
                return '<span class="rbt-risk-tag is-' + esc(grade) + '">' + esc(grade) + '</span>';
            }
            var dataApi = window.RbtDemandData;
            var dailyApi = window.RbtDailyFulfill;
            function demandOf(code) {
                return dataApi && dataApi.get ? dataApi.get(code) : null;
            }
            function ledgerOf(item) {
                return item && dailyApi && typeof dailyApi.ledgerNo === 'function' ? (dailyApi.ledgerNo(item) || '') : '';
            }
            function moneyText(value) {
                if (value == null || value === '' || value === '—') return '—';
                var text = String(value);
                return text.charAt(0) === '¥' ? esc(text) : ('¥' + esc(text));
            }
            function todayText() {
                var now = new Date();
                var month = String(now.getMonth() + 1);
                var day = String(now.getDate());
                if (month.length < 2) month = '0' + month;
                if (day.length < 2) day = '0' + day;
                return now.getFullYear() + '-' + month + '-' + day;
            }
            function codeCell(text, kind, code) {
                if (!code) return esc(text || '—');
                return '<button type="button" class="rbt-risk-link" data-' + kind + '="' + esc(code) + '">' + esc(text || '—') + '</button>';
            }
            function emptyRow(cols, text) {
                return '<tr><td class="is-empty" colspan="' + cols + '">' + esc(text) + '</td></tr>';
            }
            var live = api.liveRows().map(function (row) {
                row.ledger = ledgerOf(demandOf(row.demandCode));
                return row;
            });
            var counts = { '正常': 0, '关注': 0, '预警': 0, '异常': 0 };
            live.forEach(function (row) { counts[row.grade] = (counts[row.grade] || 0) + 1; });
            document.getElementById('rbtRiskCards').innerHTML = [
                ['正常', 'is-ok'],
                ['关注', 'is-watch'],
                ['预警', 'is-warn'],
                ['异常', 'is-bad']
            ].map(function (item) {
                return '<div class="rbt-risk-card ' + item[1] + '"><span>' + item[0] + '</span><b>' + (counts[item[0]] || 0) + '</b></div>';
            }).join('');
            var alerts = live.filter(function (row) { return row.grade !== '正常'; });
            document.getElementById('rbtRiskAlerts').innerHTML = alerts.length ? alerts.map(function (row) {
                return '<tr><td>' + esc(row.storeName) + '</td><td>' + codeCell(row.ledger, 'ledger', row.demandCode) + '</td><td>' + codeCell(row.demandCode, 'demand', row.demandCode) + '</td><td>' + tag(row.grade) + '</td><td>' + esc(row.alert) + '</td></tr>';
            }).join('') : emptyRow(5, '暂无异常提醒');

            var pending = (typeof api.exceptionRows === 'function' ? api.exceptionRows() : []).filter(function (row) {
                return row.source === '当前台账' && row.handleStatus === '待处置';
            });
            document.getElementById('rbtRiskPending').innerHTML = pending.length ? pending.map(function (row) {
                var ledger = ledgerOf(demandOf(row.demandCode)) || '—';
                return '<tr><td>' + esc(row.storeName) + '</td><td>' + codeCell(ledger, 'ledger', row.demandCode) + '</td><td>' + codeCell(row.demandCode, 'demand', row.demandCode) + '</td><td>' + tag(row.grade) + '</td><td class="is-money">' + moneyText(row.gap) + '</td><td>' + esc(row.streak) + '</td><td>' + esc(row.handleStatus) + '</td></tr>';
            }).join('') : emptyRow(7, '暂无待处理单据');

            var today = todayText();
            document.getElementById('rbtRiskTodayAll').href = 'rbt_daily_fulfill.html?date=' + encodeURIComponent(today);
            var todayRows = (dailyApi && typeof dailyApi.partyRows === 'function' ? dailyApi.partyRows() : []).filter(function (row) {
                return row && row.date === today;
            });
            document.getElementById('rbtRiskToday').innerHTML = todayRows.length ? todayRows.map(function (row) {
                return '<tr><td>' + esc(row.payNo || '—') + '</td><td>' + esc(row.settleStatus || '—') + '</td><td>' + esc(row.storeName || '—') + '</td><td>' + codeCell(row.demandCode, 'demand', row.demandCode) + '</td><td>' + esc(row.payeeRole || '—') + '</td><td>' + esc(row.payeeName || '—') + '</td><td>' + esc(row.payWay || row.channel || '—') + '</td><td>' + esc(row.payAccount || '—') + '</td><td class="is-money">' + moneyText(row.due) + '</td><td class="is-money">' + moneyText(row.actual) + '</td></tr>';
            }).join('') : emptyRow(10, '当天暂无付款');
            var todayWrap = document.getElementById('rbtRiskTodayWrap');
            if (todayRows.length > 3) {
                var head = todayWrap.querySelector('thead');
                var sample = todayWrap.querySelector('tbody tr');
                var headHeight = head ? head.getBoundingClientRect().height : 37;
                var rowHeight = sample ? sample.getBoundingClientRect().height : 37;
                todayWrap.classList.add('rbt-risk-scroll');
                todayWrap.style.maxHeight = Math.ceil(headHeight + rowHeight * 3) + 'px';
            }

            document.querySelector('.main-content').addEventListener('click', function (event) {
                var ledger = event.target.closest('[data-ledger]');
                var demand = event.target.closest('[data-demand]');
                var button = ledger || demand;
                if (!button) return;
                var raw = button.getAttribute(ledger ? 'data-ledger' : 'data-demand');
                if (!raw || raw === '—') return;
                var item = demandOf(raw);
                if (item && window.RbtDemandDetail) window.RbtDemandDetail.open(item, ledger ? { performance: true } : undefined);
            });
        })();
    </script>
</body>
</html>
