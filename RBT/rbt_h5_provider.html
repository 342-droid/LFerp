<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰RBT-移动端 - 服务商端</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="rbt-h5-party.css?v=20261127-ledger2">
    <style>
        .rbt-h5-store-stage {
            min-height: calc(100vh - 88px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px 0 28px;
            background: #f5f5f5;
        }
        .rbt-h5-phone {
            width: 393px;
            height: 851px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .rbt-h5-phone__head {
            padding: 32px 24px 16px;
            background: #ff7019;
            color: #fff;
        }
        .rbt-h5-phone__head h1 { margin: 0; font-size: 26px; font-weight: 600; }
        .rbt-h5-phone__head p { margin: 8px 0 0; font-size: 14px; opacity: 0.92; }
        .rbt-h5-phone__body {
            flex: 1;
            min-height: 0;
            padding: 20px 24px 24px;
            display: flex;
            flex-direction: column;
        }
        .rbt-h5-phone.is-app .rbt-h5-phone__head {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 28px 16px 14px;
        }
        .rbt-h5-phone.is-app .rbt-h5-phone__head h1 {
            flex: 1;
            min-width: 0;
            margin: 0;
            font-size: 20px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rbt-h5-phone.is-app .rbt-h5-phone__head p { display: none; }
        .rbt-h5-head-back {
            flex: none;
            width: 28px;
            height: 28px;
            margin-left: -4px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .rbt-h5-phone.is-app .rbt-h5-head-back.is-on { display: flex; }
        .rbt-h5-phone.is-app .rbt-h5-phone__body { padding: 0; }
        .rbt-h5-login-form { display: none; flex: 1; min-height: 0; overflow: auto; }
        .rbt-h5-app {
            display: none;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            background: #f7f7f7;
        }
        .rbt-h5-phone.is-login .rbt-h5-login-form { display: block; }
        .rbt-h5-phone.is-app .rbt-h5-app { display: flex; }
        .rbt-h5-scroll { flex: 1; min-height: 0; overflow: auto; padding: 12px 12px 16px; }
        .rbt-h5-scroll.is-collect { padding: 0 0 16px; }
        .rbt-h5-accounts { margin-top: 16px; }
        .rbt-h5-accounts h2 { margin: 0 0 8px; color: #333; font-size: 14px; }
        .rbt-h5-account {
            margin-bottom: 6px;
            padding: 6px 10px;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            background: #fafafa;
        }
        .rbt-h5-account strong { display: block; color: #222; font-size: 13px; }
        .rbt-h5-account button {
            display: block;
            width: 100%;
            margin-top: 2px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #555;
            font-size: 13px;
            line-height: 1.5;
            text-align: left;
            cursor: pointer;
        }
        .rbt-h5-field { margin-bottom: 12px; }
        .rbt-h5-field label { display: block; margin-bottom: 8px; color: #333; font-size: 14px; }
        .rbt-h5-field input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: #fff;
            color: #222;
        }
        .rbt-h5-field input:focus { outline: none; border-color: #ff7019; }
        .rbt-h5-tip { margin: 0 0 12px; color: #888; font-size: 12px; line-height: 1.6; }
        .rbt-h5-login {
            width: 100%;
            height: 46px;
            border: 0;
            border-radius: 8px;
            background: #ff7019;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .rbt-h5-toast {
            position: absolute;
            top: 108px;
            left: 24px;
            right: 24px;
            padding: 12px 16px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 30;
        }
        .rbt-h5-toast.is-on { opacity: 1; }
        .rbt-h5-empty { padding: 48px 16px; color: #c0c4cc; font-size: 13px; text-align: center; }
        .rbt-bill__head {
            margin: -12px -12px 0;
            padding: 8px 16px 16px;
            background: #ff7019;
            color: #fff;
        }
        .rbt-bill__top { display: flex; justify-content: space-between; align-items: center; }
        .rbt-bill__code { font-size: 16px; font-weight: 600; }
        .rbt-bill__tag { padding: 2px 10px; border-radius: 12px; background: rgba(255,255,255,.2); font-size: 12px; }
        .rbt-bill__label { margin: 18px 0 0; text-align: center; font-size: 13px; opacity: .9; }
        .rbt-bill__amt { margin: 6px 0 14px; text-align: center; font-size: 32px; font-weight: 700; }
        .rbt-bill__stats { display: flex; gap: 8px; }
        .rbt-bill__stats div { flex: 1; min-width: 0; text-align: center; }
        .rbt-bill__stats span { display: block; font-size: 12px; opacity: .85; }
        .rbt-bill__stats b { display: block; margin-top: 4px; font-size: 13px; font-weight: 600; }
        .rbt-bill-tabs { display: flex; margin: 12px 0 0; border-bottom: 1px solid #eee; }
        .rbt-bill-tabs button {
            flex: 1;
            height: 40px;
            border: 0;
            border-bottom: 2px solid transparent;
            background: transparent;
            color: #666;
            font-size: 14px;
            cursor: pointer;
        }
        .rbt-bill-tabs button.is-on { color: #ff7019; border-bottom-color: #ff7019; font-weight: 600; }
        .rbt-bill__sheet { padding: 4px 0 12px; }
        .rbt-bill__sheet--blank {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            padding: 24px 28px;
        }
        .rbt-bill__empty { margin: 0; color: #c0c4cc; font-size: 13px; line-height: 1.6; text-align: center; }
        .rbt-share__head,
        .rbt-share__row {
            display: grid;
            grid-template-columns: minmax(0, 1.45fr) 84px 64px;
            align-items: center;
            gap: 8px;
        }
        .rbt-share__head { padding: 10px 0 4px; color: #999; font-size: 12px; }
        .rbt-share__head span:last-child,
        .rbt-share__row em { text-align: right; }
        .rbt-share__row > span { white-space: nowrap; }
        .rbt-share__row { padding: 12px 0; border-top: 1px solid #f0f0f0; }
        .rbt-share__row b { color: #222; font-size: 15px; font-weight: 700; }
        .rbt-share__row span { color: #222; font-size: 13px; font-weight: 600; }
        .rbt-share__row em { font-style: normal; color: #ff7019; font-size: 13px; font-weight: 600; }
        .rbt-share__row em.is-due { color: #52c41a; }
        .rbt-bill__line {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 11px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        .rbt-bill__line span { flex: none; color: #888; white-space: nowrap; }
        .rbt-bill__line b { flex: 1; min-width: 0; color: #222; font-weight: 600; text-align: right; overflow-wrap: break-word; }
        .rbt-fund { padding: 0 0 12px; }
        .rbt-fund__tabs { display: flex; margin: 0 0 12px; border-bottom: 1px solid #eee; }
        .rbt-fund__tabs button {
            flex: 1;
            height: 40px;
            border: 0;
            border-bottom: 2px solid transparent;
            background: transparent;
            color: #666;
            font-size: 14px;
            cursor: pointer;
        }
        .rbt-fund__tabs button.is-on { color: #ff7019; border-bottom-color: #ff7019; font-weight: 600; }
        .rbt-h5-scroll.is-collect .rbt-fund__tabs { margin: 0; padding: 0 12px; background: #f7f7f7; }
        .rbt-h5-scroll.is-collect .rbt-fund-card,
        .rbt-h5-scroll.is-collect .rbt-h5-empty { margin-left: 12px; margin-right: 12px; }
        .rbt-h5-scroll.is-collect .rbt-fund__summary + .rbt-fund-card,
        .rbt-h5-scroll.is-collect .rbt-fund__summary + .rbt-h5-empty { margin-top: 12px; }
        .rbt-fund__summary {
            position: sticky;
            top: 0;
            z-index: 4;
            margin: 0;
            padding: 10px 16px 12px;
            border: 0;
            border-radius: 0;
            background: #fff6f0;
            box-shadow: 0 1px 0 #ffd8c2;
        }
        .rbt-fund__summary-name { margin: 0 0 8px; color: #ff7019; font-size: 12px; font-weight: 600; line-height: 1.2; }
        .rbt-fund__summary-metrics { display: flex; gap: 8px; }
        .rbt-fund__summary-metrics div { flex: 1; min-width: 0; }
        .rbt-fund__summary span { display: block; color: #a35a32; font-size: 12px; }
        .rbt-fund__summary b { display: block; margin-top: 4px; color: #222; font-size: 15px; font-weight: 700; white-space: nowrap; }
        .rbt-fund__summary-metrics div:last-child b { color: #ff7019; }
        .rbt-fund-card {
            display: block;
            width: 100%;
            margin: 0 0 10px;
            padding: 14px 12px;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            background: #fff;
            text-align: left;
            cursor: pointer;
        }
        .rbt-fund-card__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .rbt-fund-card__top strong { color: #222; font-size: 16px; }
        .rbt-fund-card__tag { flex: none; padding: 0 8px; border-radius: 4px; background: #fff7e6; color: #d46b08; font-size: 12px; line-height: 22px; }
        .rbt-fund-card__tag.is-done { background: #f6ffed; color: #389e0d; }
        .rbt-fund-card__tag.is-off { background: #f5f5f5; color: #999; }
        .rbt-fund-card__store { margin: 6px 0 10px; color: #888; font-size: 12px; }
        .rbt-fund-card__metrics { display: flex; gap: 8px; }
        .rbt-fund-card__metrics div { flex: 1; min-width: 0; }
        .rbt-fund-card__metrics span { display: block; color: #888; font-size: 12px; }
        .rbt-fund-card__metrics b { display: block; margin-top: 4px; color: #222; font-size: 15px; }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="rbt-h5-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="rbt-h5-store-stage">
                <section class="rbt-h5-phone is-login" id="rbtH5Phone" aria-label="服务商端">
                    <div class="rbt-h5-toast" id="rbtH5Toast" role="status"></div>
                    <div class="rbt-h5-phone__head">
                        <button type="button" class="rbt-h5-head-back" id="rbtH5HeadBack" aria-label="返回">
                            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                        <h1>服务商端</h1>
                        <p id="rbtH5HeadText">密码登录</p>
                    </div>
                    <div class="rbt-h5-phone__body">
                        <form class="rbt-h5-login-form" id="rbtH5LoginForm">
                            <div class="rbt-h5-field">
                                <label for="rbtH5LoginPhone">手机号</label>
                                <input id="rbtH5LoginPhone" data-phone="login" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号" autocomplete="tel">
                            </div>
                            <div class="rbt-h5-field">
                                <label for="rbtH5LoginPassword">密码</label>
                                <input id="rbtH5LoginPassword" data-password="login" type="password" maxlength="32" placeholder="请输入密码" autocomplete="current-password">
                            </div>
                            <p class="rbt-h5-tip">演示密码 123456。点击下方手机号可填入。</p>
                            <button type="submit" class="rbt-h5-login">登录</button>
                            <section class="rbt-h5-accounts" id="rbtH5Accounts" aria-label="可登录账号"></section>
                        </form>
                        <div class="rbt-h5-app" id="rbtH5App">
                            <div class="rbt-h5-scroll" id="rbtH5Scroll"></div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="rbt-fresh.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/mdm-provider-archive-store.js?v=20261117-provider"></script>
    <script src="rbt-settle-ratio.js"></script>
    <script src="rbt-demand-data.js?v=20261123-provider-collect"></script>
    <script src="rbt-daily-fulfill.js?v=20261127-pos-pay"></script>
    <script src="../js/store-pay-password.js"></script>
    <script src="rbt-party-wallet.js?v=20261127-ledger2"></script>
    <script src="rbt-h5-provider-app.js?v=20261127-ledger"></script>
</body>
</html>
