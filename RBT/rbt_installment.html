<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰RBT - 产品配置</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../vendor/octopus-prototype-runtime/runtime.css">
    <link rel="stylesheet" href="../vendor/octopus-prototype-runtime/theme.css">
    <style>
        [v-cloak] { display: none; }
        .rbt-installment-schema-host { min-height: 480px; }
        .rbt-range, .rbt-fee { display: flex; align-items: center; gap: 8px; width: 100%; flex-wrap: wrap; }
        .rbt-range .el-input, .rbt-fee .el-input { width: 140px; flex: 0 0 140px; }
        .rbt-fee .el-select { width: 220px; flex: 0 0 220px; }
        .rbt-range__unit, .rbt-range__label { color: #606266; white-space: nowrap; }
        .rbt-period-rates { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .rbt-period-rate-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .rbt-period-rate-row .el-input { width: 120px; flex: 0 0 120px; }
        .rbt-period-rate-row__label { color: #606266; white-space: nowrap; min-width: 42px; }
        .rbt-period-rate-row__pair { display: flex; align-items: center; gap: 8px; }
        .rbt-period-rates__empty { color: #909399; font-size: 13px; line-height: 32px; }
        .rbt-store-log { width: 100%; border-collapse: collapse; font-size: 13px; }
        .rbt-store-log th,
        .rbt-store-log td {
            padding: 10px 12px;
            border-bottom: 1px solid #ebeef5;
            text-align: left;
            vertical-align: top;
            line-height: 1.5;
        }
        .rbt-store-log th { color: #909399; font-weight: 500; background: #fafafa; }
        .rbt-store-log__who { width: 120px; white-space: nowrap; }
        .rbt-store-log__time { width: 180px; white-space: nowrap; color: #606266; }
        .rbt-store-log__empty { text-align: center; color: #909399; padding: 28px 12px; }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="rbt-sidebar.js"></script>

    <div id="header-container"></div>

    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button type="button" class="active">产品配置</button></div>
            <hr class="content-divider">

            <div id="rbtInstallmentApp" class="rbt-installment-schema-host" v-cloak>
                <vab-schema-table
                    ref="table"
                    :columns="columns"
                    :request="requestRows"
                    row-key="code"
                    search-label-width="112px"
                    action-column-width="160"
                    :default-page-size="20"
                    :auto-format-time="false">
                    <template v-slot:[slots.code]="{row}">
                        <doc-no-link :value="row.code" @open="openDetail(row)"></doc-no-link>
                    </template>
                    <template #toolbar-left="{elSize}">
                        <el-button type="primary" :size="elSize" @click="openAdd">新增产品</el-button>
                    </template>
                    <template v-slot:[slots.status]="{row,elSize}">
                        <el-tag :size="elSize" effect="light" :type="row.enabled === false ? 'danger' : 'success'">{{ row.enabled === false ? '禁用' : '启用' }}</el-tag>
                    </template>
                    <template #actions="{row,elSize}">
                        <el-button :size="elSize" text type="primary" @click="openEdit(row)">编辑</el-button>
                        <el-button :size="elSize" text type="primary" @click="toggleEnabled(row)">{{ row.enabled === false ? '启用' : '禁用' }}</el-button>
                    </template>
                </vab-schema-table>
                <vab-schema-form-dialog
                    ref="addDialog"
                    :title="dialogTitle"
                    dialog-width="720px"
                    label-width="120px"
                    :default-col-span="24"
                    :fields="addFields"
                    row-key-field="code"
                    :before-submit="beforeSubmit"
                    :add-api="addInstallment"
                    :edit-api="updateInstallment"
                    add-success-message="产品已新增"
                    edit-success-message="产品已更新"
                    @saved="refreshTable">
                    <template #form-ratepair="{form}">
                        <div class="rbt-period-rate-row">
                            <div class="rbt-period-rate-row__pair">
                                <span class="rbt-range__label">门店结算系数</span>
                                <el-input :model-value="form.storeRate" placeholder="请输入" @input="onDecimal(form, 'storeRate', $event)"></el-input>
                            </div>
                            <div class="rbt-period-rate-row__pair">
                                <span class="rbt-range__label">贸易商结算系数</span>
                                <el-input :model-value="form.traderRate" placeholder="请输入" @input="onDecimal(form, 'traderRate', $event)"></el-input>
                            </div>
                        </div>
                    </template>
                    <template #form-amountpair="{form}">
                        <div class="rbt-range">
                            <el-input :model-value="form.amountMin" placeholder="请输入" @input="onDecimal(form, 'amountMin', $event)"></el-input>
                            <span class="rbt-range__unit">元</span>
                            <span class="rbt-range__unit">–</span>
                            <el-input :model-value="form.amountMax" placeholder="请输入" @input="onDecimal(form, 'amountMax', $event)"></el-input>
                            <span class="rbt-range__unit">元</span>
                        </div>
                    </template>
                </vab-schema-form-dialog>
            </div>
        </main>
    </div>

    <script src="rbt-fresh.js"></script>
    <script src="../js/common.js"></script>
    <script src="../vendor/octopus-prototype-runtime/runtime.js"></script>
    <script src="rbt-installment-detail.js"></script>
    <script src="rbt-installment.js"></script>
</body>
</html>
