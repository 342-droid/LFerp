<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰RBT - 贸易商管理</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../vendor/octopus-prototype-runtime/runtime.css">
    <link rel="stylesheet" href="../vendor/octopus-prototype-runtime/theme.css">
    <style>
        [v-cloak] { display: none; }
        .rbt-trader-panel { display: none; }
        .rbt-trader-panel.is-active { display: block; }
        .rbt-trader-schema-host { min-height: 480px; }
        .rbt-trader-money {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        .rbt-trader-money .el-input { flex: 1; min-width: 0; }
        .rbt-trader-money__unit {
            flex: none;
            color: #606266;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="rbt-sidebar.js"></script>

    <div id="header-container"></div>

    <div class="container">
        <main class="main-content">
            <div class="content-tabs" id="rbtTraderTabs">
                <button type="button" class="active" data-trader-tab="pending">待入驻贸易商</button>
                <button type="button" data-trader-tab="settled">已入驻贸易商</button>
            </div>
            <hr class="content-divider">

            <div class="rbt-trader-panel is-active" data-trader-panel="pending">
                <div id="rbtTraderPendingApp" class="rbt-trader-schema-host" v-cloak>
                    <vab-schema-table
                        ref="table"
                        :columns="columns"
                        :request="requestRows"
                        row-key="code"
                        row-selection
                        search-label-width="112px"
                        :action-column-width="0"
                        :default-page-size="20"
                        :auto-format-time="false">
                        <template #toolbar-left="{elSize}">
                            <el-button type="primary" :size="elSize" @click="audit()">审核</el-button>
                            <el-button :size="elSize" @click="reject()">驳回</el-button>
                        </template>
                        <template v-slot:[slots.subject]="{row}">
                            <doc-no-link :value="row.subjectName" @open="openDetail(row)"></doc-no-link>
                        </template>
                        <template v-slot:[slots.status]="{row,elSize}">
                            <el-tag :size="elSize" effect="light" :type="statusTagType(row.status)">{{ row.status }}</el-tag>
                        </template>
                    </vab-schema-table>
                    <vab-schema-form-dialog
                        ref="auditDialog"
                        title="审核贸易商"
                        dialog-width="480px"
                        label-width="120px"
                        :default-col-span="24"
                        :fields="auditFields"
                        :before-submit="beforeSubmitAudit"
                        :add-api="submitAudit"
                        add-success-message="审核通过，已进入已入驻贸易商"
                        @saved="onAuditSaved">
                        <template #form-orderquota="{form}">
                            <div class="rbt-trader-money">
                                <el-input
                                    :model-value="form.orderquota"
                                    placeholder="请输入接单总额度"
                                    clearable
                                    @input="onQuotaInput(form, $event)">
                                </el-input>
                                <span class="rbt-trader-money__unit">元</span>
                            </div>
                        </template>
                    </vab-schema-form-dialog>
                </div>
            </div>

            <div class="rbt-trader-panel" data-trader-panel="settled">
                <div id="rbtTraderSettledApp" class="rbt-trader-schema-host" v-cloak>
                    <vab-schema-table
                        ref="table"
                        :columns="columns"
                        :request="requestRows"
                        row-key="code"
                        search-label-width="112px"
                        :action-column-width="0"
                        :default-page-size="20"
                        :auto-format-time="false">
                        <template v-slot:[slots.subject]="{row}">
                            <doc-no-link :value="row.subjectName" @open="openDetail(row)"></doc-no-link>
                        </template>
                        <template v-slot:[slots.status]="{row,elSize}">
                            <el-tag :size="elSize" effect="light" :type="statusTagType(row.status)">{{ row.status }}</el-tag>
                        </template>
                    </vab-schema-table>
                </div>
            </div>
        </main>
    </div>

    <script src="rbt-fresh.js"></script>
    <script src="../js/common.js"></script>
    <script src="rbt-trader-data.js"></script>
    <script src="rbt-trader-detail.js"></script>
    <script src="../vendor/octopus-prototype-runtime/runtime.js"></script>
    <script src="rbt-trader-list.js"></script>
    <script>
    (function () {
        var tabs = document.getElementById('rbtTraderTabs');
        if (!tabs) return;
        tabs.addEventListener('click', function (event) {
            var button = event.target.closest('button[data-trader-tab]');
            if (!button) return;
            var key = button.getAttribute('data-trader-tab');
            tabs.querySelectorAll('button[data-trader-tab]').forEach(function (node) {
                node.classList.toggle('active', node === button);
            });
            document.querySelectorAll('[data-trader-panel]').forEach(function (panel) {
                panel.classList.toggle('is-active', panel.getAttribute('data-trader-panel') === key);
            });
            window.dispatchEvent(new CustomEvent('rbt-trader:changed'));
        });
    })();
    </script>
</body>
</html>
