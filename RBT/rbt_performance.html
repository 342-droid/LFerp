<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰RBT - 付款</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/lf-contract.css?v=20261120-rbt-read">
    <link rel="stylesheet" href="../vendor/octopus-prototype-runtime/runtime.css">
    <link rel="stylesheet" href="../vendor/octopus-prototype-runtime/theme.css">
    <style>
        [v-cloak] { display: none; }
        .rbt-perf-host { min-height: 480px; }
        .rbt-perf-tip { margin: 0 0 12px; }
        .rbt-demand-table-wrap { width: 100%; overflow-x: auto; }
        .rbt-demand-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .rbt-demand-table th,
        .rbt-demand-table td { border: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; white-space: nowrap; }
        .rbt-demand-table th { background: #f7f8fa; font-weight: 600; color: #303133; }
        .rbt-demand-table td.is-money,
        .rbt-demand-table th.is-money { text-align: right; }
        .rbt-demand-table td.is-empty { text-align: center; color: #909399; }
        .rbt-daily-note { margin: 0 0 10px; color: #606266; font-size: 13px; line-height: 1.7; }
        .rbt-daily-note__more { margin-left: 8px; color: #155bd4; text-decoration: none; }
        .rbt-risk-tag { display: inline-block; padding: 0 8px; border-radius: 4px; line-height: 22px; font-size: 12px; }
        .rbt-risk-tag.is-正常 { color: #389e0d; background: #f6ffed; }
        .rbt-risk-tag.is-关注 { color: #d48806; background: #fffbe6; }
        .rbt-risk-tag.is-预警 { color: #d46b08; background: #fff7e6; }
        .rbt-risk-tag.is-异常 { color: #cf1322; background: #fff1f0; }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="rbt-sidebar.js"></script>

    <div id="header-container"></div>

    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button type="button" class="active">付款</button></div>
            <hr class="content-divider">

            <div id="rbtPerfApp" class="rbt-perf-host" v-cloak>
                <div class="mdm-biz-tip rbt-perf-tip" role="note">
                    只列出贸易商付款完成、处于<strong>付款中</strong>或<strong>已完成</strong>的需求。点需求单号打开付款详情，每日付款在基础信息右侧。应付款按所得佣金乘该渠道结算比例。当日实际付款再按应收占比拆成<strong>贸易商、冷丰、服务商</strong>收款。后台仍按渠道、按冷丰和服务商分开。<strong>日均付款额</strong> = 实际付款合计 ÷ 营业日天数，和当前生效基准比，不是百分比进度。<strong>剩余付款额</strong> = 总金额 − 已付款金额。剩余付款额为 0 时，付款阶段为<strong>已完成</strong>。
                </div>
                <vab-schema-table
                    ref="table"
                    :columns="columns"
                    :request="requestRows"
                    row-key="code"
                    search-label-width="128px"
                    action-column-width="88"
                    :default-page-size="20"
                    :auto-format-time="false">
                    <template v-slot:[slots.code]="{row}">
                        <doc-no-link :value="row.code" @open="openDetail(row)"></doc-no-link>
                    </template>
                    <template v-slot:[slots.status]="{row,elSize}">
                        <el-tag :size="elSize" effect="light" :type="statusType(row.fulfillPhase)">{{ row.fulfillPhase }}</el-tag>
                    </template>
                    <template v-slot:[slots.riskgrade]="{row}">
                        <span :class="'rbt-risk-tag is-' + row.riskGrade">{{ row.riskGrade }}</span>
                        <span v-if="row.riskMark"> {{ row.riskMark }}</span>
                    </template>
                    <template #actions="{row,elSize}">
                        <el-button :size="elSize" text type="primary" @click="openDetail(row)">查看</el-button>
                    </template>
                </vab-schema-table>
            </div>
        </main>
    </div>

    <script src="rbt-fresh.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/contract-bodies.js?v=20261120-rbt-read"></script>
    <script src="../js/basic-settings-contract.js?v=20261120-rbt-read"></script>
    <script src="../vendor/octopus-prototype-runtime/runtime.js"></script>
    <script src="rbt-store-data.js"></script>
    <script src="rbt-settle-ratio.js"></script>
    <script src="rbt-demand-data.js"></script>
    <script src="rbt-demand-detail.js"></script>
    <script src="rbt-daily-fulfill.js"></script>
    <script src="rbt-risk.js"></script>
    <script src="rbt-performance.js"></script>
</body>
</html>
