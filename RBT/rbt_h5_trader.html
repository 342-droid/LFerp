<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰RBT-移动端 - 贸易商端</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        .rbt-h5-store-stage {
            min-height: calc(100vh - 88px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px 0 28px;
            background: #f5f5f5;
        }
        .rbt-h5-phone {
            width: 393px;
            height: 851px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .rbt-h5-phone__head {
            padding: 32px 24px 16px;
            background: #ff7019;
            color: #fff;
        }
        .rbt-h5-phone__head h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 600;
        }
        .rbt-h5-phone__head p {
            margin: 8px 0 0;
            font-size: 14px;
            opacity: 0.92;
        }
        .rbt-h5-phone__body {
            flex: 1;
            min-height: 0;
            padding: 20px 24px 24px;
            display: flex;
            flex-direction: column;
        }
        .rbt-h5-phone.is-app .rbt-h5-phone__head {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 28px 16px 14px;
        }
        .rbt-h5-phone.is-app .rbt-h5-phone__head h1 {
            flex: 1;
            min-width: 0;
            margin: 0;
            font-size: 20px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rbt-h5-phone.is-app .rbt-h5-phone__head p { display: none; }
        .rbt-h5-head-back {
            flex: none;
            width: 28px;
            height: 28px;
            margin-left: -4px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .rbt-h5-phone.is-app .rbt-h5-head-back.is-on { display: flex; }
        .rbt-h5-phone.is-app .rbt-h5-phone__body { padding: 0; }
        .rbt-h5-login-form {
            display: none;
            flex: 1;
            min-height: 0;
            overflow: auto;
        }
        .rbt-h5-app {
            display: none;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            background: #f7f7f7;
        }
        .rbt-h5-phone.is-login .rbt-h5-login-form { display: block; }
        .rbt-h5-phone.is-app .rbt-h5-app { display: flex; }
        .rbt-h5-scroll { flex: 1; min-height: 0; overflow: auto; padding: 12px 12px 16px; }
        .rbt-h5-scroll.is-collect { padding: 0 0 16px; }
        .rbt-h5-phone.is-home .rbt-h5-phone__head { display: none; }
        .rbt-h5-phone.is-hall .rbt-h5-phone__head,
        .rbt-h5-phone.is-sign .rbt-h5-phone__head {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 44px 12px;
            background: #fff;
            color: #222;
            border-bottom: 1px solid #f0f0f0;
        }
        .rbt-h5-phone.is-hall .rbt-h5-phone__head h1,
        .rbt-h5-phone.is-sign .rbt-h5-phone__head h1 {
            margin: 0;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
        }
        .rbt-h5-phone.is-hall .rbt-h5-phone__head p,
        .rbt-h5-phone.is-sign .rbt-h5-phone__head p { display: none; }
        .rbt-h5-phone.is-hall .rbt-h5-head-back,
        .rbt-h5-phone.is-sign .rbt-h5-head-back {
            display: flex;
            position: absolute;
            left: 8px;
            margin-left: 0;
            color: #222;
        }
        .rbt-h5-scroll.is-home {
            padding: 0 0 20px;
            background: linear-gradient(180deg, #fff6ee 0%, #f4f6fb 240px, #f4f6fb 100%);
        }
        .rbt-h5-home__bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 22px 16px 8px;
        }
        .rbt-h5-home__avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #ff7019;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
        }
        .rbt-h5-home__name {
            flex: 1;
            min-width: 0;
            color: #222;
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rbt-h5-home__tools {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #8a8f99;
            flex: none;
        }
        .rbt-h5-home__card {
            margin: 16px 12px 0;
            padding: 16px 8px 18px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(31, 35, 41, 0.04);
        }
        .rbt-h5-home__card h2 {
            margin: 0 8px 16px;
            color: #222;
            font-size: 16px;
            font-weight: 700;
        }
        .rbt-h5-home__grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            row-gap: 18px;
        }
        .rbt-h5-tool {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #333;
            font-size: 12px;
            line-height: 1.2;
        }
        button.rbt-h5-tool {
            border: 0;
            background: transparent;
            padding: 0;
            cursor: pointer;
            font: inherit;
        }
        .rbt-h5-tool__icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .rbt-h5-empty { padding: 48px 12px; text-align: center; color: #999; font-size: 14px; }
        .rbt-h5-card {
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid #eee;
        }
        .rbt-h5-card h2 { margin: 0; font-size: 16px; color: #222; }
        .rbt-h5-card p { margin: 6px 0 0; color: #666; font-size: 13px; line-height: 1.6; }
        .rbt-h5-card__top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
        .rbt-h5-status { flex: none; font-size: 12px; color: #ff7019; }
        .rbt-h5-status.is-done { color: #52c41a; }
        .rbt-h5-status.is-off { color: #999; }
        .rbt-h5-withdraw {
            display: block;
            width: 100%;
            margin-top: 8px;
            height: 36px;
            border: 1px solid #ff7019;
            border-radius: 8px;
            background: #fff;
            color: #ff7019;
            font-size: 14px;
            cursor: pointer;
        }
        .rbt-h5-pay-mask {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.45);
        }
        .rbt-h5-pay-dialog {
            width: 100%;
            padding: 20px 16px 16px;
            border-radius: 12px;
            background: #fff;
        }
        .rbt-h5-pay-dialog p {
            margin: 0;
            color: #222;
            font-size: 15px;
            line-height: 1.6;
            text-align: center;
        }
        .rbt-h5-pay-dialog__actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .rbt-h5-pay-dialog__actions button {
            flex: 1;
            height: 36px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .rbt-h5-pay-dialog__actions [data-pay-cancel] {
            border: 1px solid #ddd;
            background: #fff;
            color: #666;
        }
        .rbt-h5-pay-dialog__actions [data-pay-ok] {
            border: 0;
            background: #ff7019;
            color: #fff;
        }
        .rbt-accept-dialog {
            width: 100%;
            padding: 22px 18px 18px;
            border-radius: 16px;
            background: #fff;
        }
        .rbt-accept-dialog h2 {
            margin: 0;
            color: #222;
            font-size: 17px;
            font-weight: 700;
            text-align: center;
        }
        .rbt-accept-dialog p {
            margin: 14px 0 0;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
        }
        .rbt-accept-dialog__actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .rbt-accept-dialog__actions button {
            flex: 1;
            height: 40px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
        .rbt-accept-dialog__actions .is-later {
            border: 1px solid #e5e5e5;
            background: #fff;
            color: #333;
        }
        .rbt-accept-dialog__actions .is-go {
            border: 0;
            background: #ff7019;
            color: #fff;
        }
        .rbt-withdraw-reasons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
        .rbt-withdraw-reasons button {
            max-width: 100%;
            padding: 4px 10px;
            border: 1px solid #ffd3b8;
            border-radius: 14px;
            background: #fff7f2;
            color: #ff7019;
            font-size: 13px;
            line-height: 20px;
            cursor: pointer;
        }
        .rbt-withdraw-reasons button.is-on { border-color: #ff7019; background: #ff7019; color: #fff; }
        .rbt-withdraw-dialog textarea {
            display: block;
            width: 100%;
            box-sizing: border-box;
            min-height: 72px;
            margin-top: 12px;
            padding: 8px 10px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            color: #222;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
        }
        .rbt-h5-accept,
        .rbt-sign-submit {
            display: block;
            width: 100%;
            margin-top: 12px;
            height: 44px;
            border: 0;
            border-radius: 22px;
            background: #ff7019;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        .rbt-sign-banner {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #fff4ec;
            color: #ff7019;
            font-size: 13px;
            line-height: 1.4;
        }
        .rbt-sign-banner svg { flex: none; }
        .rbt-sign-card {
            margin-bottom: 12px;
            padding: 14px;
            border-radius: 12px;
            background: #fff;
        }
        .rbt-sign-card h2 { margin: 0; font-size: 16px; color: #222; font-weight: 700; }
        .rbt-sign-card h2 span { margin-left: 6px; color: #999; font-size: 13px; font-weight: 400; }
        .rbt-sign-card p { margin: 6px 0 0; color: #666; font-size: 13px; line-height: 1.6; }
        .rbt-sign-brief__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .rbt-sign-brief__toggle {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #999;
            font-size: 13px;
            cursor: pointer;
        }
        .rbt-sign-brief__sub { margin: 6px 0 0; color: #999; font-size: 12px; }
        .rbt-sign-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 16px;
            margin-top: 14px;
        }
        .rbt-sign-grid span,
        .rbt-sign-block span { display: block; color: #999; font-size: 12px; }
        .rbt-sign-grid b { display: block; margin-top: 4px; color: #222; font-size: 15px; font-weight: 600; }
        .rbt-sign-grid b.is-amt { color: #ff7019; font-size: 18px; }
        .rbt-sign-block { margin-top: 14px; }
        .rbt-sign-block p { margin: 4px 0 0; color: #222; font-size: 14px; }
        .rbt-sign-party {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f2f2f2;
        }
        .rbt-sign-party b { display: block; color: #999; font-size: 12px; font-weight: 400; }
        .rbt-sign-party span { display: block; margin-top: 4px; color: #222; font-size: 15px; font-weight: 600; }
        .rbt-sign-party__state { flex: none; text-align: right; }
        .rbt-sign-party__state em { display: block; font-style: normal; color: #ff7019; font-size: 13px; }
        .rbt-sign-party__state i { display: block; margin-top: 4px; font-style: normal; font-size: 12px; }
        .rbt-sign-party__state.is-done em,
        .rbt-sign-party__state.is-done i { color: #52c41a; }
        .rbt-sign-tip { margin: 4px 0 0; color: #888; font-size: 13px; line-height: 1.6; }
        .rbt-sign-empty { padding: 24px 12px; text-align: center; color: #999; font-size: 14px; }
        .rbt-h5-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .rbt-h5-hall-tabs {
            display: flex;
            margin: -12px -12px 12px;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
        }
        .rbt-h5-hall-tabs button {
            flex: 1;
            height: 44px;
            border: 0;
            background: transparent;
            color: #666;
            font-size: 15px;
            cursor: pointer;
        }
        .rbt-h5-hall-tabs button.is-on {
            color: #ff7019;
            font-weight: 600;
            box-shadow: inset 0 -2px 0 #ff7019;
        }
        .rbt-hall-card {
            margin-bottom: 12px;
            padding: 14px 14px 12px;
            border-radius: 12px;
            background: #fff;
        }
        .rbt-hall-card__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        .rbt-hall-card__name { margin: 0; color: #222; font-size: 16px; font-weight: 700; line-height: 1.3; }
        .rbt-hall-card__status {
            flex: none;
            padding: 2px 8px;
            border-radius: 4px;
            background: #fff1e8;
            color: #ff7019;
            font-size: 12px;
            line-height: 18px;
        }
        .rbt-hall-card__status.is-off { background: #f2f3f5; color: #999; }
        .rbt-hall-card__status.is-done { background: #f6ffed; color: #52c41a; }
        .rbt-hall-card__meta { margin: 4px 0 0; color: #999; font-size: 12px; line-height: 1.4; }
        .rbt-hall-card__total {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-top: 12px;
        }
        .rbt-hall-card__total span { color: #666; font-size: 13px; }
        .rbt-hall-card__total b { color: #ff7019; font-size: 22px; font-weight: 700; letter-spacing: 0.2px; }
        .rbt-hall-card__grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 16px;
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            background: #f7f8fa;
        }
        .rbt-hall-card__cell span { display: block; color: #999; font-size: 12px; }
        .rbt-hall-card__cell b { display: block; margin-top: 4px; color: #222; font-size: 15px; font-weight: 600; }
        .rbt-hall-card__block { margin-top: 12px; }
        .rbt-hall-card__block span { display: block; color: #999; font-size: 12px; }
        .rbt-hall-card__block p { margin: 4px 0 0; color: #333; font-size: 13px; line-height: 1.5; }
        .rbt-hall-card__foot {
            display: flex;
            align-items: stretch;
            gap: 10px;
            margin-top: 14px;
        }
        .rbt-hall-card__btn {
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            flex: 1;
            min-width: 0;
            height: 40px;
            padding: 0 12px;
            border: 0;
            border-radius: 20px;
            background: #ff7019;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .rbt-hall-card__btn.is-ghost {
            border: 1px solid #ffd0b5;
            background: #fff;
            color: #ff7019;
        }
        .rbt-hall-card[data-demand] { cursor: pointer; }
        .rbt-hall-sheet {
            margin-bottom: 12px;
            padding: 14px;
            border-radius: 12px;
            background: #fff;
        }
        .rbt-hall-sheet h3 { margin: 0 0 10px; color: #222; font-size: 15px; font-weight: 700; }
        .rbt-hall-sheet__empty,
        .rbt-hall-sheet__text { margin: 0; color: #333; font-size: 13px; line-height: 1.5; }
        .rbt-hall-sku {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-top: 1px solid #f2f3f5;
        }
        .rbt-hall-sku:first-of-type { border-top: 0; padding-top: 0; }
        .rbt-hall-sku__main { min-width: 0; }
        .rbt-hall-sku__main strong { display: block; color: #222; font-size: 14px; font-weight: 600; line-height: 1.4; }
        .rbt-hall-sku__main p { margin: 4px 0 0; color: #999; font-size: 12px; line-height: 1.4; }
        .rbt-hall-sku__side { flex: none; text-align: right; }
        .rbt-hall-sku__side b { display: block; color: #222; font-size: 14px; font-weight: 600; }
        .rbt-hall-sku__side span { display: block; margin-top: 4px; color: #999; font-size: 12px; }
        .rbt-h5-back {
            border: 0;
            background: transparent;
            color: #ff7019;
            font-size: 14px;
            cursor: pointer;
            padding: 0;
        }
        .rbt-h5-primary {
            height: 40px;
            padding: 0 14px;
            border: 0;
            border-radius: 8px;
            background: #ff7019;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .rbt-h5-publish { width: 100%; height: 44px; }
        .rbt-h5-login-tabs {
            display: flex;
            margin-bottom: 16px;
            border: 1px solid #ffe0cc;
            border-radius: 8px;
            overflow: hidden;
            background: #fff7f2;
        }
        .rbt-h5-login-tabs button {
            flex: 1;
            height: 40px;
            border: 0;
            background: transparent;
            color: #888;
            font-size: 14px;
            cursor: pointer;
        }
        .rbt-h5-login-tabs button.is-on {
            background: #ff7019;
            color: #fff;
            font-weight: 600;
        }
        .rbt-h5-phone.is-pwd [data-mode-field="code"],
        .rbt-h5-phone.is-pwd [data-mode-tip="code"] { display: none; }
        .rbt-h5-phone:not(.is-pwd) [data-mode-field="password"],
        .rbt-h5-phone:not(.is-pwd) [data-mode-tip="password"] { display: none; }
        .rbt-h5-action {
            width: 100%;
            margin-top: 12px;
            height: 44px;
            border: 1px solid #ff7019;
            border-radius: 8px;
            background: #fff;
            color: #ff7019;
            font-size: 15px;
            cursor: pointer;
        }
        .rbt-h5-accounts { margin-top: 16px; }
        .rbt-h5-accounts h2 {
            margin: 0 0 8px;
            color: #333;
            font-size: 14px;
        }
        .rbt-h5-account {
            margin-bottom: 6px;
            padding: 6px 10px;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            background: #fafafa;
        }
        .rbt-h5-account strong {
            display: block;
            color: #222;
            font-size: 13px;
        }
        .rbt-h5-account button {
            display: block;
            width: 100%;
            margin-top: 2px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #555;
            font-size: 13px;
            line-height: 1.5;
            text-align: left;
            cursor: pointer;
        }
        .rbt-h5-account button b {
            color: #ff7019;
            font-weight: 600;
        }
        .rbt-h5-field { margin-bottom: 12px; }

            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        .rbt-h5-field input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: #fff;
            color: #222;
        }
        .rbt-h5-field input:focus {
            outline: none;
            border-color: #ff7019;
        }
        .rbt-h5-code { display: flex; gap: 8px; }
        .rbt-h5-code input { flex: 1; }
        .rbt-h5-sms {
            flex: 0 0 112px;
            height: 44px;
            border: 1px solid #ff7019;
            border-radius: 8px;
            background: #fff;
            color: #ff7019;
            font-size: 14px;
            cursor: pointer;
        }
        .rbt-h5-sms:disabled {
            border-color: #ddd;
            color: #999;
            cursor: not-allowed;
        }
        .rbt-h5-tip {
            margin: 0 0 12px;
            color: #888;
            font-size: 12px;
            line-height: 1.6;
        }
        .rbt-h5-login {
            width: 100%;
            height: 46px;
            border: 0;
            border-radius: 8px;
            background: #ff7019;

                            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                        <h1>贸易商端</h1>
                        <p id="rbtH5HeadText">验证码登录</p>
                    </div>
                    <div class="rbt-h5-phone__body">
                        <form class="rbt-h5-login-form" id="rbtH5LoginForm">
                            <div class="rbt-h5-login-tabs" role="tablist">
                                <button type="button" data-login-mode="code" class="is-on">验证码登录</button>
                                <button type="button" data-login-mode="password">密码登录</button>
                            </div>
                            <div class="rbt-h5-field">
                                <label for="rbtH5LoginPhone">手机号</label>
                                <input id="rbtH5LoginPhone" data-phone="login" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号" autocomplete="tel">
                            </div>
                            <div class="rbt-h5-field" data-mode-field="code">
                                <label for="rbtH5LoginCode">验证码</label>
                                <div class="rbt-h5-code">
                                    <input id="rbtH5LoginCode" data-code="login" type="text" inputmode="numeric" maxlength="6" placeholder="请输入验证码" autocomplete="one-time-code">
                                    <button type="button" class="rbt-h5-sms" data-sms="login">获取验证码</button>
                                </div>
                            </div>
                            <div class="rbt-h5-field" data-mode-field="password">
                                <label for="rbtH5LoginPassword">密码</label>
                                <input id="rbtH5LoginPassword" data-password="login" type="password" maxlength="32" placeholder="请输入密码" autocomplete="current-password">
                            </div>
                            <p class="rbt-h5-tip" data-mode-tip="code">演示验证码 123456。点击下方手机号可填入。</p>
                            <p class="rbt-h5-tip" data-mode-tip="password">演示密码 123456。点击下方手机号可填入。</p>
                            <button type="submit" class="rbt-h5-login">登录</button>
                            <section class="rbt-h5-accounts" id="rbtH5Accounts" aria-label="可登录账号"></section>
                        </form>
                        <div class="rbt-h5-app" id="rbtH5App">
                            <div class="rbt-h5-scroll" id="rbtH5Scroll"></div>
                            <div class="rbt-contract" id="rbtH5Contract" hidden></div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
