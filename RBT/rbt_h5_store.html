<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰RBT-移动端 - 门店端</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        .rbt-h5-store-stage {
            min-height: calc(100vh - 88px);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 16px 0 28px;
            background: #f5f5f5;
        }
        .rbt-h5-switch {
            margin: 0 0 12px;
            height: 32px;
            padding: 0 14px;
            border: 1px solid #ff7019;
            border-radius: 16px;
            background: #fff;
            color: #ff7019;
            font-size: 13px;
            cursor: pointer;
        }
        .rbt-h5-phone {
            width: 393px;
            height: 851px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .rbt-h5-phone__head {
            padding: 32px 24px 16px;
            background: #ff7019;
            color: #fff;
        }
        .rbt-h5-phone__head h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 600;
        }
        .rbt-h5-phone__head p {
            margin: 8px 0 0;
            font-size: 14px;
            opacity: 0.92;
        }
        .rbt-h5-phone__body {
            flex: 1;
            min-height: 0;
            padding: 28px 24px 24px;
            display: flex;
            flex-direction: column;
        }
        .rbt-h5-phone.is-app .rbt-h5-phone__head { padding: 28px 16px 14px; }
        .rbt-h5-phone.is-app .rbt-h5-phone__head h1 { font-size: 20px; }
        .rbt-h5-phone.is-app .rbt-h5-phone__body { padding: 0; }
        .rbt-h5-field {
            margin-bottom: 12px;
        }
        .rbt-h5-field label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        .rbt-h5-field input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .rbt-h5-field input:focus {
            outline: none;
            border-color: #ff7019;
        }
        .rbt-h5-tip {
            margin: 0 0 12px;
            color: #888;
            font-size: 12px;
            line-height: 1.6;
        }
        .rbt-h5-action {
            width: 100%;
            margin-top: 12px;
            height: 44px;
            border: 1px solid #ff7019;
            border-radius: 8px;
            background: #fff;
            color: #ff7019;
            font-size: 15px;
            cursor: pointer;
        }
        .rbt-h5-app { display: none; flex: 1; min-height: 0; flex-direction: column; background: #f7f7f7; }
        .rbt-h5-phone.is-app .rbt-h5-app { display: flex; }
        .rbt-h5-phone.is-app .rbt-h5-pick { display: none; }
        .rbt-h5-scroll { flex: 1; min-height: 0; overflow: auto; padding: 12px 12px 16px; }
        .rbt-h5-phone.is-home .rbt-h5-phone__head { display: none; }
        .rbt-h5-scroll.is-home {
            padding: 0 0 20px;
            background: linear-gradient(180deg, #fff6ee 0%, #f4f6fb 240px, #f4f6fb 100%);
        }
        .rbt-h5-home__bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 22px 16px 6px;
        }
        .rbt-h5-home__avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #ff7019;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
        }
        .rbt-h5-home__name {
            flex: 1;
            min-width: 0;
            color: #222;
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rbt-h5-home__tools {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #8a8f99;
            flex: none;
        }
        .rbt-h5-home__quick {
            display: flex;
            justify-content: space-evenly;
            padding: 18px 28px 16px;
        }
        .rbt-h5-home__quick-item,
        .rbt-h5-tool {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #333;
            font-size: 12px;
            line-height: 1.2;
        }
        .rbt-h5-home__quick-item { color: #4a4a4a; font-size: 13px; gap: 8px; }
        .rbt-h5-home__quick-icon {
            width: 28px;
            height: 28px;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .rbt-h5-home__card {
            margin: 0 12px;
            padding: 16px 8px 18px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(31, 35, 41, 0.04);
        }
        .rbt-h5-home__card h2 {
            margin: 0 8px 16px;
            color: #222;
            font-size: 16px;
            font-weight: 700;
        }
        .rbt-h5-home__grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            row-gap: 18px;
        }
        button.rbt-h5-tool {
            border: 0;
            background: transparent;
            padding: 0;
            cursor: pointer;
            font: inherit;
        }
        .rbt-h5-tool__icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .rbt-h5-create {
            flex: none;
            padding: 12px 16px;
            background: #fff;
            border-top: 1px solid #eee;
        }
        .rbt-h5-create[hidden] { display: none; }
        .rbt-h5-create .rbt-h5-primary {
            display: block;
            width: 100%;
            height: 44px;
            margin: 0 auto;
            text-align: center;
        }
        .rbt-h5-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .rbt-h5-back, .rbt-h5-text-btn {
            border: 0;
            background: transparent;
            color: #ff7019;
            font-size: 14px;
            cursor: pointer;
            padding: 0;
        }
        .rbt-h5-primary {
            height: 40px;
            padding: 0 14px;
            border: 0;
            border-radius: 8px;
            background: #ff7019;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .rbt-h5-card {
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid #eee;
        }
        button.rbt-h5-card { width: 100%; font: inherit; text-align: left; cursor: pointer; }
        .rbt-h5-card.is-on { border-color: #ff7019; background: #fff7f2; }
        .rbt-h5-card h2 { margin: 0; font-size: 16px; color: #222; }
        .rbt-h5-card p { margin: 6px 0 0; color: #666; font-size: 13px; line-height: 1.6; }
        .rbt-h5-card__top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
        .rbt-h5-status { flex: none; font-size: 12px; color: #ff7019; }
        .rbt-h5-status.is-done { color: #52c41a; }
        .rbt-h5-status.is-off { color: #999; }
        .rbt-h5-cancel {
            margin-top: 8px;
            height: 32px;
            padding: 0 12px;
            border: 1px solid #ff7019;
            border-radius: 6px;
            background: #fff;
            color: #ff7019;
            font-size: 13px;
            cursor: pointer;
        }
        .rbt-h5-sign,
        .rbt-sign-submit {
            display: block;
            width: 100%;
            margin-top: 10px;
            height: 36px;
            border: 0;
            border-radius: 8px;
            background: #ff7019;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .rbt-sign-card {
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid #eee;
        }
        .rbt-sign-card h2 { margin: 0 0 8px; font-size: 16px; color: #222; }
        .rbt-sign-card p { margin: 6px 0 0; color: #666; font-size: 13px; line-height: 1.6; }
        .rbt-sign-party {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 0;
            border-top: 1px solid #f2f2f2;
            font-size: 13px;
        }
        .rbt-sign-party b { display: block; color: #222; font-size: 13px; }
        .rbt-sign-party span { color: #666; }
        .rbt-sign-party em { flex: none; font-style: normal; color: #ff7019; }
        .rbt-sign-party em.is-done { color: #52c41a; }
        .rbt-sign-tip { margin: 4px 0 0; color: #888; font-size: 13px; line-height: 1.6; }
        .rbt-sign-empty { padding: 24px 12px; text-align: center; color: #999; font-size: 14px; }
        .rbt-h5-empty { padding: 48px 12px; text-align: center; color: #999; font-size: 14px; }
        .rbt-h5-check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
            margin: 0 0 8px;
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 10px;
            background: #fff;
            text-align: left;
            cursor: pointer;
        }
        .rbt-h5-check input { width: 18px; height: 18px; margin-top: 2px; accent-color: #ff7019; }
        .rbt-h5-check strong { display: block; color: #222; font-size: 14px; }
        .rbt-h5-check span { display: block; margin-top: 4px; color: #888; font-size: 12px; }
        .rbt-h5-sku { align-items: flex-start; }
        .rbt-h5-sku__img {
            flex: none;
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 8px;
            background: #f5f5f5;
        }
        .rbt-h5-sku__img--empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #bbb;
            font-size: 12px;
        }
        .rbt-h5-check .rbt-h5-sku__body { flex: 1; min-width: 0; margin-top: 0; }
        .rbt-h5-check .rbt-h5-sku__unit { color: #666; font-size: 12px; }
        .rbt-h5-check .rbt-h5-sku__price { color: #ff7019; font-size: 14px; font-weight: 600; }
        .rbt-h5-sku__foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 8px;
        }
        .rbt-h5-sku__foot .rbt-h5-sku__price { margin-top: 0; }
        .rbt-h5-qty {
            display: inline-flex;
            align-items: center;
            flex: none;
        }
        .rbt-h5-qty button {
            width: 28px;
            height: 28px;
            padding: 0;
            border: 1px solid #ffd0b0;
            border-radius: 6px;
            background: #fff7f2;
            color: #ff7019;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }
        .rbt-h5-qty button:disabled {
            border-color: #eee;
            background: #f7f7f7;
            color: #bbb;
            cursor: not-allowed;
        }
        .rbt-h5-qty input {
            width: 44px;
            height: 28px;
            margin: 0 6px;
            padding: 0;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            color: #333;
            box-sizing: border-box;
        }
        .rbt-h5-qty input:focus {
            outline: none;
            border-color: #ff7019;
        }
        .rbt-h5-sum {
            margin: 4px 0 12px;
            color: #333;
            font-size: 14px;
        }
        .rbt-h5-sum b { color: #ff7019; }
        .rbt-h5-section { margin: 14px 0 8px; color: #222; font-size: 14px; font-weight: 600; }
        .rbt-h5-publish { width: 100%; height: 44px; }
        .rbt-h5-pick {
            display: none;
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 16px;
            background: #f7f7f7;
        }
        .rbt-h5-phone.is-pick .rbt-h5-app { display: none; }
        .rbt-h5-phone.is-pick .rbt-h5-pick { display: block; }
        .rbt-h5-phone.is-pick .rbt-h5-phone__head { padding: 28px 16px 14px; }
        .rbt-h5-phone.is-pick .rbt-h5-phone__head h1 { font-size: 20px; }
        .rbt-h5-phone.is-pick .rbt-h5-phone__body { padding: 0; }
        .rbt-h5-pick button {
            width: 100%;
            margin-bottom: 10px;
            padding: 12px 14px;
            border: 1px solid #ffe0cc;
            border-radius: 8px;
            background: #fff7f2;
            text-align: left;
            cursor: pointer;
        }
        .rbt-h5-pick button strong { display: block; color: #222; font-size: 15px; }
        .rbt-h5-pick button span { color: #888; font-size: 12px; }
        .rbt-h5-toast {
            position: absolute;
            top: 108px;
            left: 24px;
            right: 24px;
            padding: 12px 16px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 30;
        }
        .rbt-h5-toast.is-on { opacity: 1; }
        .rbt-h5-inst {
            background: #fff;
            border-radius: 10px;
            border: 1px solid #eee;
            padding: 14px 12px;
            margin-bottom: 12px;
        }
        .rbt-h5-inst__row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f3f3f3;
        }
        .rbt-h5-inst__row:last-child { border-bottom: 0; }
        .rbt-h5-inst__label {
            color: #666;
            font-size: 14px;
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .rbt-h5-help-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .rbt-h5-help {
            width: 16px;
            height: 16px;
            padding: 0;
            border: 1px solid #bbb;
            border-radius: 50%;
            background: #fff;
            color: #888;
            font-size: 11px;
            line-height: 14px;
            text-align: center;
            cursor: pointer;
        }
        .rbt-h5-help:active,
        .rbt-h5-help-wrap.is-open .rbt-h5-help {
            border-color: #ff7019;
            color: #ff7019;
        }
        .rbt-h5-help-tip {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 8px);
            transform: translateX(-50%);
            z-index: 30;
            width: max-content;
            max-width: 200px;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.82);
            color: #fff;
            font-size: 12px;
            font-weight: 400;
            line-height: 1.5;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            white-space: normal;
            pointer-events: none;
        }
        .rbt-h5-help-tip[hidden] { display: none !important; }
        .rbt-h5-help-tip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border: 5px solid transparent;
            border-top-color: rgba(0, 0, 0, 0.82);
        }
        .rbt-h5-inst__amount {
            color: #222;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .rbt-h5-inst__chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
        }
        .rbt-h5-chip {
            min-width: 64px;
            height: 32px;
            padding: 0 12px;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            background: #fff;
            color: #333;
            font-size: 13px;
            cursor: pointer;
        }
        .rbt-h5-chip.is-on {
            border-color: #ff7019;
            background: #fff7f2;
            color: #ff7019;
            font-weight: 600;
        }
        .rbt-h5-inst__estimate {
            margin-top: 10px;
            padding: 12px;
            border-radius: 10px;
            background: #fff7f2;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
        .rbt-h5-inst__estimate b {
            color: #ff7019;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="rbt-h5-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="rbt-h5-store-stage">
                <button type="button" class="rbt-h5-switch" id="rbtH5SwitchStore">切换门店</button>
                <section class="rbt-h5-phone is-app" id="rbtH5Phone" aria-label="门店端">
                    <div class="rbt-h5-toast" id="rbtH5Toast" role="status"></div>
                    <div class="rbt-h5-phone__head">
                        <h1>门店端</h1>
                        <p id="rbtH5HeadText">首页</p>
                    </div>
                    <div class="rbt-h5-phone__body">
                        <div class="rbt-h5-pick" id="rbtH5Pick" aria-label="选择门店"></div>
                        <div class="rbt-h5-app" id="rbtH5App">
                            <div class="rbt-h5-scroll" id="rbtH5Scroll"></div>
                            <div class="rbt-h5-create" id="rbtH5Create" hidden>
                                <button type="button" class="rbt-h5-primary" data-create>发布需求</button>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="rbt-fresh.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/business-tag-prototype-store.js"></script>
    <script src="rbt-store-data.js"></script>
    <script src="rbt-demand-data.js"></script>
    <script src="rbt-contract-sign.js"></script>
    <script src="rbt-h5-store-app.js"></script>
    <script src="rbt-h5-store-login.js"></script>
</body>
</html>
