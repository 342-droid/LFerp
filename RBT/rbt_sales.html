<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰RBT - 销售单</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../vendor/octopus-prototype-runtime/runtime.css">
    <link rel="stylesheet" href="../vendor/octopus-prototype-runtime/theme.css">
    <link rel="stylesheet" href="../css/rbt-trade-page.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="rbt-sidebar.js"></script>

    <div id="header-container"></div>

    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button type="button" class="active">销售单</button></div>
            <hr class="content-divider">

            <div id="rbtTradeApp" class="rbt-demand-schema-host" data-kind="sales" v-cloak>
                <vab-schema-table
                    ref="table"
                    :columns="columns"
                    :request="requestRows"
                    row-key="code"
                    search-label-width="112px"
                    action-column-width="88"
                    :default-page-size="20"
                    :auto-format-time="false">
                    <template v-slot:[slots.code]="{row}">
                        <doc-no-link :value="row.code" @open="openDetail(row)"></doc-no-link>
                    </template>
                    <template v-slot:[slots.status]="{row,elSize}">
                        <el-tag :size="elSize" effect="light" :type="statusType(row.status)">{{ row.status || '—' }}</el-tag>
                    </template>
                    <template #actions="{row,elSize}">
                        <el-button :size="elSize" text type="primary" @click="openDetail(row)">详情</el-button>
                    </template>
                </vab-schema-table>
            </div>
        </main>
    </div>

    <script src="rbt-fresh.js"></script>
    <script src="../js/common.js"></script>
    <script src="../vendor/octopus-prototype-runtime/runtime.js"></script>
    <script src="rbt-store-data.js"></script>
    <script src="rbt-settle-ratio.js"></script>
    <script src="rbt-demand-data.js"></script>
    <script src="rbt-demand-detail.js"></script>
    <script src="rbt-trade-docs.js"></script>
    <script src="rbt-trade-detail.js"></script>
    <script src="rbt-trade-list.js"></script>
</body>
</html>
