<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>购物车 · 用户 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-profile.css">
  <link rel="stylesheet" href="../css/user-app-shop.css?v=20260817-sale1">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-cart-page">
    <div class="ua-mp-capsule" aria-hidden="true">
      <span class="ua-mp-capsule__dots"><i></i><i></i><i></i></span>
      <span class="ua-mp-capsule__ring"></span>
    </div>

    <header class="ua-cart-nav">
      <h1 class="ua-cart-nav__title">购物车</h1>
    </header>
    <div class="ua-cart-toolbar">
      <button type="button" class="ua-cart-toolbar__clear" id="cartClearBtn">清空</button>
    </div>

    <div class="ua-scroll">
      <div class="ua-cart-body">
        <div class="ua-cart-empty" id="cartEmpty" hidden>购物车还是空的</div>
        <div class="ua-cart-groups" id="cartGroupList"></div>
      </div>
    </div>

    <footer class="ua-cart-footer">
      <button type="button" class="ua-shop-check" id="cartSelectAll" aria-checked="false" aria-label="全选"></button>
      <span class="ua-cart-footer__all-label">全选</span>
      <div class="ua-cart-footer__total">合计 <strong id="cartTotal">¥0.00</strong></div>
      <button type="button" class="ua-cart-footer__btn" id="cartCheckoutBtn">立即下单(0)</button>
    </footer>

    <nav class="user-app-tabbar ua-shop-tabbar">
      <a href="home.html" class="ua-tab">
        <span class="ua-tab-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-8.5z"/></svg>
        </span>
        <span>首页</span>
      </a>
      <a href="mall.html" class="ua-tab">
        <span class="ua-tab-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9h16l-1.2 11H5.2L4 9z"/><path d="M8 9V7a4 4 0 018 0v2"/></svg>
        </span>
        <span>商城</span>
      </a>
      <span class="ua-tab ua-tab--active">
        <span class="ua-tab-icon-wrap">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 18a2 2 0 100 4 2 2 0 000-4zm10 0a2 2 0 100 4 2 2 0 000-4zM3 3h2l.4 2H21l-2.2 9H7.2L6 5H3V3zm4.4 9h8.9l1.2-5H7.6l-.2 1-.2 4z"/></svg>
          <span class="ua-tab-badge" data-ua-cart-badge hidden></span>
        </span>
        <span>购物车</span>
      </span>
      <a href="profile.html" class="ua-tab">
        <span class="ua-tab-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>
        </span>
        <span>我的</span>
      </a>
    </nav>
  </div>
<script src="../js/user-app-blacklist-guard.js"></script>
<script src="../../js/mdm-supplier-archive-store.js"></script>
<script src="../js/user-app-points-mall-order.js"></script>
<script src="../js/user-app-product-sale-time.js?v=20260817-sale1"></script>
<script src="../js/user-app-shop.js?v=20260817-sale1"></script>
<script>UAShop.initCartPage();</script>
</body>
</html>
