<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body class="user-app-body">
  <div class="ua-mobile-shell ua-as-list-page">

    <div class="ua-scroll ua-as-list-scroll">

        <span class="ua-status-bar__icons">

      <div class="ua-as-list-empty" id="aftersaleListEmpty" hidden>暂无售后记录</div>
    </div>

    <div class="ua-or-toast" id="refundDetailToast" hidden></div>

  <script src="../js/user-app-order-refund.js?v=20260720-as-refund-success"></script>
