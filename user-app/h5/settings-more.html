<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>更多 · 用户 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-profile-edit.css">
  <link rel="stylesheet" href="../css/user-app-login.css">
  <link rel="stylesheet" href="../css/user-app-settings.css">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-pe-page ua-set-page">
    <div class="ua-mp-capsule" aria-hidden="true">
      <span class="ua-mp-capsule__dots"><i></i><i></i><i></i></span>
      <span class="ua-mp-capsule__ring"></span>
    </div>

    <div class="ua-scroll ua-pe-scroll">
      <div class="ua-status-bar ua-pe-status">
        <span>9:41</span>
        <span class="ua-status-bar__icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="#111"><path d="M1 7h2v4H1V7zm4-2h2v6H5V5zm4-3h2v9H9V2zm4 5h2v4h-2V7z"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="#111"><path d="M8 2.4C10.8 2.4 13.2 3.6 15 5.6 15.2 5.8 15.5 5.8 15.7 5.6 15.9 5.4 15.9 5.1 15.7 4.9 13.6 2.6 10.9 1.2 8 1.2S2.4 2.6.3 4.9C.1 5.1.1 5.4.3 5.6.5 5.8.8 5.8 1 5.6 2.8 3.6 5.2 2.4 8 2.4zm0 3.6c1.8 0 3.4.8 4.5 2.1.2.2.5.2.7 0 .2-.2.2-.5 0-.7C11.9 5.4 10.1 4.4 8 4.4S4.1 5.4 2.8 6.9c-.2.2-.2.5 0 .7.2.2.5.2.7 0C4.6 6.8 6.2 6 8 6zm0 3c1 0 1.8.5 2.4 1.2.2.2.5.2.7 0 .2-.2.2-.5 0-.7C10.3 9.2 9.2 8.6 8 8.6S5.7 9.2 4.9 10.5c-.2.2-.2.5 0 .7.2.2.5.2.7 0 .6-.7 1.4-1.2 2.4-1.2z"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="20" height="11" rx="2.5" stroke="#111" opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#111"/><path d="M22 4.5v3a1.5 1.5 0 000-3z" fill="#111" opacity=".4"/></svg>
        </span>
      </div>

      <header class="ua-pe-nav">
        <a href="settings.html" class="ua-pe-nav__back" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <h1 class="ua-pe-nav__title">更多</h1>
      </header>

      <div class="ua-set-body">
        <section class="ua-set-card">
          <a href="account-cancel.html" class="ua-set-item" id="moreAccountCancel">
            <span class="ua-set-item__text ua-set-danger">账号注销</span>
            <span class="ua-set-item__arrow">&gt;</span>
          </a>
        </section>

        <!-- 注销驳回：单独卡片，仅展示最新一条 -->
        <section class="ua-set-reject-card" id="moreCancelRejectCard" hidden>
          <div class="ua-set-reject-card__head">
            <span class="ua-set-reject-card__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
                <path d="M7 7l10 10M17 7L7 17"/>
              </svg>
            </span>
            <span class="ua-set-reject-card__title">审核不通过</span>
          </div>
          <p class="ua-set-reject-card__desc">您的账号注销申请未通过审核，可修改后重新提交。</p>
          <div class="ua-set-reject-card__divider"></div>
          <p class="ua-set-reject-card__reason" id="moreCancelRejectReason"></p>
        </section>
      </div>
    </div>
  </div>
  <script src="../js/user-app-nav.js"></script>
  <script src="../js/user-app-account-cancel.js"></script>
  <script>
    (function () {
      if (window.UaNav) {
        window.UaNav.applyBackLink('.ua-pe-nav__back', 'settings.html');
        var link = document.getElementById('moreAccountCancel');
        if (link && window.UaNav.withFrom) {
          link.href = window.UaNav.withFrom('account-cancel.html');
        }
      }
      var rejectCard = document.getElementById('moreCancelRejectCard');
      var reasonEl = document.getElementById('moreCancelRejectReason');
      /* 注销成功应已退出；若仍停留本页则收尾跳转登录 */
      if (window.UaAccountCancel && window.UaAccountCancel.isCanceled()) {
        if (typeof window.UaAccountCancel.finalizeCancelSuccess === 'function') {
          window.UaAccountCancel.finalizeCancelSuccess();
        } else {
          window.location.replace('login.html?cancelSuccess=1&force=1');
        }
        return;
      }
      /* 上次注销申请被驳回：单独卡片展示最新一条驳回原因 */
      if (window.UaAccountCancel && window.UaAccountCancel.isRejected() && rejectCard) {
        if (reasonEl) {
          reasonEl.textContent = window.UaAccountCancel.getRejectReason() || '未填写原因';
        }
        rejectCard.hidden = false;
      }
    })();
  </script>
</body>
</html>
