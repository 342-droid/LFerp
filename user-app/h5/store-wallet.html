<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>门店钱包 · 门店 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-store-wallet.css">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-sw-page">
    <div class="ua-mp-capsule" aria-hidden="true">
      <span class="ua-mp-capsule__dots"><i></i><i></i><i></i></span>
      <span class="ua-mp-capsule__ring"></span>
    </div>

    <div class="ua-scroll">
      <div class="ua-status-bar">
        <span>9:41</span>
        <span class="ua-status-bar__icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="#111"><path d="M1 7h2v4H1V7zm4-2h2v6H5V5zm4-3h2v9H9V2zm4 5h2v4h-2V7z"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="#111"><path d="M8 2.4C10.8 2.4 13.2 3.6 15 5.6 15.2 5.8 15.5 5.8 15.7 5.6 15.9 5.4 15.9 5.1 15.7 4.9 13.6 2.6 10.9 1.2 8 1.2S2.4 2.6.3 4.9C.1 5.1.1 5.4.3 5.6.5 5.8.8 5.8 1 5.6 2.8 3.6 5.2 2.4 8 2.4z"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="20" height="11" rx="2.5" stroke="#111" opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#111"/><path d="M22 4.5v3a1.5 1.5 0 000-3z" fill="#111" opacity=".4"/></svg>
        </span>
      </div>

      <header class="ua-sw-nav">
        <a href="restock.html?from=store-app&tab=me" class="ua-sw-nav__back" id="swBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <h1 class="ua-sw-nav__title">门店钱包</h1>
      </header>

      <div class="ua-sw-body">
        <section class="ua-sw-card">
          <div class="ua-sw-deposit">
            <div>
              <div class="ua-sw-deposit__label">保证金账户</div>
              <div class="ua-sw-deposit__value" id="swDepositActual">¥0.00</div>
              <div class="ua-sw-deposit__meta" id="swDepositMeta">应保有 ¥2,000 · 不可提现</div>
            </div>
            <span class="ua-sw-gap" id="swDepositGap">无缺口</span>
          </div>
        </section>

        <section class="ua-sw-card ua-sw-card--balance">
          <div class="ua-sw-balance__title">余额账户 · 可支付</div>
          <div class="ua-sw-balance__main"><small>¥</small><span id="swAvailable">0.00</span></div>
          <p class="ua-sw-balance__tip">进货可用此余额；入驻货款不可提现，佣金与后续充值可提现</p>
          <div class="ua-sw-balance__grid">
            <div class="ua-sw-balance__item">
              <div class="ua-sw-balance__item-label">不可提现货款</div>
              <div class="ua-sw-balance__item-value" id="swGoodsQuota">¥0.00</div>
            </div>
            <div class="ua-sw-balance__item">
              <div class="ua-sw-balance__item-label">可提现</div>
              <div class="ua-sw-balance__item-value" id="swWithdrawable">¥0.00</div>
            </div>
          </div>
        </section>

        <div class="ua-sw-actions">
          <button type="button" id="swRechargeBtn">充值</button>
          <button type="button" class="ua-sw-actions__primary" id="swWithdrawBtn">提现</button>
        </div>

        <div class="ua-sw-ledger-head">
          <h2 class="ua-sw-ledger-head__title">资金台账</h2>
          <button type="button" class="ua-sw-ledger-head__reset" id="swResetDemo" hidden>重置演示数据</button>
        </div>
        <div class="ua-sw-tabs" role="tablist">
          <button type="button" class="is-active" data-sw-tab="all">全部</button>
          <button type="button" data-sw-tab="in">收入</button>
          <button type="button" data-sw-tab="out">支出</button>
          <button type="button" data-sw-tab="lock">锁定/补齐</button>
        </div>
        <section class="ua-sw-list-card" id="swLedgerList"></section>
      </div>
    </div>

    <div class="ua-sw-sheet" id="swDetailSheet" hidden>
      <div class="ua-sw-sheet__mask" data-sw-close></div>
      <div class="ua-sw-sheet__panel">
        <h3 class="ua-sw-sheet__title" id="swDetailTitle">流水详情</h3>
        <div id="swDetailBody"></div>
        <button type="button" class="ua-sw-sheet__close" data-sw-close>关闭</button>
      </div>
    </div>
  </div>
  <script src="../../js/store-wallet-demo.js"></script>
  <script src="../js/user-app-store-wallet.js"></script>
</body>
</html>
