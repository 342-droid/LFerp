<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>我的钱包 · 门店 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-store-wallet.css?v=20260805-ledger-enum">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-sw-page">
    <div class="ua-mp-capsule" aria-hidden="true">
      <span class="ua-mp-capsule__dots"><i></i><i></i><i></i></span>
      <span class="ua-mp-capsule__ring"></span>
    </div>

    <div class="ua-scroll">
      <header class="ua-sw-nav">
        <a href="restock.html?from=store-app&tab=me" class="ua-sw-nav__back" id="swBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <h1 class="ua-sw-nav__title">我的钱包</h1>
      </header>

      <div class="ua-sw-body">
        <section class="ua-sw-overview" aria-label="账户总计">
          <div class="ua-sw-overview__top">
            <span class="ua-sw-overview__badge">账户总计</span>
            <div class="ua-sw-overview__cols">
              <div class="ua-sw-overview__col">
                <div class="ua-sw-overview__big"><span id="swTotalAmount">0.00</span><small>元</small></div>
                <div class="ua-sw-overview__sub">总金额</div>
              </div>
              <div class="ua-sw-overview__col">
                <div class="ua-sw-overview__big"><span id="swTotalWithdrawable">0.00</span><small>元</small></div>
                <div class="ua-sw-overview__sub">可提现金额</div>
              </div>
            </div>
          </div>
          <div class="ua-sw-overview__bottom">
            <div class="ua-sw-overview__acct">
              <div class="ua-sw-overview__acct-name">
                保证金账户
                <button type="button" class="ua-sw-overview__help" data-sw-help="deposit" aria-label="保证金账户说明">?</button>
              </div>
              <div class="ua-sw-overview__line">余额：¥<span id="swDepositActual">0.00</span></div>
              <div class="ua-sw-overview__line">可提款：¥<span id="swDepositWithdrawable">0.00</span></div>
              <div class="ua-sw-overview__line ua-sw-overview__line--muted" id="swDepositMeta">应保有 ¥2,000</div>
            </div>
            <div class="ua-sw-overview__acct">
              <div class="ua-sw-overview__acct-name">
                余额账户
                <button type="button" class="ua-sw-overview__help" data-sw-help="balance" aria-label="余额账户说明">?</button>
              </div>
              <div class="ua-sw-overview__line">余额：¥<span id="swAvailable">0.00</span></div>
              <div class="ua-sw-overview__line">可提款：¥<span id="swWithdrawable">0.00</span></div>
              <div class="ua-sw-overview__line ua-sw-overview__line--muted ua-sw-overview__line--with-help">
                货款
                <button type="button" class="ua-sw-overview__help" data-sw-help="goods" aria-label="货款说明">?</button>
                ¥<span id="swGoodsQuota">0.00</span>
              </div>
            </div>
          </div>
          <span id="swDepositGap" hidden></span>
        </section>

        <div class="ua-sw-actions">
          <button type="button" id="swRechargeBtn">充值</button>
          <button type="button" class="ua-sw-actions__primary" id="swWithdrawBtn">提现</button>
        </div>

        <div class="ua-sw-ledger-head">
          <div class="ua-sw-ledger-head__left">
            <h2 class="ua-sw-ledger-head__title">账户明细</h2>
            <button type="button" class="ua-sw-ledger-head__reset" id="swResetDemo" hidden>重置</button>
          </div>
          <button type="button" class="ua-sw-time" id="swTimeBtn" aria-haspopup="dialog" aria-expanded="false">
            <svg class="ua-sw-time__cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="3"/>
              <path d="M3 10h18M8 3v4M16 3v4"/>
            </svg>
            <span class="ua-sw-time__label" id="swTimeLabel">近30天</span>
            <svg class="ua-sw-time__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </button>
        </div>
        <div class="ua-sw-tabs" role="tablist">
          <button type="button" class="is-active" data-sw-tab="all">全部</button>
          <button type="button" data-sw-tab="in" title="含首次充值、佣金结算、充值、退款等">收入</button>
          <button type="button" data-sw-tab="out" title="含提现、进货支付、售后/责任类扣款等">支出</button>
          <button type="button" data-sw-tab="lock" title="保证金补缴（锁定/补齐）">锁定/补齐</button>
        </div>
        <div class="ua-sw-biz-filter" id="swBizFilter" hidden>
          <span id="swBizFilterLabel">账变类型：提现</span>
          <button type="button" id="swBizFilterClear">清除</button>
        </div>
        <section class="ua-sw-list-card" id="swLedgerList"></section>
      </div>
    </div>

    <div class="ua-sw-sheet" id="swTimeSheet" hidden>
      <div class="ua-sw-sheet__mask" data-sw-time-close></div>
      <div class="ua-sw-sheet__panel ua-sw-time-sheet" role="dialog" aria-modal="true" aria-labelledby="swTimeSheetTitle">
        <div class="ua-sw-sheet__head">
          <button type="button" class="ua-sw-time-sheet__back" id="swTimeBack" hidden aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <h3 class="ua-sw-sheet__title" id="swTimeSheetTitle">选择时间</h3>
          <button type="button" class="ua-sw-sheet__x" data-sw-time-close aria-label="关闭">×</button>
        </div>
        <div class="ua-sw-time-sheet__list" id="swTimeOptions" role="listbox" aria-label="时间范围"></div>
        <div class="ua-sw-time-custom" id="swTimeCustom" hidden>
          <p class="ua-sw-time-custom__hint">选择起止日期后点击确定</p>
          <div class="ua-sw-time-custom__row">
            <label class="ua-sw-time-custom__field">
              <span>开始日期</span>
              <input type="date" id="swTimeStart" />
            </label>
            <span class="ua-sw-time-custom__sep">至</span>
            <label class="ua-sw-time-custom__field">
              <span>结束日期</span>
              <input type="date" id="swTimeEnd" />
            </label>
          </div>
          <p class="ua-sw-time-custom__err" id="swTimeCustomErr" hidden></p>
          <button type="button" class="ua-sw-time-custom__ok" id="swTimeCustomOk">确定</button>
        </div>
      </div>
    </div>

    <div class="ua-sw-sheet" id="swHelpSheet" hidden>
      <div class="ua-sw-sheet__mask" data-sw-help-close></div>
      <div class="ua-sw-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="swHelpTitle">
        <div class="ua-sw-sheet__head">
          <h3 class="ua-sw-sheet__title" id="swHelpTitle">说明</h3>
          <button type="button" class="ua-sw-sheet__x" data-sw-help-close aria-label="关闭">×</button>
        </div>
        <div class="ua-sw-sheet__body" id="swHelpBody"></div>
        <div class="ua-sw-sheet__foot">
          <button type="button" class="ua-sw-sheet__ok" data-sw-help-close>我知道了</button>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/user-app-blacklist-guard.js"></script>
  <script src="../../js/store-wallet-demo.js?v=20260810-deposit-unfreeze6"></script>
  <script src="../../js/store-onboarding-gate.js?v=20260805-wd-unlock"></script>
  <script src="../js/user-app-store-wallet.js?v=20260810-deposit-unfreeze6"></script>

</body>
</html>
