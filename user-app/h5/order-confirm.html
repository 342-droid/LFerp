<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>确认订单 · 用户 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-profile.css">
  <link rel="stylesheet" href="../css/user-app-shop.css?v=20260725-confirm-split">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-confirm-page">
    <div class="ua-mp-capsule" aria-hidden="true">
      <span class="ua-mp-capsule__dots"><i></i><i></i><i></i></span>
      <span class="ua-mp-capsule__ring"></span>
    </div>

    <header class="ua-confirm-nav">
      <a href="cart.html" class="ua-confirm-nav__back" id="confirmBack" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <h1 class="ua-confirm-nav__title">确认订单</h1>
      <button type="button" class="ua-confirm-nav__service" id="confirmServiceBtn" aria-label="客服">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4.5 13.5v-1.2a7.5 7.5 0 0115 0v1.2"/><path d="M6.5 13.5v2.2a1.8 1.8 0 001.8 1.8H10v-4H6.5zM14 13.5v4h1.7a1.8 1.8 0 001.8-1.8v-2.2H14z"/></svg>
      </button>
    </header>

    <div class="ua-scroll">
      <div class="ua-confirm-body">
        <!-- 快递收货地址：有快递单时展示 -->
        <button type="button" class="ua-confirm-card ua-confirm-address" id="confirmAddressCard" hidden>
          <span class="ua-confirm-address__pin" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 00-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 00-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>
          </span>
          <div class="ua-confirm-address__body">
            <div class="ua-confirm-address__user">
              <span id="confirmAddrName">武者</span>
              <span id="confirmAddrPhone">181****4215</span>
            </div>
            <p class="ua-confirm-address__text" id="confirmAddrText">四川省成都市武侯区天府大道中段666号天府软件园A区</p>
          </div>
          <svg class="ua-confirm-address__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>

        <!-- 拆单卡片列表 -->
        <div id="confirmSplitList"></div>

        <!-- 金额与优惠 -->
        <section class="ua-confirm-card ua-confirm-options">
          <button type="button" class="ua-confirm-row" id="confirmInvoiceRow">
            <span class="ua-confirm-row__label">发票抬头</span>
            <span class="ua-confirm-row__value" id="confirmInvoiceText">不开发票</span>
            <svg class="ua-confirm-row__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <button type="button" class="ua-confirm-row" id="confirmCouponRow">
            <span class="ua-confirm-row__label">优惠券</span>
            <span class="ua-confirm-row__value ua-confirm-row__value--muted" id="confirmCouponText">暂无可用优惠券</span>
            <svg class="ua-confirm-row__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <button type="button" class="ua-confirm-row" id="confirmPointsDeductRow">
            <span class="ua-confirm-row__label">积分抵扣</span>
            <span class="ua-confirm-row__value" id="confirmPointsDeductText">未使用</span>
            <svg class="ua-confirm-row__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </section>

        <section class="ua-confirm-card ua-confirm-summary">
          <div class="ua-confirm-summary__row">
            <span>商品总价</span>
            <span id="confirmGoodsTotal">¥0.00</span>
          </div>
          <div class="ua-confirm-summary__row" id="confirmExchangePointsRow" hidden>
            <span>积分兑换</span>
            <span id="confirmExchangePoints">0积分</span>
          </div>
          <div class="ua-confirm-summary__row">
            <span class="ua-confirm-summary__label">
              运费
              <button type="button" class="ua-confirm-summary__help" id="confirmFreightHelp" aria-label="运费说明">i</button>
            </span>
            <span id="confirmFreight">¥0.00</span>
          </div>
          <div class="ua-confirm-summary__row">
            <span>优惠券</span>
            <span class="ua-confirm-summary__discount" id="confirmCouponDiscount">-¥0.00</span>
          </div>
          <div class="ua-confirm-summary__row" id="confirmPointsDeductSummaryRow" hidden>
            <span>积分抵扣</span>
            <span class="ua-confirm-summary__discount" id="confirmPointsDeductAmount">-¥0.00</span>
          </div>
          <div class="ua-confirm-summary__row ua-confirm-summary__row--total">
            <span>合计</span>
            <strong id="confirmSum">¥0.00</strong>
          </div>
        </section>

        <label class="ua-confirm-agree">
          <button type="button" class="ua-shop-check is-checked" id="confirmAgreeCheck" aria-checked="true"></button>
          <span>我已阅读并同意《交易服务协议》</span>
        </label>
      </div>
    </div>

    <footer class="ua-confirm-footer">
      <div class="ua-confirm-footer__pay">合计支付 <strong id="confirmPayAmount">¥0.00</strong></div>
      <button type="button" class="ua-confirm-footer__btn" id="confirmPayBtn">确认订单</button>
    </footer>

    <!-- 支付弹层 -->
    <div class="ua-confirm-sheet" id="confirmPaySheet" hidden>
      <div class="ua-confirm-sheet__mask" data-confirm-close="pay"></div>
      <div class="ua-confirm-sheet__panel">
        <button type="button" class="ua-confirm-sheet__close" data-confirm-close="pay" aria-label="关闭">×</button>
        <div class="ua-confirm-pay-sheet__amount" id="confirmPaySheetAmount">¥0.00</div>
        <div class="ua-confirm-pay-sheet__timer">支付剩余时间 <span id="confirmPayTimer">29:59</span></div>
        <div class="ua-confirm-pay-sheet__list">
          <button type="button" class="ua-confirm-pay-sheet__item is-active" data-pay-method="wechat">
            <span class="ua-confirm-pay-sheet__icon ua-confirm-pay-sheet__icon--wechat">微</span>
            <span class="ua-confirm-pay-sheet__name">微信支付</span>
            <span class="ua-shop-check is-checked" aria-hidden="true"></span>
          </button>
          <button type="button" class="ua-confirm-pay-sheet__item" data-pay-method="alipay">
            <span class="ua-confirm-pay-sheet__icon ua-confirm-pay-sheet__icon--alipay">支</span>
            <span class="ua-confirm-pay-sheet__name">支付宝</span>
            <span class="ua-shop-check" aria-hidden="true"></span>
          </button>
        </div>
        <button type="button" class="ua-confirm-pay-sheet__submit" id="confirmPaySubmit">立即支付</button>
      </div>
    </div>

    <div class="ua-shop-toast" id="uaShopToast" hidden></div>
  </div>
  <script src="../../js/mdm-supplier-archive-store.js"></script>
  <script src="../../js/mdm-marketing-points-mall-config.js"></script>
  <script src="../js/user-app-points-mall-order.js"></script>
  <script src="../js/user-app-orders-store.js?v=20260728-status-sync2"></script>
  <script src="../js/user-app-newcomer-zone-order.js"></script>
  <script src="../js/user-app-shop.js?v=20260728-status-sync2"></script>
  <script>UAShop.initOrderConfirmPage();</script>
</body>
</html>
