<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>确认订单 · 用户 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-profile.css">
  <link rel="stylesheet" href="../css/user-app-shop.css?v=20260723-shop">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-confirm-page">
    <div class="ua-mp-capsule" aria-hidden="true">
      <span class="ua-mp-capsule__dots"><i></i><i></i><i></i></span>
      <span class="ua-mp-capsule__ring"></span>
    </div>

    <header class="ua-confirm-nav">
      <a href="cart.html" class="ua-confirm-nav__back" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <h1 class="ua-confirm-nav__title">确认订单</h1>
    </header>

    <div class="ua-scroll">
      <div class="ua-confirm-body">
        <section class="ua-confirm-card ua-confirm-pickup">
          <h2 class="ua-confirm-pickup__title">提货点：生产验证门店</h2>
          <p class="ua-confirm-pickup__addr">上海市市辖区青浦区上海市青浦区华新镇纪鹤公路1301号7幢1层121室</p>
          <div class="ua-confirm-pickup__contact">斯斯 159****4315</div>
          <div class="ua-confirm-pickup__time">提货时间：</div>
        </section>

        <section class="ua-confirm-card" id="confirmItemList"></section>

        <section class="ua-confirm-card ua-confirm-summary">
          <div class="ua-confirm-summary__row">
            <div class="ua-confirm-summary__left">
              <span>商品总价</span>
              <span class="ua-confirm-summary__hint" id="confirmGoodsCount">共计0件商品</span>
            </div>
            <span id="confirmGoodsTotal">¥0</span>
          </div>
          <div class="ua-confirm-summary__row">
            <span>优惠券</span>
            <span class="ua-confirm-summary__muted">暂无可用优惠券</span>
          </div>
          <div class="ua-confirm-summary__row ua-confirm-summary__row--total">
            <span>合计</span>
            <strong id="confirmSum">¥0</strong>
          </div>
        </section>

        <section class="ua-confirm-card ua-confirm-pay">
          <span class="ua-confirm-pay__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M9.5 8.2c-3.3 0-6 2.1-6 4.7 0 1.5.9 2.9 2.3 3.8l-.5 1.7 2-.9c.5.1 1 .2 1.5.2.2 0 .3 0 .5-.1-.2-.5-.3-1-.3-1.5 0-2.8 2.8-5.1 6.2-5.1.2 0 .5 0 .7.1C15.3 9.4 12.6 8.2 9.5 8.2zm-2.4 2.3a.75.75 0 110 1.5.75.75 0 010-1.5zm3.5 0a.75.75 0 110 1.5.75.75 0 010-1.5zM15.4 11c-3.1 0-5.6 2-5.6 4.5s2.5 4.5 5.6 4.5c.5 0 1-.1 1.5-.2l1.7.8-.4-1.5c1.2-.8 2-2 2-3.6 0-2.5-2.5-4.5-5.8-4.5zm-1.8 2.7a.65.65 0 110 1.3.65.65 0 010-1.3zm3.3 0a.65.65 0 110 1.3.65.65 0 010-1.3z"/></svg>
          </span>
          <span class="ua-confirm-pay__name">微信支付</span>
          <span class="ua-shop-check is-checked" aria-hidden="true"></span>
        </section>
      </div>
    </div>

    <footer class="ua-confirm-footer">
      <div class="ua-confirm-footer__pay">实付 <strong id="confirmPayAmount">¥0.00</strong></div>
      <button type="button" class="ua-confirm-footer__btn" id="confirmPayBtn">立即支付</button>
    </footer>
  </div>
  <script src="../js/user-app-shop.js?v=20260723-shop"></script>
  <script>UAShop.initOrderConfirmPage();</script>
</body>
</html>
