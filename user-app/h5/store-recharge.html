<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>充值 · 门店 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-store-withdraw.css?v=20260804-unify">
  <link rel="stylesheet" href="../css/user-app-store-recharge.css?v=20260804-unify">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-wd-page">
    <div class="ua-mp-capsule" aria-hidden="true">
      <span class="ua-mp-capsule__dots"><i></i><i></i><i></i></span>
      <span class="ua-mp-capsule__ring"></span>
    </div>

    <div class="ua-scroll ua-wd-scroll">
      <header class="ua-wd-nav">
        <a href="store-wallet.html" class="ua-wd-nav__back" id="rcBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <h1 class="ua-wd-nav__title">充值</h1>
        <span class="ua-wd-nav__link" aria-hidden="true"></span>
      </header>

      <div class="ua-wd-body">
        <section class="ua-wd-card">
          <button type="button" class="ua-wd-bank ua-rc-method-row" id="rcMethodBtn" aria-label="选择充值方式">
            <span class="ua-wd-bank__label">充值方式</span>
            <span class="ua-wd-bank__main">
              <span class="ua-wd-bank__icon is-corp" id="rcBankIcon" aria-hidden="true">公</span>
              <span class="ua-wd-bank__info">
                <span class="ua-wd-bank__name" id="rcBankName">中国建设银行(0992)</span>
                <span class="ua-wd-bank__tip" id="rcBankTip">单笔最高¥5000，单日最高¥50000</span>
              </span>
              <svg class="ua-wd-bank__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
            </span>
          </button>

          <div class="ua-wd-amount">
            <div class="ua-wd-amount__label">充值金额</div>
            <div class="ua-wd-amount__row" id="rcAmountFocus">
              <span class="ua-wd-amount__yen">¥</span>
              <div class="ua-wd-amount__field">
                <span class="ua-wd-amount__value" id="rcAmountValue"></span>
                <span class="ua-wd-amount__caret" id="rcCaret" hidden></span>
              </div>
            </div>
            <p class="ua-wd-amount__err" id="rcErr" hidden></p>
          </div>

          <button type="button" class="ua-wd-submit" id="rcSubmit" disabled>充值</button>
        </section>
      </div>
    </div>

    <div class="ua-wd-keypad" id="rcKeypad" hidden>
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <button type="button" data-key=".">.</button>
      <button type="button" data-key="0">0</button>
      <button type="button" class="ua-wd-keypad__del" data-key="del" aria-label="删除">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M9 6h11a1 1 0 011 1v10a1 1 0 01-1 1H9l-5-6 5-6z"/>
          <path d="M12 10l4 4m0-4l-4 4"/>
        </svg>
      </button>
    </div>

    <div class="ua-wd-sheet" id="rcBankSheet" hidden>
      <div class="ua-wd-sheet__mask" data-rc-sheet-close></div>
      <div class="ua-wd-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="rcBankSheetTitle">
        <div class="ua-wd-sheet__head">
          <h3 class="ua-wd-sheet__title" id="rcBankSheetTitle">选择充值方式</h3>
          <button type="button" class="ua-wd-sheet__x" data-rc-sheet-close aria-label="关闭">×</button>
        </div>
        <div class="ua-wd-sheet__list" id="rcBankList"></div>
      </div>
    </div>
  </div>

  <script src="../../js/store-wallet-demo.js?v=20260805-first-cz"></script>
  <script src="../../js/store-pay-password.js?v=20260804"></script>
  <script src="../js/user-app-store-pay-guard.js?v=20260804"></script>
  <script src="../js/user-app-store-recharge.js?v=20260805-first-cz"></script>
</body>
</html>
