<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>绑定银行卡 · 门店 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-store-withdraw.css?v=20260804-unify">
  <link rel="stylesheet" href="../css/user-app-store-bind-card.css?v=20260805">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-bc-page">
    <div class="ua-scroll ua-bc-scroll">
      <header class="ua-bc-nav">
        <a href="store-recharge.html" class="ua-bc-nav__back" id="bcBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <h1 class="ua-bc-nav__title">绑定银行卡</h1>
        <button type="button" class="ua-bc-nav__side" id="bcCsBtn" aria-label="客服">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M4 12a8 8 0 0116 0v5a2 2 0 01-2 2h-1v-7h3"/>
            <path d="M4 12v5a2 2 0 002 2h1v-7H4"/>
            <path d="M12 19v2a2 2 0 002 2h0"/>
          </svg>
        </button>
      </header>

      <div class="ua-bc-holder">
        <span class="ua-bc-holder__name">
          持卡人：<span id="bcHolderName">王小二</span>
          <button type="button" class="ua-bc-holder__info" id="bcHolderInfo" aria-label="持卡人说明">i</button>
        </span>
        <span class="ua-bc-holder__link">仅限绑定本人持有借记卡</span>
      </div>

      <div class="ua-bc-card">
        <div class="ua-bc-field">
          <input type="tel" id="bcCardNo" inputmode="numeric" maxlength="23" placeholder="请输入银行卡号" autocomplete="off" />
          <button type="button" class="ua-bc-field__cam" id="bcScanBtn" aria-label="扫描银行卡">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/>
              <rect x="7" y="8" width="10" height="8" rx="1"/>
            </svg>
          </button>
        </div>
        <div class="ua-bc-field">
          <button type="button" class="ua-bc-field__bank is-placeholder" id="bcBankBtn">请选择开户银行</button>
          <span class="ua-bc-field__chev" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
          </span>
        </div>
        <div class="ua-bc-field">
          <input type="tel" id="bcPhone" inputmode="numeric" maxlength="11" placeholder="请输入银行预留手机号" autocomplete="off" />
          <button type="button" class="ua-bc-holder__info" id="bcPhoneInfo" aria-label="手机号说明">i</button>
        </div>
        <div class="ua-bc-field">
          <input type="tel" id="bcSms" inputmode="numeric" maxlength="6" placeholder="请输入验证码" autocomplete="off" />
          <button type="button" class="ua-bc-field__sms" id="bcSmsBtn">获取验证码</button>
        </div>
      </div>

      <div class="ua-bc-foot">
        <button type="button" class="ua-bc-submit" id="bcSubmit" disabled>立即绑卡</button>
      </div>
    </div>

    <div class="ua-wd-sheet ua-bc-bank-sheet" id="bcBankSheet" hidden>
      <div class="ua-wd-sheet__mask" data-bc-bank-close></div>
      <div class="ua-wd-sheet__panel" role="dialog" aria-modal="true" aria-label="选择开户银行">
        <div class="ua-wd-sheet__head">
          <h3 class="ua-wd-sheet__title">选择开户银行</h3>
          <button type="button" class="ua-wd-sheet__x" data-bc-bank-close aria-label="关闭">×</button>
        </div>
        <div class="ua-wd-sheet__list" id="bcBankList"></div>
      </div>
    </div>

    <div class="ua-bc-modal" id="bcHolderModal" hidden>
      <div class="ua-bc-modal__mask" data-bc-modal-close="bcHolderModal"></div>
      <div class="ua-bc-modal__panel">
        <h3 class="ua-bc-modal__title">持卡人说明</h3>
        <div class="ua-bc-modal__body">
          <p>为了你的账户资金安全，只能绑定持卡人本人的银行卡。</p>
          <p>获取更多帮助，请致电丰银宝客服400-88888888。</p>
        </div>
        <button type="button" class="ua-bc-modal__ok" data-bc-modal-close="bcHolderModal">知道了</button>
      </div>
    </div>

    <div class="ua-bc-modal" id="bcPhoneModal" hidden>
      <div class="ua-bc-modal__mask" data-bc-modal-close="bcPhoneModal"></div>
      <div class="ua-bc-modal__panel">
        <h3 class="ua-bc-modal__title">手机号说明</h3>
        <div class="ua-bc-modal__illus">银行卡申请人资料<br />手机号码 xxxxxxx</div>
        <div class="ua-bc-modal__body">
          <p>银行预留的手机号是办理该银行卡时所填写的手机号码。没有预留、手机号忘记或者已停用，请联系银行客服更新处理。</p>
        </div>
        <button type="button" class="ua-bc-modal__ok" data-bc-modal-close="bcPhoneModal">知道了</button>
      </div>
    </div>

    <div class="ua-bc-modal" id="bcErrModal" hidden>
      <div class="ua-bc-modal__mask" data-bc-modal-close="bcErrModal"></div>
      <div class="ua-bc-modal__panel">
        <h3 class="ua-bc-modal__title">提示</h3>
        <div class="ua-bc-modal__body"><p id="bcErrText"></p></div>
        <button type="button" class="ua-bc-modal__ok" data-bc-modal-close="bcErrModal">确定</button>
      </div>
    </div>
  </div>

  <script src="../../js/store-bind-card-demo.js?v=20260805"></script>
  <script src="../js/user-app-store-bind-card.js?v=20260805"></script>
</body>
</html>
