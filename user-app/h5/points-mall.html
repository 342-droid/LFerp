<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>积分商城 · 用户 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-profile.css">
  <link rel="stylesheet" href="../css/user-app-points-mall.css">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-pm-page">
    <div class="ua-mp-capsule ua-mp-capsule--light" aria-hidden="true">
      <span class="ua-mp-capsule__dots"><i></i><i></i><i></i></span>
      <span class="ua-mp-capsule__ring"></span>
    </div>

    <div class="ua-scroll ua-pm-scroll">
      <div class="ua-pm-hero">
        <div class="ua-status-bar ua-pm-status">
          <span>9:41</span>
          <span class="ua-status-bar__icons">
            <svg width="17" height="11" viewBox="0 0 17 11" fill="#fff"><path d="M1 7h2v4H1V7zm4-2h2v6H5V5zm4-3h2v9H9V2zm4 5h2v4h-2V7z"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.4C10.8 2.4 13.2 3.6 15 5.6 15.2 5.8 15.5 5.8 15.7 5.6 15.9 5.4 15.9 5.1 15.7 4.9 13.6 2.6 10.9 1.2 8 1.2S2.4 2.6.3 4.9C.1 5.1.1 5.4.3 5.6.5 5.8.8 5.8 1 5.6 2.8 3.6 5.2 2.4 8 2.4zm0 3.6c1.8 0 3.4.8 4.5 2.1.2.2.5.2.7 0 .2-.2.2-.5 0-.7C11.9 5.4 10.1 4.4 8 4.4S4.1 5.4 2.8 6.9c-.2.2-.2.5 0 .7.2.2.5.2.7 0C4.6 6.8 6.2 6 8 6zm0 3c1 0 1.8.5 2.4 1.2.2.2.5.2.7 0 .2-.2.2-.5 0-.7C10.3 9.2 9.2 8.6 8 8.6S5.7 9.2 4.9 10.5c-.2.2-.2.5 0 .7.2.2.5.2.7 0 .6-.7 1.4-1.2 2.4-1.2z"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="20" height="11" rx="2.5" stroke="#fff" opacity=".45"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#fff"/><path d="M22 4.5v3a1.5 1.5 0 000-3z" fill="#fff" opacity=".55"/></svg>
          </span>
        </div>

        <header class="ua-pm-nav">
          <a href="profile.html" class="ua-pm-nav__back" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>
          </a>
          <h1 class="ua-pm-nav__title">积分商城</h1>
        </header>

        <div class="ua-pm-hero__glow" aria-hidden="true"></div>
        <div class="ua-pm-hero__coin" aria-hidden="true"></div>

        <div class="ua-pm-balance">
          <div class="ua-pm-balance__row">
            <a href="points-detail.html" class="ua-pm-balance__item" id="pmPointsLink" aria-label="查看可用积分明细">
              <span class="ua-pm-balance__label">可用积分</span>
              <span class="ua-pm-balance__value" id="pmAvailable">0</span>
            </a>
            <span class="ua-pm-balance__divider" aria-hidden="true"></span>
            <a href="points-detail.html" class="ua-pm-balance__item" id="pmFrozenLink" aria-label="查看冻结积分明细">
              <span class="ua-pm-balance__label">冻结积分</span>
              <span class="ua-pm-balance__value ua-pm-balance__value--sub" id="pmFrozen">0</span>
            </a>
            <a href="points-rule-desc.html" class="ua-pm-balance__rule" id="pmRuleLink">规则</a>
          </div>
          <a href="points-detail.html" class="ua-pm-balance__tip" id="pmExpireTip">
            <span class="ua-pm-balance__tip-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 3a6 6 0 016 6v1.2c0 .4.1.8.4 1.1L20 13v1H4v-1l1.6-1.7c.3-.3.4-.7.4-1.1V9a6 6 0 016-6z" stroke="currentColor" stroke-width="1.6"/><path d="M10 18a2 2 0 004 0" stroke="currentColor" stroke-width="1.6"/></svg>
            </span>
            <span id="pmExpireText">可用积分不含冻结积分</span>
            <svg class="ua-pm-balance__tip-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
          </a>
        </div>
      </div>

      <div class="ua-pm-sheet">
        <section class="ua-pm-banner" id="pmBanner" aria-label="轮播图" hidden></section>

        <div class="ua-pm-toolbar">
          <nav class="ua-pm-tabs" id="pmTabs" aria-label="兑换方式">
            <button type="button" class="ua-pm-tab is-active" data-type="">全部</button>
            <button type="button" class="ua-pm-tab" data-type="points">纯积分</button>
            <button type="button" class="ua-pm-tab" data-type="points_money">积分+现金</button>
          </nav>

          <section class="ua-pm-filters" aria-label="筛选">
            <div class="ua-pm-filter-row">
              <div class="ua-pm-range" role="group" aria-label="兑换积分区间，可只填一侧">
                <input id="pmPointsMin" type="number" min="0" step="1" placeholder="最低" inputmode="numeric" title="只填左侧表示最低积分起、上不封顶">
                <span>—</span>
                <input id="pmPointsMax" type="number" min="0" step="1" placeholder="不限" inputmode="numeric" title="只填右侧表示最高积分、下不设限">
              </div>
              <input class="ua-pm-name" id="pmName" type="search" placeholder="搜商品" autocomplete="off">
              <button type="button" class="ua-pm-filter-clear" id="pmFilterClear">清空</button>
              <button type="button" class="ua-pm-filter-go" id="pmFilterQuery">筛选</button>
            </div>
          </section>
        </div>

        <section class="ua-pm-list" id="pmList" aria-label="兑换商品"></section>
        <div class="ua-pm-end" id="pmEnd" hidden>— 没有更多了 —</div>
      </div>
    </div>

    <!-- 多规格选择弹层：加入购物车 / 立即兑换 -->
    <div class="ua-pm-sku-sheet" id="pmSkuSheet" hidden>
      <div class="ua-pm-sku-sheet__mask" data-pm-sku-close></div>
      <div class="ua-pm-sku-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="pmSkuName">
        <button type="button" class="ua-pm-sku-sheet__close" data-pm-sku-close aria-label="关闭">×</button>
        <div class="ua-pm-sku-sheet__head">
          <img class="ua-pm-sku-sheet__thumb" id="pmSkuThumb" src="" alt="">
          <div class="ua-pm-sku-sheet__meta">
            <div class="ua-pm-sku-sheet__price" id="pmSkuPrice">0积分</div>
            <div class="ua-pm-sku-sheet__name" id="pmSkuName"></div>
            <div class="ua-pm-sku-sheet__picked" id="pmSkuPicked">已选</div>
          </div>
        </div>
        <div class="ua-pm-sku-sheet__section">
          <div class="ua-pm-sku-sheet__label">规格</div>
          <div class="ua-pm-sku-sheet__specs" id="pmSkuSpecs"></div>
        </div>
        <div class="ua-pm-sku-sheet__qty-row">
          <div class="ua-pm-sku-sheet__label">兑换数量</div>
          <div class="ua-pm-sku-sheet__stepper">
            <button type="button" id="pmSkuQtyMinus" aria-label="减少">−</button>
            <span id="pmSkuQty">1</span>
            <button type="button" id="pmSkuQtyPlus" aria-label="增加">+</button>
          </div>
        </div>
        <div class="ua-pm-sku-sheet__hint" id="pmSkuHint"></div>
        <div class="ua-pm-sku-sheet__actions">
          <button type="button" class="ua-pm-sku-sheet__cart" id="pmSkuAddCart">加入购物车</button>
          <button type="button" class="ua-pm-sku-sheet__buy" id="pmSkuBuyNow">立即兑换</button>
        </div>
      </div>
    </div>
  </div>
  <script src="../../js/mdm-marketing-points-mall-store.js"></script>
  <script src="../../js/mdm-marketing-points-mall-config.js"></script>
  <script src="../js/user-app-nav.js"></script>
  <script src="../js/user-app-points-mall-order.js"></script>
  <script src="../js/user-app-points-mall.js?v=20260728-banner-no-title"></script>
</body>
</html>
