<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>切换门店 · 用户 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-register-gift.css">
  <link rel="stylesheet" href="../css/user-app-switch-address.css?v=20260828-search">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-sa-page">
    <div class="ua-mp-capsule" aria-hidden="true">
      <span class="ua-mp-capsule__dots"><i></i><i></i><i></i></span>
      <span class="ua-mp-capsule__ring"></span>
    </div>

    <header class="ua-sa-nav">
      <a href="home.html" class="ua-sa-nav__back" id="saBack" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <h1 class="ua-sa-nav__title">切换门店</h1>
    </header>

    <div class="ua-scroll ua-sa-scroll" id="saScroll">
      <div class="ua-sa-store-search" role="search">
        <svg class="ua-sa-store-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"/>
          <path d="M16.5 16.5L20 20"/>
        </svg>
        <input type="search" class="ua-sa-store-search__input" id="saStoreSearch" placeholder="搜索门店名称" autocomplete="off" enterkeyhint="search">
      </div>
      <section class="ua-sa-block">
        <div class="ua-sa-section-head">
          <div class="ua-sa-section-title">当前门店</div>
          <button type="button" class="ua-sa-scan-switch" id="saScanSwitchBtn">扫一扫切换门店</button>
        </div>
        <div class="ua-sa-pickup-list" id="saCurrentPickup"></div>
      </section>
      <section class="ua-sa-block">
        <div class="ua-sa-section-title">可切门店</div>
        <div class="ua-sa-pickup-list" id="saSwitchablePickup"></div>
        <div class="ua-sa-empty" id="saSwitchableEmpty">暂无可切门店，点击右上角扫一扫切换门店</div>
      </section>
    </div>

    <div class="ua-sa-toast" id="saToast" hidden></div>
  </div>

  <script src="../js/user-app-blacklist-guard.js"></script>
  <script src="../../js/mdm-system-default-store.js?v=20260827-sys-default"></script>
  <script src="../js/user-app-switch-address.js?v=20260827-sys-default"></script>
  <script src="../js/user-app-store-switch.js?v=20260828-autobind"></script>
  <script src="../../js/pg-prd-float.js?v=20260828-537"></script>
  <script>
    if (window.UaStoreSwitch) UaStoreSwitch.initSwitchPage();
  </script>
</body>
</html>
