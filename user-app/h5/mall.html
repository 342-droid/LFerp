<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>商城 · 用户 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-profile.css">
  <link rel="stylesheet" href="../css/user-app-shop.css?v=20260723-goods">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-mall-page">
    <div class="ua-mp-capsule" aria-hidden="true">
      <span class="ua-mp-capsule__dots"><i></i><i></i><i></i></span>
      <span class="ua-mp-capsule__ring"></span>
    </div>

    <div class="ua-scroll" id="mallScroll">
      <div class="ua-mall-sticky">
        <header class="ua-mall-head" id="mallHead">
          <form class="ua-mall-search" role="search" onsubmit="return false;">
            <svg class="ua-mall-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
            <input type="search" class="ua-mall-search__input" placeholder="搜索商品" autocomplete="off">
            <button type="button" class="ua-mall-search__btn" id="mallSearchBtn">搜索</button>
          </form>
          <div class="ua-mall-promises">
            <span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.4 4.8L20 9l-4 3.9.9 5.6L12 16.2 7.1 18.5 8 12.9 4 9l5.6-1.2L12 3z"/></svg>
              品质特选
            </span>
            <span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2L4 14h7l-1 8 10-14h-7l0-6z"/></svg>
              争鲜速达
            </span>
            <span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v5c0 4.5-2.8 7.8-7 9-4.2-1.2-7-4.5-7-9V6l7-3z"/><path d="M9.5 12l2 2 3.5-3.5"/></svg>
              售后无忧
            </span>
          </div>
        </header>
      </div>

      <a class="ua-mall-banner" href="#">
        <img src="../assets/shop/banner-featured.svg" alt="冷丰特选">
      </a>

      <section class="ua-mall-cats" aria-label="商品分类">
        <button type="button" class="ua-mall-cat"><img src="../assets/shop/cat-daily.svg" alt=""><span>日用百货</span></button>
        <button type="button" class="ua-mall-cat"><img src="../assets/shop/cat-meat.svg" alt=""><span>肉禽蛋品</span></button>
        <button type="button" class="ua-mall-cat"><img src="../assets/shop/cat-dairy.svg" alt=""><span>乳品烘焙</span></button>
        <button type="button" class="ua-mall-cat"><img src="../assets/shop/cat-seafood.svg" alt=""><span>水产生鲜</span></button>
        <button type="button" class="ua-mall-cat"><img src="../assets/shop/cat-veg.svg" alt=""><span>蔬菜水果</span></button>
        <button type="button" class="ua-mall-cat"><img src="../assets/shop/cat-snack.svg" alt=""><span>休闲零食</span></button>
        <button type="button" class="ua-mall-cat"><img src="../assets/shop/cat-grain.svg" alt=""><span>粮油调味</span></button>
        <button type="button" class="ua-mall-cat"><img src="../assets/shop/cat-test.svg" alt=""><span>生产测试商</span></button>
      </section>

      <div class="ua-mall-subtabs-wrap">
        <div class="ua-mall-subtabs" role="tablist">
          <button type="button" class="ua-mall-subtab">精选</button>
          <button type="button" class="ua-mall-subtab">冷丰溯源</button>
          <button type="button" class="ua-mall-subtab">安心认证</button>
          <button type="button" class="ua-mall-subtab is-active">测试商品</button>
        </div>
      </div>

      <section class="ua-mall-products">
        <article class="ua-mall-product" data-goods-id="beef-tendon">
          <div class="ua-mall-product__img">
            <img src="../assets/shop/beef-hero.svg" alt="精选金钱牛腱子肉">
          </div>
          <div class="ua-mall-product__body">
            <h3 class="ua-mall-product__name">精选金钱牛腱子肉</h3>
            <div class="ua-mall-product__row">
              <span class="ua-mall-product__price"><small>¥</small>96.80</span>
              <button type="button" class="ua-mall-product__add" data-add-product="beef-tendon" aria-label="加入购物车"></button>
            </div>
          </div>
        </article>

        <article class="ua-mall-product" data-goods-id="dumpling">
          <div class="ua-mall-product__img">
            <img src="../assets/shop/product-dumpling.svg" alt="饺子">
            <span class="ua-shop-watermark">生产验证商品<br>请勿下单</span>
          </div>
          <div class="ua-mall-product__body">
            <h3 class="ua-mall-product__name">饺子</h3>
            <div class="ua-mall-product__row">
              <span class="ua-mall-product__price"><small>¥</small>16.00</span>
              <button type="button" class="ua-mall-product__add" data-add-product="dumpling" aria-label="加入购物车"></button>
            </div>
          </div>
        </article>

        <article class="ua-mall-product" data-goods-id="wonton-pork">
          <div class="ua-mall-product__img">
            <img src="../assets/shop/product-wonton-pork.svg" alt="猪肉雪菜笋丁云吞">
          </div>
          <div class="ua-mall-product__body">
            <h3 class="ua-mall-product__name">猪肉雪菜笋丁云吞</h3>
            <div class="ua-mall-product__row">
              <span class="ua-mall-product__price"><small>¥</small>12.00</span>
              <button type="button" class="ua-mall-product__add" data-add-product="wonton-pork" aria-label="加入购物车"></button>
            </div>
          </div>
        </article>

        <article class="ua-mall-product" data-goods-id="wonton-corn">
          <div class="ua-mall-product__img">
            <img src="../assets/shop/product-wonton-corn.svg" alt="黑猪肉玉米云吞">
          </div>
          <div class="ua-mall-product__body">
            <h3 class="ua-mall-product__name">黑猪肉玉米云吞</h3>
            <div class="ua-mall-product__row">
              <span class="ua-mall-product__price"><small>¥</small>12.00</span>
              <button type="button" class="ua-mall-product__add" data-add-product="wonton-corn" aria-label="加入购物车"></button>
            </div>
          </div>
        </article>

        <article class="ua-mall-product" data-goods-id="duck-mix">
          <div class="ua-mall-product__img">
            <img src="../assets/shop/product-duck-mix.svg" alt="鸭杂复合包">
          </div>
          <div class="ua-mall-product__body">
            <h3 class="ua-mall-product__name">鸭杂复合包</h3>
            <div class="ua-mall-product__row">
              <span class="ua-mall-product__price"><small>¥</small>3.00</span>
              <button type="button" class="ua-mall-product__add" data-add-product="duck-mix" aria-label="加入购物车"></button>
            </div>
          </div>
        </article>
      </section>
    </div>

    <nav class="user-app-tabbar ua-shop-tabbar">
      <a href="home.html" class="ua-tab">
        <span class="ua-tab-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-8.5z"/></svg>
        </span>
        <span>首页</span>
      </a>
      <span class="ua-tab ua-tab--active">
        <span class="ua-tab-icon-wrap">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 8h14l-1 12H6L5 8zm3-1V6a4 4 0 018 0v1h-2V6a2 2 0 10-4 0v1H8z"/></svg>
        </span>
        <span>商城</span>
      </span>
      <a href="cart.html" class="ua-tab">
        <span class="ua-tab-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/><path d="M3 4h2l2.2 11h9.6L19 8H7"/></svg>
          <span class="ua-tab-badge" data-ua-cart-badge hidden></span>
        </span>
        <span>购物车</span>
      </a>
      <a href="profile.html" class="ua-tab">
        <span class="ua-tab-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>
        </span>
        <span>我的</span>
      </a>
    </nav>
  </div>
  <script src="../js/user-app-shop.js?v=20260723-goods"></script>
  <script>UAShop.initMallPage();</script>
</body>
</html>
