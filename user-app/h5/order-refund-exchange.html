<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>换货 · 用户 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-order-refund.css">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-order-refund-page">
    <div class="ua-mp-capsule" aria-hidden="true">
      <span class="ua-mp-capsule__dots"><i></i><i></i><i></i></span>
      <span class="ua-mp-capsule__ring"></span>
    </div>

    <div class="ua-scroll ua-or-scroll">
      <div class="ua-status-bar">
        <span>9:41</span>
        <span class="ua-status-bar__icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="#111"><path d="M1 7h2v4H1V7zm4-2h2v6H5V5zm4-3h2v9H9V2zm4 5h2v4h-2V7z"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#111"/></svg>
        </span>
      </div>

      <header class="ua-or-nav">
        <a href="order-refund-select.html" class="ua-or-nav__back" id="refundNavBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <h1 class="ua-or-nav__title" id="refundNavTitle">换货</h1>
        <div class="ua-or-nav__actions">
          <button type="button" class="ua-or-nav__icon" aria-label="更多">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
        </div>
      </header>

      <section class="ua-or-card ua-or-product" id="refundProductCard"></section>

      <div class="ua-or-goods-tip" role="note">
        请确保退回商品完好(包含赠品配件，未拆封/使用/标签损坏)
      </div>

      <section class="ua-or-block">
        <h2 class="ua-or-block__title">原商品信息</h2>
        <div class="ua-or-card ua-or-form">
          <div class="ua-or-field-row">
            <span class="ua-or-field__label">原商品规格</span>
            <span class="ua-or-field__value" id="refundExchangeSourceSpec">—</span>
          </div>
          <div class="ua-or-field-row">
            <span class="ua-or-field__label">原商品数量</span>
            <span class="ua-or-field__value" id="refundExchangeSourceQty">—</span>
          </div>
        </div>
      </section>

      <section class="ua-or-card ua-or-form">
        <button type="button" class="ua-or-field" id="refundReasonRow">
          <span class="ua-or-field__label">换货原因<span class="ua-or-required">*</span></span>
          <span class="ua-or-field__value ua-or-field__value--placeholder" id="refundReasonValue">请选择</span>
          <span class="ua-or-field__arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
        </button>
        <button type="button" class="ua-or-field ua-or-field--evidence" id="refundEvidenceToggle">
          <span class="ua-or-field__label">上传描述和凭证</span>
          <span class="ua-or-field__value ua-or-field__value--placeholder" id="refundEvidenceHint">上传有助处理售后</span>
          <span class="ua-or-field__arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
        </button>
        <div class="ua-or-evidence-panel" id="refundEvidencePanel" hidden>
          <div class="ua-or-desc ua-or-desc--embedded">
            <textarea id="refundDescInput" maxlength="200" placeholder="补充描述，有助于平台更好的处理售后问题"></textarea>
            <div class="ua-or-desc__count"><span id="refundDescCount">0</span>/200</div>
          </div>
          <div class="ua-or-upload ua-or-upload--embedded">
            <div class="ua-or-upload__grid" id="refundUploadGrid"></div>
          </div>
        </div>
      </section>

      <section class="ua-or-block">
        <h2 class="ua-or-block__title">换成<span class="ua-or-required">*</span></h2>
        <div class="ua-or-card">
          <p class="ua-or-exchange-hint" id="refundExchangeHint"></p>
          <div class="ua-or-spec-chips" id="refundExchangeTargetList"></div>
          <div class="ua-or-field-row ua-or-exchange-qty-row">
            <span class="ua-or-field__label">换货数量</span>
            <div class="ua-or-stepper">
              <button type="button" id="refundExchangeTargetQtyMinus" aria-label="减少">-</button>
              <input type="number" id="refundExchangeTargetQty" value="1" min="1" readonly tabindex="-1">
              <button type="button" id="refundExchangeTargetQtyPlus" aria-label="增加">+</button>
            </div>
          </div>
        </div>
      </section>

      <section class="ua-or-card ua-or-return-method" id="refundReturnMethodCard">
        <button type="button" class="ua-or-field" id="refundReturnMethodRow">
          <span class="ua-or-field__label">退货方式</span>
          <span class="ua-or-field__value" id="refundReturnMethodValue">快递上门取货</span>
          <span class="ua-or-field__arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
        </button>
        <div class="ua-or-pickup-fields" id="refundPickupFields">
          <button type="button" class="ua-or-field" id="refundPickupAddressRow">
            <span class="ua-or-field__label">取件地址</span>
            <span class="ua-or-field__value ua-or-field__value--multi" id="refundPickupAddressValue">
              <em id="refundPickupAddressText">杭州市 西湖区文三路168号</em>
              <small id="refundPickupContactText">刘十九 13800001987</small>
            </span>
            <span class="ua-or-field__arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
          </button>
          <button type="button" class="ua-or-field" id="refundPickupTimeRow">
            <span class="ua-or-field__label">上门时间<span class="ua-or-required">*</span></span>
            <span class="ua-or-field__value ua-or-field__value--placeholder" id="refundPickupTimeValue">请选择上门时间</span>
            <span class="ua-or-field__arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
          </button>
        </div>
        <label class="ua-or-auth-waybill" id="refundAuthWaybillRow">
          <input type="checkbox" id="refundAuthWaybill" checked>
          <span class="ua-or-auth-waybill__box" aria-hidden="true"></span>
          <span class="ua-or-auth-waybill__text">授权商家填写运单号</span>
        </label>
      </section>
    </div>

    <footer class="ua-or-footer">
      <button type="button" class="ua-or-footer__btn" id="refundSubmitBtn">提交</button>
    </footer>

    <div class="ua-or-sheet" id="refundReasonSheet" hidden>
      <div class="ua-or-sheet__mask" data-or-sheet-close="refundReasonSheet"></div>
      <div class="ua-or-sheet__panel">
        <h3 class="ua-or-sheet__title">换货原因</h3>
        <div class="ua-or-picker__list" id="refundReasonList"></div>
        <button type="button" class="ua-or-sheet__confirm" id="refundReasonConfirm">确定</button>
      </div>
    </div>

    <div class="ua-or-sheet" id="refundReturnMethodSheet" hidden>
      <div class="ua-or-sheet__mask" data-or-sheet-close="refundReturnMethodSheet"></div>
      <div class="ua-or-sheet__panel">
        <h3 class="ua-or-sheet__title">退货方式</h3>
        <div class="ua-or-picker__list" id="refundReturnMethodList"></div>
        <button type="button" class="ua-or-sheet__confirm" id="refundReturnMethodConfirm">确定</button>
      </div>
    </div>

    <div class="ua-or-sheet" id="refundPickupAddressSheet" hidden>
      <div class="ua-or-sheet__mask" data-or-sheet-close="refundPickupAddressSheet"></div>
      <div class="ua-or-sheet__panel">
        <h3 class="ua-or-sheet__title">取件地址</h3>
        <div class="ua-or-picker__list" id="refundPickupAddressList"></div>
        <button type="button" class="ua-or-sheet__confirm" id="refundPickupAddressConfirm">确定</button>
      </div>
    </div>

    <div class="ua-or-sheet" id="refundPickupTimeSheet" hidden>
      <div class="ua-or-sheet__mask" data-or-sheet-close="refundPickupTimeSheet"></div>
      <div class="ua-or-sheet__panel ua-or-pickup-time-panel">
        <div class="ua-or-pickup-time-panel__head">
          <h3 class="ua-or-pickup-time-panel__title">选择上门时间段</h3>
          <button type="button" class="ua-or-sheet__close" data-or-sheet-close="refundPickupTimeSheet" aria-label="关闭">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="ua-or-pickup-time-panel__notice">
          <span class="ua-or-pickup-time-panel__notice-icon" aria-hidden="true">i</span>
          <span>请选择上门时间，可随时修改取消</span>
        </div>
        <div class="ua-or-pickup-time-panel__body">
          <div class="ua-or-pickup-cal" id="refundPickupCal">
            <div class="ua-or-pickup-cal__month" id="refundPickupCalMonth"></div>
            <div class="ua-or-pickup-cal__weekdays">
              <span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span>
            </div>
            <div class="ua-or-pickup-cal__grid" id="refundPickupCalGrid"></div>
          </div>
          <div class="ua-or-pickup-slots" id="refundPickupTimeList"></div>
        </div>
        <button type="button" class="ua-or-pickup-time-panel__confirm" id="refundPickupTimeConfirm">请选择上门时间</button>
      </div>
    </div>
  </div>
  <script src="../js/user-app-order-refund.js?v=20260717-pickup"></script>
  <script>UAOrderRefund.initExchangePage();</script>
</body>
</html>
