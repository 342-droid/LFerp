<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>设置支付密码 · 门店 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-store-pay-password.css?v=20260805-hint">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-pp-page">
    <div class="ua-mp-capsule" aria-hidden="true">
      <span class="ua-mp-capsule__dots"><i></i><i></i><i></i></span>
      <span class="ua-mp-capsule__ring"></span>
    </div>

    <header class="ua-pp-nav">
      <a href="store-wallet.html" class="ua-pp-nav__back" id="ppBack" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <h1 class="ua-pp-nav__title" id="ppTitle">设置支付密码</h1>
    </header>

    <!-- 设置 / 重置密码 -->
    <div class="ua-pp-body" id="ppStepSet">
      <p class="ua-pp-tip" id="ppTip" hidden>首次提现，需设置支付密码</p>
      <p class="ua-pp-lead" id="ppLead">设置您的支付密码</p>
      <div class="ua-pp-fields" id="ppFields"></div>
      <button type="button" class="ua-pp-submit" id="ppSubmit" disabled>确定</button>
    </div>

    <!-- 短信验证 -->
    <div class="ua-pp-body" id="ppStepSms" hidden>
      <p class="ua-pp-lead">短信验证码已发送至:</p>
      <p class="ua-pp-phone" id="ppPhone">+86 138****8001</p>
      <p class="ua-pp-demo-hint" id="ppSmsDemoHint">演示验证码：123456</p>
      <div class="ua-pp-field">
        <span class="ua-pp-field__label">请输入短信验证码</span>
        <div class="ua-pp-field__row is-sms">
          <div class="ua-pp-field__slots" id="ppSmsSlots"></div>
          <button type="button" class="ua-pp-sms-cd" id="ppSmsCd" disabled>60S</button>
        </div>
      </div>
      <button type="button" class="ua-pp-submit" id="ppSmsNext" disabled>下一步</button>
    </div>

    <!-- 输入支付密码（校验） -->
    <div class="ua-pp-body" id="ppStepVerify" hidden>
      <p class="ua-pp-lead">请输入支付密码</p>
      <div class="ua-pp-fields" id="ppVerifyFields"></div>
      <button type="button" class="ua-pp-forgot" id="ppForgot">忘记密码？</button>
      <button type="button" class="ua-pp-submit" id="ppVerifyOk" disabled>确定</button>
    </div>

    <div class="ua-pp-keypad" id="ppKeypad" aria-label="数字键盘">
      <button type="button" data-key="1"><span class="ua-pp-keypad__num">1</span></button>
      <button type="button" data-key="2"><span class="ua-pp-keypad__num">2</span><span class="ua-pp-keypad__sub">ABC</span></button>
      <button type="button" data-key="3"><span class="ua-pp-keypad__num">3</span><span class="ua-pp-keypad__sub">DEF</span></button>
      <button type="button" data-key="4"><span class="ua-pp-keypad__num">4</span><span class="ua-pp-keypad__sub">GHI</span></button>
      <button type="button" data-key="5"><span class="ua-pp-keypad__num">5</span><span class="ua-pp-keypad__sub">JKL</span></button>
      <button type="button" data-key="6"><span class="ua-pp-keypad__num">6</span><span class="ua-pp-keypad__sub">MNO</span></button>
      <button type="button" data-key="7"><span class="ua-pp-keypad__num">7</span><span class="ua-pp-keypad__sub">PQRS</span></button>
      <button type="button" data-key="8"><span class="ua-pp-keypad__num">8</span><span class="ua-pp-keypad__sub">TUV</span></button>
      <button type="button" data-key="9"><span class="ua-pp-keypad__num">9</span><span class="ua-pp-keypad__sub">WXYZ</span></button>
      <button type="button" class="ua-pp-keypad__empty" disabled aria-hidden="true"></button>
      <button type="button" data-key="0"><span class="ua-pp-keypad__num">0</span></button>
      <button type="button" class="ua-pp-keypad__del" data-key="del" aria-label="删除">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M9 6H20a1 1 0 011 1v10a1 1 0 01-1 1H9l-6-6 6-6z"/>
          <path d="M12 10l4 4M16 10l-4 4"/>
        </svg>
      </button>
    </div>
  </div>

<script src="../js/user-app-blacklist-guard.js"></script>
<script src="../../js/store-wallet-demo.js"></script>
<script src="../../js/store-pay-password.js?v=20260805-sms"></script>
<script src="../js/user-app-store-pay-password.js?v=20260805-reset-back"></script>
</body>
</html>
