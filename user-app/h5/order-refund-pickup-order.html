<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>订单详情 · 用户 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-order-refund.css?v=20260718-detail-fix">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-or-pickup-order-page">
    <div class="ua-mp-capsule" aria-hidden="true">
      <span class="ua-mp-capsule__dots"><i></i><i></i><i></i></span>
      <span class="ua-mp-capsule__ring"></span>
    </div>

    <div class="ua-scroll ua-or-pickup-order-scroll">
      <div class="ua-status-bar ua-status-bar--light">
        <span>9:41</span>
        <span class="ua-status-bar__icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="#fff"><path d="M1 7h2v4H1V7zm4-2h2v6H5V5zm4-3h2v9H9V2zm4 5h2v4h-2V7z"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#fff"/></svg>
        </span>
      </div>

      <header class="ua-or-po-nav">
        <a href="order-refund-detail.html" class="ua-or-po-nav__back" id="pickupOrderBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <h1 class="ua-or-po-nav__title">订单详情</h1>
        <button type="button" class="ua-or-po-nav__share" id="pickupOrderShareNav" aria-label="分享">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="18" cy="5" r="2.2"/>
            <circle cx="6" cy="12" r="2.2"/>
            <circle cx="18" cy="19" r="2.2"/>
            <path d="M8.1 10.9l7.8-4.3M8.1 13.1l7.8 4.3"/>
          </svg>
        </button>
      </header>

      <section class="ua-or-po-status">
        <div class="ua-or-po-status__main">
          <div class="ua-or-po-status__left">
            <button type="button" class="ua-or-po-status__title" id="pickupOrderStatusBtn">
              待上门取件
              <span class="ua-or-po-status__chevron" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>
              </span>
            </button>
            <p class="ua-or-po-status__sub" id="pickupOrderScheduleText">预约明天 09:00-11:00 上门取件</p>
          </div>
          <div class="ua-or-po-code">
            <div class="ua-or-po-code__box">
              <span class="ua-or-po-code__label">寄件码</span>
              <span class="ua-or-po-code__value" id="pickupOrderCode">0030</span>
            </div>
            <button type="button" class="ua-or-po-code__share" id="pickupOrderShareCode">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="18" cy="5" r="2"/>
                <circle cx="6" cy="12" r="2"/>
                <circle cx="18" cy="19" r="2"/>
                <path d="M8.1 10.9l7.8-4.3M8.1 13.1l7.8 4.3"/>
              </svg>
              分享
            </button>
          </div>
        </div>

        <div class="ua-or-po-guard">
          <div class="ua-or-po-guard__left">
            <span class="ua-or-po-guard__avatar" aria-hidden="true">
              <svg viewBox="0 0 40 40" width="36" height="36">
                <circle cx="20" cy="20" r="20" fill="#ffd7b8"/>
                <circle cx="20" cy="16" r="8" fill="#ff8a3d"/>
                <ellipse cx="20" cy="30" rx="11" ry="7" fill="#ff6a00"/>
                <rect x="12" y="8" width="16" height="5" rx="2" fill="#ff6a00"/>
                <circle cx="17" cy="15" r="1.2" fill="#333"/>
                <circle cx="23" cy="15" r="1.2" fill="#333"/>
                <path d="M17 19c1.2 1.2 4.8 1.2 6 0" stroke="#333" stroke-width="1.2" fill="none" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="ua-or-po-guard__text">官方退货提供全程保障</span>
          </div>
          <div class="ua-or-po-guard__actions">
            <button type="button" class="ua-or-po-guard__urge" id="pickupOrderUrgeBtn">催一催</button>
            <a class="ua-or-po-guard__phone" id="pickupOrderPhoneBtn" href="tel:4008001234" aria-label="联系快递员">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M7.2 3.8h3.1l1.2 4.2-2 1.2a12.5 12.5 0 005.3 5.3l1.2-2 4.2 1.2v3.1c0 .8-.4 1.5-1.2 1.8A16.6 16.6 0 015.4 5c.3-.8 1-.1.2-1.2z"/>
              </svg>
            </a>
          </div>
        </div>
      </section>

      <section class="ua-or-po-actions">
        <button type="button" class="ua-or-po-actions__item" id="pickupOrderEditBtn">
          <span class="ua-or-po-actions__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M5 19h4l10-10a2 2 0 00-3-3L6 16v3z"/>
              <path d="M13 6l3 3"/>
            </svg>
          </span>
          <span>修改信息</span>
        </button>
        <button type="button" class="ua-or-po-actions__item" id="pickupOrderHandoverBtn">
          <span class="ua-or-po-actions__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="4" y="8" width="16" height="11" rx="1.5"/>
              <path d="M8 8V6.5A2.5 2.5 0 0110.5 4h3A2.5 2.5 0 0116 6.5V8"/>
            </svg>
            <i class="ua-or-po-actions__dot"></i>
          </span>
          <span>交件方式</span>
        </button>
        <button type="button" class="ua-or-po-actions__item" id="pickupOrderCancelBtn">
          <span class="ua-or-po-actions__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="12" cy="12" r="8"/>
              <path d="M9 9l6 6M15 9l-6 6"/>
            </svg>
          </span>
          <span>取消寄件</span>
        </button>
        <button type="button" class="ua-or-po-actions__item" id="pickupOrderPayBtn">
          <span class="ua-or-po-actions__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="12" cy="12" r="8"/>
              <path d="M12 7v10M9.5 9.5c.6-.8 1.5-1.2 2.5-1.2 1.4 0 2.5.8 2.5 2s-1.1 2-2.5 2h-1c-1.4 0-2.5.8-2.5 2s1.1 2 2.5 2c1 0 1.9-.4 2.5-1.2"/>
            </svg>
          </span>
          <span>支付</span>
        </button>
        <button type="button" class="ua-or-po-actions__item" id="pickupOrderCsBtn">
          <span class="ua-or-po-actions__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M5 13v-2a7 7 0 0114 0v2"/>
              <rect x="3.5" y="12" width="4" height="5.5" rx="1.5"/>
              <rect x="16.5" y="12" width="4" height="5.5" rx="1.5"/>
              <path d="M17 18.5v.5a3 3 0 01-3 3h-1"/>
            </svg>
          </span>
          <span>客服</span>
        </button>
      </section>

      <section class="ua-or-po-card ua-or-po-ship" id="pickupOrderShipCard">
        <div class="ua-or-po-ship__goods" id="pickupOrderGoodsBlock">
          <div class="ua-or-po-ship__goods-left">
            <img class="ua-or-po-ship__thumb" id="pickupOrderGoodsImg" src="../assets/order-product-1.svg" alt="">
            <span class="ua-or-po-ship__goods-text" id="pickupOrderGoodsText">天猫退货 | 1件</span>
          </div>
          <button type="button" class="ua-or-po-ship__goods-link" id="pickupOrderGoodsLink">
            查看退货商品详情
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>

        <div class="ua-or-po-ship__addrs" id="pickupOrderAddrBlock">
          <div class="ua-or-po-ship__addr">
            <span class="ua-or-po-ship__tag ua-or-po-ship__tag--send">寄</span>
            <div class="ua-or-po-ship__addr-body">
              <div class="ua-or-po-ship__contact" id="pickupOrderSendContact">林晓棠 13856781234</div>
              <div class="ua-or-po-ship__line" id="pickupOrderSendAddr">浙江省杭州市西湖区西溪花园...</div>
            </div>
          </div>
          <div class="ua-or-po-ship__addr">
            <span class="ua-or-po-ship__tag ua-or-po-ship__tag--recv">收</span>
            <div class="ua-or-po-ship__addr-body">
              <div class="ua-or-po-ship__contact" id="pickupOrderRecvContact">马小羊 18915686957</div>
              <div class="ua-or-po-ship__line" id="pickupOrderRecvAddr">江苏省苏州市张家港市后塍街道 健康南路 12号</div>
            </div>
          </div>
        </div>

        <div class="ua-or-po-ship__meta" id="pickupOrderMetaBlock">
          <div class="ua-or-po-ship__meta-row">
            <span>订单编号</span>
            <span class="ua-or-po-ship__meta-val">
              <span id="pickupOrderNo">22281689699248315</span>
              <button type="button" class="ua-or-po-ship__copy" id="pickupOrderCopyBtn">复制</button>
            </span>
          </div>
          <div class="ua-or-po-ship__meta-row">
            <span>下单时间</span>
            <span class="ua-or-po-ship__meta-val" id="pickupOrderTime">2026-07-17 13:53:44</span>
          </div>
        </div>

        <button type="button" class="ua-or-po-ship__toggle" id="pickupOrderToggleBtn">
          收起
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 14l6-6 6 6"/></svg>
        </button>
      </section>

      <section class="ua-or-po-card ua-or-po-rights">
        <h2 class="ua-or-po-rights__title">官方退货平台权益</h2>
        <div class="ua-or-po-rights__item">
          <div class="ua-or-po-rights__icon-wrap">
            <span class="ua-or-po-rights__badge">保障中</span>
            <span class="ua-or-po-rights__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M12 3l7 3v5c0 4.5-2.8 7.8-7 9-4.2-1.2-7-4.5-7-9V6l7-3z"/>
                <path d="M9.5 12l2 2 3.5-3.5"/>
              </svg>
            </span>
          </div>
          <div class="ua-or-po-rights__copy">
            <div class="ua-or-po-rights__name">丢损必赔</div>
            <div class="ua-or-po-rights__desc">丢件全额赔偿</div>
          </div>
        </div>
      </section>
    </div>

    <div class="ua-or-toast" id="refundDetailToast" hidden></div>
  </div>
  <script src="../js/user-app-order-refund.js?v=20260718-detail-fix"></script>
  <script>UAOrderRefund.initPickupOrderPage();</script>
</body>
</html>
