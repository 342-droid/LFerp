<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>修改地址 · 用户 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-order-edit-address.css?v=20260907-no-more">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-oea-page">
    <div class="ua-mp-capsule" aria-hidden="true">
      <span class="ua-mp-capsule__dots"><i></i><i></i><i></i></span>
      <span class="ua-mp-capsule__ring"></span>
    </div>

    <div class="ua-scroll ua-oea-scroll">
      <div class="ua-status-bar">
        <span>9:41</span>
        <span class="ua-status-bar__icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="#111"><path d="M1 7h2v4H1V7zm4-2h2v6H5V5zm4-3h2v9H9V2zm4 5h2v4h-2V7z"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="20" height="11" rx="2.5" stroke="#111" opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#111"/></svg>
        </span>
      </div>

      <header class="ua-oea-nav">
        <a href="order-detail.html" class="ua-oea-nav__back" id="oeaBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <h1 class="ua-oea-nav__title">修改地址</h1>
      </header>

      <div class="ua-oea-tip" role="note">
        <span class="ua-oea-tip__icon" aria-hidden="true">i</span>
        <p>修改后会影响物流时效、送货上门等服务，只能原价修改。商家接单后不可再改。若因商品换仓、已发货、运费变更等原因导致修改失败，请您谅解。</p>
      </div>

      <section class="ua-oea-section">
        <h2 class="ua-oea-section__title">原地址</h2>
        <div class="ua-oea-origin" id="oeaOrigin"></div>
      </section>

      <section class="ua-oea-section ua-oea-section--list">
        <h2 class="ua-oea-section__title">选择新的收货地址</h2>
        <div class="ua-oea-list" id="oeaList"></div>
      </section>
    </div>

    <footer class="ua-oea-footer">
      <button type="button" class="ua-oea-footer__btn" id="oeaSubmit">提交修改</button>
    </footer>

    <div class="ua-oea-toast" id="oeaToast" hidden></div>
  </div>
  <script src="../js/user-app-blacklist-guard.js"></script>
  <script src="../js/user-app-order-refund.js?v=20260907-edit-addr-page"></script>
  <script src="../js/user-app-order-edit-address.js?v=20260907-exclude-origin"></script>
</body>
</html>
