<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>黑灯直播间 · 用户 APP</title>
  <link rel="stylesheet" href="../css/user-app-shell.css">
  <link rel="stylesheet" href="../css/user-app-profile.css">
  <link rel="stylesheet" href="../css/user-app-shop.css?v=20260823-task-add">
  <link rel="stylesheet" href="../css/user-app-live-entry-fx.css">
  <link rel="stylesheet" href="../css/user-app-feedback.css">
</head>
<body class="user-app-body">
  <div class="ua-mobile-shell ua-live-room-page">
    <div class="ua-mp-capsule ua-mp-capsule--light" aria-hidden="true">
      <span class="ua-mp-capsule__dots"><i></i><i></i><i></i></span>
      <span class="ua-mp-capsule__ring"></span>
    </div>

    <div class="ua-live-room">
      <div class="ua-live-room__stage" aria-hidden="true"></div>

      <header class="ua-live-room__top">
        <a href="home.html" class="ua-live-room__back" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <div class="ua-live-room__host">
          <span class="ua-live-room__logo">冷丰<br>特选</span>
          <div class="ua-live-room__host-text">
            <span class="ua-live-room__name">黑灯直播间</span>
            <span class="ua-live-room__viewers" id="liveViewerCount">1人正在观看</span>
          </div>
        </div>
      </header>

      <button type="button" class="ua-live-room__report" id="liveReportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ff4d3a" stroke-width="1.8">
          <path d="M12 4l9 16H3L12 4z"/>
          <path d="M12 10v5" stroke-linecap="round"/>
          <circle cx="12" cy="17.5" r="1" fill="#ff4d3a" stroke="none"/>
        </svg>
        举报
      </button>

      <div class="ua-live-fx-demo" id="liveFxDemo" aria-label="进场特效演示">
        <button type="button" class="ua-live-fx-demo__btn" data-fx="banner">欢迎横幅</button>
        <button type="button" class="ua-live-fx-demo__btn" data-fx="vehicle">进场座驾</button>
        <button type="button" class="ua-live-fx-demo__btn" data-fx="fullscreen">全屏特效</button>
      </div>

      <div class="ua-live-room__center">
        <span class="ua-live-room__live">
          <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><rect x="4" y="10" width="2.5" height="4"/><rect x="8" y="7" width="2.5" height="10"/><rect x="12" y="5" width="2.5" height="14"/><rect x="16" y="8" width="2.5" height="8"/></svg>
          直播中
        </span>
      </div>

      <div class="ua-live-room__box" aria-hidden="true"></div>

      <div class="ua-live-explain" id="liveExplainCard" hidden>
        <span class="ua-live-explain__tag">讲解中</span>
        <div class="ua-live-explain__thumb" id="liveExplainThumb"></div>
        <div class="ua-live-explain__body">
          <div class="ua-live-explain__name" id="liveExplainName"></div>
          <div class="ua-live-explain__price" id="liveExplainPrice"></div>
        </div>
        <button type="button" class="ua-live-explain__buy" id="liveExplainBuy">去抢购</button>
      </div>

      <div class="ua-live-danmu-pin" id="liveDanmuPin" hidden></div>

      <div class="ua-live-danmu" id="liveDanmuList" aria-live="polite"></div>

      <div class="ua-live-fx-host" id="liveEntryFxHost" hidden aria-hidden="true"></div>

      <footer class="ua-live-room__bar">
        <div class="ua-live-quick-comments" id="liveQuickComments" hidden></div>
        <div class="ua-live-room__bar-row">
        <button type="button" class="ua-live-room__like" id="liveLikeBtn" aria-label="点赞">
          <svg viewBox="0 0 24 24" fill="#ff4da6"><path d="M2 12.5V21h4.5V12.5H2zm5.5-.3l3.2-6.5c.4-.8 1.4-1.2 2.3-.9.7.3 1.1 1 1.1 1.8V10H20c1.3 0 2.3 1.2 2.1 2.5l-1.1 6C20.7 20 19.5 21 18.1 21H7.5V12.2z"/></svg>
        </button>
        <div class="ua-live-room__input-wrap">
          <input type="text" class="ua-live-room__input" id="liveCommentInput" placeholder="说点什么..." autocomplete="off">
          <button type="button" class="ua-live-room__send" id="liveSendBtn">发送</button>
        </div>
        <button type="button" class="ua-live-room__action" id="liveShareBtn" aria-label="分享">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v11"/><path d="M8 7l4-4 4 4"/><path d="M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg>
        </button>
        <button type="button" class="ua-live-room__cart" id="liveCartBtn" aria-label="购物车">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.1 10.5h9.8L19 8H7"/></svg>
        </button>
        </div>
      </footer>
    </div>

    <!-- 图一：商品列表半遮罩 -->
    <div class="ua-live-sheet" id="liveGoodsSheet" hidden>
      <div class="ua-live-sheet__mask" data-live-close="goods"></div>
      <div class="ua-live-sheet__panel ua-live-goods">
        <div class="ua-live-goods__toolbar">
          <label class="ua-live-goods__search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
            <input type="search" id="liveGoodsSearch" placeholder="输入商品关键词" autocomplete="off">
          </label>
          <div class="ua-live-goods__tools">
            <button type="button" class="ua-live-goods__tool" id="liveCouponBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8.5A2.5 2.5 0 015.5 6H19a2 2 0 012 2v1.2a2.2 2.2 0 000 4.4V17a2 2 0 01-2 2H5.5A2.5 2.5 0 013 16.5v-8z"/><text x="9" y="15" fill="currentColor" stroke="none" font-size="9" font-weight="700">¥</text></svg>
              <span>优惠券</span>
            </button>
            <button type="button" class="ua-live-goods__tool" id="liveOrderBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 3h10a2 2 0 012 2v16l-3.5-2-3.5 2-3.5-2L5 21V5a2 2 0 012-2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
              <span>订单</span>
            </button>
          </div>
        </div>
        <div class="ua-live-goods__tabs">
          <button type="button" class="ua-live-goods__tab is-active">全部</button>
        </div>
        <div class="ua-live-goods__list" id="liveGoodsList"></div>
        <div class="ua-live-goods__footer">
          <div class="ua-live-goods__total" id="liveGoodsTotal">¥0.00</div>
          <button type="button" class="ua-live-goods__checkout" id="liveGoodsCheckout">立即下单</button>
        </div>
      </div>
    </div>

    <!-- 直播商品详情半屏：内容沿用商品详情页，仅改为底部半屏承载 -->
    <div class="ua-live-sheet ua-live-sheet--detail" id="liveDetailSheet" hidden>
      <div class="ua-live-sheet__mask" data-live-close="detail"></div>
      <div class="ua-live-sheet__panel ua-live-gd">
        <div class="ua-scroll ua-gd-scroll" id="goodsDetailScroll">
          <section class="ua-gd-hero">
            <a href="#" class="ua-gd-hero__back" id="goodsDetailBack" aria-label="返回">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>
            </a>
            <img class="ua-gd-hero__img" id="goodsDetailHero" src="" alt="">
            <span class="ua-live-goods__preview-badge ua-gd-hero__preview-badge" id="goodsDetailPreviewBadge" hidden>预告中</span>
            <span class="ua-sale-unsaleable-badge ua-gd-hero__unsaleable-badge" id="goodsDetailUnsaleableBadge" hidden>今日不可售</span>
            <div class="ua-gd-hero__tags" id="goodsDetailTags"></div>
          </section>

          <section class="ua-gd-info">
            <div class="ua-gd-info__price-row">
              <div class="ua-gd-info__prices">
                <span class="ua-gd-info__price" id="goodsDetailPrice"></span>
                <span class="ua-gd-info__origin" id="goodsDetailOrigin" hidden></span>
              </div>
              <span class="ua-gd-info__sold" id="goodsDetailSold"></span>
            </div>
            <h1 class="ua-gd-info__title" id="goodsDetailTitle"></h1>
            <p class="ua-gd-info__service" id="goodsDetailService"></p>
          </section>

          <section class="ua-gd-card ua-gd-rows">
            <button type="button" class="ua-gd-row" id="goodsDetailFulfillRow">
              <span class="ua-gd-row__label">配送</span>
              <span class="ua-gd-row__value" id="goodsDetailFulfillText"></span>
              <svg class="ua-gd-row__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>
            <button type="button" class="ua-gd-row" id="goodsDetailSpecRow">
              <span class="ua-gd-row__label">规格</span>
              <span class="ua-gd-row__value ua-gd-row__value--ellipsis" id="goodsDetailSpecValue"></span>
              <span class="ua-gd-row__more">共<span id="goodsDetailSpecCount">1</span>款</span>
              <svg class="ua-gd-row__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </section>

          <section class="ua-gd-card ua-gd-merchant" id="goodsDetailMerchant">
            <img class="ua-gd-merchant__avatar" id="goodsDetailMerchantAvatar" src="../assets/restock/me-shop-avatar.svg" alt="">
            <div class="ua-gd-merchant__body">
              <div class="ua-gd-merchant__name" id="goodsDetailMerchantName"></div>
              <div class="ua-gd-merchant__meta" id="goodsDetailMerchantMeta"></div>
            </div>
          </section>

          <section class="ua-gd-review">
            <div class="ua-gd-review__head">
              <h2 class="ua-gd-review__title">商品评价 (<span id="goodsDetailReviewCount">0</span>)</h2>
              <button type="button" class="ua-gd-review__more" id="goodsDetailReviewMore">查看更多 <span>›</span></button>
            </div>
            <div class="ua-gd-review__user">
              <img class="ua-gd-review__avatar" src="../assets/shop/review-avatar.svg" alt="">
              <div class="ua-gd-review__user-meta">
                <div class="ua-gd-review__name">宁静致远</div>
                <div class="ua-gd-review__stars" aria-label="5星">
                  <span></span><span></span><span></span><span></span><span></span>
                </div>
              </div>
            </div>
            <p class="ua-gd-review__spec">规格：精选金钱牛腱子肉1kg;</p>
            <p class="ua-gd-review__text">冷丰特选上东西的品质都很好，家里的大人小孩都爱吃，吃完还会回购的。</p>
            <div class="ua-gd-review__photos">
              <img src="../assets/shop/beef-review-1.svg" alt="">
              <img src="../assets/shop/beef-review-2.svg" alt="">
              <img src="../assets/shop/beef-review-3.svg" alt="">
            </div>
          </section>

          <section class="ua-gd-detail">
            <div class="ua-gd-detail__divider"><span>商品详情</span></div>
            <img class="ua-gd-detail__img" id="goodsDetailDetailImg" src="" alt="商品详情">
          </section>
        </div>

        <footer class="ua-gd-footer">
          <button type="button" class="ua-gd-footer__icon" id="goodsDetailServiceBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M4.5 13.5v-1.2a7.5 7.5 0 0115 0v1.2"/>
              <path d="M6.5 13.5v2.2a1.8 1.8 0 001.8 1.8H10v-4H6.5zM14 13.5v4h1.7a1.8 1.8 0 001.8-1.8v-2.2H14z"/>
              <path d="M12 19.5v1"/>
            </svg>
            <span>客服</span>
          </button>
          <a href="cart.html" class="ua-gd-footer__icon ua-gd-footer__icon--cart" id="goodsDetailCartBtn" aria-label="购物车" hidden>
            <span class="ua-gd-footer__icon-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <circle cx="9" cy="20" r="1.5"/>
                <circle cx="17" cy="20" r="1.5"/>
                <path d="M3 4h2l2.2 11h9.6L19 8H7"/>
              </svg>
              <span class="ua-gd-footer__badge" data-ua-cart-badge hidden>0</span>
            </span>
            <span>购物车</span>
          </a>
          <div class="ua-gd-footer__actions">
            <button type="button" class="ua-gd-footer__cart" id="goodsDetailAddCart" hidden>加入购物车</button>
            <button type="button" class="ua-gd-footer__buy" id="goodsDetailBuyNow">立即购买</button>
            <button type="button" class="ua-gd-footer__soon" id="goodsDetailSoon" hidden disabled>即将开售</button>
          </div>
        </footer>

        <div class="ua-gd-sheet" id="goodsDetailSpecSheet" hidden>
          <div class="ua-gd-sheet__mask" data-gd-close="spec"></div>
          <div class="ua-gd-sheet__panel">
            <div class="ua-gd-sheet__head">
              <h3>选择规格</h3>
              <button type="button" class="ua-gd-sheet__close" data-gd-close="spec" aria-label="关闭">×</button>
            </div>
            <div class="ua-gd-sheet__list" id="goodsDetailSpecList"></div>
            <div class="ua-gd-sheet__foot">
              <button type="button" class="ua-gd-sheet__confirm" id="goodsDetailSpecConfirm">确定</button>
            </div>
          </div>
        </div>

        <div class="ua-gd-sheet" id="goodsDetailFulfillSheet" hidden>
          <div class="ua-gd-sheet__mask" data-gd-close="fulfill"></div>
          <div class="ua-gd-sheet__panel">
            <div class="ua-gd-sheet__head">
              <h3>配送说明</h3>
              <button type="button" class="ua-gd-sheet__close" data-gd-close="fulfill" aria-label="关闭">×</button>
            </div>
            <div class="ua-gd-sheet__body" id="goodsDetailFulfillList"></div>
            <div class="ua-gd-sheet__foot">
              <button type="button" class="ua-gd-sheet__confirm" data-gd-close="fulfill">我知道了</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 图二：规格数量选择 -->
    <div class="ua-live-sheet ua-live-sheet--sku" id="liveSkuSheet" hidden>
      <div class="ua-live-sheet__mask" data-live-close="sku"></div>
      <div class="ua-live-sheet__panel ua-live-sku">
        <button type="button" class="ua-live-sku__close" data-live-close="sku" aria-label="关闭">×</button>
        <div class="ua-live-sku__head">
          <img class="ua-live-sku__thumb" id="liveSkuThumb" src="" alt="">
          <div class="ua-live-sku__meta">
            <div class="ua-live-sku__price" id="liveSkuPrice">¥0.00</div>
            <div class="ua-live-sku__name" id="liveSkuName"></div>
            <div class="ua-live-sku__picked" id="liveSkuPicked">已选 </div>
          </div>
        </div>
        <div class="ua-live-sku__section">
          <div class="ua-live-sku__label">规格</div>
          <div class="ua-live-sku__specs" id="liveSkuSpecs"></div>
        </div>
        <div class="ua-live-sku__qty-row">
          <div class="ua-live-sku__label">购买数量</div>
          <div class="ua-live-sku__stepper">
            <button type="button" id="liveSkuMinus">−</button>
            <span id="liveSkuQty">1</span>
            <button type="button" id="liveSkuPlus">+</button>
          </div>
        </div>
        <div class="ua-live-sku__actions">
          <button type="button" class="ua-live-sku__buy" id="liveSkuBuyNow">立即购买</button>
        </div>
      </div>
    </div>

    <!-- 图三：确认订单（字段/逻辑与 order-confirm 全页一致，半遮罩承载） -->
    <div class="ua-live-sheet ua-live-sheet--confirm" id="liveConfirmSheet" hidden>
      <div class="ua-live-sheet__mask" data-live-close="confirm"></div>
      <div class="ua-live-sheet__panel ua-live-confirm">
        <div class="ua-live-confirm__head">
          <h3>确认订单</h3>
          <button type="button" class="ua-live-confirm__close" data-live-close="confirm" aria-label="关闭">×</button>
        </div>
        <div class="ua-live-confirm__body ua-confirm-body" id="liveConfirmBody"></div>
        <div class="ua-live-confirm__footer">
          <div class="ua-live-confirm__pay-text">合计支付 <strong id="liveConfirmPay">¥0.00</strong></div>
          <button type="button" class="ua-live-confirm__pay-btn" id="liveConfirmPayBtn">确认订单</button>
        </div>
      </div>
    </div>

    <!-- 支付弹层：与 order-confirm 全页一致 -->
    <div class="ua-confirm-sheet" id="confirmPaySheet" hidden>
      <div class="ua-confirm-sheet__mask" data-confirm-close="pay"></div>
      <div class="ua-confirm-sheet__panel">
        <button type="button" class="ua-confirm-sheet__close" data-confirm-close="pay" aria-label="关闭">×</button>
        <div class="ua-confirm-pay-sheet__amount" id="confirmPaySheetAmount">¥0.00</div>
        <div class="ua-confirm-pay-sheet__timer">支付剩余时间 <span id="confirmPayTimer">29:59</span></div>
        <div class="ua-confirm-pay-sheet__list">
          <button type="button" class="ua-confirm-pay-sheet__item is-active" data-pay-method="wechat">
            <span class="ua-confirm-pay-sheet__icon ua-confirm-pay-sheet__icon--wechat">微</span>
            <span class="ua-confirm-pay-sheet__name">微信支付</span>
            <span class="ua-shop-check is-checked" aria-hidden="true"></span>
          </button>
          <button type="button" class="ua-confirm-pay-sheet__item" data-pay-method="alipay">
            <span class="ua-confirm-pay-sheet__icon ua-confirm-pay-sheet__icon--alipay">支</span>
            <span class="ua-confirm-pay-sheet__name">支付宝</span>
            <span class="ua-shop-check" aria-hidden="true"></span>
          </button>
        </div>
        <button type="button" class="ua-confirm-pay-sheet__submit" id="confirmPaySubmit">立即支付</button>
      </div>
    </div>

    <div class="ua-shop-toast" id="uaShopToast" hidden></div>
  </div>
  <script src="../js/user-app-blacklist-guard.js"></script>
  <script src="../../js/mdm-supplier-archive-store.js"></script>
  <script src="../../js/mdm-marketing-points-mall-config.js"></script>
  <script src="../js/user-app-orders-store.js?v=20260728-status-sync2"></script>
  <script src="../js/user-app-profile.js"></script>
  <script src="../../js/mdm-aftersale-feedback-store.js"></script>
  <script src="../js/user-app-fb-media.js"></script>
  <script src="../js/user-app-live-report.js"></script>
  <script src="../js/user-app-live-entry-fx.js"></script>
  <script src="../js/user-app-product-sale-time.js?v=20260818-store-rest-sale"></script>
  <script src="../../js/mdm-live-sensitive-words.js"></script>
  <script src="../../js/mdm-live-demo-data.js?v=20260823-task-add"></script>
  <script src="../js/user-app-shop.js?v=20260821-qc2"></script>
  <script src="../js/user-app-live-watch-reward.js?v=20260823-task-add"></script>
  <script src="../../js/pg-prd-float.js?v=20260820-prd3"></script>
  <script>
    UAShop.initLiveRoomPage();
    if (window.UaLiveWatchReward) window.UaLiveWatchReward.init();
  </script>
</body>
</html>
