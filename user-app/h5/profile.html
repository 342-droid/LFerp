      }

      /* 自提门店：展示当前绑定门店（扫码 / 系统默认）；整块可进切换门店 */
      function syncDefaultPickupCard() {
        var card = document.getElementById('uaDefaultPickupCard');
        if (!card) return;
        var store = null;
        if (window.UaStoreSwitch && typeof window.UaStoreSwitch.resolveCurrentStore === 'function') {
          store = window.UaStoreSwitch.resolveCurrentStore(
            window.UaStoreSwitch.readBind ? window.UaStoreSwitch.readBind() : {}
          );
        }
        var ctx =
          window.UaSwitchAddress && typeof window.UaSwitchAddress.readCtx === 'function'
            ? window.UaSwitchAddress.readCtx()
            : null;
        card.hidden = false;

        var nameEl = document.getElementById('uaDefaultPickupName');
        var addrEl = document.getElementById('uaDefaultPickupAddr');
        var leaderEl = document.getElementById('uaDefaultPickupLeader');
        var distEl = document.getElementById('uaDefaultPickupDist');
        var avatarEl = document.getElementById('uaDefaultPickupAvatar');
        if (store) {
          if (nameEl) nameEl.textContent = store.homeName || store.name;
          if (addrEl) addrEl.textContent = store.addr || '';
          if (leaderEl) leaderEl.textContent = store.leader || '';
          if (distEl) distEl.textContent = store.dist || '';
          if (avatarEl && store.avatar) avatarEl.src = store.avatar;
        } else if (ctx && ctx.displayName && nameEl) {
          nameEl.textContent = ctx.displayName;
          if (addrEl) addrEl.textContent = ctx.storeAddr || ctx.locateAddr || '';
          if (leaderEl) leaderEl.textContent = ctx.storeLeader || '';
          if (distEl) distEl.textContent = ctx.storeDist || '';
          if (avatarEl && ctx.storeAvatar) avatarEl.src = ctx.storeAvatar;
        }

        var hoursEl = document.getElementById('uaDefaultPickupBizHours');
        if (hoursEl && window.UaSwitchAddress && typeof window.UaSwitchAddress.getStoreBizMeta === 'function') {
          var storeId = (store && store.id) || (ctx && ctx.storeId) || 'ONS-CENTER-01';
          var biz = window.UaSwitchAddress.getStoreBizMeta(storeId);
          hoursEl.textContent = biz.hoursText;
          hoursEl.hidden = false;
        }

        var switchHref = 'switch-address.html?from=' + encodeURIComponent('profile.html');
        var switchBtn = document.getElementById('uaDefaultPickupSwitch');
        if (switchBtn) switchBtn.href = switchHref;
        var bodyLink = document.getElementById('uaDefaultPickupBody');
        if (bodyLink) bodyLink.href = switchHref;
      }
      syncDefaultPickupCard();

      /* 登录回流带 rg=1 时，在「我的」页也触发发放弹窗 */
      if (window.UaRegisterGift) UaRegisterGift.bootPage();
      if (window.UaFeedback && typeof window.UaFeedback.syncProfileDot === 'function') {
        window.UaFeedback.syncProfileDot();
      }
    })();
  </script>
</body>
</html>
