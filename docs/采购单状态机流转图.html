<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>采购单状态机流转图</title>
<style>
  body { margin: 0; padding: 40px; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .container { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 500; color: #2C2C2A; margin-bottom: 8px; }
  .desc { font-size: 13px; color: #888780; margin-bottom: 24px; line-height: 1.6; }
  svg { width: 100%; height: auto; display: block; }
  .legend-note { margin-top: 20px; font-size: 12px; color: #5F5E5A; line-height: 1.8; }
  .legend-note span { display: inline-block; margin-right: 24px; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
</style>
</head>
<body>
<div class="container">
  <h1>采购单状态机流转图</h1>
  <p class="desc">展示采购单新增审核环节后的状态流转，包括平台配送路径（含审核）和快递配送路径（免审核）。</p>

  <svg viewBox="0 0 680 445" width="100%" role="img">
    <title>采购单状态机流转图</title>
    <desc>展示采购单新增审核环节后的状态流转，包括平台配送路径（含审核）和快递配送路径（免审核）</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">采购单状态机流转图</text>

    <text x="260" y="72" text-anchor="middle" font-size="12" fill="#888780">快递配送（免审核）</text>
    <path d="M260 80 L260 96" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

    <g>
      <rect x="40" y="100" width="120" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
      <text x="100" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">待审核</text>
      <text x="100" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">平台配送生成</text>
    </g>

    <g>
      <rect x="200" y="100" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="260" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">待收货</text>
      <text x="260" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">可收货 / 不可取消</text>
    </g>

    <g>
      <rect x="360" y="100" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="420" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">部分收货</text>
      <text x="420" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">WMS收货中</text>
    </g>

    <g>
      <rect x="520" y="100" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="580" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">已完成</text>
      <text x="580" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">收货完成</text>
    </g>

    <g>
      <rect x="40" y="220" width="120" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
      <text x="100" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">已驳回</text>
      <text x="100" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">可修改重提</text>
    </g>

    <g>
      <rect x="200" y="340" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
      <text x="260" y="360" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">已取消</text>
      <text x="260" y="380" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">终态不可恢复</text>
    </g>

    <path d="M160 128 L196 128" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="178" y="118" text-anchor="middle" font-size="11" fill="#888780">审核通过</text>

    <path d="M320 128 L356 128" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="338" y="118" text-anchor="middle" font-size="11" fill="#888780">WMS收货中</text>

    <path d="M480 128 L516 128" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="498" y="118" text-anchor="middle" font-size="11" fill="#888780">收货完成</text>

    <path d="M80 156 L80 216" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="56" y="190" text-anchor="middle" font-size="11" fill="#888780">退回修改</text>

    <path d="M120 220 L120 160" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="144" y="190" text-anchor="middle" font-size="11" fill="#888780">重新提交</text>

    <path d="M160 248 L196 340" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="172" y="298" text-anchor="middle" font-size="11" fill="#888780">主动作废</text>

    <path d="M160 128 L175 128 L175 340 L196 340" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="188" y="234" text-anchor="middle" font-size="11" fill="#888780">直接作废</text>

    <g>
      <rect x="70" y="418" width="18" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
      <text x="96" y="425" dominant-baseline="central" font-size="11" fill="#5F5E5A">新增状态</text>
      <rect x="190" y="418" width="18" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="216" y="425" dominant-baseline="central" font-size="11" fill="#5F5E5A">原有状态</text>
      <rect x="310" y="418" width="18" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
      <text x="336" y="425" dominant-baseline="central" font-size="11" fill="#5F5E5A">终态</text>
      <line x1="410" y1="424" x2="438" y2="424" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="448" y="425" dominant-baseline="central" font-size="11" fill="#5F5E5A">免审核路径</text>
    </g>
  </svg>

  <div class="legend-note">
    <span><span class="dot" style="background:#FAEEDA; border:1px solid #854F0B;"></span>新增状态（待审核、已驳回）</span>
    <span><span class="dot" style="background:#E6F1FB; border:1px solid #185FA5;"></span>原有状态（待收货、部分收货、已完成）</span>
    <span><span class="dot" style="background:#F1EFE8; border:1px solid #5F5E5A;"></span>终态（已取消）</span>
  </div>
</div>
</body>
</html>
