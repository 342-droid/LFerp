<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退货单状态机流转图</title>
<style>
  body { margin: 0; padding: 40px; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .container { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 500; color: #2C2C2A; margin-bottom: 8px; }
  .desc { font-size: 13px; color: #888780; margin-bottom: 24px; line-height: 1.6; }
  svg { width: 100%; height: auto; display: block; }
  .legend-note { margin-top: 20px; font-size: 12px; color: #5F5E5A; line-height: 1.8; }
  .legend-note span { display: inline-block; margin-right: 24px; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
</style>
</head>
<body>
<div class="container">
  <h1>退货单状态机流转图</h1>
  <p class="desc">展示退货单状态流转：手动新增需审核；代采-退货退款免审核，直接进入待发货。审核通过后进入发货履约，退入地收货完成后关单。</p>

  <svg viewBox="0 0 880 470" width="100%" role="img">
    <title>退货单状态机流转图</title>
    <desc>展示退货单状态流转，手动新增需审核，代采-退货退款免审核直接待发货</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <text x="440" y="22" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">退货单状态机流转图</text>

    <!-- 代采免审核入口 -->
    <text x="240" y="58" text-anchor="middle" font-size="12" fill="#888780">代采-退货退款（免审核）</text>
    <path d="M240 66 L240 96" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

    <!-- 主路径 -->
    <g>
      <rect x="20" y="100" width="120" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
      <text x="80" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">待审核</text>
      <text x="80" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">手动新增</text>
    </g>

    <g>
      <rect x="180" y="100" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="240" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">待发货</text>
      <text x="240" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">仓库待发货</text>
    </g>

    <g>
      <rect x="340" y="100" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="400" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">部分发货</text>
      <text x="400" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">出库单开始发货</text>
    </g>

    <g>
      <rect x="500" y="100" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="560" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">发货完成</text>
      <text x="560" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">出库单发货完成</text>
    </g>

    <g>
      <rect x="660" y="100" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="720" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">部分收货</text>
      <text x="720" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">退入地收货中</text>
    </g>

    <g>
      <rect x="660" y="220" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="720" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">已完成</text>
      <text x="720" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">收货完成关单</text>
    </g>

    <!-- 审核分支 -->
    <g>
      <rect x="20" y="220" width="120" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
      <text x="80" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">已驳回</text>
      <text x="80" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">可修改重提</text>
    </g>

    <g>
      <rect x="180" y="340" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
      <text x="240" y="360" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">已取消</text>
      <text x="240" y="380" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">终态不可恢复</text>
    </g>

    <!-- 主路径箭头 -->
    <path d="M140 128 L176 128" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="158" y="118" text-anchor="middle" font-size="11" fill="#888780">审核通过</text>

    <path d="M300 128 L336 128" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="318" y="118" text-anchor="middle" font-size="11" fill="#888780">开始出库</text>

    <path d="M460 128 L496 128" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="478" y="118" text-anchor="middle" font-size="11" fill="#888780">出库完成</text>

    <path d="M620 128 L656 128" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="638" y="118" text-anchor="middle" font-size="11" fill="#888780">开始收货</text>

    <path d="M720 156 L720 216" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="752" y="190" text-anchor="middle" font-size="11" fill="#888780">收货完成</text>

    <!-- 一次发完 / 一次收完 -->
    <path d="M240 156 C240 188 560 188 560 156" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="400" y="182" text-anchor="middle" font-size="11" fill="#888780">一次发完</text>

    <path d="M560 156 C560 190 680 190 680 220" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="640" y="178" text-anchor="middle" font-size="11" fill="#888780">一次收完</text>

    <!-- 审核驳回 / 重提 -->
    <path d="M60 156 L60 216" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="40" y="190" text-anchor="middle" font-size="11" fill="#888780">驳回</text>

    <path d="M100 220 L100 160" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="124" y="190" text-anchor="middle" font-size="11" fill="#888780">重新提交</text>

    <path d="M140 248 L176 340" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="152" y="298" text-anchor="middle" font-size="11" fill="#888780">主动作废</text>

    <!-- 图例 -->
    <g>
      <rect x="70" y="430" width="18" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
      <text x="96" y="437" dominant-baseline="central" font-size="11" fill="#5F5E5A">审核状态</text>
      <rect x="190" y="430" width="18" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="216" y="437" dominant-baseline="central" font-size="11" fill="#5F5E5A">履约状态</text>
      <rect x="310" y="430" width="18" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
      <text x="336" y="437" dominant-baseline="central" font-size="11" fill="#5F5E5A">终态</text>
      <line x1="410" y1="436" x2="438" y2="436" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="448" y="437" dominant-baseline="central" font-size="11" fill="#5F5E5A">免审核 / 可跳过路径</text>
    </g>
  </svg>

  <div class="legend-note">
    <span><span class="dot" style="background:#FAEEDA; border:1px solid #854F0B;"></span>审核状态（待审核、已驳回，仅手动新增）</span>
    <span><span class="dot" style="background:#E6F1FB; border:1px solid #185FA5;"></span>履约状态（待发货 → 已完成）</span>
    <span><span class="dot" style="background:#F1EFE8; border:1px solid #5F5E5A;"></span>终态（已取消）</span>
  </div>
</div>
</body>
</html>
