<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 签署任务</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/basic-settings.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/lf-contract.css">
</head>
<body data-ct-page="task">
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/basic-settings-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-title">基础设置 / 合同管理 / 签署任务</div>
            <hr class="content-divider">

            <div class="mdm-biz-tip" role="note">
                门店入驻、供应商合作、仓库合作、员工入职都在此发起合同。状态由法大大回调回写：<strong>待对方授权 / 签署中 / 已完成 / 已拒签 / 已撤销</strong>。
            </div>

            <div class="ct-tabs" role="tablist">
                <button type="button" class="ct-tabs__item is-active" data-status="" data-label="全部">全部</button>
                <button type="button" class="ct-tabs__item" data-status="wait_auth" data-label="待对方授权">待对方授权</button>
                <button type="button" class="ct-tabs__item" data-status="sign_progress" data-label="签署中">签署中</button>
                <button type="button" class="ct-tabs__item" data-status="sign_completed" data-label="已完成">已完成</button>
                <button type="button" class="ct-tabs__item" data-status="rejected" data-label="已拒签">已拒签</button>
                <button type="button" class="ct-tabs__item" data-status="cancelled" data-label="已撤销">已撤销</button>
            </div>

            <section class="search-section">
                <form class="search-form" id="ctTaskFilter" onsubmit="return false;">
                    <div class="form-group">
                        <label>关键字:</label>
                        <input id="qTaskKw" placeholder="任务号 / 合同名称 / 主体" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>业务场景:</label>
                        <select id="qTaskScene"></select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" data-ct-reset>重置</button>
                        <button type="button" class="btn btn-primary" data-ct-query>查询</button>
                    </div>
                </form>
            </section>

            <div class="ct-toolbar">
                <button type="button" class="erp-btn erp-btn--primary" id="ctTaskAddBtn">发起签署</button>
            </div>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>任务号</th>
                                <th>合同名称</th>
                                <th>业务场景</th>
                                <th>签署主体</th>
                                <th>状态</th>
                                <th>发起人</th>
                                <th>发起时间</th>
                                <th>完成时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="ctTaskBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/basic-settings-contract.js"></script>
</body>
</html>
