<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 库存查询</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        /* 保持操作列为表格单元格，避免公共 flex 样式破坏行边框与高度 */
        .inventory-table td.action-links {
            display: table-cell;
            vertical-align: middle;
        }
        #productionDateModal { align-items: flex-start; padding-top: 6vh; box-sizing: border-box; }
        #productionDateModal .modal-content { width: 560px; max-width: calc(100% - 32px); height: auto; max-height: none; box-sizing: border-box; }
        #productionDateModal .modal-form-group { width: 100%; margin-bottom: 16px; min-width: 0; }
        #productionDateModal .modal-form-group label { width: 110px; }
        #productionDateModal .modal-form-group > span { flex: 1; min-width: 0; color: #333; line-height: 1.5; }
        #productionDateModal .modal-close { position: absolute; right: 0; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: #999; font-size: 24px; line-height: 1; cursor: pointer; padding: 4px 8px; }
        #productionDateModal .production-date-product { display: flex; gap: 16px; align-items: center; }
        #productionDateModal .production-date-product img { width: 56px; height: 56px; object-fit: cover; border: 1px solid #eee; border-radius: 4px; }
        #productionDateModal .production-date-product img { cursor: zoom-in; }
        #productionDateModal .production-date-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
    </style>
</head>
<body>
    <!-- 侧边栏容器 -->
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/wms-sidebar.js"></script>

    <!-- 顶部导航栏容器 -->
    <div id="header-container"></div>
    
    <div class="container">
        <main class="main-content">
            <div class="content-tabs">
                <button class="active">库存查询</button>
            </div>
            
            <hr class="content-divider">
            
            <div class="content-title">库存管理 / 库存查询</div>
            
            <section class="search-section">
                <form class="search-form">
                    <div class="form-group custom-select-wrapper">
                        <label style="width: 70px;">货主:</label>
                        <div class="custom-select">
                            <input type="text" id="searchCompany" placeholder="请选择或输入搜索">
                            <span class="select-arrow">▼</span>
                            <span class="clear-btn">×</span>
                            <div class="select-dropdown" id="searchCompanyDropdown">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label style="width: 70px;">商品:</label>
                        <div class="input-wrapper">
                            <input type="text" id="searchSkuKeyword" placeholder="请输入商品编码/条码/名称">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group custom-select-wrapper">
                        <label>来源类型:</label>
                        <div class="custom-select">
                            <input type="text" id="searchSourceType" placeholder="请选择">
                            <span class="select-arrow">▼</span>
                            <span class="clear-btn">×</span>
                            <div class="select-dropdown" id="searchSourceTypeDropdown"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>来源单号:</label>
                        <div class="input-wrapper">
                            <input type="text" id="searchSourceOrder" placeholder="请输入">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label style="width: 70px;">储位:</label>
                        <div class="input-wrapper">
                            <input type="text" id="searchLocation" placeholder="请输入储位编码/名称">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label style="width: 70px;">容器:</label>
                        <div class="input-wrapper">
                            <input type="text" id="searchLpn" placeholder="请输入">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group custom-select-wrapper">
                        <label>是否冻结:</label>
                        <div class="custom-select">
                            <input type="text" id="searchIsFrozen" placeholder="请选择">
                            <span class="select-arrow">▼</span>
                            <span class="clear-btn">×</span>
                            <div class="select-dropdown" id="searchIsFrozenDropdown">
                                <div class="select-option" data-value="true">是</div>
                                <div class="select-option" data-value="false">否</div>
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-primary" onclick="searchInventory()">查询</button>
                        <button type="button" class="btn btn-secondary">导出</button>
                        <button type="button" class="btn btn-secondary" id="correctProductionDateBtn">更正生产日期</button>
                    </div>
                </form>
            </section>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table inventory-table">
                        <thead>
                            <tr>
                                <th><input type="checkbox" class="table-checkbox checkbox-all"></th>
                                <th>仓库</th>
                                <th>货主</th>
                                <th>商品图片</th>
                                <th>商品编码</th>
                                <th>商品名称</th>
                                <th>商品规格</th>
                                <th>商品单位</th>
                                <th>库存量</th>
                                <th>占用量</th>
                                <th>储位</th>
                                <th>容器</th>
                                <th>供应商</th>
                                <th>入库日期</th>
                                <th>批次</th>
                                <th>生产日期</th>
                                <th>来源类型</th>
                                <th>来源单号</th>
                                <th>是否冻结</th>
                                <th>更新时间</th>
                                <th>更新人</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- 数据将通过JavaScript动态生成 -->
                        </tbody>
                    </table>
                </div>
                
                <!-- 分页组件容器 -->
                <div id="pagination-container"></div>
            </section>
        </main>
    </div>

    <div id="productionDateModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">更正生产日期</h2>
                <button type="button" class="modal-close" id="productionDateCloseBtn" aria-label="关闭">×</button>
            </div>
            <div class="modal-body">
                <div class="production-date-product modal-form-group">
                    <img id="productionDateImage" alt="商品图片">
                </div>
                <div class="production-date-grid">
                    <div class="modal-form-group"><label>商品编码:</label><span id="productionDateSkuCode"></span></div>
                    <div class="modal-form-group"><label>商品名称:</label><span id="productionDateSkuName"></span></div>
                    <div class="modal-form-group"><label>商品规格:</label><span id="productionDateSkuSpec"></span></div>
                    <div class="modal-form-group"><label>商品单位:</label><span id="productionDateUnit"></span></div>
                    <div class="modal-form-group"><label>生产日期:</label><span id="productionDateCurrent"></span></div>
                    <div class="modal-form-group"><label>可用库存:</label><span id="productionDateAvailable"></span></div>
                    <div class="modal-form-group"><label for="productionDateInput">新生产日期:</label><input type="text" id="productionDateInput" inputmode="numeric" maxlength="8" placeholder="如20260901" required></div>
                    <div class="modal-form-group"><label for="productionDateQuantity">变更数量:</label><input type="number" id="productionDateQuantity" min="0.01" step="0.01" required placeholder="请输入变更数量"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="productionDateCancelBtn">取消</button>
                <button type="button" class="btn btn-primary" id="productionDateSaveBtn">执行</button>
            </div>
        </div>
    </div>
    <div id="productionImagePreview" class="modal" style="display: none; align-items: center; justify-content: center; z-index: 2600;" aria-label="商品图片预览">
        <button type="button" id="productionImagePreviewClose" aria-label="关闭图片预览" style="position:absolute; right:24px; top:18px; border:0; background:transparent; color:#fff; font-size:32px; cursor:pointer;">×</button>
        <img id="productionImagePreviewImg" alt="商品图片大图" style="max-width:80vw; max-height:80vh; object-fit:contain; border-radius:6px; box-shadow:0 4px 18px rgba(0,0,0,.35);">
    </div>

    <!-- 引入公共脚本 -->
    <script src="../js/common.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/form-utils.js"></script>
    <script src="../js/modal-manager.js"></script>
    <script src="../js/page-manager.js"></script>
    <script>
        // 模拟数据
        const inventoryData = [
            {
                warehouse: 'W001 南京仓',
                company: 'C001 货主1',
                skuCode: 'SKU001',
                skuName: '商品A',
                skuImage: '../user-app/assets/order-product-1.svg',
                skuSpec: '500g/袋',
                unit: '件',
                inventoryStatus: '正常',
                quantity: 100,
                occupied: 20,
                location: 'A-01-01',
                lpn: 'LPN001',
                supplier: '供应商A',
                inDate: '2026-02-01',
                productionDate: '2026-01-15',
                sourceType: '收货',
                sourceOrder: 'PO001',
                isFrozen: '否',
                updateTime: '2026-02-10 10:00:00',
                updateUser: 'admin'
            },
            {
                warehouse: 'W001 南京仓',
                company: 'C002 货主2',
                skuCode: 'SKU002',
                skuName: '商品B',
                skuImage: '../user-app/assets/order-product-2.svg',
                skuSpec: '1kg/盒',
                unit: '箱',
                inventoryStatus: '正常',
                quantity: 200,
                occupied: 50,
                location: 'B-02-03',
                lpn: 'LPN002',
                supplier: '供应商B',
                inDate: '2026-02-02',
                productionDate: '2026-01-20',
                sourceType: '拣货',
                sourceOrder: 'WO001',
                isFrozen: '是',
                updateTime: '2026-02-10 11:00:00',
                updateUser: 'admin'
            },
            {
                warehouse: 'W001 南京仓',
                company: 'C003 货主3',
                skuCode: 'SKU003',
                skuName: '商品C',
                skuImage: '../user-app/assets/order-product-3.svg',
                skuSpec: '12盒/箱',
                unit: '个',
                inventoryStatus: '异常',
                quantity: 50,
                occupied: 10,
                location: 'C-03-02',
                lpn: 'LPN003',
                supplier: '供应商C',
                inDate: '2026-02-03',
                productionDate: '2026-01-25',
                sourceType: '分拣',
                sourceOrder: 'RO001',
                isFrozen: '否',
                updateTime: '2026-02-10 12:00:00',
                updateUser: 'admin'
            }
        ];

                // 页面加载完成后初始化
                document.addEventListener('DOMContentLoaded', () => {
                    try {
                const formatCompactDate = (date) => String(date || '').replace(/-/g, '').slice(0, 8) || '-';
                // 初始化下拉框数据
                renderSelectOptions('searchSourceTypeDropdown', CommonOptions.inventorySourceType);

                const companyDropdown = document.getElementById('searchCompanyDropdown');
                const companies = ['C001 货主1', 'C002 货主2', 'C003 货主3', 'C004 货主4', 'C005 货主5'];
                companies.forEach(company => {
                    const option = document.createElement('div');
                    option.className = 'select-option';
                    option.setAttribute('data-value', company);
                    option.textContent = company;
                    companyDropdown.appendChild(option);
                });

                // 加载库存数据
                function loadInventoryData() {
                    const tbody = document.querySelector('#tableBody');
                    tbody.innerHTML = '';
                    
                    inventoryData.forEach((item, index) => {
                        const receiptDate = item.receiveDate || item.inDate || '';
                        const receiptDatePlain = receiptDate.replace(/-/g, '');
                        const batch = `${receiptDatePlain}-${String(index + 1).padStart(3, '0')}-${item.skuCode}`;
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td><input type="checkbox" class="table-checkbox checkbox-row" data-index="${index}"></td>
                            <td>${item.warehouse}</td>
                            <td>${item.company}</td>
                            <td><img class="wms-sku-image" src="${item.skuImage}" alt="${item.skuName}"></td>
                            <td>${item.skuCode}</td>
                            <td>${item.skuName}</td>
                            <td>${item.skuSpec}</td>
                            <td>${item.unit || '-'}</td>
                            <td>${item.quantity}</td>
                            <td>${item.occupied}</td>
                            <td>${item.location}</td>
                            <td>${item.lpn}</td>
                            <td>${item.supplier}</td>
                            <td>${formatCompactDate(item.inDate)}</td>
                            <td>${batch}</td>
                            <td>${formatCompactDate(item.productionDate)}</td>
                            <td>${item.sourceType}</td>
                            <td>${item.sourceOrder}</td>
                            <td><span class="status ${item.isFrozen === '否' ? 'active' : 'inactive'}">${item.isFrozen}</span></td>
                            <td>${item.updateTime}</td>
                            <td>${item.updateUser}</td>
                            <td class="action-links">
                                ${item.isFrozen === '否' ? '<a href="#" class="freeze-btn">冻结</a>' : ''}
                                ${item.isFrozen === '是' ? '<a href="#" class="unfreeze-btn">解冻</a>' : ''}
                            </td>
                        `;
                        tbody.appendChild(row);
                    });
                }

                // 搜索库存
                function searchInventory() {
                    // 获取搜索条件
                    const company = document.getElementById('searchCompany').value.trim();
                    const skuKeyword = document.getElementById('searchSkuKeyword').value.trim();
                    const sourceType = document.getElementById('searchSourceType').value.trim();
                    const sourceOrder = document.getElementById('searchSourceOrder').value.trim();
                    const location = document.getElementById('searchLocation').value.trim();
                    const lpn = document.getElementById('searchLpn').value.trim();
                    const isFrozen = document.getElementById('searchIsFrozen').value.trim();
                    
                    // 这里可以添加搜索逻辑
                    console.log('搜索条件:', {
                        company,
                        skuKeyword,
                        sourceType,
                        sourceOrder,
                        location,
                        lpn,
                        isFrozen
                    });
                    
                    // 模拟搜索结果
                    loadInventoryData();
                }

                // 冻结库存
                function freezeInventory(btn) {
                    // 冻结逻辑已移除
                }

                // 解冻库存
                function unfreezeInventory(btn) {
                    // 解冻逻辑已移除
                }

                // 使用PageManager简化页面逻辑
                const page = new PageManager({
                    entityName: '库存',
                    statusColumnIndex: 16,
                    
                    // 搜索区域下拉框
                    customSelects: [
                        { inputId: 'searchCompany', dropdownId: 'searchCompanyDropdown' },
                        { inputId: 'searchSourceType', dropdownId: 'searchSourceTypeDropdown' },
                        { inputId: 'searchIsFrozen', dropdownId: 'searchIsFrozenDropdown' }
                    ],
                    
                    deleteModal: {
                        modalId: 'confirmDeleteModal',
                        closeBtnId: 'confirmDeleteCloseBtn',
                        cancelBtnId: 'cancelDeleteBtn',
                        confirmBtnId: 'confirmDeleteBtn'
                    }
                });
                
                page.init();
                
                // 加载初始数据
                loadInventoryData();

                // 绑定冻结/解冻按钮事件（仅阻止默认行为）
                document.addEventListener('click', (e) => {
                    if (e.target.classList.contains('freeze-btn') || e.target.classList.contains('unfreeze-btn')) {
                        e.preventDefault();
                        // 点击逻辑已移除
                    }
                    if (e.target.id === 'correctProductionDateBtn') {
                        const selected = [...document.querySelectorAll('.checkbox-row:checked')];
                        if (selected.length !== 1) {
                            showToast('请选择一条库存记录进行更正', 'error');
                            return;
                        }
                        const index = Number(selected[0].dataset.index);
                        const item = inventoryData[index];
                        if (!item) return;
                        document.getElementById('productionDateImage').src = item.skuImage;
                        document.getElementById('productionDateSkuCode').textContent = item.skuCode;
                        document.getElementById('productionDateSkuName').textContent = item.skuName;
                        document.getElementById('productionDateSkuSpec').textContent = item.skuSpec || '-';
                        document.getElementById('productionDateUnit').textContent = item.unit || '-';
                        document.getElementById('productionDateAvailable').textContent = Math.max(0, Number(item.quantity) - Number(item.occupied));
                        document.getElementById('productionDateCurrent').textContent = formatCompactDate(item.productionDate);
                        document.getElementById('productionDateInput').dataset.index = index;
                        document.getElementById('productionDateInput').value = '';
                        document.getElementById('productionDateQuantity').value = Math.max(0, Number(item.quantity) - Number(item.occupied));
                        document.getElementById('productionDateModal').style.display = 'flex';
                        document.getElementById('productionDateInput').focus();
                    }
                });

                document.getElementById('productionDateCloseBtn').addEventListener('click', closeProductionDateModal);
                document.getElementById('productionDateCancelBtn').addEventListener('click', closeProductionDateModal);
                document.getElementById('productionDateImage').addEventListener('click', () => {
                    const image = document.getElementById('productionDateImage');
                    document.getElementById('productionImagePreviewImg').src = image.src;
                    document.getElementById('productionImagePreview').style.display = 'flex';
                });
                document.getElementById('productionImagePreviewClose').addEventListener('click', closeProductionImagePreview);
                document.getElementById('productionImagePreview').addEventListener('click', (event) => {
                    if (event.target.id === 'productionImagePreview') closeProductionImagePreview();
                });
                document.getElementById('productionDateSaveBtn').addEventListener('click', () => {
                    const index = Number(document.getElementById('productionDateInput').dataset.index);
                    const value = document.getElementById('productionDateInput').value;
                    const quantity = Number(document.getElementById('productionDateQuantity').value);
                    if (!/^\d{8}$/.test(value)) { showToast('请输入8位生产日期，如20260901', 'error'); return; }
                    const normalizedDate = `${value.slice(0, 4)}-${value.slice(4, 6)}-${value.slice(6, 8)}`;
                    const available = Math.max(0, Number(inventoryData[index]?.quantity) - Number(inventoryData[index]?.occupied));
                    if (!Number.isFinite(quantity) || quantity <= 0 || quantity > available || Math.round(quantity * 100) / 100 !== quantity) { showToast('变更数量须大于0且不超过可用库存', 'error'); return; }
                    if (inventoryData[index]) {
                        inventoryData[index].productionDate = normalizedDate;
                        loadInventoryData();
                        closeProductionDateModal();
                        showToast('生产日期已更正', 'success');
                    }
                });
                function closeProductionDateModal() {
                    document.getElementById('productionDateModal').style.display = 'none';
                }
                function closeProductionImagePreview() {
                    document.getElementById('productionImagePreview').style.display = 'none';
                }
            } catch (error) {
                console.error('初始化错误:', error);
                // 避免showToast可能不存在的问题
                if (typeof showToast === 'function') {
                    showToast('页面初始化失败，请刷新重试', 'error');
                }
            }
        });
    </script>
</body>
</html>
