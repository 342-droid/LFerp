<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 合同模板</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/basic-settings.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/lf-contract.css">
</head>
<body data-ct-page="template">
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/basic-settings-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-title">基础设置 / 合同管理 / 合同模板</div>
            <hr class="content-divider">

            <div class="mdm-biz-tip" role="note">
                这里绑定的是法大大的<strong>签署任务模板</strong>。一份模板里可以有多份文档，发起后进入同一条签署任务。不能把多份签署模板合成一条任务。点模板名称看绑定详情；详情里的法大大模板只查阅正文，乙方留空，没有复制链接。加盟店用含品牌合作和资金清分两份文档的模板；联营店、直营店只用品牌合作那一份模板。<strong>结算信息变更补充协议</strong>是单独模板，不跟入驻模板一起发起。
            </div>

            <div class="ct-scene-grid" id="ctSceneCards"></div>

            <section class="search-section">
                <form class="search-form" id="ctTplFilter" onsubmit="return false;">
                    <div class="form-group">
                        <label>模板名称:</label>
                        <input id="qTplName" placeholder="名称或法大大模板 ID" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>业务场景:</label>
                        <select id="qTplScene"></select>
                    </div>
                    <div class="form-group">
                        <label>状态:</label>
                        <select id="qTplStatus">
                            <option value="">全部</option>
                            <option value="on">启用</option>
                            <option value="off">停用</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" data-ct-reset>重置</button>
                        <button type="button" class="btn btn-primary" data-ct-query>查询</button>
                    </div>
                </form>
            </section>

            <div class="ct-toolbar">
                <button type="button" class="erp-btn erp-btn--primary" id="ctTplAddBtn">新增绑定</button>
                <button type="button" class="erp-btn" id="ctTplSyncBtn">同步法大大模板</button>
            </div>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>模板名称</th>
                                <th>业务场景</th>
                                <th>适用合作类型</th>
                                <th>法大大签署模板</th>
                                <th>包含文档</th>
                                <th>签署方</th>
                                <th>状态</th>
                                <th>更新时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="ctTplBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/contract-bodies.js?v=20261105-settle-sup"></script>
    <script src="../js/basic-settings-contract.js?v=20261112-contract-push"></script>
</body>
</html>
