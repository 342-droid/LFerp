<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 直播排品</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/lf-product.css?v=20260905-reset-spec">
    <link rel="stylesheet" href="../css/lf-live.css?v=20260905-sched-more">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/live-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content lf-live-sched-page">
            <div class="content-tabs"><button class="active">直播排品</button></div>
            <hr class="content-divider">

            <section class="search-section lf-live-sched-picker-card">
                <div class="lf-live-sess-dd" id="liveSchedSessionDd">
                    <div class="lf-live-sess-dd__row">
                        <label class="lf-live-sess-dd__label" for="liveSchedSessionTrigger">
                            <svg class="lf-live-sess-dd__cam" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"></path>
                            </svg>
                            选择直播场次
                        </label>
                        <div class="lf-live-sess-dd__field">
                            <button type="button" class="lf-live-sess-dd__trigger" id="liveSchedSessionTrigger" aria-haspopup="listbox" aria-expanded="false">
                                <span class="lf-live-sess-dd__value" id="liveSchedSessionLabel">请选择直播场次</span>
                                <span class="lf-live-sess-dd__chevron" aria-hidden="true"></span>
                            </button>
                            <input type="hidden" id="liveSchedSession" value="">
                            <div class="lf-live-sess-dd__pop" id="liveSchedSessionPop" hidden>
                                <div class="lf-live-sess-dd__search">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
                                    <input type="search" id="liveSchedSessionSearch" placeholder="搜索直播间名称" autocomplete="off">
                                </div>
                                <div class="lf-live-sess-dd__tabs" id="liveSchedSessionTabs" role="tablist"></div>
                                <div class="lf-live-sess-dd__list" id="liveSchedSessionList" role="listbox"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <div id="liveSchedEmpty" class="lf-live-empty-tip">选择一个直播场次后，可以管理该场次的直播排品</div>

            <div id="liveSchedPanel" hidden>
                <div id="liveSchedMeta" class="lf-live-session-meta"></div>
                <div class="mdm-biz-tip" role="note">直播排品的商品<strong>上架</strong>代表直播间可以售卖该商品，并不会直接展示到直播间。需要直播场次的中控台添加直播商品用户可以看到。</div>
                <div class="lf-live-toolbar">
                    <button type="button" class="erp-btn erp-btn--primary" id="liveSchedAddBtn">+ 添加商品</button>
                </div>
                <section class="table-section">
                    <div class="table-scroll-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>序号</th>
                                    <th>商品编号</th>
                                    <th>图片</th>
                                    <th>商品名称</th>
                                    <th>类目</th>
                                    <th>规格</th>
                                    <th>售价</th>
                                    <th>划线价</th>
                                    <th>库存</th>
                                    <th>添加时间</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="liveSchedTableBody"></tbody>
                        </table>
                    </div>
                    <div id="pagination-container"></div>
                </section>
            </div>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/mdm-product-mall-library.js"></script>
    <script src="../js/mdm-product-proxy-library-drawer.js"></script>
    <script src="../js/mdm-live-demo-data.js"></script>
    <script src="../js/mdm-live-product-sched.js?v=20260905-sel-del"></script>
</body>
</html>
