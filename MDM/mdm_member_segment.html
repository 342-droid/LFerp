<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 会员分群</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-product.css">
    <link rel="stylesheet" href="../css/mdm-member-segment-filter.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <style>
        .member-segment-toolbar {
            margin: 0 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .member-segment-toolbar__hint {
            font-size: 13px;
            color: #888;
        }
        .member-segment-rule-cell {
            max-width: 360px;
            white-space: normal;
            margin: 0;
            padding: 0;
            list-style: none;
            text-align: left;
        }
        .member-segment-rule-cell li { margin: 0 0 2px; }
        .member-segment-rule-cell li::before {
            content: '· ';
            color: #ff7019;
            font-weight: 700;
        }
        .member-segment-logic {
            display: inline-block;
            min-width: 28px;
            padding: 1px 8px;
            border-radius: 3px;
            background: rgba(255, 112, 25, 0.1);
            color: #ff7019;
            text-align: center;
        }
        .member-segment-mode {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .member-segment-tip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid #c0c4cc;
            color: #999;
            font-size: 10px;
            font-weight: 600;
            cursor: help;
            background: #fff;
            vertical-align: middle;
        }
        .th-with-tip {
            white-space: nowrap;
        }
        .btn.btn-outline {
            background: #fff;
            color: #ff7019;
            border: 1px solid #ff7019;
            box-sizing: border-box;
        }
        .btn.btn-outline:hover {
            background: #fff7f0;
            color: #e85f10;
            border-color: #e85f10;
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/mdm-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">会员分群</button></div>
            <hr class="content-divider">
            <div class="content-title">会员 / 会员360 / 会员分群</div>

            <div class="member-segment-toolbar">
                <span class="member-segment-toolbar__hint">通过会员标签、消费、行动、偏好等条件筛选目标人群</span>
            </div>

            <section class="search-section">
                <form class="search-form" id="segmentSearchForm">
                    <div class="form-group">
                        <label>人群名称:</label>
                        <div class="input-wrapper">
                            <input id="qGroupName" placeholder="请输入人群名称">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>更新方式:</label>
                        <select id="qUpdateMode">
                            <option value="">全部</option>
                            <option value="manual">手动</option>
                            <option value="auto">自动</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>状态:</label>
                        <select id="qStatus">
                            <option value="">全部</option>
                            <option value="启用">启用</option>
                            <option value="停用">停用</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="btnFilterReset">重置</button>
                        <button type="button" class="btn btn-primary" id="btnFilterQuery">查询</button>
                        <button type="button" class="btn btn-outline" id="btnCreateSegment">新建人群</button>
                    </div>
                </form>
            </section>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>人群名称</th>
                                <th>条件关系</th>
                                <th>筛选规则</th>
                                <th>人数</th>
                                <th class="th-with-tip">更新方式 <span class="member-segment-tip" title="手动：需要用户手动点击更新，才会触发更新；自动：系统每天凌晨开始更新">?</span></th>
                                <th>创建人</th>
                                <th>创建时间</th>
                                <th>更新时间</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                <div id="pagination-container"></div>
            </section>
        </main>
    </div>

    <div id="groupNameModalHost"></div>

    <script src="../js/common.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/form-utils.js"></script>
    <script src="../js/mdm-product-catalog-store.js"></script>
    <script src="../js/mdm-product-proxy-region-picker.js"></script>
    <script src="../js/mdm-product-proxy-store-picker.js"></script>
    <script src="../js/mdm-member-segment-filter.js"></script>
    <script src="../js/mdm-member-segment.js"></script>
</body>
</html>
