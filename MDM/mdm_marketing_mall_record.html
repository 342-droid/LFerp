<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 领券记录</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <style>
        .mall-record-orders { line-height: 1.55; white-space: normal; }
        .search-form > .form-group[hidden] { display: none !important; }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/marketing-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">领券记录</button></div>
            <hr class="content-divider">

            <section class="search-section">
                <form class="search-form" id="mallRecordSearchForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>用户ID:</label>
                        <div class="input-wrapper">
                            <input id="qUserId" placeholder="请输入用户ID" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>用户昵称:</label>
                        <div class="input-wrapper">
                            <input id="qNickname" placeholder="请输入昵称" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>手机号:</label>
                        <div class="input-wrapper">
                            <input id="qPhone" placeholder="请输入手机号" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>领券场景:</label>
                        <select id="qCollectMethod">
                            <option value="">全部</option>
                            <option value="直播发券">直播发券</option>
                            <option value="福袋发券">福袋发券</option>
                            <option value="签到发券">签到发券</option>
                            <option value="后台人工发券">后台人工发券</option>
                        </select>
                    </div>
                    <div class="form-group" id="qActivityIdGroup" hidden>
                        <label id="qActivityIdLabel">直播场次ID:</label>
                        <select id="qActivityId">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>状态:</label>
                        <select id="qStatus">
                            <option value="">全部</option>
                            <option value="未使用">未使用</option>
                            <option value="已使用">已使用</option>
                            <option value="已过期">已过期</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="btnFilterReset">重置</button>
                        <button type="button" class="btn btn-primary" id="btnFilterQuery">查询</button>
                    </div>
                </form>
            </section>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>记录ID</th>
                                <th>用户ID</th>
                                <th>用户昵称</th>
                                <th>手机号</th>
                                <th>优惠券名称</th>
                                <th>面额</th>
                                <th>门槛</th>
                                <th>模版ID</th>
                                <th>领取时间</th>
                                <th>领券场景</th>
                                <th>活动ID</th>
                                <th>状态</th>
                                <th>核销关联订单</th>
                                <th>备注</th>
                            </tr>
                        </thead>
                        <tbody id="mallRecordTableBody"></tbody>
                    </table>
                </div>
                <div id="pagination-container"></div>
            </section>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/form-utils.js"></script>
    <script src="../js/mdm-marketing-mall-record-store.js"></script>
    <script src="../js/mdm-marketing-mall-record.js"></script>
</body>
</html>
