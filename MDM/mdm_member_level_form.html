<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 会员等级配置</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-mdm-edit-page.css">
    <link rel="stylesheet" href="../css/lf-mdm-points-rule.css">
    <link rel="stylesheet" href="../user-app/css/user-app-live-entry-fx.css">
    <style>
        .member-level-form-toolbar {
            margin: 0 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .member-level-form-back {
            color: #2196F3;
            text-decoration: none;
            font-size: 13px;
        }
        .member-level-form-back:hover { text-decoration: underline; }

        /* 卡片通栏；字段控件参考成长值规则页，不必贴满右缘 */
        .pts-rule-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 4px;
            margin-bottom: 16px;
            overflow: hidden;
            width: 100%;
            max-width: none;
            box-sizing: border-box;
        }
        .pts-rule-card__title {
            padding: 12px 16px;
            background: #fafafa;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pts-rule-card__body {
            padding: 16px 16px 8px;
        }
        .pts-rule-field {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
        }
        .pts-rule-field__label {
            flex: 0 0 140px;
            text-align: right;
            font-size: 13px;
            color: #333;
            line-height: 36px;
        }
        .pts-rule-field__label .erp-req {
            color: #ff4d4f;
            margin-right: 2px;
        }
        /* 覆盖 lf-mdm-edit-page 的 max-width:none，控件区保持可读宽度 */
        #memberLevelForm .pts-rule-field__control {
            flex: 1;
            min-width: 0;
            max-width: 640px;
        }
        #memberLevelForm .pts-rule-field__control .erp-input,
        #memberLevelForm .pts-rule-field__control .erp-select,
        #memberLevelForm .pts-rule-field__control textarea.erp-input {
            width: 100%;
            box-sizing: border-box;
        }
        #memberLevelForm .pts-rule-field__control .erp-input,
        #memberLevelForm .pts-rule-field__control .erp-select {
            height: 36px;
        }
        #memberLevelForm .pts-rule-field__control textarea.erp-input {
            height: auto;
            min-height: 88px;
            padding: 8px 10px;
            line-height: 1.5;
            resize: vertical;
        }
        /* 券列表、适用范围等稍宽内容：可略放宽，仍不贴边 */
        #memberLevelForm .pts-rule-field[data-benefit="giftCoupon"] .pts-rule-field__control,
        #memberLevelForm .pts-rule-field[data-benefit="birthday"] .pts-rule-field__control,
        #memberLevelForm .pts-rule-field[data-benefit="memberDiscount"] .pts-rule-field__control {
            max-width: 760px;
        }

        .member-level-label-tip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            margin-left: 4px;
            border-radius: 50%;
            border: 1px solid #bbb;
            color: #888;
            font-size: 11px;
            line-height: 1;
            cursor: help;
            vertical-align: middle;
            user-select: none;
            position: relative;
            top: -1px;
        }
        .member-level-label-tip:hover {
            border-color: #ff7019;
            color: #ff7019;
        }
        .member-level-form-footer {
            /* 底栏由 lf-mdm-edit-page.css 固定悬浮 */
        }
        .member-level-field-tip {
            margin-top: 6px;
            font-size: 12px;
            color: #999;
            line-height: 1.45;
        }
        .member-level-unit {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            flex-wrap: wrap;
        }
        .member-level-unit .erp-input {
            width: auto;
            flex: 0 0 140px;
            max-width: 180px;
            height: 36px;
            box-sizing: border-box;
        }
        .member-level-unit .erp-select {
            width: auto;
            flex: 0 0 180px;
            max-width: 220px;
            height: 36px;
            box-sizing: border-box;
        }
        .member-level-unit__text {
            flex-shrink: 0;
            font-size: 13px;
            color: #666;
            white-space: nowrap;
        }
        .member-level-check-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 20px;
            align-items: center;
            min-height: 36px;
        }
        .pts-rule-field[data-benefit] {
            align-items: flex-start;
        }
        .pts-rule-field[data-benefit] > .pts-rule-field__label {
            line-height: 36px;
        }
        .member-level-check-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            color: #333;
            min-height: 36px;
            line-height: 36px;
        }
        .member-level-check-label input {
            accent-color: var(--color-primary, #ff7019);
            margin: 0;
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }
        .member-level-benefit-head {
            margin-bottom: 10px;
            min-height: 36px;
            display: flex;
            align-items: center;
        }
        .member-level-benefit-body {
            transition: opacity 0.15s ease;
        }
        .member-level-benefit-body.is-disabled {
            opacity: 0.45;
            pointer-events: none;
        }
        .member-level-desc {
            width: 100%;
            min-height: 72px;
            resize: vertical;
            box-sizing: border-box;
            margin-top: 10px;
            font-family: inherit;
            white-space: pre-wrap;
        }
        .member-level-coupon-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .member-level-coupon-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .member-level-coupon-picker {
            position: relative;
            flex: 1;
            min-width: 0;
        }
        .member-level-coupon-picker__trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 32px;
            padding: 0 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            box-sizing: border-box;
            text-align: left;
            gap: 8px;
        }
        .member-level-coupon-picker__trigger:hover {
            border-color: #ff7019;
        }
        .member-level-coupon-picker__trigger.is-placeholder {
            color: #999;
        }
        .member-level-coupon-picker__trigger > span:last-child {
            flex-shrink: 0;
            color: #2196F3;
            font-size: 12px;
        }
        .member-level-coupon-picker__empty {
            padding: 12px 8px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
        .member-level-coupon-qty {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .member-level-coupon-qty .erp-input {
            width: 72px;
        }
        .member-level-coupon-remove {
            flex-shrink: 0;
            border: none;
            background: transparent;
            color: #2196F3;
            cursor: pointer;
            font-size: 13px;
            padding: 0 4px;
            line-height: 32px;
        }
        .member-level-coupon-remove:hover { text-decoration: underline; }
        .member-level-coupon-add {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 34px;
            margin-top: 8px;
            border: 1px dashed #ddd;
            border-radius: 4px;
            background: #fafafa;
            color: #333;
            font-size: 13px;
            cursor: pointer;
        }
        .member-level-coupon-add:hover {
            border-color: #ff7019;
            color: #ff7019;
            background: #fff7f0;
        }
        .member-level-upload {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }
        .member-level-upload__box {
            width: 72px;
            height: 72px;
            border: 1px dashed #dcdfe6;
            border-radius: 6px;
            background: #fafafa;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            overflow: hidden;
            position: relative;
        }
        .member-level-upload__box:hover {
            border-color: #ff7019;
        }
        .member-level-upload__box--filled {
            border-style: solid;
            border-color: #ddd;
            background: #fff;
        }
        .member-level-upload__plus {
            font-size: 26px;
            line-height: 1;
            color: #999;
        }
        .member-level-upload__preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .member-level-upload__hint {
            margin: 0;
            font-size: 12px;
            color: #999;
            line-height: 1.5;
        }
        .member-level-upload__actions {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .member-level-upload__clear {
            border: none;
            background: transparent;
            color: #2196F3;
            cursor: pointer;
            font-size: 13px;
            padding: 0;
        }
        .member-level-upload__clear:hover {
            text-decoration: underline;
        }
        .member-level-upload__clear[hidden] {
            display: none;
        }
        .member-level-scope-box {
            margin-top: 10px;
        }
        .member-level-scope-actions {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .member-level-scope-actions[hidden],
        .member-level-scope-chips[hidden],
        .member-level-scope-empty[hidden] {
            display: none !important;
        }
        .member-level-scope-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
            min-height: 8px;
        }
        .member-level-scope-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            background: #fafafa;
            font-size: 12px;
            color: #555;
            line-height: 1.4;
        }
        .member-level-scope-chip__remove {
            border: none;
            background: transparent;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            padding: 0;
        }
        .member-level-scope-chip__remove:hover {
            color: #ff7019;
        }
        .member-level-scope-empty {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }
        .member-level-pick-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1200;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .member-level-pick-modal {
            width: min(520px, 96vw);
            max-height: min(72vh, 560px);
            background: #fff;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
        }
        .member-level-pick-modal--product {
            width: min(860px, 96vw);
            max-height: min(80vh, 680px);
        }
        .member-level-pick-modal__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
        }
        .member-level-pick-modal__title {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }
        .member-level-pick-modal__close {
            border: none;
            background: transparent;
            font-size: 20px;
            line-height: 1;
            color: #999;
            cursor: pointer;
        }
        .member-level-pick-modal__body {
            padding: 12px 16px;
            overflow: auto;
            flex: 1;
        }
        .member-level-pick-filter {
            width: 100%;
            height: 32px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .member-level-pick-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .member-level-pick-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            user-select: none;
        }
        .member-level-pick-item input {
            accent-color: var(--color-primary, #ff7019);
            margin: 0;
        }
        .member-level-pick-modal__footer {
            padding: 12px 16px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
        }
        .member-level-product-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
        }
        .member-level-product-filter .erp-input,
        .member-level-product-filter .erp-select {
            height: 32px;
            box-sizing: border-box;
        }
        .member-level-product-filter__cat {
            width: 140px;
        }
        .member-level-product-filter .erp-input {
            width: 160px;
        }
        .member-level-product-table-wrap {
            max-height: min(48vh, 420px);
            overflow: auto;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        .member-level-product-table {
            margin: 0;
        }
        .member-level-product-table th,
        .member-level-product-table td {
            vertical-align: middle;
        }
        .member-level-product-row.is-checked {
            background: #fff7f0;
        }
        .member-level-product-thumb {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
            background: #f5f5f5;
        }
        .member-level-product-thumb--empty {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #bbb;
        }
        .member-level-product-name {
            font-size: 13px;
            color: #333;
            line-height: 1.35;
        }
        .member-level-product-cat {
            margin-top: 2px;
            font-size: 12px;
            color: #999;
        }
        .member-level-product-sku {
            font-size: 12px;
            color: #666;
            word-break: break-all;
            max-width: 220px;
        }
        .member-level-product-price {
            font-size: 13px;
            color: #333;
            white-space: nowrap;
        }
        #memberLevelForm .erp-input:disabled,
        #memberLevelForm .erp-select:disabled,
        #memberLevelForm input:disabled,
        #memberLevelForm select:disabled,
        #memberLevelForm textarea:disabled,
        #memberLevelForm button:disabled {
            background: #f5f5f5 !important;
            color: #bbb !important;
            border-color: #e8e8e8 !important;
            cursor: not-allowed;
            opacity: 1;
            -webkit-text-fill-color: #bbb;
            box-shadow: none;
        }
        #memberLevelForm .member-level-unit:has(.erp-input:disabled) .member-level-unit__text {
            color: #bbb;
        }
        #memberLevelForm .member-level-coupon-picker__trigger:disabled,
        #memberLevelForm .member-level-coupon-add:disabled,
        #memberLevelForm .member-level-coupon-remove:disabled {
            background: #f5f5f5 !important;
            color: #bbb !important;
            border-color: #e8e8e8 !important;
            cursor: not-allowed;
        }
        .erp-modal--ml-coupon {
            max-width: 920px;
            width: min(96vw, 920px);
        }
        .ml-coupon-table-wrap {
            width: 100%;
            overflow-x: hidden;
            border: 1px solid #eee;
            border-radius: 4px;
            background: #fff;
        }
        .ml-coupon-table {
            width: 100%;
            table-layout: fixed;
            min-width: 0 !important;
            margin: 0;
        }
        .ml-coupon-table th,
        .ml-coupon-table td {
            word-break: break-word;
            white-space: normal;
            vertical-align: middle;
            font-size: 12px;
            line-height: 1.4;
            padding: 8px 10px;
        }
        .ml-coupon-table th:nth-child(1),
        .ml-coupon-table td:nth-child(1) { width: 20%; }
        .ml-coupon-table th:nth-child(2),
        .ml-coupon-table td:nth-child(2) { width: 11%; }
        .ml-coupon-table th:nth-child(3),
        .ml-coupon-table td:nth-child(3) { width: 10%; }
        .ml-coupon-table th:nth-child(4),
        .ml-coupon-table td:nth-child(4) { width: 12%; }
        .ml-coupon-table th:nth-child(5),
        .ml-coupon-table td:nth-child(5) { width: 21%; }
        .ml-coupon-table th:nth-child(6),
        .ml-coupon-table td:nth-child(6) { width: 13%; }
        .ml-coupon-table th:nth-child(7),
        .ml-coupon-table td:nth-child(7) { width: 13%; }
        .ml-coupon-table tr.is-selected {
            background: #fff7f0;
        }
        .ml-coupon-table__check {
            display: inline-flex;
            align-items: flex-start;
            gap: 8px;
            cursor: pointer;
            margin: 0;
            font-size: 12px;
            color: #333;
            line-height: 1.4;
        }
        .ml-coupon-table__check input {
            margin: 2px 0 0;
            flex-shrink: 0;
            accent-color: var(--color-primary, #ff7019);
            width: 14px;
            height: 14px;
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/mdm-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content mdm-edit-page">
            <div class="content-tabs"><button class="active" id="formTabTitle">新增会员等级</button></div>
            <hr class="content-divider">
            <div class="content-title">会员 / 会员体系 / 会员等级 / <span id="formCrumb">新增</span></div>

            <div class="member-level-form-toolbar">
                <a class="member-level-form-back" id="btnBackList" href="mdm_member_level.html">← 返回会员等级</a>
            </div>

            <div id="memberLevelForm">
                <div class="pts-rule-card">
                    <div class="pts-rule-card__title">基础信息</div>
                    <div class="pts-rule-card__body">
                        <div class="pts-rule-field">
                            <label class="pts-rule-field__label" for="mlName"><span class="erp-req">*</span>等级名称</label>
                            <div class="pts-rule-field__control">
                                <input class="erp-input" id="mlName" type="text" maxlength="20" placeholder="请输入等级名称，20字以内">
                            </div>
                        </div>

                        <div class="pts-rule-field">
                            <label class="pts-rule-field__label"><span class="erp-req">*</span>等级图标</label>
                            <div class="pts-rule-field__control">
                                <div class="member-level-upload">
                                    <div class="member-level-upload__actions">
                                        <button type="button" class="member-level-upload__box" id="mlIconBtn" aria-label="上传等级图标">
                                            <span class="member-level-upload__plus">+</span>
                                        </button>
                                        <button type="button" class="member-level-upload__clear" id="mlIconClear" hidden>清除</button>
                                    </div>
                                    <input type="file" id="mlIconFile" accept="image/jpeg,image/png,image/webp,image/svg+xml" hidden>
                                    <p class="member-level-upload__hint">支持 JPG/PNG/WEBP/SVG，建议正方形，单张不超过 2MB；将展示给 C 端用户。</p>
                                </div>
                            </div>
                        </div>

                        <div class="pts-rule-field">
                            <label class="pts-rule-field__label" for="mlGrowth"><span class="erp-req">*</span>成长值</label>
                            <div class="pts-rule-field__control">
                                <div class="member-level-unit">
                                    <input class="erp-input" id="mlGrowth" type="number" min="0" step="1" placeholder="达到该成长值可享本等级">
                                    <span class="member-level-unit__text">分</span>
                                </div>
                                <div class="member-level-field-tip" id="mlGrowthTip">列表按成长值从低到高排序；达标后立即升级生效，降级于每日统一处理。成长值 0 为默认等级专用，新增不可使用。</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pts-rule-card">
                    <div class="pts-rule-card__title">会员权益</div>
                    <div class="pts-rule-card__body">
                        <!-- 赠送积分 -->
                        <div class="pts-rule-field" data-benefit="giftPoints">
                            <label class="pts-rule-field__label">赠送积分</label>
                            <div class="pts-rule-field__control">
                                <div class="member-level-benefit-head">
                                    <label class="member-level-check-label">
                                        <input type="checkbox" id="mlGiftPointsEnable" data-benefit-switch> 开启赠送积分
                                    </label>
                                </div>
                                <div class="member-level-benefit-body is-disabled" data-benefit-body>
                                    <div class="member-level-unit">
                                        <input class="erp-input" id="mlGiftPoints" type="number" min="0" step="1" placeholder="升级时赠送积分" disabled>
                                        <span class="member-level-unit__text">分</span>
                                    </div>
                                    <textarea class="erp-input member-level-desc" id="mlGiftPointsDesc" placeholder="说明（选填，支持多行）" disabled></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- 赠送券 -->
                        <div class="pts-rule-field" data-benefit="giftCoupon">
                            <label class="pts-rule-field__label">赠送券</label>
                            <div class="pts-rule-field__control">
                                <div class="member-level-benefit-head">
                                    <label class="member-level-check-label">
                                        <input type="checkbox" id="mlGiftCouponEnable" data-benefit-switch> 开启赠送券
                                    </label>
                                </div>
                                <div class="member-level-benefit-body is-disabled" data-benefit-body>
                                    <div class="member-level-coupon-block" data-coupon-block="gift">
                                        <div class="member-level-check-row" style="margin-bottom:8px;" data-coupon-modes></div>
                                        <div class="member-level-coupon-list" data-coupon-list></div>
                                        <button type="button" class="member-level-coupon-add" data-coupon-add disabled>+ 添加优惠券</button>
                                    </div>
                                    <textarea class="erp-input member-level-desc" id="mlGiftCouponDesc" placeholder="说明（选填，支持多行）" disabled></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- 商品会员折扣 -->
                        <div class="pts-rule-field" data-benefit="memberDiscount">
                            <label class="pts-rule-field__label">商品会员折扣</label>
                            <div class="pts-rule-field__control">
                                <div class="member-level-benefit-head">
                                    <label class="member-level-check-label">
                                        <input type="checkbox" id="mlDiscountEnable" data-benefit-switch> 开启商品会员折扣
                                    </label>
                                </div>
                                <div class="member-level-benefit-body is-disabled" data-benefit-body>
                                    <div class="member-level-unit">
                                        <input class="erp-input" id="mlDiscount" type="number" min="1" max="100" step="1" placeholder="如 90 表示 9 折" disabled>
                                        <span class="member-level-unit__text">%（如 90 表示 9 折）</span>
                                    </div>
                                    <div class="member-level-scope-box">
                                        <div class="member-level-field-tip" style="margin:0 0 8px;">适用范围</div>
                                        <div class="member-level-check-row" id="mlScopeTypeRow">
                                            <label class="member-level-check-label"><input type="radio" name="mlScopeType" value="all" checked disabled> 全部商品</label>
                                            <label class="member-level-check-label"><input type="radio" name="mlScopeType" value="include_product" disabled> 适用商品</label>
                                            <label class="member-level-check-label"><input type="radio" name="mlScopeType" value="include_category" disabled> 适用类目</label>
                                            <label class="member-level-check-label"><input type="radio" name="mlScopeType" value="exclude_product" disabled> 排除商品</label>
                                            <label class="member-level-check-label"><input type="radio" name="mlScopeType" value="exclude_category" disabled> 排除类目</label>
                                        </div>
                                        <div class="member-level-scope-actions" id="mlScopePickWrap" hidden>
                                            <button type="button" class="erp-btn" id="mlScopePickBtn" disabled>选择范围</button>
                                            <span class="member-level-field-tip" id="mlScopePickHint" style="margin:0;"></span>
                                        </div>
                                        <div class="member-level-scope-chips" id="mlScopeChips"></div>
                                        <div class="member-level-scope-empty" id="mlScopeEmpty" hidden>尚未选择，请点击上方按钮选择</div>
                                    </div>
                                    <textarea class="erp-input member-level-desc" id="mlDiscountDesc" placeholder="说明（选填，支持多行）" disabled></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- 消费积分等级赠送比例 -->
                        <div class="pts-rule-field" data-benefit="pointsRatio">
                            <label class="pts-rule-field__label">消费积分等级赠送比例</label>
                            <div class="pts-rule-field__control">
                                <div class="member-level-benefit-head">
                                    <label class="member-level-check-label">
                                        <input type="checkbox" id="mlPointsRatioEnable" data-benefit-switch> 开启消费积分等级赠送比例
                                    </label>
                                </div>
                                <div class="member-level-benefit-body is-disabled" data-benefit-body>
                                    <div class="member-level-unit">
                                        <input class="erp-input" id="mlPointsRatio" type="number" min="101" step="1" placeholder="须大于 100，如 150 表示 1.5 倍" disabled>
                                        <span class="member-level-unit__text">%（须大于 100，如 150 表示消费积分 1.5 倍）</span>
                                    </div>
                                    <textarea class="erp-input member-level-desc" id="mlPointsRatioDesc" placeholder="说明（选填，支持多行）" disabled></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- 生日送券 -->
                        <div class="pts-rule-field" data-benefit="birthday">
                            <label class="pts-rule-field__label">
                                生日送券
                                <span class="member-level-label-tip" title="会员生日月进行赠送，每年只会赠送一次" aria-label="会员生日月进行赠送，每年只会赠送一次">?</span>
                            </label>
                            <div class="pts-rule-field__control">
                                <div class="member-level-benefit-head">
                                    <label class="member-level-check-label">
                                        <input type="checkbox" id="mlBirthdayEnable" data-benefit-switch> 开启生日送券
                                    </label>
                                </div>
                                <div class="member-level-benefit-body is-disabled" data-benefit-body>
                                    <div class="member-level-coupon-block" data-coupon-block="birthday">
                                        <div class="member-level-check-row" style="margin-bottom:8px;display:none;" data-coupon-modes hidden></div>
                                        <div class="member-level-coupon-list" data-coupon-list></div>
                                        <button type="button" class="member-level-coupon-add" data-coupon-add disabled>+ 添加优惠券</button>
                                    </div>
                                    <textarea class="erp-input member-level-desc" id="mlBirthdayDesc" placeholder="说明（选填，支持多行）" disabled></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- 进入直播间特效 -->
                        <div class="pts-rule-field" data-benefit="liveEntryEffect">
                            <label class="pts-rule-field__label">
                                进入直播间特效
                                <span class="member-level-label-tip" title="该等级会员进入直播间时展示专属进场特效" aria-label="该等级会员进入直播间时展示专属进场特效">?</span>
                            </label>
                            <div class="pts-rule-field__control">
                                <div class="member-level-benefit-head">
                                    <label class="member-level-check-label">
                                        <input type="checkbox" id="mlLiveEntryEffectEnable" data-benefit-switch> 开启进入直播间特效
                                    </label>
                                </div>
                                <div class="member-level-benefit-body is-disabled" data-benefit-body>
                                    <div class="member-level-unit">
                                        <span class="member-level-unit__text">特效样式</span>
                                        <select class="erp-select" id="mlLiveEntryEffectType" disabled>
                                            <option value="banner">欢迎横幅</option>
                                            <option value="vehicle">进场座驾</option>
                                            <option value="fullscreen">全屏特效</option>
                                        </select>
                                    </div>
                                    <div class="lf-live-fx-preview" id="mlLiveEntryFxPreview" aria-label="进场特效预览">
                                        <div class="ua-live-fx-host" id="mlLiveEntryFxHost"></div>
                                    </div>
                                    <div class="lf-live-fx-preview-tip">预览示意：进入直播间时观众侧看到的特效样式</div>
                                    <textarea class="erp-input member-level-desc" id="mlLiveEntryEffectDesc" placeholder="说明（选填，如：进场展示金色欢迎横幅）" disabled></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="member-level-form-footer mdm-edit-page__footer">
                <button type="button" class="erp-btn" id="btnCancel">取消</button>
                <button type="button" class="erp-btn erp-btn--primary" id="btnSave">保存</button>
            </div>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/form-utils.js"></script>
    <script src="../js/mdm-product-catalog-store.js"></script>
    <script src="../js/mdm-member-level-data.js"></script>
    <script src="../js/mdm-member-product-picker.js"></script>
    <script src="../user-app/js/user-app-live-entry-fx.js"></script>
    <script src="../js/mdm-member-level-form.js?v=20260725-back"></script>
</body>
</html>
