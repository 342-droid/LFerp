<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 直播数据</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <link rel="stylesheet" href="../css/lf-live.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/live-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">直播数据</button></div>
            <hr class="content-divider">

            <div class="lf-live-session-picker">
                <label for="liveDataSession">选择直播场次</label>
                <select id="liveDataSession"></select>
            </div>

            <div id="liveDataEmpty" class="lf-live-empty-tip">选择一个直播场次后，可以查看该场直播数据</div>

            <div id="liveDataPanel" hidden>
                <div class="lf-live-metrics" id="liveDataMetrics"></div>

                <h3 class="lf-live-section-title">商品转化数据</h3>
                <section class="table-section">
                    <div class="table-scroll-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>排名</th>
                                    <th>商品名称</th>
                                    <th>规格</th>
                                    <th>点击率</th>
                                    <th>成交单数</th>
                                    <th>成交金额</th>
                                    <th>实收金额</th>
                                </tr>
                            </thead>
                            <tbody id="liveDataProductBody"></tbody>
                        </table>
                    </div>
                </section>
                <p class="lf-live-footnote">页面接口还未对接，当前数据仅供参考</p>
            </div>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/mdm-live-demo-data.js"></script>
    <script src="../js/mdm-live-data.js"></script>
</body>
</html>
