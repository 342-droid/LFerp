<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 商品类目</title>
    <link rel="stylesheet" href="../css/common.css">

    <script src="../js/path-prefix.js"></script>
