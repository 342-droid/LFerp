<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰售后 - 售后保障期管理</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-aftersale.css?v=20261028-filter-label-right">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/mdm-aftersale-guarantee.css?v=20261105-g1">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/aftersale-sidebar.js?v=20261105-g1"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="aftersale-page">
                <div class="aftersale-page-tabs" id="aftersalePageTabs"></div>
                <div class="aftersale-page-body as-g-page">
                    <div class="mdm-biz-tip" role="note">
                        售后期天数生效优先级：<strong>销售域商品售后期</strong>（商城 / 代采 / 直播排品，非必填） &gt; <strong>类目默认</strong> &gt; <strong>平台兜底</strong>。不按 SKU 配置。
                        <strong>用户端</strong>：整单完成后按<strong>各商品自己的售后期</strong>判断申请入口是否置灰，与结算起算节点无关。
                        <strong>结算</strong>：仅当起算节点选「售后期结束」时，才用整单履约确认 + 本单各商品售后期<strong>最大值</strong> + 结算周期生成结算单；若选「订单履约确认后」，则按整单完成日 + 结算周期，商品售后期不参与结算。
                    </div>
                    <div id="asGuaranteeApp"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/mdm-aftersale-guarantee-store.js?v=20261107-trigger-split"></script>
    <script src="../js/mdm-aftersale-guarantee.js?v=20261107-trigger-split"></script>
</body>
</html>
