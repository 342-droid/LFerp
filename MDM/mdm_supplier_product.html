<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 供货关系</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-product.css">
    <link rel="stylesheet" href="../vendor/octopus-prototype-runtime/runtime.css">
    <link rel="stylesheet" href="../vendor/octopus-prototype-runtime/theme.css">
    <style>
        [v-cloak] { display: none; }
        .supply-schema-host { min-height: 480px; }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/product-sidebar.js"></script>

    <div id="header-container"></div>

    <div class="container">
        <main class="main-content">
            <div class="product-page">
                <div class="product-page-tabs" id="productPageTabs" aria-label="页面页签"></div>
                <div class="product-page-body">
                    <div id="supplyApp" class="supply-schema-host" v-cloak>
                        <vab-schema-table
                            ref="table"
                            :columns="columns"
                            :request="requestRows"
                            row-key="skuCode"
                            :default-page-size="20"
                            :default-sorts="[]"
                            :auto-format-time="false">
                            <template v-slot:[slots.spucode]="{row}"><biz-no :value="row.spuCode"></biz-no></template>
                            <template v-slot:[slots.skucode]="{row}"><biz-no :value="row.skuCode"></biz-no></template>
                            <template v-slot:[slots.barcode]="{row}"><biz-no :value="row.barcode"></biz-no></template>
                            <template v-slot:[slots.supplystatus]="{row,elSize}">
                                <el-tag :size="elSize" :type="row.supplyStatus === '生效' ? 'success' : 'danger'">{{ row.supplyStatus }}</el-tag>
                            </template>
                            <template #actions="{row,elSize}">
                                <el-button :size="elSize" text type="primary" @click="editRow(row)">编辑</el-button>
                            </template>
                        </vab-schema-table>
                        <vab-schema-form-dialog
                            ref="editDialog"
                            title="供货关系-编辑"
                            dialog-width="720px"
                            label-width="168px"
                            :default-col-span="12"
                            :fields="editFields"
                            row-key-field="skuCode"
                            edit-success-message="供货关系已更新"
                            :before-submit="beforeSubmit"
                            :edit-api="saveSupply"
                            @saved="refreshTable">
                        </vab-schema-form-dialog>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/product-page-tabs.js"></script>
    <script src="../vendor/octopus-prototype-runtime/runtime.js"></script>
    <script src="../js/mdm-supplier-product-page.js"></script>
</body>
</html>
