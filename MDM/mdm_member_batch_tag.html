<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 批量打标签</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-product.css">
    <link rel="stylesheet" href="../css/mdm-member-segment-filter.css">
    <style>
        .member-batch-tip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            margin-left: 4px;
            border-radius: 50%;
            border: 1px solid #c0c4cc;
            color: #999;
            font-size: 10px;
            font-weight: 600;
            cursor: help;
            background: #fff;
            vertical-align: middle;
        }
        .th-with-tip { white-space: nowrap; }
        .member-batch-ops a { margin-right: 8px; }
        .member-batch-ops a:last-child { margin-right: 0; }
        .member-batch-rule-cell {
            max-width: 320px;
            font-size: 12px;
            color: #555;
            line-height: 1.55;
            white-space: normal;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .member-batch-rule-cell li { margin: 0 0 2px; }
        .member-batch-rule-cell li::before {
            content: '· ';
            color: #ff7019;
            font-weight: 700;
        }
        .member-batch-rule-empty { color: #bbb; }
        .member-batch-tags-cell {
            max-width: 240px;
            font-size: 12px;
            color: #555;
            line-height: 1.55;
            white-space: normal;
        }
        .member-batch-tags-cell strong {
            color: #333;
            font-weight: 600;
        }
        .member-batch-count-link {
            color: #2196F3;
            text-decoration: none;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .member-batch-count-link:hover { text-decoration: underline; color: #1976D2; }
        .member-batch-logic {
            display: inline-block;
            min-width: 28px;
            padding: 1px 8px;
            border-radius: 3px;
            background: rgba(255, 112, 25, 0.1);
            color: #ff7019;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }
        .btn.btn-outline {
            background: #fff;
            color: #ff7019;
            border: 1px solid #ff7019;
            box-sizing: border-box;
        }
        .btn.btn-outline:hover {
            background: #fff7f0;
            color: #e85f10;
            border-color: #e85f10;
        }
        a.btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/mdm-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">批量打标签</button></div>
            <hr class="content-divider">
            <div class="content-title">会员 / 会员360 / 批量打标签</div>

            <section class="search-section">
                <form class="search-form" id="batchTagSearchForm">
                    <div class="form-group">
                        <label>标签值:</label>
                        <div class="input-wrapper">
                            <input id="qTagValue" placeholder="请输入标签值">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>打标方式:</label>
                        <select id="qUpdateMode">
                            <option value="">全部</option>
                            <option value="manual">手动</option>
                            <option value="auto">自动</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>状态:</label>
                        <select id="qStatus">
                            <option value="">全部</option>
                            <option value="启用">启用</option>
                            <option value="停用">停用</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="btnFilterReset">重置</button>
                        <button type="button" class="btn btn-primary" id="btnFilterQuery">查询</button>
                        <a class="btn btn-outline" id="btnCreateBatchTag" href="mdm_member_batch_tag_form.html">批量打标签</a>
                    </div>
                </form>
            </section>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>打标标签</th>
                                <th>标签值处理</th>
                                <th>条件关系</th>
                                <th>筛选规则</th>
                                <th>人数</th>
                                <th class="th-with-tip">打标方式 <span class="member-batch-tip" title="手动则需要用户手动点击更新，才会触发更新；自动为系统每天凌晨开始更新">?</span></th>
                                <th>创建人</th>
                                <th>创建时间</th>
                                <th>更新时间</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                <div id="pagination-container"></div>
            </section>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/form-utils.js"></script>
    <script src="../js/mdm-product-proxy-region-picker.js"></script>
    <script src="../js/mdm-product-proxy-store-picker.js"></script>
    <script src="../js/mdm-member-segment-filter.js"></script>
    <script src="../js/mdm-member-batch-tag.js"></script>
</body>
</html>
