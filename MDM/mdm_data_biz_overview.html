    <script>
      /* 兼容丢失「?」的旧链接：…overview.htmlperiod=today&… → …overview.html?period=today&… */
      (function () {
        var path = location.pathname || '';
        var m = path.match(/^(.*\.html)([A-Za-z_][\w]*)=(.*)$/);
        if (!m) return;
        var qs = m[2] + '=' + m[3] + (location.search ? '&' + location.search.replace(/^\?/, '') : '');
        location.replace(m[1] + '?' + qs + location.hash);
      })();
    </script>
