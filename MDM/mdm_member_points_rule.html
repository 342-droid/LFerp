<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 积分规则</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <link rel="stylesheet" href="../css/lf-mdm-edit-page.css">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/lf-mdm-points-rule.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/mdm-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content mdm-edit-page">
            <div class="content-tabs"><button class="active">积分规则</button></div>
            <hr class="content-divider">

            <div class="mdm-biz-tip" role="note">本页为<strong>全局设置</strong>：积分有效期、积分兑换商品规则。消费送积分、积分抵现请分别在对应规则列表中配置。</div>

            <form id="memberPointsRuleForm">
                <div class="pts-rule-card">
                    <div class="pts-rule-card__title">积分规则</div>
                    <div class="pts-rule-card__body">
                        <div class="pts-rule-field">
                            <label class="pts-rule-field__label">开关</label>
                            <div class="pts-rule-field__control">
                                <div class="pts-rule-check-row">
                                    <label class="pts-rule-check-label">
                                        <input type="checkbox" id="ptsEnabled" checked> 开启积分功能
                                    </label>
                                </div>
                                <div class="pts-rule-tip">关闭后，用户端不展示积分相关能力，消费送积分 / 积分抵现 / 积分兑换均不生效。</div>
                            </div>
                        </div>
                        <div class="pts-rule-field" id="ptsValidityRow">
                            <label class="pts-rule-field__label" for="ptsValidityDays"><span class="erp-req">*</span>积分有效期</label>
                            <div class="pts-rule-field__control">
                                <div class="pts-rule-unit">
                                    <input class="erp-input" id="ptsValidityDays" type="number" min="1" step="1" value="365">
                                    <span class="pts-rule-unit__text">天</span>
                                </div>
                                <div class="pts-rule-tip">自获得之日起计算，到期后该笔积分失效。</div>
                            </div>
                        </div>
                        <div class="pts-rule-field" id="ptsDescRow">
                            <label class="pts-rule-field__label" for="ptsRuleDesc">规则说明</label>
                            <div class="pts-rule-field__control">
                                <textarea class="erp-input" id="ptsRuleDesc" placeholder="请输入积分规则说明，将展示给用户端（选填）"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pts-rule-card" id="exchangeRuleCard">
                    <div class="pts-rule-card__title">
                        积分兑换商品规则
                        <i class="pts-rule-help" title="积分可兑换商品请前往营销-积分商城处配置" aria-label="积分可兑换商品请前往营销-积分商城处配置">?</i>
                    </div>
                    <div class="pts-rule-card__body">
                        <div class="pts-rule-field">
                            <label class="pts-rule-field__label">开关</label>
                            <div class="pts-rule-field__control">
                                <div class="pts-rule-check-row">
                                    <label class="pts-rule-check-label">
                                        <input type="checkbox" id="exchangeEnabled" checked> 开启积分兑换商品
                                    </label>
                                </div>
                                <div class="pts-rule-tip">可兑换商品清单请在营销-积分商城配置。</div>
                            </div>
                        </div>
                        <div id="exchangeRuleBody">
                            <div class="pts-rule-field">
                                <label class="pts-rule-field__label">是否支持售后</label>
                                <div class="pts-rule-field__control">
                                    <div class="pts-rule-check-row">
                                        <label class="pts-rule-check-label">
                                            <input type="checkbox" id="exchangeRefundEnabled" checked> 支持售后
                                        </label>
                                    </div>
                                    <div class="pts-rule-tip">开启后，积分兑换商品支持售后退还积分。</div>
                                </div>
                            </div>
                            <div class="pts-rule-field" id="exchangeRefundValidityRow">
                                <label class="pts-rule-field__label">退还积分有效期</label>
                                <div class="pts-rule-field__control">
                                    <div class="pts-rule-check-row">
                                        <label class="pts-rule-check-label">
                                            <input type="radio" name="exchangeRefundValidity" value="keep_original" checked> 保留原有效期
                                        </label>
                                    </div>
                                    <div class="pts-rule-tip">若兑换时使用 100 积分，获取时间分别为 1 月 1 日 20 积分、1 月 2 日 80 积分，若售后需退还 50 积分，则退还积分的获取时间为 1 月 2 日 50 积分（按兑换扣减的逆序退回原批次）。</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pts-rule-actions mdm-edit-page__footer">
                    <button type="button" class="btn btn-secondary" id="btnPtsRuleReset">重置</button>
                    <button type="button" class="btn btn-primary" id="btnPtsRuleSave">保存配置</button>
                </div>
            </form>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/mdm-member-points-rule.js"></script>
</body>
</html>
