<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 全景总览</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/lf-mdm-ops-cockpit.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/mdm-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">全景总览</button></div>
            <hr class="content-divider">
            <div class="content-title">经营驾驶舱 · 全景总览</div>
            <section class="table-section" style="padding-top:0;" data-ck-overview>
                <div class="mdm-biz-tip" role="note" style="margin-bottom:12px;">
                    首屏只汇总<strong>消费者交易 GMV</strong>（直播／商城；POS 待接入）。<strong>RBT</strong>仅作独立「联营与回收」摘要，禁止与 GMV 相加。
                    <strong>财务确认收入</strong>分列；履约主指标按 <strong>SKU 件数</strong>。未接入数据展示「待接入／未获取」，不为 0。
                </div>
                <div class="ops-ck">
                    <div class="ops-ck__meta" data-ck-meta></div>
                    <div class="ops-ck__filters" data-ck-filters></div>

                    <h3 class="ops-ck-section-title">核心经营指标</h3>
                    <div class="ops-ck-kpi-grid" data-ck-kpis></div>

                    <div class="ops-ck-row">
                        <div class="ops-ck-card">
                            <div class="ops-ck-card__head">
                                <h3 class="ops-ck-card__title">经营趋势</h3>
                                <div class="ops-ck__chips" data-ck-trend-chips></div>
                            </div>
                            <div class="ops-ck-trend" data-ck-trend></div>
                        </div>
                        <div class="ops-ck-card">
                            <div class="ops-ck-card__head">
                                <h3 class="ops-ck-card__title">业务线构成（消费者交易）</h3>
                            </div>
                            <p class="ops-ck-note" style="margin-bottom:12px;">RBT 不计入本构成。POS 待接入时不算进合计占比。</p>
                            <div class="ops-ck-bars" data-ck-line-mix></div>
                        </div>
                    </div>

                    <div class="ops-ck-card ops-ck-card--soft">
                        <div class="ops-ck-card__head">
                            <h3 class="ops-ck-card__title">联营与回收（RBT · 独立摘要）</h3>
                            <a class="ops-ck-card__action" data-ck-rbt-link href="mdm_ops_rbt_recoup.html">进入 RBT 专题 ›</a>
                        </div>
                        <p class="ops-ck-note" data-ck-rbt-note style="margin-bottom:12px;"></p>
                        <div class="ops-ck-rbt" data-ck-rbt></div>
                    </div>

                    <h3 class="ops-ck-section-title">经营对象排行（分列，不可混排）</h3>
                    <div class="ops-ck-rank-grid" data-ck-ranks></div>

                    <div class="ops-ck-card ops-ck-card--soft">
                        <div class="ops-ck-card__head">
                            <h3 class="ops-ck-card__title">风险与预警</h3>
                            <a class="ops-ck-card__action" href="mdm_ops_alert.html">进入预警 ›</a>
                        </div>
                        <div class="ops-ck-alert-list" data-ck-alerts></div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/mdm-ops-cockpit-shared.js"></script>
    <script src="../js/mdm-ops-cockpit-data.js"></script>
    <script src="../js/mdm-ops-cockpit-overview.js"></script>
</body>
</html>
