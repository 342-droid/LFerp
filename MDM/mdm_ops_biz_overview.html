<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 全景总览</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-mdm-ops-cockpit.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/mdm-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">全景总览</button></div>
            <hr class="content-divider">
            <div class="content-title">全景总览</div>
            <section class="table-section" style="padding-top:0;" data-ck-overview>
                <div class="ops-ck">
                    <div class="ops-ck__meta" data-ck-meta></div>
                    <div class="ops-ck__filters" data-ck-filters></div>

                    <div class="ops-ck-tip" role="note" data-ck-board-tip>
                        看板按当前筛选主体口径汇总；待接入数据不计 0，展示为「待接入」。
                    </div>

                    <!-- 核心指标：主指标＋副卡＋展开更多 -->
                    <div class="ops-ck-board">
                        <div class="ops-ck-board__head">
                            <h3 class="ops-ck-board__title">核心指标</h3>
                        </div>
                        <div class="ops-ck-hero" data-ck-hero></div>
                        <div class="ops-ck-sec-grid" data-ck-secondary></div>
                        <button type="button" class="ops-ck-more-toggle" data-ck-more-toggle>
                            展开更多指标
                            <span class="ops-ck-more-toggle__icon" aria-hidden="true">▾</span>
                        </button>
                        <div class="ops-ck-more-kpis" data-ck-more-kpis hidden></div>
                    </div>

                    <!-- 模块对比：一眼看出哪块最好 -->
                    <div class="ops-ck-card ops-ck-card--soft">
                        <div class="ops-ck-card__head">
                            <h3 class="ops-ck-card__title">模块经营对比</h3>
                        </div>
                        <p class="ops-ck-note" style="margin-bottom:12px;">
                            对比零售／代采／POS／联营等业务模块（按贡献排序）；订单分账属收益清分，见下方「收益构成」。
                        </p>
                        <div data-ck-modules></div>
                    </div>

                    <div class="ops-ck-row">
                        <div class="ops-ck-card">
                            <div class="ops-ck-card__head">
                                <h3 class="ops-ck-card__title">经营趋势</h3>
                                <div class="ops-ck__chips" data-ck-trend-chips></div>
                            </div>
                            <div class="ops-ck-trend" data-ck-trend></div>
                        </div>
                        <div class="ops-ck-card" data-ck-comp-card>
                            <div class="ops-ck-card__head">
                                <h3 class="ops-ck-card__title" data-ck-comp-title>构成分析</h3>
                            </div>
                            <div class="ops-ck-comp-tabs" data-ck-comp-tabs></div>
                            <p class="ops-ck-note" data-ck-comp-note style="margin-bottom:12px;"></p>
                            <div class="ops-ck-donut-panel" data-ck-donut-panel></div>
                            <div class="ops-ck-comp-seg" data-ck-comp-seg></div>
                            <div class="ops-ck-mix-table-wrap" data-ck-mix-table></div>
                        </div>
                    </div>

                    <div class="ops-ck-card" data-ck-bill-card>
                        <div class="ops-ck-card__head">
                            <h3 class="ops-ck-card__title">营业额分账账单</h3>
                        </div>
                        <p class="ops-ck-note" data-ck-bill-note style="margin-bottom:12px;"></p>
                        <div class="ops-ck-bill-check" data-ck-bill-check></div>
                        <div class="ops-ck-bill" data-ck-bill></div>
                    </div>

                    <div class="ops-ck-card ops-ck-card--soft">
                        <div class="ops-ck-card__head">
                            <h3 class="ops-ck-card__title">联营与回收（RBT）</h3>
                        </div>
                        <p class="ops-ck-note" data-ck-rbt-note style="margin-bottom:12px;"></p>
                        <div class="ops-ck-rbt" data-ck-rbt></div>
                    </div>

                    <h3 class="ops-ck-section-title" data-ck-rank-title>经营对象排行</h3>
                    <div class="ops-ck-rank-grid" data-ck-ranks></div>

                    <div class="ops-ck-card ops-ck-card--soft">
                        <div class="ops-ck-card__head">
                            <h3 class="ops-ck-card__title">风险与预警</h3>
                        </div>
                        <div class="ops-ck-alert-list" data-ck-alerts></div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/mdm-ops-cockpit-shared.js"></script>
    <script src="../js/mdm-ops-cockpit-data.js"></script>
    <script src="../js/mdm-ops-cockpit-overview.js"></script>
</body>
</html>
