<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 注册有礼</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/lf-marketing-register-gift.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/marketing-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">注册有礼</button></div>
            <hr class="content-divider">

            <div class="mdm-biz-tip" role="note">若同一时段内有多个满足的活动，取最新创建的活动。</div>

            <section class="search-section">
                <form class="search-form" id="rgFilterForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>活动名称:</label>
                        <div class="input-wrapper">
                            <input id="qRgName" placeholder="请输入活动名称" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>应用端口:</label>
                        <select id="qRgPort">
                            <option value="">全部</option>
                            <option value="mini">小程序</option>
                            <option value="app">APP</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>状态:</label>
                        <select id="qRgStatus">
                            <option value="">全部</option>
                            <option value="upcoming">未开始</option>
                            <option value="active">进行中</option>
                            <option value="ended">已结束</option>
                            <option value="disabled">已禁用</option>
                        </select>
                    </div>
                    <div class="form-group form-group--rg-time form-group--datetime">
                        <label>活动时间:</label>
                        <div class="mkt-rg-filter-range" role="group" aria-label="活动时间筛选区间">
                            <span class="mkt-rg-datetime-wrap" id="qRgTimeStartWrap">
                                <input id="qRgTimeStart" type="datetime-local" step="60" title="筛选开始时间">
                                <button type="button" class="mkt-rg-datetime-clear" data-clear-for="qRgTimeStart" aria-label="清空开始时间">×</button>
                            </span>
                            <span class="sep">至</span>
                            <span class="mkt-rg-datetime-wrap" id="qRgTimeEndWrap">
                                <input id="qRgTimeEnd" type="datetime-local" step="60" title="筛选结束时间">
                                <button type="button" class="mkt-rg-datetime-clear" data-clear-for="qRgTimeEnd" aria-label="清空结束时间">×</button>
                            </span>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="rgFilterReset">重置</button>
                        <button type="button" class="btn btn-primary" id="rgFilterQuery">查询</button>
                    </div>
                </form>
            </section>

            <div class="mkt-rg-toolbar">
                <button type="button" class="erp-btn erp-btn--primary" id="rgAddBtn">新增活动</button>
            </div>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>活动ID</th>
                                <th>活动名称</th>
                                <th>应用端口</th>
                                <th>场景</th>
                                <th>活动时间</th>
                                <th>奖励</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>更新时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="rgTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/mdm-marketing-register-gift-store.js"></script>
    <script src="../js/mdm-marketing-register-gift.js"></script>
</body>
</html>
