<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 优惠券</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-mdm-edit-page.css">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/lf-mdm-points-rule.css">
    <link rel="stylesheet" href="../css/lf-marketing-template.css">
    <link rel="stylesheet" href="../css/lf-marketing-coupon.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/marketing-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content mdm-edit-page">
            <div class="content-tabs"><button class="active" id="cpFormTab">新建优惠券</button></div>
            <hr class="content-divider">

            <div class="mkt-rg-form-toolbar" style="margin-bottom:12px">
                <a class="mkt-rg-form-back" id="cpFormBack" href="mdm_marketing_coupon.html">← 返回优惠券</a>
            </div>

            <div class="mdm-biz-tip" id="cpFormTip" role="note"></div>

            <div id="cpFormPanel"></div>

            <div class="mdm-edit-page__footer">
                <button type="button" class="btn btn-secondary" id="cpBtnCancel">取消</button>
                <button type="button" class="btn btn-secondary" id="cpBtnSave">保存</button>
                <button type="button" class="btn btn-primary" id="cpBtnSubmit">提交</button>
                <button type="button" class="btn" id="cpBtnReject" hidden>审核失败</button>
                <button type="button" class="btn btn-primary" id="cpBtnApprove" hidden>审核成功</button>
            </div>
        </main>
    </div>

    <div id="tplSkuBackdrop" class="erp-modal-backdrop erp-modal-backdrop--nested mkt-tpl-sku-backdrop" hidden>
        <div class="erp-modal" role="dialog" aria-modal="true" aria-labelledby="tplSkuTitle">
            <div class="erp-modal__header">
                <h2 class="erp-modal__title" id="tplSkuTitle">选择商品（精确到规格）</h2>
                <div class="erp-modal__header-actions">
                    <button type="button" class="erp-modal__header-btn" id="tplSkuClose" aria-label="关闭">&times;</button>
                </div>
            </div>
            <div class="erp-modal__body">
                <input id="tplSkuKeyword" type="text" placeholder="搜索商品名称" style="width:100%;height:32px;padding:0 10px;border:1px solid #dcdfe6;border-radius:4px;">
                <div class="mkt-tpl-sku-tree" id="tplSkuTree"></div>
            </div>
            <div class="erp-modal__footer">
                <div class="mkt-tpl-sku-footer">
                    <span class="mkt-tpl-sku-footer__hint" id="tplSkuHint">已选 0 个规格</span>
                    <div class="mkt-tpl-sku-footer__actions">
                        <button type="button" class="erp-btn" id="tplSkuCancel">取消</button>
                        <button type="button" class="erp-btn erp-btn--primary" id="tplSkuOk">确定</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="cpRejectBackdrop" class="erp-modal-backdrop mkt-cp-reject-backdrop" hidden>
        <div class="erp-modal" role="dialog" aria-modal="true" aria-labelledby="cpRejectTitle">
            <div class="erp-modal__header">
                <h2 class="erp-modal__title">审核失败</h2>
                <div class="erp-modal__header-actions">
                    <button type="button" class="erp-modal__header-btn" id="cpRejectClose" aria-label="关闭">&times;</button>
                </div>
            </div>
            <div class="erp-modal__body">
                <div class="mkt-tpl-row">
                    <div class="mkt-tpl-row__label is-req">失败原因</div>
                    <div class="mkt-tpl-row__ctrl">
                        <textarea id="cpRejectReason" maxlength="200" placeholder="请填写审核失败原因，将回写到优惠券备注"></textarea>
                    </div>
                </div>
            </div>
            <div class="erp-modal__footer">
                <button type="button" class="erp-btn" id="cpRejectCancel">取消</button>
                <button type="button" class="erp-btn erp-btn--primary" id="cpRejectOk">确定</button>
            </div>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/mdm-marketing-coupon-store.js"></script>
    <script src="../js/mdm-marketing-coupon-goods-dialog.js"></script>
    <script src="../js/mdm-marketing-coupon-form-ui.js"></script>
    <script src="../js/mdm-marketing-coupon-form.js"></script>
</body>
</html>
