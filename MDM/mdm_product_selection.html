<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 选品库</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-product.css?v=20260808-price-unit">
    <link rel="stylesheet" href="../css/lf-product-selection-tag.css?v=20260902-tag">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/product-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="product-page">
                <div class="product-page-tabs" id="productPageTabs" aria-label="页面页签"></div>

                <div class="product-page-body">
                    <section class="erp-page__card product-filter-card">
                        <form class="product-filter-form" id="productSelectionFilterForm" onsubmit="return false;">
                            <div class="product-filter-grid">
                                <div class="product-filter-field">
                                    <label class="product-filter-field__label" for="qProductCode">商品编码</label>
                                    <input class="product-filter-field__input" id="qProductCode" type="text" placeholder="请输入商品编码">
                                </div>
                                <div class="product-filter-field">
                                    <label class="product-filter-field__label" for="qProductName">商品名称</label>
                                    <input class="product-filter-field__input" id="qProductName" type="text" placeholder="商品名称">
                                </div>
                                <div class="product-filter-field">
                                    <label class="product-filter-field__label" for="qProductCategory">商品类目</label>
                                    <select class="product-filter-field__select" id="qProductCategory">
                                        <option value="">请选择商品类目</option>
                                        <option value="新鲜蔬菜">新鲜蔬菜</option>
                                        <option value="时令水果">时令水果</option>
                                        <option value="粮油调味">粮油调味</option>
                                        <option value="肉禽蛋品">肉禽蛋品</option>
                                        <option value="酒水饮料">酒水饮料</option>
                                    </select>
                                </div>
                            </div>
                            <div class="product-filter-actions">
                                <button type="button" class="product-filter-btn product-filter-btn--primary" id="productFilterQuery">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                                    查询
                                </button>
                                <button type="button" class="product-filter-btn product-filter-btn--default" id="productFilterReset">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M5 19a9 9 0 0014-7"/><path d="M19 5a9 9 0 00-14 7"/></svg>
                                    重置
                                </button>
                            </div>
                        </form>
                    </section>

                    <section class="erp-page__card product-table-card">
                        <div class="product-toolbar">
                            <div class="product-toolbar__left">
                                <select class="product-toolbar__status" id="productStatusFilter" aria-label="商品状态筛选">
                                    <option value="">全部</option>
                                    <option value="pending_sale">待售卖</option>
                                    <option value="selling">售卖中</option>
                                    <option value="pending">待审核</option>
                                    <option value="rejected">审核未通过</option>
                                    <option value="stopped">已停售</option>
                                </select>
                                <button type="button" class="product-toolbar__ghost" id="productTagManageBtn">标签管理</button>
                                <button type="button" class="product-toolbar__add" id="productAddBtn">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                                    添加商品
                                </button>
                            </div>
                        </div>
                        <div class="product-table-wrap">
                            <table class="product-table">
                                <colgroup>
                                    <col class="product-table__col product-table__col--code">
                                    <col class="product-table__col product-table__col--img">
                                    <col class="product-table__col product-table__col--name">
                                    <col class="product-table__col product-table__col--price">
                                    <col class="product-table__col product-table__col--channel">
                                    <col class="product-table__col product-table__col--category">
                                    <col class="product-table__col product-table__col--status">
                                    <col class="product-table__col product-table__col--audit">
                                    <col class="product-table__col product-table__col--action">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th class="product-table__th product-table__th--code">商品编码</th>
                                        <th class="product-table__th product-table__th--img">商品图</th>
                                        <th class="product-table__th product-table__th--name">商品名称</th>
                                        <th class="product-table__th product-table__th--price">商品采购价</th>
                                        <th class="product-table__th product-table__th--channel">销售渠道</th>
                                        <th class="product-table__th product-table__th--category">商品类目</th>
                                        <th class="product-table__th product-table__th--status">商品状态</th>
                                        <th class="product-table__th product-table__th--audit">审核状态</th>
                                        <th class="product-table__th product-table__th--action">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="productSelectionTableBody"></tbody>
                            </table>
                        </div>
                        <div class="product-empty" id="productSelectionEmpty" hidden>暂无符合条件的商品</div>
                        <div class="product-pagination" id="productSelectionPagination">
                            <span id="productPaginationTotal">共 0 条</span>
                            <div class="product-pagination__right">
                                <select class="product-pagination__size" id="productPageSize" aria-label="每页条数">
                                    <option value="20" selected>20条/页</option>
                                    <option value="50">50条/页</option>
                                    <option value="100">100条/页</option>
                                </select>
                                <div class="product-pagination__pages" id="productPaginationPages"></div>
                                <label class="product-pagination__goto">
                                    前往
                                    <input id="productPageGoto" type="text" value="1" inputmode="numeric">
                                    页
                                </label>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <div id="selTagDrawerRoot" hidden>
        <div class="sel-tag-drawer-backdrop" id="selTagDrawerBackdrop"></div>
        <aside class="sel-tag-drawer" id="selTagDrawer" role="dialog" aria-modal="true" aria-labelledby="selTagDrawerTitle">
            <header class="sel-tag-drawer__header">
                <h2 class="sel-tag-drawer__title" id="selTagDrawerTitle">商品标签管理</h2>
                <button type="button" class="sel-tag-drawer__close" id="selTagDrawerClose" aria-label="关闭">&times;</button>
            </header>
            <div class="sel-tag-drawer__body">
                <div class="sel-tag-info" role="note">
                    <span class="sel-tag-info__icon" aria-hidden="true">i</span>
                    <div>
                        <p class="sel-tag-info__title">系统标签使用说明</p>
                        <p class="sel-tag-info__desc">系统标签由系统预置并维护，名称、颜色和业务语义不可修改或删除；业务可正常绑定、移除和筛选。具体用途请悬停“系统维护”查看。</p>
                    </div>
                </div>

                <form class="sel-tag-filter" id="selTagFilterForm" onsubmit="return false;">
                    <div class="sel-tag-filter__grid" id="selTagFilterGrid">
                        <div class="sel-tag-filter__field">
                            <label class="sel-tag-filter__label" for="selTagFilterName">标签名称</label>
                            <input class="sel-tag-filter__input" id="selTagFilterName" type="text" placeholder="请输入标签名称" autocomplete="off">
                        </div>
                        <div class="sel-tag-filter__field sel-tag-filter__extra" hidden>
                            <label class="sel-tag-filter__label" for="selTagFilterSource">来源</label>
                            <select class="sel-tag-filter__input" id="selTagFilterSource" aria-label="来源">
                                <option value="">全部</option>
                                <option value="system">系统管理</option>
                                <option value="business">业务创建</option>
                            </select>
                        </div>
                        <div class="sel-tag-filter__field sel-tag-filter__extra" hidden>
                            <label class="sel-tag-filter__label" for="selTagFilterStatus">状态</label>
                            <select class="sel-tag-filter__input" id="selTagFilterStatus" aria-label="状态">
                                <option value="">全部</option>
                                <option value="active">启用</option>
                                <option value="stopped">停用</option>
                            </select>
                        </div>
                    </div>
                    <div class="sel-tag-filter__actions">
                        <button type="button" class="product-filter-btn product-filter-btn--primary" id="selTagFilterQuery">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                            查询
                        </button>
                        <button type="button" class="product-filter-btn product-filter-btn--default" id="selTagFilterReset">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M5 19a9 9 0 0014-7"/><path d="M19 5a9 9 0 00-14 7"/></svg>
                            重置
                        </button>
                        <button type="button" class="product-filter-btn product-filter-btn--text" id="selTagFilterCollapse" aria-expanded="false">
                            <span id="selTagFilterCollapseLabel">展开</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                        </button>
                    </div>
                </form>

                <div class="sel-tag-toolbar">
                    <button type="button" class="product-toolbar__add" id="selTagAddBtn">+ 新增标签</button>
                </div>

                <div class="sel-tag-table-wrap">
                    <table class="sel-tag-table">
                        <colgroup>
                            <col style="width: 22%">
                            <col style="width: 14%">
                            <col style="width: 16%">
                            <col style="width: 14%">
                            <col>
                        </colgroup>
                        <thead>
                            <tr>
                                <th>标签名称</th>
                                <th>颜色</th>
                                <th>来源</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="selTagTableBody"></tbody>
                    </table>
                </div>
                <div class="sel-tag-empty" id="selTagEmpty" hidden>暂无标签</div>
                <div class="product-pagination" id="selTagPagination">
                    <span id="selTagPaginationTotal">共 0 条</span>
                    <div class="product-pagination__right">
                        <select class="product-pagination__size" id="selTagPageSize" aria-label="每页条数"></select>
                        <div class="product-pagination__pages" id="selTagPaginationPages"></div>
                        <label class="product-pagination__goto">
                            前往
                            <input id="selTagPageGoto" type="text" value="1" inputmode="numeric">
                            页
                        </label>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/product-page-tabs.js"></script>
    <script src="../js/mdm-product-catalog-store.js"></script>
    <script src="../js/mdm-product-selection-tag-store.js?v=20260902-no-skip-cutoff"></script>
    <script src="../js/mdm-product-add-drawer.js?v=20260902-no-skip-cutoff"></script>
    <script src="../js/mdm-product-selection.js"></script>
    <script src="../js/mdm-product-selection-tag.js"></script>
</body>
</html>
