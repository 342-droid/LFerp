<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 会员标签</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <style>
        .member-tag-toolbar {
            margin: 0 0 12px;
            display: flex;
            align-items: center;
        }
        .member-tag-option-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .member-tag-option-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .member-tag-option-row__label {
            flex: 0 0 48px;
            font-size: 13px;
            color: var(--color-text, #333);
            line-height: 32px;
            white-space: nowrap;
        }
        .member-tag-option-row .erp-input {
            flex: 1;
            min-width: 0;
        }
        .member-tag-option-row__remove {
            flex-shrink: 0;
            border: none;
            background: transparent;
            color: #2196F3;
            cursor: pointer;
            font-size: 13px;
            padding: 0 4px;
            line-height: 32px;
        }
        .member-tag-option-row__remove:hover {
            text-decoration: underline;
        }
        .member-tag-option-add {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 36px;
            margin-top: 2px;
            border: 1px dashed var(--color-border, #ddd);
            border-radius: var(--radius-sm, 4px);
            background: #fafafa;
            color: var(--color-text, #333);
            font-size: 13px;
            cursor: pointer;
        }
        .member-tag-option-add:hover {
            border-color: var(--color-primary, #ff7019);
            color: var(--color-primary, #ff7019);
            background: #fff7f0;
        }
        .erp-modal--member-tag {
            max-width: 560px;
        }
        .erp-modal--member-tag .erp-modal-field__label {
            flex: 0 0 96px;
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/mdm-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">会员标签</button></div>
            <hr class="content-divider">
            <div class="content-title">业务伙伴 / 会员中心 / 会员标签</div>

            <div class="member-tag-toolbar">
                <button type="button" class="erp-btn erp-btn--outline-primary" id="btnAddTag">新增标签</button>
            </div>

            <section class="search-section">
                <form class="search-form" id="memberTagSearchForm">
                    <div class="form-group">
                        <label>标签值:</label>
                        <div class="input-wrapper">
                            <input id="qTagValue" placeholder="请输入标签值">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>标签组:</label>
                        <div class="input-wrapper">
                            <input id="qTagGroup" placeholder="请输入标签组">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>标签组规则:</label>
                        <select id="qTagRule">
                            <option value="">全部</option>
                            <option value="单选">单选</option>
                            <option value="多选">多选</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>状态:</label>
                        <select id="qStatus">
                            <option value="">全部</option>
                            <option value="启用">启用</option>
                            <option value="禁用">禁用</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="btnFilterReset">重置</button>
                        <button type="button" class="btn btn-primary" id="btnFilterQuery">查询</button>
                    </div>
                </form>
            </section>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>标签值</th>
                                <th>标签组</th>
                                <th>标签组规则</th>
                                <th>关联用户数</th>
                                <th>创建时间</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                <div id="pagination-container"></div>
            </section>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/form-utils.js"></script>
    <script src="../js/mdm-member-tag.js"></script>
</body>
</html>
