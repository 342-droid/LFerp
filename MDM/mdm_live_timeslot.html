<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 直播时段</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <link rel="stylesheet" href="../css/lf-live.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/live-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">直播时段</button></div>
            <hr class="content-divider">

            <section class="search-section">
                <form class="search-form" id="liveSlotFilterForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>时段名称:</label>
                        <div class="input-wrapper">
                            <input id="qSlotName" placeholder="请输入时段名称" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="slotFilterReset">重置</button>
                        <button type="button" class="btn btn-primary" id="slotFilterQuery">查询</button>
                    </div>
                </form>
            </section>

            <div class="lf-live-toolbar">
                <button type="button" class="erp-btn erp-btn--primary" id="slotAddBtn">新建时段</button>
            </div>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width:72px;">序号</th>
                                <th>时段名称</th>
                                <th>已绑定直播数量</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="slotTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/mdm-live-demo-data.js"></script>
    <script src="../js/mdm-live-timeslot.js"></script>
</body>
</html>
