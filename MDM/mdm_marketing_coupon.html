<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 优惠券</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/lf-marketing-template.css">
    <link rel="stylesheet" href="../css/lf-marketing-coupon.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/marketing-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">优惠券</button></div>
            <hr class="content-divider">

            <div class="mdm-biz-tip" role="note">保存进入<strong>草稿</strong>（不校验必填）；提交进入<strong>待审核</strong>并生成审核记录。启用后的券才会按<strong>发放场景</strong>出现在直播发券、福袋送券、签到送券、观看任务送券、商城推荐位、会员等级送券、会员手工发券的选券列表中。仅从<strong>启用</strong>禁用后状态为<strong>禁用</strong>，可再启用，或编辑后保存为草稿、提交为待审核。</div>

            <section class="search-section">
                <form class="search-form" id="cpFilterForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>模板名称:</label>
                        <div class="input-wrapper">
                            <input id="qCpName" placeholder="券名称或模板ID" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>状态:</label>
                        <select id="qCpStatus">
                            <option value="">全部</option>
                            <option value="DRAFT">草稿</option>
                            <option value="PENDING">待审核</option>
                            <option value="APPROVED">审核成功</option>
                            <option value="REJECTED">审核失败</option>
                            <option value="ACTIVE">启用</option>
                            <option value="DISABLED">禁用</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>发放场景:</label>
                        <select id="qCpScene">
                            <option value="">全部</option>
                            <option value="LIVE">直播发券</option>
                            <option value="BAG">福袋送券</option>
                            <option value="SIGNIN">签到送券</option>
                            <option value="WATCH">观看任务送券</option>
                            <option value="MALL">商城推荐位</option>
                            <option value="LEVEL">会员等级送券</option>
                            <option value="MEMBER">会员手工发券</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>适用范围:</label>
                        <select id="qCpScope">
                            <option value="">全部</option>
                            <option value="ALL">全部商品</option>
                            <option value="GOODS">指定商品</option>
                            <option value="CATEGORY">指定类目</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cpFilterReset">重置</button>
                        <button type="button" class="btn btn-primary" id="cpFilterQuery">查询</button>
                    </div>
                </form>
            </section>

            <div class="mkt-tpl-toolbar">
                <button type="button" class="erp-btn erp-btn--primary" id="cpAddBtn">新建优惠券</button>
            </div>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>模板ID</th>
                                <th>券名称</th>
                                <th>券面值</th>
                                <th>券门槛</th>
                                <th>适用渠道</th>
                                <th>适用商品</th>
                                <th>创建时间</th>
                                <th style="text-align:center;width:100px">状态</th>
                                <th>备注</th>
                                <th style="width:240px">操作</th>
                            </tr>
                        </thead>
                        <tbody id="cpTableBody"></tbody>
                    </table>
                </div>
                <div id="pagination-container"></div>
            </section>
        </main>
    </div>

    <div id="tplLogDrawer" class="mkt-tpl-log-drawer" hidden>
        <div class="mkt-tpl-log-drawer__mask" id="tplLogMask"></div>
        <aside class="mkt-tpl-log-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="tplLogTitle">
            <div class="mkt-tpl-log-drawer__header">
                <div id="tplLogTitle">操作日志</div>
                <button type="button" class="mkt-tpl-log-drawer__x" id="tplLogClose" aria-label="关闭">×</button>
            </div>
            <div class="mkt-tpl-log-drawer__body">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width:170px">操作时间</th>
                                <th>操作内容</th>
                                <th style="width:120px">操作人</th>
                                <th>方法</th>
                                <th style="width:90px;text-align:center">结果</th>
                                <th style="width:90px">操作</th>
                            </tr>
                        </thead>
                        <tbody id="tplLogTableBody"></tbody>
                    </table>
                </div>
                <div id="tplLogPagination"></div>
            </div>
        </aside>
    </div>

    <div id="tplLogDetailBackdrop" class="erp-modal-backdrop erp-modal-backdrop--over-drawer mkt-tpl-log-detail-backdrop" hidden>
        <div class="erp-modal" role="dialog" aria-modal="true" aria-labelledby="tplLogDetailTitle">
            <div class="erp-modal__header">
                <h2 class="erp-modal__title" id="tplLogDetailTitle">操作日志详情</h2>
                <div class="erp-modal__header-actions">
                    <button type="button" class="erp-modal__header-btn" id="tplLogDetailClose" aria-label="关闭">&times;</button>
                </div>
            </div>
            <div class="erp-modal__body" id="tplLogDetailBody"></div>
            <div class="erp-modal__footer">
                <button type="button" class="erp-btn" id="tplLogDetailOk">关闭</button>
            </div>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/form-utils.js"></script>
    <script src="../js/mdm-marketing-coupon-store.js"></script>
    <script src="../js/mdm-marketing-coupon-goods-dialog.js"></script>
    <script src="../js/mdm-marketing-coupon-log-ui.js"></script>
    <script src="../js/mdm-marketing-coupon.js"></script>
</body>
</html>
