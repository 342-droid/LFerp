<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 成长值明细</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <style>
        .member-growth-toolbar {
            margin: 0 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .flow-box {
            margin: 0 0 14px;
            padding: 12px 14px;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
            line-height: 1.65;
        }
        .subject-name-link { color: #2196F3; text-decoration: none; font-weight: 600; }
        .subject-name-link:hover { text-decoration: underline; color: #1976D2; }
        .growth-change--plus { color: #2e7d32; font-weight: 600; }
        .growth-change--minus { color: #d32f2f; font-weight: 600; }
        .search-form .form-group input[type="datetime-local"] {
            height: 36px;
            min-width: 200px;
            border: 1px solid #ddd;
            border-radius: 3px;
            padding: 0 8px;
            box-sizing: border-box;
        }
        .erp-modal--growth-adjust {
            max-width: 520px;
            width: min(96vw, 520px);
        }
        .erp-modal--growth-adjust .erp-modal-field__label {
            flex: 0 0 112px;
        }
        .growth-adjust-member {
            min-height: 32px;
            line-height: 32px;
            font-size: 13px;
            color: #333;
        }
        .growth-adjust-tip {
            margin-top: 6px;
            font-size: 12px;
            color: #999;
            line-height: 1.45;
        }
        .growth-adjust-radio-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            min-height: 32px;
        }
        .growth-adjust-radio-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/mdm-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">成长值明细</button></div>
            <hr class="content-divider">
            <div class="content-title">业务伙伴 / 会员中心 / 会员等级 / 成长值明细</div>

            <div class="flow-box">
                记录会员成长值变动明细。获取方式包含：购物消费、用户活跃（与成长值规则中的活跃行为一致）、手工调整（手工增加 / 手工减少）。
                购物消费明细类型：订单完成、售后完成（关联售后单号）。
                有效 / 过期按「获取时间 + 成长值规则有效期」计算；有效记录不展示过期时间；手工调整会记录操作人。
                会员ID、关联订单/售后单号可跳转至对应详情。
            </div>

            <div class="member-growth-toolbar">
                <button type="button" class="erp-btn" id="btnBackLevel">返回会员等级</button>
                <button type="button" class="erp-btn" id="btnGotoRule">成长值规则</button>
            </div>

            <section class="search-section">
                <form class="search-form" id="growthDetailSearchForm">
                    <div class="form-group">
                        <label>会员:</label>
                        <div class="input-wrapper">
                            <input id="qMember" placeholder="会员ID / 昵称 / 手机号">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>开始时间:</label>
                        <input id="qTimeStart" type="datetime-local" step="1">
                    </div>
                    <div class="form-group">
                        <label>结束时间:</label>
                        <input id="qTimeEnd" type="datetime-local" step="1">
                    </div>
                    <div class="form-group">
                        <label>获取方式:</label>
                        <select id="qAcquireType">
                            <option value="">全部</option>
                            <option value="consume">购物消费</option>
                            <option value="activity">用户活跃</option>
                            <option value="manual">手工调整</option>
                        </select>
                    </div>
                    <div class="form-group" id="qAcquireSubGroup" style="display:none;">
                        <label id="qAcquireSubLabel">明细类型:</label>
                        <select id="qAcquireSub"></select>
                    </div>
                    <div class="form-group">
                        <label>状态:</label>
                        <select id="qStatus">
                            <option value="">全部</option>
                            <option value="有效">有效</option>
                            <option value="过期">过期</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="btnFilterReset">重置</button>
                        <button type="button" class="btn btn-primary" id="btnFilterQuery">查询</button>
                    </div>
                </form>
            </section>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>流水号</th>
                                <th>会员ID</th>
                                <th>会员昵称</th>
                                <th>手机号</th>
                                <th>获取方式</th>
                                <th>明细类型</th>
                                <th>变动成长值</th>
                                <th>关联单号</th>
                                <th>备注</th>
                                <th>获取时间</th>
                                <th>过期时间</th>
                                <th>状态</th>
                                <th>操作人</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                <div id="pagination-container"></div>
            </section>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/form-utils.js"></script>
    <script src="../js/mdm-member-level-growth.js"></script>
</body>
</html>
