<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 成长值明细</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <style>
        .member-growth-toolbar {
            margin: 0 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .flow-box {
            margin: 0 0 14px;
            padding: 12px 14px;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
            line-height: 1.65;
        }
        .subject-name-link { color: #2196F3; text-decoration: none; font-weight: 600; }
        .subject-name-link:hover { text-decoration: underline; color: #1976D2; }
        .growth-change--plus { color: #2e7d32; font-weight: 600; }
        .growth-change--minus { color: #d32f2f; font-weight: 600; }
        .search-form .form-group input[type="datetime-local"] {
            height: 32px;
            min-width: 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 0 28px 0 8px;
            box-sizing: border-box;
        }
        .growth-datetime-row {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }
        .growth-datetime-wrap {
            position: relative;
            display: inline-block;
        }
        .growth-datetime-wrap input[type="datetime-local"] {
            width: 210px;
        }
        .growth-datetime-clear {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            border: none;
            border-radius: 50%;
            background: #ddd;
            color: #666;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            padding: 0;
            display: none;
        }
        .growth-datetime-wrap.has-value:hover .growth-datetime-clear,
        .growth-datetime-wrap.has-value:focus-within .growth-datetime-clear { display: block; }
        .growth-datetime-clear:hover { background: #ccc; color: #333; }
        .growth-datetime-row .sep { color: #999; font-size: 12px; }
        /* 筛选项按内容宽度紧凑排列，放不下再换行 */
        #growthDetailSearchForm.search-form {
            gap: 16px 20px;
        }
        #growthDetailSearchForm.search-form > .form-group {
            flex: 0 0 auto;
            max-width: none;
            width: auto;
        }
        #growthDetailSearchForm.search-form > .form-group.form-group--datetime {
            flex: 0 0 auto;
            max-width: none;
        }
        #growthDetailSearchForm .form-group input,
        #growthDetailSearchForm .form-group select {
            width: 180px;
        }
        #growthDetailSearchForm .growth-datetime-wrap input[type="datetime-local"] {
            width: 190px;
        }
        .btn.btn-outline {
            background: #fff;
            color: #ff7019;
            border: 1px solid #ff7019;
            box-sizing: border-box;
        }
        .btn.btn-outline:hover {
            background: #fff7f0;
            color: #e85f10;
            border-color: #e85f10;
        }
        .growth-member-search-box {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .growth-member-search-box .erp-input { flex: 1; }
        .growth-member-result {
            margin-top: 10px;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        .growth-member-result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-bottom: 1px solid #f5f5f5;
            font-size: 13px;
            cursor: pointer;
        }
        .growth-member-result-item:last-child { border-bottom: none; }
        .growth-member-result-item:hover { background: #fff7f0; }
        .growth-member-result-empty {
            padding: 16px;
            text-align: center;
            color: #999;
            font-size: 13px;
        }
        .growth-member-picked {
            margin-top: 8px;
            padding: 8px 10px;
            background: #fafafa;
            border-radius: 4px;
            font-size: 13px;
        }
        .erp-modal--growth-adjust {
            max-width: 520px;
            width: min(96vw, 520px);
        }
        .erp-modal--growth-adjust .erp-modal-field__label {
            flex: 0 0 112px;
        }
        .growth-adjust-member {
            min-height: 32px;
            line-height: 32px;
            font-size: 13px;
            color: #333;
        }
        .growth-adjust-tip {
            margin-top: 6px;
            font-size: 12px;
            color: #999;
            line-height: 1.45;
        }
        .growth-adjust-radio-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            min-height: 32px;
        }
        .growth-adjust-radio-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/mdm-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">成长值明细</button></div>
            <hr class="content-divider">

            <section class="search-section">
                <form class="search-form" id="growthDetailSearchForm">
                    <div class="form-group">
                        <label>会员:</label>
                        <div class="input-wrapper">
                            <input id="qMember" placeholder="会员ID / 昵称 / 手机号">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group form-group--datetime">
                        <label>获取时间:</label>
                        <div class="growth-datetime-row">
                            <span class="growth-datetime-wrap" data-datetime-wrap>
                                <input id="qTimeStart" type="datetime-local" step="1" title="开始时间">
                                <button type="button" class="growth-datetime-clear" data-clear-datetime="qTimeStart" aria-label="清空">×</button>
                            </span>
                            <span class="sep">至</span>
                            <span class="growth-datetime-wrap" data-datetime-wrap>
                                <input id="qTimeEnd" type="datetime-local" step="1" title="结束时间">
                                <button type="button" class="growth-datetime-clear" data-clear-datetime="qTimeEnd" aria-label="清空">×</button>
                            </span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>获取方式:</label>
                        <select id="qAcquireType">
                            <option value="">全部</option>
                            <option value="consume">购物消费</option>
                            <option value="activity">用户活跃</option>
                            <option value="manual">手工调整</option>
                        </select>
                    </div>
                    <div class="form-group" id="qAcquireSubGroup" style="display:none;">
                        <label id="qAcquireSubLabel">明细类型:</label>
                        <select id="qAcquireSub"></select>
                    </div>
                    <div class="form-group">
                        <label>状态:</label>
                        <select id="qStatus">
                            <option value="">全部</option>
                            <option value="有效">有效</option>
                            <option value="过期">过期</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="btnFilterReset">重置</button>
                        <button type="button" class="btn btn-primary" id="btnFilterQuery">查询</button>
                        <button type="button" class="btn btn-outline" id="btnAdjustGrowth">调整</button>
                    </div>
                </form>
            </section>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>流水号</th>
                                <th>会员ID</th>
                                <th>会员昵称</th>
                                <th>手机号</th>
                                <th>获取方式</th>
                                <th>明细类型</th>
                                <th>变动成长值</th>
                                <th>关联单号</th>
                                <th>备注</th>
                                <th>获取时间</th>
                                <th>过期时间</th>
                                <th>状态</th>
                                <th>操作人</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                <div id="pagination-container"></div>
            </section>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/form-utils.js"></script>
    <script src="../js/mdm-member-growth-acquire.js"></script>
    <script src="../js/mdm-member-level-growth.js"></script>
</body>
</html>
