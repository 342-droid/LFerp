<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 秒杀活动</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-mdm-points-rule.css">
    <link rel="stylesheet" href="../css/lf-mdm-edit-page.css">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/lf-product.css">
    <link rel="stylesheet" href="../css/lf-live.css">
    <link rel="stylesheet" href="../css/lf-marketing-register-gift.css">
    <link rel="stylesheet" href="../css/lf-marketing-seckill.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/marketing-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content mdm-edit-page" id="skFormMain">
            <div class="content-tabs"><button class="active" id="skFormTabTitle">创建秒杀活动</button></div>
            <hr class="content-divider">

            <div class="mkt-sk-form-toolbar">
                <a class="mkt-sk-form-back" href="mdm_marketing_seckill.html">← 返回秒杀</a>
            </div>

            <div class="mkt-sk-steps" role="tablist">
                <button type="button" class="active" data-tab="info" id="skStepInfo">第一步 活动信息</button>
                <button type="button" data-tab="products" id="skStepProducts">第二步 设置活动商品</button>
            </div>

            <div id="skTabInfo" class="mkt-sk-tab">
                <div class="pts-rule-card">
                    <div class="pts-rule-card__title">基础信息</div>
                    <div class="pts-rule-card__body">
                        <div class="pts-rule-field">
                            <label class="pts-rule-field__label"><span class="erp-req">*</span>活动名称</label>
                            <div class="pts-rule-field__control">
                                <input class="erp-input pts-rule-field__input--name" id="skName" type="text" placeholder="请输入活动名称" maxlength="50" autocomplete="off">
                                <div class="mkt-sk-char-count"><span id="skNameCount">0</span>/50</div>
                            </div>
                        </div>
                        <div class="pts-rule-field">
                            <label class="pts-rule-field__label"><span class="erp-req">*</span>活动时间</label>
                            <div class="pts-rule-field__control">
                                <div class="pts-rule-check-row" id="skTimeModeRow">
                                    <label class="pts-rule-check-label">
                                        <input type="radio" name="skTimeMode" value="range" checked> 指定时间
                                    </label>
                                    <label class="pts-rule-check-label">
                                        <input type="radio" name="skTimeMode" value="forever"> 永久有效
                                    </label>
                                </div>
                                <div class="mkt-sk-datetime-row" id="skTimeRangeRow" style="margin-top:10px;">
                                    <input class="erp-input" id="skStartAt" type="datetime-local" step="60" title="开始时间" style="max-width:220px;">
                                    <span class="sep" id="skTimeSep">至</span>
                                    <input class="erp-input" id="skEndAt" type="datetime-local" step="60" title="结束时间" style="max-width:220px;">
                                </div>
                            </div>
                        </div>
                        <div class="pts-rule-field">
                            <label class="pts-rule-field__label"><span class="erp-req">*</span>商品限购</label>
                            <div class="pts-rule-field__control">
                                <div class="pts-rule-check-row" id="skLimitRow">
                                    <label class="pts-rule-check-label">
                                        <input type="radio" name="skLimitType" value="none" checked> 不限购
                                    </label>
                                    <label class="pts-rule-check-label">
                                        <input type="radio" name="skLimitType" value="order"> 每单限购
                                    </label>
                                    <label class="pts-rule-check-label">
                                        <input type="radio" name="skLimitType" value="daily"> 每天限购
                                    </label>
                                    <label class="pts-rule-check-label">
                                        <input type="radio" name="skLimitType" value="total"> 累计限购
                                    </label>
                                    <span class="mkt-sk-limit-qty" id="skLimitQtyWrap" hidden>
                                        <input class="erp-input" id="skLimitQty" type="number" min="1" step="1" placeholder="限购件数">
                                        <span>件</span>
                                    </span>
                                </div>
                                <div class="pts-rule-tip">活动里所有商品共同受此限购控制</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pts-rule-card">
                    <div class="pts-rule-card__title">售卖范围</div>
                    <div class="pts-rule-card__body">
                        <div class="pts-rule-field">
                            <label class="pts-rule-field__label">范围类型</label>
                            <div class="pts-rule-field__control">
                                <div class="pts-rule-check-row" id="skSaleScope">
                                    <label class="pts-rule-check-label">
                                        <input type="radio" name="skSaleScope" value="all" checked> 全部
                                    </label>
                                    <label class="pts-rule-check-label">
                                        <input type="radio" name="skSaleScope" value="region"> 省市区
                                    </label>
                                    <label class="pts-rule-check-label">
                                        <input type="radio" name="skSaleScope" value="store"> 门店
                                    </label>
                                </div>
                                <div class="product-proxy-sale-scope__region" id="skSaleScopeRegion" hidden>
                                    <div class="product-proxy-sale-scope__alert">
                                        <span class="product-proxy-sale-scope__alert-icon">i</span>
                                        <span class="product-proxy-sale-scope__alert-text">支持按省 / 市 / 区配置售卖范围，可勾选整省、整市或具体区县</span>
                                    </div>
                                    <button type="button" class="product-proxy-sale-scope__pick" id="skSaleScopePickBtn">+ 选择区域</button>
                                    <div class="product-proxy-sale-scope__tags" id="skSaleScopeTags"></div>
                                </div>
                                <div class="product-proxy-sale-scope__store" id="skSaleScopeStore" hidden>
                                    <button type="button" class="product-proxy-sale-scope__pick" id="skSaleScopeStorePickBtn">+ 选择门店</button>
                                    <p class="product-proxy-sale-scope__store-count" id="skSaleScopeStoreCount" hidden>已选择 0 个门店</p>
                                </div>
                            </div>
                        </div>
                        <div class="pts-rule-field" style="margin-top:16px;">
                            <label class="pts-rule-field__label">售卖端口</label>
                            <div class="pts-rule-field__control">
                                <div class="pts-rule-check-row" id="skPortScope">
                                    <label class="pts-rule-check-label">
                                        <input type="radio" name="skPortScope" value="all" checked> 不限
                                    </label>
                                    <label class="pts-rule-check-label">
                                        <input type="radio" name="skPortScope" value="custom"> 指定端口
                                    </label>
                                </div>
                                <div class="pts-rule-check-row mkt-sk-port-list" id="skPortList" hidden>
                                    <label class="pts-rule-check-label">
                                        <input type="checkbox" data-field="salePort" value="mini_program">
                                        <span>小程序</span>
                                    </label>
                                    <label class="pts-rule-check-label">
                                        <input type="checkbox" data-field="salePort" value="app">
                                        <span>APP</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="pts-rule-field" style="margin-top:16px;">
                            <label class="pts-rule-field__label"><span class="erp-req">*</span>售卖场景</label>
                            <div class="pts-rule-field__control">
                                <div class="pts-rule-check-row" id="skSceneRow">
                                    <label class="pts-rule-check-label">
                                        <input type="checkbox" data-field="scene" value="mall"> 商城
                                    </label>
                                    <label class="pts-rule-check-label">
                                        <input type="checkbox" data-field="scene" value="live"> 直播
                                    </label>
                                </div>
                                <div class="pts-rule-tip">可多选，至少选择一个</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pts-rule-card">
                    <div class="pts-rule-card__title">参与限制</div>
                    <div class="pts-rule-card__body">
                        <div class="pts-rule-field">
                            <label class="pts-rule-field__label"><span class="erp-req">*</span>购买限制</label>
                            <div class="pts-rule-field__control">
                                <div class="pts-rule-check-row">
                                    <label class="pts-rule-check-label">
                                        <input type="radio" name="skBuyLimit" value="all" checked> 全部用户
                                    </label>
                                    <label class="pts-rule-check-label">
                                        <input type="radio" name="skBuyLimit" value="neu"> 新用户
                                    </label>
                                </div>
                                <div class="pts-rule-tip" id="skBuyLimitTip">新用户：没有支付过订单的用户；奖品中的实物商品兑换不算支付过的订单。避免用户多次生成待支付订单，支付时需再次校验该用户是否为新用户。</div>
                            </div>
                        </div>
                        <div class="pts-rule-field" id="skUnqualifiedRow" hidden>
                            <label class="pts-rule-field__label"><span class="erp-req">*</span>不符合条件用户</label>
                            <div class="pts-rule-field__control">
                                <div class="pts-rule-check-row">
                                    <label class="pts-rule-check-label">
                                        <input type="radio" name="skUnqualified" value="deny" checked> 不支持购买
                                    </label>
                                    <label class="pts-rule-check-label">
                                        <input type="radio" name="skUnqualified" value="origin"> 允许原价购买
                                    </label>
                                </div>
                                <div class="pts-rule-tip">原价指商城 / 直播排品中的售价。选择「允许原价购买」后，不符合购买限制的用户不享受秒杀价。</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="skTabProducts" class="mkt-sk-tab" hidden>
                <section class="search-section">
                    <form class="search-form mkt-sk-prod-filter" id="skProdFilterForm" onsubmit="return false;">
                        <div class="form-group">
                            <label>商品编号:</label>
                            <div class="input-wrapper">
                                <input id="qSkProdCode" placeholder="请输入商品编号" autocomplete="off">
                                <span class="clear-btn">×</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>商品名称:</label>
                            <div class="input-wrapper">
                                <input id="qSkProdName" placeholder="请输入商品名称" autocomplete="off">
                                <span class="clear-btn">×</span>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" id="skProdFilterReset">重置</button>
                            <button type="button" class="btn btn-primary" id="skProdFilterQuery">查询</button>
                        </div>
                    </form>
                </section>
                <div class="lf-live-toolbar" id="skProdToolbar">
                    <button type="button" class="erp-btn erp-btn--primary" id="skProdAddBtn">+ 添加商品</button>
                </div>
                <section class="table-section">
                    <div class="table-scroll-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>序号</th>
                                    <th>商品编号</th>
                                    <th>图片</th>
                                    <th>商品名称</th>
                                    <th>类目</th>
                                    <th>规格</th>
                                    <th>秒杀价</th>
                                    <th>划线价</th>
                                    <th>库存</th>
                                    <th>添加时间</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="skProdTableBody"></tbody>
                        </table>
                    </div>
                    <div id="skProdPagination"></div>
                </section>
            </div>

            <div class="mdm-edit-page__footer" id="skFormFooter">
                <button type="button" class="btn btn-secondary" id="skFormCancel">取消</button>
                <button type="button" class="btn btn-secondary" id="skFormPrev" hidden>上一步</button>
                <button type="button" class="btn btn-primary" id="skFormNext">下一步</button>
                <button type="button" class="btn btn-primary" id="skFormSave" hidden>保存</button>
                <button type="button" class="btn btn-secondary" id="skFormBack" hidden>返回</button>
            </div>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/mdm-product-mall-library.js"></script>
    <script src="../js/mdm-product-proxy-library-drawer.js"></script>
    <script src="../js/mdm-product-proxy-region-picker.js"></script>
    <script src="../js/mdm-product-proxy-store-picker.js"></script>
    <script src="../js/mdm-marketing-seckill-store.js"></script>
    <script src="../js/mdm-marketing-seckill-form.js"></script>
</body>
</html>
