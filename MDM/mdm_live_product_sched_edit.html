<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 直播排品编辑</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-mdm-points-rule.css">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/lf-product.css?v=20260903-stock-collapse">
    <link rel="stylesheet" href="../css/lf-mdm-edit-page.css">
    <link rel="stylesheet" href="../css/lf-live.css?v=20260831-wh-stock">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/live-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content mdm-edit-page lf-live-edit-page">
            <div class="content-tabs"><button class="active">直播排品编辑</button></div>
            <hr class="content-divider">

            <div class="lf-live-edit-header">
                <div class="lf-live-edit-header__left">
                    <a class="lf-live-form-back" id="schedEditBack" href="mdm_live_product_sched.html">← 返回直播排品</a>
                    <span class="lf-live-edit-header__divider">/</span>
                    <span class="lf-live-edit-header__title">编辑直播商品</span>
                </div>
                <div class="lf-live-edit-header__right">商品 ID：<span id="schedProductId">-</span></div>
            </div>

            <div id="schedEditEmpty" class="lf-live-empty-tip" hidden>未找到该直播商品</div>

            <form id="schedEditForm" onsubmit="return false;" hidden>
                <div class="pts-rule-card lf-live-card">
                    <div class="pts-rule-card__title">基础信息</div>
                    <div class="pts-rule-card__body lf-live-edit-grid">
                        <div class="pts-rule-field lf-live-edit-grid__full">
                            <label class="pts-rule-field__label" for="pName"><span class="erp-req">*</span>商品名称</label>
                            <div class="pts-rule-field__control">
                                <input class="erp-input" id="pName" placeholder="请输入商品名称">
                            </div>
                        </div>
                        <div class="pts-rule-field">
                            <label class="pts-rule-field__label" for="pArrival">预计到店时间</label>
                            <div class="pts-rule-field__control">
                                <div class="pts-rule-unit">
                                    <input class="erp-input" id="pArrival" placeholder="请输入预计到店时间">
                                    <select class="erp-select" id="pArrivalUnit">
                                        <option value="DAY">天</option>
                                        <option value="HOUR">小时</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="pts-rule-field">
                            <label class="pts-rule-field__label"><span class="erp-req">*</span>配送方式</label>
                            <div class="pts-rule-field__control">
                                <div class="lf-live-radio-row">
                                    <label class="lf-live-radio"><input type="radio" name="deliveryMode" value="express" checked> 快递配送</label>
                                    <label class="lf-live-radio"><input type="radio" name="deliveryMode" value="pickup"> 自提</label>
                                </div>
                            </div>
                        </div>
                        <div class="pts-rule-field">
                            <label class="pts-rule-field__label" for="pCategory">商品类目</label>
                            <div class="pts-rule-field__control">
                                <select class="erp-select" id="pCategory"></select>
                            </div>
                        </div>
                        <div class="pts-rule-field">
                            <label class="pts-rule-field__label">展示销量</label>
                            <div class="pts-rule-field__control">
                                <div class="lf-live-radio-row">
                                    <label class="lf-live-radio"><input type="radio" name="displaySalesMode" value="ACTUAL" checked> 实际销量</label>
                                    <label class="lf-live-radio"><input type="radio" name="displaySalesMode" value="CUSTOM"> 自定义销量</label>
                                </div>
                                <input class="erp-input lf-live-edit-sales-input" id="pDisplaySales" placeholder="请输入展示销量" hidden>
                            </div>
                        </div>
                        <div class="pts-rule-field lf-live-edit-grid__full">
                            <label class="pts-rule-field__label" for="pDesc">文字描述</label>
                            <div class="pts-rule-field__control">
                                <textarea class="erp-input lf-live-textarea" id="pDesc" rows="4" placeholder="请输入商品文字描述"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pts-rule-card lf-live-card">
                    <div class="pts-rule-card__title">
                        <span>售卖规格配置</span>
                        <button type="button" class="lf-live-reset-spec" id="pResetSkuBtn">重置规格</button>
                    </div>
                    <div class="pts-rule-card__body">
                        <div class="lf-live-sku-pick">
                            <label class="lf-live-sku-pick__label">选择 SKU</label>
                            <div class="product-proxy-form__sku-picker lf-live-sku-pick__box" id="pSkuPicker">
                                <button type="button" class="product-proxy-form__sku-trigger" id="pSkuTrigger">已选 0 个 SKU <span class="product-proxy-form__sku-caret">▼</span></button>
                                <div class="product-proxy-form__sku-dropdown" id="pSkuDropdown" hidden></div>
                            </div>
                        </div>
                        <div class="product-proxy-form__spec-list" id="pSkuList"></div>
                    </div>
                </div>

                <div class="pts-rule-card lf-live-card">
                    <div class="pts-rule-card__title">媒体与详情</div>
                    <div class="pts-rule-card__body">
                        <div class="pts-rule-field lf-live-edit-media-field">
                            <label class="pts-rule-field__label">商品图片</label>
                            <div class="pts-rule-field__control">
                                <p class="lf-live-field-hint">支持一次上传多张图片，默认使用第一张图片作为封面图；可另传 1 个 MP4 视频</p>
                                <div class="product-proxy-form__images" id="pImages"></div>
                                <input type="file" id="pImageInput" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4" multiple hidden>
                                <p class="lf-live-field-hint">第 1 张图片作为封面图，最多上传 10 张图片，支持 JPG/PNG/GIF/WebP (≤5MB)；视频限 1 个 MP4 (≤10MB)</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pts-rule-card lf-live-card">
                    <div class="pts-rule-card__title">商品详情</div>
                    <div class="pts-rule-card__body">
                        <div class="product-add-editor">
                            <div class="product-add-editor__toolbar" id="pEditorToolbar"></div>
                            <div class="product-add-editor__body" id="pDetailEditor" contenteditable="true" data-placeholder="请输入商品详情，支持图文、列表、表格等"></div>
                        </div>
                    </div>
                </div>
            </form>

            <div class="mdm-edit-page__footer lf-live-edit-footer" id="schedEditFooter" hidden>
                <p class="lf-live-edit-footer__tip">编辑仅作用于本场直播排品，不会更新中央商品库；本场配额占用配送仓库存，与代采、商城、其他场次共享</p>
                <div class="lf-live-edit-footer__actions">
                    <button type="button" class="erp-btn" id="pCancelBtn">取消</button>
                    <button type="button" class="erp-btn erp-btn--primary" id="pSaveBtn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
                        保存
                    </button>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/mdm-sku-wh-stock.js?v=20260903-stock-collapse"></script>
    <script src="../js/mdm-live-demo-data.js"></script>
    <script src="../js/mdm-live-product-sched-edit.js?v=20260903-stock-spec"></script>
</body>
</html>
