<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 秒杀</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/lf-marketing-register-gift.css">
    <link rel="stylesheet" href="../css/lf-marketing-template.css">
    <link rel="stylesheet" href="../css/lf-marketing-seckill.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/marketing-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">秒杀</button></div>
            <hr class="content-divider">

            <div class="mdm-biz-tip" role="note">秒杀活动内<strong>所有商品共同受商品限购控制</strong>。新用户指<strong>没有支付过订单</strong>的用户（奖品中的实物商品兑换不算支付过的订单）；支付时会再次校验，避免多次生成待支付订单绕过限制。</div>

            <section class="search-section">
                <form class="search-form" id="skFilterForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>活动ID:</label>
                        <div class="input-wrapper">
                            <input id="qSkId" placeholder="请输入活动ID" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>活动名称:</label>
                        <div class="input-wrapper">
                            <input id="qSkName" placeholder="请输入活动名称" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group form-group--rg-time form-group--datetime">
                        <label>活动时间:</label>
                        <div class="mkt-rg-filter-range" role="group" aria-label="活动时间筛选区间">
                            <span class="mkt-rg-datetime-wrap" id="qSkTimeStartWrap">
                                <input id="qSkTimeStart" type="datetime-local" step="60" title="筛选开始时间">
                                <button type="button" class="mkt-rg-datetime-clear" data-clear-for="qSkTimeStart" aria-label="清空开始时间">×</button>
                            </span>
                            <span class="sep">至</span>
                            <span class="mkt-rg-datetime-wrap" id="qSkTimeEndWrap">
                                <input id="qSkTimeEnd" type="datetime-local" step="60" title="筛选结束时间">
                                <button type="button" class="mkt-rg-datetime-clear" data-clear-for="qSkTimeEnd" aria-label="清空结束时间">×</button>
                            </span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>活动商品:</label>
                        <div class="input-wrapper">
                            <input id="qSkProduct" placeholder="请输入商品名称" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>商品编码:</label>
                        <div class="input-wrapper">
                            <input id="qSkCode" placeholder="请输入商品编码" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>状态:</label>
                        <select id="qSkStatus">
                            <option value="">全部</option>
                            <option value="upcoming">未开始</option>
                            <option value="active">进行中</option>
                            <option value="ended">已结束</option>
                            <option value="disabled">已禁用</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="skFilterReset">重置</button>
                        <button type="button" class="btn btn-primary" id="skFilterQuery">查询</button>
                    </div>
                </form>
            </section>

            <div class="mkt-sk-toolbar">
                <button type="button" class="erp-btn erp-btn--primary" id="skAddBtn">创建活动</button>
            </div>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>活动ID</th>
                                <th>活动名称</th>
                                <th>活动时间</th>
                                <th>活动商品</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="skTableBody"></tbody>
                    </table>
                </div>
                <div id="pagination-container"></div>
            </section>
        </main>
    </div>

    <div id="skGoodsBackdrop" class="erp-modal-backdrop mkt-sk-goods-modal" hidden>
        <div class="erp-modal" role="dialog" aria-modal="true" aria-labelledby="skGoodsTitle">
            <div class="erp-modal__header">
                <h2 class="erp-modal__title" id="skGoodsTitle">活动商品</h2>
                <div class="erp-modal__header-actions">
                    <button type="button" class="erp-modal__header-btn" id="skGoodsClose" aria-label="关闭">&times;</button>
                </div>
            </div>
            <div class="erp-modal__body">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>商品编号</th>
                                <th>图片</th>
                                <th>商品名称</th>
                                <th>类目</th>
                                <th>规格数量</th>
                                <th>售价</th>
                                <th>活动库存</th>
                            </tr>
                        </thead>
                        <tbody id="skGoodsTableBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="erp-modal__footer">
                <button type="button" class="erp-btn" id="skGoodsOk">关闭</button>
            </div>
        </div>
    </div>

    <div id="tplLogDrawer" class="mkt-tpl-log-drawer" hidden>
        <div class="mkt-tpl-log-drawer__mask" id="tplLogMask"></div>
        <aside class="mkt-tpl-log-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="tplLogTitle">
            <div class="mkt-tpl-log-drawer__header">
                <div id="tplLogTitle">操作日志</div>
                <button type="button" class="mkt-tpl-log-drawer__x" id="tplLogClose" aria-label="关闭">×</button>
            </div>
            <div class="mkt-tpl-log-drawer__body">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width:170px">操作时间</th>
                                <th>操作内容</th>
                                <th style="width:120px">操作人</th>
                                <th>方法</th>
                                <th style="width:90px;text-align:center">结果</th>
                                <th style="width:90px">操作</th>
                            </tr>
                        </thead>
                        <tbody id="tplLogTableBody"></tbody>
                    </table>
                </div>
                <div id="tplLogPagination"></div>
            </div>
        </aside>
    </div>

    <div id="tplLogDetailBackdrop" class="erp-modal-backdrop erp-modal-backdrop--over-drawer mkt-tpl-log-detail-backdrop" hidden>
        <div class="erp-modal" role="dialog" aria-modal="true" aria-labelledby="tplLogDetailTitle">
            <div class="erp-modal__header">
                <h2 class="erp-modal__title" id="tplLogDetailTitle">操作日志详情</h2>
                <div class="erp-modal__header-actions">
                    <button type="button" class="erp-modal__header-btn" id="tplLogDetailClose" aria-label="关闭">&times;</button>
                </div>
            </div>
            <div class="erp-modal__body" id="tplLogDetailBody"></div>
            <div class="erp-modal__footer">
                <button type="button" class="erp-btn" id="tplLogDetailOk">关闭</button>
            </div>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/mdm-marketing-seckill-store.js"></script>
    <script src="../js/mdm-marketing-seckill.js"></script>
</body>
</html>
