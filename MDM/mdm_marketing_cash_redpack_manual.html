<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 手动发放红包</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/lf-marketing-register-gift.css">
    <link rel="stylesheet" href="../css/lf-marketing-cash-redpack.css?v=20261012-grant-target">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/marketing-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">手动发放红包</button></div>
            <hr class="content-divider">

            <div class="mkt-cr-form-toolbar">
                <a class="mkt-cr-form-back" id="crManualBack" href="mdm_marketing_cash_redpack.html">← 返回现金红包</a>
            </div>

            <div class="mdm-biz-tip" id="crManualTip" role="note">点击<strong>手动发放</strong>创建发放记录。<strong>发放金额</strong>可统一设置，也可按用户设置。下表是每次发放的操作记录。</div>

            <section class="search-section">
                <form class="search-form" id="crFilterForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>红包名称:</label>
                        <div class="input-wrapper">
                            <input id="qMbName" placeholder="请输入红包名称" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>发放对象:</label>
                        <select id="qMbMode">
                            <option value="">全部</option>
                            <option value="single">单个会员</option>
                            <option value="batch">批量发放</option>
                            <option value="level">按会员等级</option>
                            <option value="tag">按会员标签</option>
                            <option value="segment">按会员分群</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>活动领取终端:</label>
                        <select id="qMbPort">
                            <option value="">全部</option>
                            <option value="mini">小程序</option>
                            <option value="app">APP</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>红包总额:</label>
                        <div class="mkt-cr-amount-range" role="group" aria-label="红包总额区间">
                            <input id="qMbTotalMin" type="number" min="0" step="0.01" placeholder="最低" title="最低总额">
                            <span class="sep">至</span>
                            <input id="qMbTotalMax" type="number" min="0" step="0.01" placeholder="最高" title="最高总额">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>执行状态:</label>
                        <select id="qMbStatus">
                            <option value="">全部</option>
                            <option value="granting">发放中</option>
                            <option value="done">已完成</option>
                            <option value="partial">部分失败</option>
                            <option value="failed">发放失败</option>
                        </select>
                    </div>
                    <div class="form-group form-group--rg-time form-group--datetime">
                        <label>创建时间:</label>
                        <div class="mkt-rg-filter-range" role="group" aria-label="创建时间筛选区间">
                            <span class="mkt-rg-datetime-wrap" id="qMbTimeStartWrap">
                                <input id="qMbTimeStart" type="datetime-local" step="60" title="筛选开始时间">
                                <button type="button" class="mkt-rg-datetime-clear" data-clear-for="qMbTimeStart" aria-label="清空开始时间">×</button>
                            </span>
                            <span class="sep">至</span>
                            <span class="mkt-rg-datetime-wrap" id="qMbTimeEndWrap">
                                <input id="qMbTimeEnd" type="datetime-local" step="60" title="筛选结束时间">
                                <button type="button" class="mkt-rg-datetime-clear" data-clear-for="qMbTimeEnd" aria-label="清空结束时间">×</button>
                            </span>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="crMbReset">重置</button>
                        <button type="button" class="btn btn-primary" id="crMbQuery">查询</button>
                    </div>
                </form>
            </section>

            <div class="mkt-rg-toolbar">
                <button type="button" class="erp-btn erp-btn--primary" id="crMbAddBtn">手动发放</button>
            </div>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>红包名称</th>
                                <th>活动领取终端</th>
                                <th>发放对象</th>
                                <th>发放人数</th>
                                <th>红包总额</th>
                                <th>领取人数</th>
                                <th>领取金额</th>
                                <th>执行状态</th>
                                <th>执行结果</th>
                                <th>创建人</th>
                                <th>创建时间</th>
                                <th>发放完成时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="crMbTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <div class="erp-modal-backdrop mkt-cr-modal" id="crMbRemarkBackdrop" hidden>
        <div class="erp-modal mkt-cr-remark-modal" role="dialog" aria-modal="true" aria-labelledby="crMbRemarkTitle">
            <div class="erp-modal__header">
                <h2 class="erp-modal__title" id="crMbRemarkTitle">备注</h2>
                <button type="button" class="erp-modal__header-btn" id="crMbRemarkClose" aria-label="关闭">&times;</button>
            </div>
            <div class="erp-modal__body" id="crMbRemarkBody"></div>
            <div class="erp-modal__footer">
                <button type="button" class="btn btn-primary" id="crMbRemarkOk">关闭</button>
            </div>
        </div>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/vendor/xlsx.full.min.js"></script>
    <script src="../js/mdm-marketing-cash-redpack-store.js?v=20261012-grant-target"></script>
    <script src="../js/mdm-marketing-cash-redpack-manual.js?v=20261012-grant-target"></script>
</body>
</html>
