<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 直播场次</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <link rel="stylesheet" href="../css/lf-live.css?v=20260923-session-cards">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/live-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content lf-live-session-page">
            <div class="content-tabs"><button class="active">直播场次</button></div>
            <hr class="content-divider">

            <section class="lf-sess-board">
                <form class="lf-sess-filter" id="liveSessionFilterForm" onsubmit="return false;">
                    <div class="lf-sess-filter__grid">
                        <div class="form-group lf-sess-filter__name">
                            <label for="qSessionName">直播场次名称</label>
                            <input id="qSessionName" placeholder="请输入直播场次名称" autocomplete="off">
                        </div>
                        <div class="form-group lf-sess-filter__type">
                            <label for="qSessionType">场次类型</label>
                            <select id="qSessionType">
                                <option value="">全部</option>
                                <option value="regular">常规场</option>
                                <option value="origin">产地专场</option>
                                <option value="member">会员专场</option>
                                <option value="flash">闪购场</option>
                            </select>
                        </div>
                        <div class="form-group lf-sess-filter__slot">
                            <label for="qSessionSlot">选择直播时段</label>
                            <select id="qSessionSlot"></select>
                        </div>
                        <div class="form-group lf-sess-filter__room">
                            <label for="qSessionRoom">关联直播间</label>
                            <select id="qSessionRoom"></select>
                        </div>
                        <div class="lf-sess-filter__actions">
                            <button type="button" class="btn btn-primary" id="sessionFilterQuery">查询</button>
                            <button type="button" class="btn btn-secondary" id="sessionFilterReset">重置</button>
                        </div>
                    </div>
                </form>

                <div class="lf-sess-tabs" id="sessionStatusTabs" role="tablist">
                    <button type="button" class="is-active" data-status="" role="tab">全部(<span data-tab-count="all">0</span>)</button>
                    <button type="button" data-status="live" role="tab">直播中(<span data-tab-count="live">0</span>)</button>
                    <button type="button" data-status="upcoming" role="tab">未开始(<span data-tab-count="upcoming">0</span>)</button>
                    <button type="button" data-status="ended" role="tab">已结束(<span data-tab-count="ended">0</span>)</button>
                </div>

                <div class="lf-live-toolbar">
                    <button type="button" class="erp-btn erp-btn--primary" id="sessionAddBtn">+ 新建直播场次</button>
                </div>

                <div class="lf-sess-grid" id="sessionCardGrid"></div>
                <div class="lf-sess-pager" id="sessionPager"></div>
            </section>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="../js/mdm-live-demo-data.js?v=20260923-session-cards"></script>
    <script src="../js/mdm-live-session.js?v=20260923-session-cards"></script>
</body>
</html>
