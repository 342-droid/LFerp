<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 类目管理</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-product.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/product-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="product-page">
                <div class="product-page-tabs" id="productPageTabs" aria-label="页面页签"></div>

                <div class="product-page-body">
                    <section class="erp-page__card product-category-cascade-card">
                        <div class="product-category-cascade">
                            <div class="product-category-cascade__col" data-level="1">
                                <div class="product-category-cascade__head">
                                    <div class="product-category-cascade__title">
                                        <span class="product-category-cascade__level">一级</span>
                                        <span>频道类目</span>
                                    </div>
                                    <button type="button" class="product-category-cascade__add" id="catAddL1" title="新增一级类目">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                                        新增
                                    </button>
                                </div>
                                <div class="product-category-cascade__hint">APP 仅展示已上架类目；下架后分类页隐藏对应类目及商品，其他模块与搜索仍可访问</div>
                                <ul class="product-category-cascade__list" id="catListL1"></ul>
                            </div>

                            <div class="product-category-cascade__col" data-level="2">
                                <div class="product-category-cascade__head">
                                    <div class="product-category-cascade__title">
                                        <span class="product-category-cascade__level">二级</span>
                                        <span>分组类目</span>
                                    </div>
                                    <button type="button" class="product-category-cascade__add" id="catAddL2" title="在当前一级下新增二级" disabled>
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                                        新增
                                    </button>
                                </div>
                                <div class="product-category-cascade__hint" id="catHintL2">请先选择一级类目</div>
                                <ul class="product-category-cascade__list" id="catListL2"></ul>
                            </div>

                            <div class="product-category-cascade__col" data-level="3">
                                <div class="product-category-cascade__head">
                                    <div class="product-category-cascade__title">
                                        <span class="product-category-cascade__level">三级</span>
                                        <span>叶子类目</span>
                                    </div>
                                    <button type="button" class="product-category-cascade__add" id="catAddL3" title="在当前二级下新增三级" disabled>
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                                        新增
                                    </button>
                                </div>
                                <div class="product-category-cascade__hint" id="catHintL3">请先选择二级类目</div>
                                <ul class="product-category-cascade__list" id="catListL3"></ul>
                            </div>

                            <div class="product-category-detail" id="catDetailPanel">
                                <div class="product-category-cascade__head product-category-detail__head">
                                    <div class="product-category-cascade__title">
                                        <span class="product-category-cascade__level">详情</span>
                                        <span>类目详情</span>
                                    </div>
                                </div>
                                <div class="product-category-detail__breadcrumb" id="catDetailBreadcrumb"></div>
                                <div class="product-category-detail__tabs" id="catDetailTabs">
                                    <button type="button" class="product-category-detail__tab is-active" data-tab="info">类目信息</button>
                                    <button type="button" class="product-category-detail__tab" data-tab="products" id="catDetailTabProducts" hidden>已绑定商品</button>
                                </div>
                                <div class="product-category-detail__content">
                                    <div class="product-category-detail__pane" id="catDetailPaneInfo"></div>
                                    <div class="product-category-detail__pane" id="catDetailPaneProducts" hidden></div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/product-page-tabs.js"></script>
    <script src="../js/mdm-product-proxy-category-store.js"></script>
    <script src="../js/mdm-product-proxy-category.js"></script>
</body>
</html>
