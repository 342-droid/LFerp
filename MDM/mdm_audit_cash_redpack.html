<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 现金红包审核</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/lf-marketing-template.css">
    <link rel="stylesheet" href="../css/lf-marketing-cash-redpack.css?v=20261008-audit">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/mdm-sidebar.js?v=20261012-manual-audit"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">现金红包</button></div>
            <hr class="content-divider">
            <div class="content-title">审核中心 / 营销审核 / 现金红包</div>

            <div class="mdm-biz-tip" role="note">每次在营销活动-现金红包模版点击<strong>提交</strong>都会生成一条审核记录。查看/审核展示模版全部信息，样式同新建/编辑现金红包。</div>

            <section class="search-section">
                <form class="search-form" id="audFilterForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>模板ID:</label>
                        <div class="input-wrapper">
                            <input id="qAudId" placeholder="请输入模板ID" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>红包名称:</label>
                        <div class="input-wrapper">
                            <input id="qAudName" placeholder="请输入红包名称" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>奖励类型:</label>
                        <select id="qAudReward">
                            <option value="">全部</option>
                            <option value="fixed">固定金额</option>
                            <option value="random">随机金额</option>
                            <option value="custom_fixed">自定义（固定）</option>
                            <option value="custom_random">自定义（随机）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>活动领取终端:</label>
                        <select id="qAudPort">
                            <option value="">全部</option>
                            <option value="mini">小程序</option>
                            <option value="app">APP</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>审核状态:</label>
                        <select id="qAudStatus">
                            <option value="">全部</option>
                            <option value="PENDING">待审核</option>
                            <option value="REJECTED">审核失败</option>
                            <option value="APPROVED">审核成功</option>
                            <option value="CANCELLED">已取消</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>审核人:</label>
                        <div class="input-wrapper">
                            <input id="qAudAuditor" placeholder="请输入审核人" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="audFilterReset">重置</button>
                        <button type="button" class="btn btn-primary" id="audFilterQuery">查询</button>
                    </div>
                </form>
            </section>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>模板ID</th>
                                <th>红包名称</th>
                                <th>奖励类型</th>
                                <th>奖励内容</th>
                                <th>红包总额</th>
                                <th>红包总数</th>
                                <th>活动领取终端</th>
                                <th>领取条件</th>
                                <th>参与会员</th>
                                <th>提交时间</th>
                                <th style="text-align:center;width:100px">审核状态</th>
                                <th>审核人</th>
                                <th>审核时间</th>
                                <th style="width:200px">操作</th>
                            </tr>
                        </thead>
                        <tbody id="audTableBody"></tbody>
                    </table>
                </div>
                <div id="pagination-container"></div>
            </section>
        </main>
    </div>

    <div id="tplLogDrawer" class="mkt-tpl-log-drawer" hidden>
        <div class="mkt-tpl-log-drawer__mask" id="tplLogMask"></div>
        <aside class="mkt-tpl-log-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="tplLogTitle">
            <div class="mkt-tpl-log-drawer__header">
                <div id="tplLogTitle">操作日志</div>
                <button type="button" class="mkt-tpl-log-drawer__x" id="tplLogClose" aria-label="关闭">×</button>
            </div>
            <div class="mkt-tpl-log-drawer__body">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width:170px">操作时间</th>
                                <th>操作内容</th>
                                <th style="width:120px">操作人</th>
                                <th>说明</th>
                                <th style="width:90px;text-align:center">结果</th>
                            </tr>
                        </thead>
                        <tbody id="tplLogTableBody"></tbody>
                    </table>
                </div>
            </div>
        </aside>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/form-utils.js"></script>
    <script src="../js/mdm-member-level-data.js?v=20261008-packet-total"></script>
    <script src="../js/mdm-marketing-cash-redpack-tpl-store.js?v=20261014-diff-sum"></script>
    <script src="../js/mdm-audit-cash-redpack.js?v=20261014-diff-sum"></script>
</body>
</html>
