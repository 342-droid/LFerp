<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 模版配置</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <link rel="stylesheet" href="../css/lf-marketing-template.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/marketing-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">模版配置</button></div>
            <hr class="content-divider">

            <section class="search-section">
                <form class="search-form" id="tplFilterForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>模板类型:</label>
                        <select id="qTplType">
                            <option value="">全部</option>
                            <option value="COUPON">优惠券</option>
                            <option value="FORTUNE_BAG">福袋</option>
                            <option value="SIGN_IN">签到</option>
                            <option value="TASK:WATCH">观看任务</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="tplFilterReset">重置</button>
                        <button type="button" class="btn btn-primary" id="tplFilterQuery">查询</button>
                    </div>
                </form>
            </section>

            <div class="mkt-tpl-toolbar">
                <button type="button" class="erp-btn erp-btn--primary" id="tplAddBtn">新增模板</button>
            </div>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>模板名称</th>
                                <th style="text-align:center;width:120px">模板类型</th>
                                <th style="text-align:center;width:120px">适用渠道</th>
                                <th style="text-align:center;width:120px">适用商品</th>
                                <th>创建时间</th>
                                <th style="text-align:center;width:120px">启用状态</th>
                                <th style="text-align:center;width:200px">操作</th>
                            </tr>
                        </thead>
                        <tbody id="tplTableBody"></tbody>
                    </table>
                </div>
                <div id="pagination-container"></div>
            </section>
        </main>
    </div>

    <div id="tplEditBackdrop" class="erp-modal-backdrop mkt-tpl-edit-backdrop" hidden>
        <div class="erp-modal" role="dialog" aria-modal="true" aria-labelledby="tplEditTitle">
            <div class="erp-modal__header">
                <h2 class="erp-modal__title" id="tplEditTitle">新增模板</h2>
                <div class="erp-modal__header-actions">
                    <button type="button" class="erp-modal__header-btn" id="tplEditClose" aria-label="关闭">&times;</button>
                </div>
            </div>
            <div class="erp-modal__body" id="tplEditBody"></div>
            <div class="erp-modal__footer" id="tplEditFooter">
                <button type="button" class="erp-btn" id="tplEditCancel">取消</button>
                <button type="button" class="erp-btn erp-btn--primary" id="tplEditSave">保存</button>
            </div>
        </div>
    </div>

    <div id="tplSkuBackdrop" class="erp-modal-backdrop erp-modal-backdrop--nested mkt-tpl-sku-backdrop" hidden>
        <div class="erp-modal" role="dialog" aria-modal="true" aria-labelledby="tplSkuTitle">
            <div class="erp-modal__header">
                <h2 class="erp-modal__title" id="tplSkuTitle">选择商品（精确到规格）</h2>
                <div class="erp-modal__header-actions">
                    <button type="button" class="erp-modal__header-btn" id="tplSkuClose" aria-label="关闭">&times;</button>
                </div>
            </div>
            <div class="erp-modal__body">
                <input id="tplSkuKeyword" type="text" placeholder="搜索商品名称" style="width:100%;height:32px;padding:0 10px;border:1px solid #dcdfe6;border-radius:4px;">
                <div class="mkt-tpl-sku-tree" id="tplSkuTree"></div>
            </div>
            <div class="erp-modal__footer">
                <div class="mkt-tpl-sku-footer">
                    <span class="mkt-tpl-sku-footer__hint" id="tplSkuHint">已选 0 个规格</span>
                    <div class="mkt-tpl-sku-footer__actions">
                        <button type="button" class="erp-btn" id="tplSkuCancel">取消</button>
                        <button type="button" class="erp-btn erp-btn--primary" id="tplSkuOk">确定</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="tplLogDrawer" class="mkt-tpl-log-drawer" hidden>
        <div class="mkt-tpl-log-drawer__mask" id="tplLogMask"></div>
        <aside class="mkt-tpl-log-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="tplLogTitle">
            <div class="mkt-tpl-log-drawer__header">
                <div id="tplLogTitle">操作日志</div>
                <button type="button" class="mkt-tpl-log-drawer__x" id="tplLogClose" aria-label="关闭">×</button>
            </div>
            <div class="mkt-tpl-log-drawer__body">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width:170px">操作时间</th>
                                <th>操作内容</th>
                                <th style="width:120px">操作人</th>
                                <th>方法</th>
                                <th style="width:90px;text-align:center">结果</th>
                                <th style="width:90px">操作</th>
                            </tr>
                        </thead>
                        <tbody id="tplLogTableBody"></tbody>
                    </table>
                </div>
                <div id="tplLogPagination"></div>
            </div>
        </aside>
    </div>

    <div id="tplLogDetailBackdrop" class="erp-modal-backdrop erp-modal-backdrop--over-drawer mkt-tpl-log-detail-backdrop" hidden>
        <div class="erp-modal" role="dialog" aria-modal="true" aria-labelledby="tplLogDetailTitle">
            <div class="erp-modal__header">
                <h2 class="erp-modal__title" id="tplLogDetailTitle">操作日志详情</h2>
                <div class="erp-modal__header-actions">
                    <button type="button" class="erp-modal__header-btn" id="tplLogDetailClose" aria-label="关闭">&times;</button>
                </div>
            </div>
            <div class="erp-modal__body" id="tplLogDetailBody"></div>
            <div class="erp-modal__footer">
                <button type="button" class="erp-btn" id="tplLogDetailOk">关闭</button>
            </div>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/form-utils.js"></script>
    <script src="../js/mdm-marketing-template-store.js"></script>
    <script src="../js/mdm-marketing-template.js"></script>
</body>
</html>
