<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 积分抵现</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-product.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <link rel="stylesheet" href="../css/lf-mdm-biz-tip.css">
    <link rel="stylesheet" href="../css/lf-mdm-points-rule.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/mdm-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">积分抵现</button></div>
            <hr class="content-divider">

            <div class="mdm-biz-tip" role="note">若同一时段内有多个满足的规则，取<strong>最新创建</strong>的规则；<strong>未命中任何规则时不支持积分抵现</strong>。</div>

            <section class="search-section">
                <form class="search-form" id="cashFilterForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>规则名称:</label>
                        <div class="input-wrapper">
                            <input id="qCashName" placeholder="请输入规则名称" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>适用端口:</label>
                        <select id="qCashPort">
                            <option value="">全部</option>
                            <option value="mini">小程序</option>
                            <option value="app">APP</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>售卖范围:</label>
                        <select id="qCashSaleScope">
                            <option value="">全部</option>
                            <option value="all">全部范围</option>
                            <option value="region">省市区</option>
                            <option value="store">门店</option>
                        </select>
                    </div>
                    <div class="form-group pts-sale-filter-extra" id="qCashSaleRegionGroup" hidden style="display:none">
                        <label>具体省市区:</label>
                        <div id="qCashSaleRegionMount"></div>
                    </div>
                    <div class="form-group custom-select-wrapper pts-sale-filter-extra" id="qCashSaleStoreGroup" hidden style="display:none">
                        <label>具体门店:</label>
                        <div class="custom-select">
                            <input type="text" id="qCashStore" placeholder="请选择/搜索门店" autocomplete="off">
                            <span class="select-arrow">▼</span>
                            <span class="clear-btn">×</span>
                            <div class="select-dropdown" id="qCashStoreDropdown"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>适用商品:</label>
                        <div class="input-wrapper">
                            <input id="qCashProduct" placeholder="商品名称/编码" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>状态:</label>
                        <select id="qCashStatus">
                            <option value="">全部</option>
                            <option value="enabled">已启用</option>
                            <option value="disabled">已禁用</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cashFilterReset">重置</button>
                        <button type="button" class="btn btn-primary" id="cashFilterQuery">查询</button>
                    </div>
                </form>
            </section>

            <div class="pts-rule-list-toolbar">
                <button type="button" class="erp-btn erp-btn--primary" id="cashAddBtn">新增规则</button>
            </div>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>规则ID</th>
                                <th>规则名称</th>
                                <th>抵扣规则</th>
                                <th>适用端口</th>
                                <th>售卖范围</th>
                                <th>适用商品</th>
                                <th>状态</th>
                                <th>更新时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="cashTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/region-cascader.js"></script>
    <script src="../js/mdm-product-catalog-store.js"></script>
    <script src="../js/mdm-member-level-data.js"></script>
    <script src="../js/mdm-member-points-scope.js"></script>
    <script src="../js/mdm-product-proxy-region-picker.js"></script>
    <script src="../js/mdm-product-proxy-store-picker.js"></script>
    <script src="../js/mdm-member-points-rule-list-filter.js"></script>
    <script src="../js/mdm-member-points-cash-store.js"></script>
    <script src="../js/mdm-member-points-cash.js"></script>
</body>
</html>
