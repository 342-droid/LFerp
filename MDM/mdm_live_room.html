<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 直播间</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/mdm-member360-list.css">
    <link rel="stylesheet" href="../css/lf-live.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/live-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="content-tabs"><button class="active">直播间</button></div>
            <hr class="content-divider">

            <section class="search-section">
                <form class="search-form" id="liveRoomFilterForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>直播间名称:</label>
                        <div class="input-wrapper">
                            <input id="qRoomName" placeholder="请输入直播间名称" autocomplete="off">
                            <span class="clear-btn">×</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>状态:</label>
                        <select id="qRoomStatus">
                            <option value="">全部</option>
                            <option value="enabled">启用</option>
                            <option value="disabled">禁用</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="roomFilterReset">重置</button>
                        <button type="button" class="btn btn-primary" id="roomFilterQuery">查询</button>
                    </div>
                </form>
            </section>

            <div class="lf-live-toolbar">
                <button type="button" class="erp-btn erp-btn--primary" id="roomAddBtn">新建直播间</button>
            </div>

            <section class="table-section">
                <div class="table-scroll-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>直播间名称</th>
                                <th>状态</th>
                                <th>推流通道</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="roomTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/mdm-live-demo-data.js"></script>
    <script src="../js/mdm-live-room.js"></script>
</body>
</html>
