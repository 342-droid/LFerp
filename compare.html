<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰ERP - 变更对比</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
        }
        .cmp-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            height: 52px;
            padding: 0 16px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
        }
        .cmp-back {
            border: 1px solid #d9d9d9;
            background: #fff;
            border-radius: 4px;
            padding: 5px 12px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
        }
        .cmp-back:hover { border-color: #2c313c; }
        .cmp-title { flex: 1; font-size: 14px; font-weight: 600; color: #2c313c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cmp-regions { font-size: 12px; color: #f5222d; }
        .cmp-modes { display: flex; border: 1px solid #d9d9d9; border-radius: 4px; overflow: hidden; }
        .cmp-modes button {
            border: none;
            background: #fff;
            padding: 5px 14px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }
        .cmp-modes button.active { background: #2c313c; color: #fff; }
        .cmp-status { padding: 60px 20px; text-align: center; font-size: 14px; color: #999; }
        .cmp-wrap { padding: 12px; }
        .cmp-label {
            display: inline-block;
            font-size: 12px;
            color: #fff;
            border-radius: 3px 3px 0 0;
            padding: 3px 12px;
        }
        .cmp-label.before { background: #8c9099; }
        .cmp-label.after { background: #4a90d9; }
        img { display: block; width: 100%; background: #fff; border: 1px solid #e0e0e0; }
        /* 并排 */
        .cmp-side { display: flex; gap: 12px; align-items: flex-start; }
        .cmp-side > div { flex: 1; min-width: 0; }
        /* 滑动对比：before 盖在 after 上，用 clip 裁剪 */
        .cmp-slide { position: relative; max-width: 1440px; margin: 0 auto; }
        .cmp-slide .layer-before { position: absolute; top: 0; left: 0; clip-path: inset(0 50% 0 0); }
        .cmp-slide .bar {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 3px;
            margin-left: -1px;
            background: #f5222d;
            cursor: ew-resize;
        }
        .cmp-slide .bar::after {
            content: '◀ 改动前 | 改动后 ▶';
            position: fixed;
            top: 64px;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 11px;
            color: #fff;
            background: #f5222d;
            border-radius: 10px;
            padding: 2px 10px;
        }
    </style>
</head>
<body>
    <header class="cmp-header">
        <button class="cmp-back" onclick="if (history.length > 1) { history.back(); } else { location.href = 'changelog.html'; }">← 返回</button>
        <span class="cmp-title" id="cmp-title">变更对比</span>
        <span class="cmp-regions" id="cmp-regions"></span>
        <div class="cmp-modes" id="cmp-modes" hidden>
            <button data-mode="side" class="active">并排</button>
            <button data-mode="slide">滑动对比</button>
        </div>
    </header>
    <div class="cmp-wrap" id="cmp-body"><div class="cmp-status">加载中…</div></div>

    <script>
        (function () {
            var qs = new URLSearchParams(location.search);
            var key = qs.get('k') || '';
            var title = qs.get('t') || '';
            if (title) document.getElementById('cmp-title').textContent = title;
            document.title = '冷丰ERP - 变更对比' + (title ? ' · ' + title : '');

            var body = document.getElementById('cmp-body');

            function esc(s) {
                return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function renderSide(e) {
                body.innerHTML = '<div class="cmp-side">' +
                    '<div><span class="cmp-label before">改动前</span><img src="' + esc(e.before) + '" alt="改动前"></div>' +
                    '<div><span class="cmp-label after">改动后</span><img src="' + esc(e.after) + '" alt="改动后"></div>' +
                    '</div>';
            }

            function renderSlide(e) {
                body.innerHTML = '<div class="cmp-slide" id="slide">' +
                    '<img src="' + esc(e.after) + '" alt="改动后">' +
                    '<img class="layer-before" src="' + esc(e.before) + '" alt="改动前">' +
                    '<div class="bar" id="bar"></div>' +
                    '</div>';
                var slide = document.getElementById('slide');
                var before = slide.querySelector('.layer-before');
                var bar = document.getElementById('bar');
                function moveTo(clientX) {
                    var rect = slide.getBoundingClientRect();
                    var pct = Math.max(0, Math.min(100, (clientX - rect.left) / rect.width * 100));
                    before.style.clipPath = 'inset(0 ' + (100 - pct) + '% 0 0)';
                    bar.style.left = pct + '%';
                }
                slide.addEventListener('mousemove', function (ev) { moveTo(ev.clientX); });
                slide.addEventListener('touchmove', function (ev) { moveTo(ev.touches[0].clientX); }, { passive: true });
            }

            function renderAdded(e) {
                body.innerHTML = '<div style="max-width:1440px;margin:0 auto">' +
                    '<span class="cmp-label after">新增页面</span><img src="' + esc(e.after) + '" alt="新增页面"></div>';
            }

            fetch('changelog-assets/manifest.json', { cache: 'no-cache' })
                .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(function (manifest) {
                    var e = manifest[key];
                    if (!e) {
                        body.innerHTML = '<div class="cmp-status">没有找到这条变更的对比图（可能已超过保留期）</div>';
                        return;
                    }
                    if (e.status === 'added' || !e.before) { renderAdded(e); return; }
                    if (typeof e.regions === 'number') {
                        document.getElementById('cmp-regions').textContent =
                            e.regions > 0 ? '红框标出 ' + e.regions + ' 处变化' : '界面无可见变化（改动在交互或数据逻辑里）';
                    }
                    var modes = document.getElementById('cmp-modes');
                    modes.hidden = false;
                    renderSide(e);
                    modes.addEventListener('click', function (ev) {
                        var btn = ev.target.closest('button');
                        if (!btn) return;
                        modes.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
                        btn.classList.add('active');
                        if (btn.dataset.mode === 'slide') renderSlide(e); else renderSide(e);
                    });
                })
                .catch(function () {
                    body.innerHTML = '<div class="cmp-status">对比数据加载失败</div>';
                });
        })();
    </script>
</body>
</html>
